<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get-Rescue · Agent Performance</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:18px}
.hdr h1{font-family:var(--f-disp);font-size:24px;font-weight:800;color:var(--ink)}
.hdr .sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-1);
  padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters .presets{display:flex;gap:6px;flex-wrap:wrap}
.filters .presets button{font-family:var(--f-disp);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:8px;
  border:1.5px solid var(--line-strong);background:#fff;color:var(--text);cursor:pointer}
.filters .presets button.sel{background:var(--signal);color:#fff;border-color:var(--signal)}
.filters .daterange{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.filters input[type=date]{font-family:var(--f-mono);font-size:12.5px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line-strong)}
.filters .apply{font-family:var(--f-disp);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:8px;border:0;
  background:var(--signal);color:#fff;cursor:pointer}
.range-warn{color:var(--stop);font-family:var(--f-mono);font-size:11.5px;margin-top:6px}
.section-title{font-family:var(--f-disp);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){ .grid{grid-template-columns:1fr} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);
  padding:20px 16px;text-align:center}
.card .ic{width:42px;height:42px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;
  align-items:center;justify-content:center;margin:0 auto 9px}
.card .ic svg{width:20px;height:20px}
.card .num{font-family:var(--f-disp);font-size:28px;font-weight:900;color:var(--ink)}
.card .num.na{font-size:15px;color:var(--muted-2);font-family:var(--f-mono);font-weight:500}
.card .lbl{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.card.na .ic{background:var(--worktop);color:var(--muted-2)}
.hint-box{background:var(--worktop);border:1px dashed var(--line-strong);border-radius:10px;padding:14px 16px;
  font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
.center-state{text-align:center;padding:60px 16px;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);
  animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.state-err{background:var(--stop-soft);color:var(--stop);border-radius:12px;padding:16px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Agent Performance</h1>
      <div class="sub" id="agentNameLine">Loading…</div>
    </div>
  </div>
  <div class="filters">
    <div class="presets" id="presets">
      <button type="button" data-preset="today" class="sel">Today</button>
      <button type="button" data-preset="yesterday">Yesterday</button>
      <button type="button" data-preset="thisMonth">This Month</button>
      <button type="button" data-preset="lastMonth">Last Month</button>
    </div>
    <div class="daterange">
      From <input type="date" id="fromDate"> to <input type="date" id="toDate">
      <button type="button" class="apply" id="applyRange">Apply</button>
    </div>
  </div>
  <div class="range-warn" id="rangeWarn" style="display:none"></div>
  <div id="content"><div class="center-state"><div class="spin"></div></div></div>
</div>
<script>
/* =====================================================================
   Get-Rescue — Agent Performance widget (2026-09-03)

   Runs inside getRescueTicket's own logged-in agent portal context. Scopes
   every ticket-based metric to THIS agent's own tickets via the new
   Created_By_Agent_Email field (stamped at ticket creation, see
   getRescueTicket's own `create` stage) — tickets created BEFORE that field
   existed will not be attributed to any agent here; that's a known,
   unavoidable gap for historical data, not a bug in this widget.

   Call-center metrics (Number of Calls, Missed Calls, Avg Call Answer Time,
   Avg Talk Time, % of Calls Hung Up) have NO data source anywhere in this
   app yet — no cloud telephony integration exists (confirmed via the
   earlier wireframe compliance audit). Shown honestly as "Not available"
   rather than guessed or left blank with no explanation.

   Filter option 2 (explicit From/To date range) is the primary control per
   the hand-drawn wireframe's own "1st priority" note; option 1 (Today/
   Yesterday/This Month/Last Month) is offered as quick presets that just
   populate the same From/To fields — one underlying filter, two ways to
   set it. Capped at a 60-day span ("Do not show performance for > 60
   days") — a wider range is rejected with a message, not silently clamped.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  reportName: "Agent_Ticket_Report",
  // Call_Log_Report wired in 2026-09-23. The header comment above used to say
  // the call-centre metrics had "NO data source anywhere in this app" - that
  // was true when written, but the Ozonetel integration and the Call_Log form
  // exist now, so those five tiles no longer have to read "Not available".
  callLogReport: "Call_Log_Report",
  serviceTypeField: "Service_Type"
};
const MAX_RANGE_DAYS = 60;
let INIT_PARAMS = null, LOGIN_EMAIL = "";
/* null = not loaded yet / unreadable -> tiles stay "Not available"; an array
   (even empty) = Call_Log was read successfully, so real figures are shown. */
let ALL_CALLS = null;

const $=(id)=>document.getElementById(id);
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function resolve(method){
  const C = window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces = [C.DATA, C.PUBLISH, C.META, C.UTIL, C.FILE];
  for (let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||1000 };
  if(criteria) cfg.criteria=criteria;
  try{
    const r=await fn(cfg);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  }catch(e){ console.warn("[GR-AgentPerf] apiGetReport("+report+") failed", e); return []; }
}

/* ---------- date parsing (same defensive multi-format approach as the
   dashboard timer / vendor performance widgets) ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseDateTime12(str){
  if(!str) return null;
  const m=String(str).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return null;
  const monIdx=MON.findIndex(function(mo){ return mo.toLowerCase()===m[2].toLowerCase(); });
  if(monIdx<0) return null;
  let hour=Number(m[4])%12; if(/pm/i.test(m[7])) hour+=12;
  const d=new Date(Number(m[3]), monIdx, Number(m[1]), hour, Number(m[5]), Number(m[6]));
  return isNaN(d) ? null : d;
}
function parseDateTime24(str){
  if(!str) return null;
  const m=String(str).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
  if(!m) return null;
  const monIdx=MON.findIndex(function(mo){ return mo.toLowerCase()===m[2].toLowerCase(); });
  if(monIdx<0) return null;
  const d=new Date(Number(m[3]), monIdx, Number(m[1]), Number(m[4]), Number(m[5]), Number(m[6]));
  return isNaN(d) ? null : d;
}
function parseAnyDateTime(str){
  if(!str) return null;
  const native=new Date(str);
  if(!isNaN(native)) return native;
  return parseDateTime12(str) || parseDateTime24(str);
}
function inRange(dateVal, range){
  const d=parseAnyDateTime(dateVal);
  if(!d) return false;
  return d.getTime()>=range.from.getTime() && d.getTime()<=range.to.getTime();
}
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0); }
function endOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999); }
function presetRange(key){
  const now=new Date();
  if(key==="today") return { from:startOfDay(now), to:endOfDay(now) };
  if(key==="yesterday"){ const y=new Date(now); y.setDate(y.getDate()-1); return { from:startOfDay(y), to:endOfDay(y) }; }
  if(key==="thisMonth") return { from:new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0), to:endOfDay(now) };
  if(key==="lastMonth"){ const f=new Date(now.getFullYear(),now.getMonth()-1,1,0,0,0,0); const t=new Date(now.getFullYear(),now.getMonth(),0,23,59,59,999); return { from:f, to:t }; }
  return { from:startOfDay(now), to:endOfDay(now) };
}

function applyPreset(key){
  const r=presetRange(key);
  $("fromDate").value=ymd(r.from); $("toDate").value=ymd(r.to);
  document.querySelectorAll("#presets button").forEach(function(b){ b.classList.toggle("sel", b.dataset.preset===key); });
  runRefresh(r);
}
document.querySelectorAll("#presets button").forEach(function(b){ b.onclick=function(){ applyPreset(b.dataset.preset); }; });
$("applyRange").onclick=function(){
  document.querySelectorAll("#presets button").forEach(function(b){ b.classList.remove("sel"); });
  const f=$("fromDate").value, t=$("toDate").value;
  if(!f||!t){ return; }
  runRefresh({ from:startOfDay(new Date(f)), to:endOfDay(new Date(t)) });
};

/* ---------- stat computation ---------- */
/* computeCallStats() - 2026-09-23. The five call-centre tiles were hardcoded
   to "Not available" because no telephony data existed when this widget was
   written. Call_Log now exists and is populated by two independent paths (the
   callCenter widget when an agent places a call, and getCallbackStatus when
   Ozonetel pushes the end-of-call record), so these can be real.

   Attribution: Placed_By carries the agent's own login email and is the only
   field that maps a call to THIS agent reliably. Ozonetel's Agent_Name is its
   own agent label ("Sagar"), which cannot be mapped back to a Creator login,
   so rows without Placed_By - notably inbound calls logged by the callback
   alone - are not attributed to anyone here. That is a data-model gap, not
   something this widget can infer; better to under-count than to credit an
   agent with calls that may not be theirs.

   Durations arrive in seconds (getCallbackStatus converts Ozonetel's HH:MM:SS
   before writing), so they are averaged directly and rendered as mm:ss. */
function callTime(c){ return c.Call_Start_Time || c.Added_Time; }
function isMissedCall(c){
  const st=String(c.Call_Status||"").trim().toLowerCase();
  if(st==="") return false;
  if(st.indexOf("answer")>=0) return false;
  return true;
}
function secsOf(v){ const x=Number(v); return isNaN(x) ? null : x; }
function mmss(totalSecs){
  const s=Math.round(totalSecs);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function computeCallStats(calls, range){
  if(!Array.isArray(calls)) return null;
  const mine = calls.filter(function(c){
    if(String(c.Placed_By||"").trim().toLowerCase() !== String(LOGIN_EMAIL||"").trim().toLowerCase()) return false;
    return inRange(callTime(c), range);
  });
  const landed = mine.length;
  const missed = mine.filter(isMissedCall).length;
  const answerTimes = mine.map(function(c){ return secsOf(c.Time_To_Answer); }).filter(function(v){ return v!=null && v>0; });
  const talkTimes   = mine.map(function(c){ return secsOf(c.Call_Duration); }).filter(function(v){ return v!=null && v>0; });
  const avg=function(list){ return list.length ? list.reduce(function(a,b){ return a+b; },0)/list.length : null; };
  const agentHangups = mine.filter(function(c){
    return String(c.Call_Outcome||"").toLowerCase().indexOf("agent")>=0;
  }).length;
  return { landed:landed, missed:missed, avgAnswer:avg(answerTimes), avgTalk:avg(talkTimes),
    pctAgentHangup: landed ? Math.round((agentHangups/landed)*100) : null };
}
/* Per-metric timestamps - 2026-09-23, user-reported live ("in agent
   performance page not showing proper data, not showing the completed data").

   Every metric used to be filtered on Added_Time, the ticket's CREATION date.
   So "Completed Tickets" for Today actually meant "tickets CREATED today that
   happen to be complete" - a ticket opened last week and finished this morning
   counted as zero. With a Today filter that reads as an empty dashboard, which
   is exactly what was reported.

   Each metric now filters on the date that metric is actually about. Where a
   ticket carries no closure stamp at all (older records, or a status set
   before these fields existed) it falls back to Added_Time, i.e. precisely the
   old behaviour - so nothing that used to be counted stops being counted. */
function completionTime(r){
  return r.Agent_Closure_Time || r.RSP_Closure_Time || r.RSP_Completion_Time || r.Added_Time;
}
function cancellationTime(r){
  return r.Cancellation_Time || r.Agent_Closure_Time || r.RSP_Closure_Time || r.Added_Time;
}
function closureTime(r){
  return r.Agent_Closure_Time || r.RSP_Closure_Time || r.Added_Time;
}
function computeStats(tickets, range){
  const mine = tickets.filter(function(r){ return inRange(r.Added_Time, range); });

  const newCount = mine.length;
  // Real bug fixed 2026-09-04, live-confirmed via console dump: Closure_Status
  // is a separate, agent-driven Final Closure field that in practice is
  // almost never set (every "done" ticket sampled live had it blank) — the
  // vendor/RSP's own completion signal is Status:"RSP CLOSED" (Step 8,
  // Payment Received), which happens automatically and much earlier than
  // any optional Final Closure step. Keeping the Closure_Status check too
  // (a ticket that DOES reach full Final Closure with Completed set should
  // still count) — just no longer the only signal.
  /* Note these filter `tickets`, NOT `mine` - `mine` is "created in range",
     which is the right basis for New Tickets Created and for the
     creation-to-assignment average, but the wrong one for everything below. */
  const completedList = tickets.filter(function(r){
    const st=String(r.Status||"").trim().toUpperCase();
    const cs=String(r.Closure_Status||"").trim();
    if(!(st==="RSP CLOSED" || cs==="Completed")) return false;
    return inRange(completionTime(r), range);
  });
  const completed = completedList.length;
  const cancelled = tickets.filter(function(r){
    const st=String(r.Status||"").trim().toUpperCase();
    const cs=String(r.Closure_Status||"").trim();
    if(!(st==="RSP CANCELLED" || cs==="Cancelled" || cs==="Cancelled - Billable")) return false;
    return inRange(cancellationTime(r), range);
  }).length;
  const notConverted = tickets.filter(function(r){
    if(String(r.Closure_Status||"").trim()!=="Not Converted") return false;
    return inRange(closureTime(r), range);
  }).length;

  // "ON DEMAND" is a plain sentinel string on Client (not a Lookup id for
  // that special walk-in client) — same check getRescueTicket's own
  // onDemandInvoicing()/clientDisplayName() already use.
  const isOnDemand=function(r){ return String(r.Client||"").trim().toUpperCase()==="ON DEMAND"; };
  const sumFee=function(list){ return list.reduce(function(acc,r){ return acc+(Number(r.Total_Service_Fee)||0); }, 0); };
  /* Revenue follows COMPLETED tickets, not created ones - money is earned when
     the job finishes. Uses completedList above so the two figures can never
     disagree about which tickets counted. */
  const revRSR = sumFee(completedList.filter(function(r){ return isOnDemand(r) && String(r[CONFIG.serviceTypeField]||"").toUpperCase()!=="TOW"; }));
  const revTOW = sumFee(completedList.filter(function(r){ return isOnDemand(r) && String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW"; }));

  const withBoth = mine.map(function(r){
    const created=parseAnyDateTime(r.Added_Time);
    const assigned=parseDateTime12(r.Assignment_Time) || parseDateTime24(r.Assignment_Time);
    if(!created || !assigned) return null;
    return assigned.getTime()-created.getTime();
  }).filter(function(v){ return v!=null && v>=0; });
  const avgAssignMins = withBoth.length ? Math.round(withBoth.reduce(function(a,b){ return a+b; },0)/withBoth.length/60000) : null;

  /* SLA adherence, 2026-09-25 — ETA sheet item 25: "response time (Case Created
     to RSP Accepted), service time (Accepted to Completed)". Every timestamp this
     needs was already being captured; nothing new is stored.

     Accept time is split RSR/TOW the same way every other paired field in this
     project is, and falls back to the other branch before giving up — so a ticket
     whose Service_Type changed after acceptance still reports its real accept time
     rather than dropping out of the average.

     Measured over completedList, the same set the Completed tile and the revenue
     figures use, so all four can never disagree about which tickets counted. A
     ticket missing either stamp is excluded rather than counted as zero, and a
     negative span (clock skew, or a stamp edited by hand) is dropped for the same
     reason — one bad row must not drag the average. Null when nothing qualifies,
     which renders as an em dash rather than a misleading 0. */
  const acceptTimeOf = function(r){
    const svc = String(r[CONFIG.serviceTypeField]||"").toUpperCase();
    const primary = svc==="TOW" ? r.Service_Acceptance_For_Tow : r.Service_Acceptance;
    return primary || r.Service_Acceptance || r.Service_Acceptance_For_Tow || "";
  };
  const avgSpanMins = function(list, fromOf, toOf){
    const spans = list.map(function(r){
      const a = parseAnyDateTime(fromOf(r)), b = parseAnyDateTime(toOf(r));
      if(!a || !b) return null;
      const ms = b.getTime() - a.getTime();
      return ms >= 0 ? ms : null;
    }).filter(function(v){ return v != null; });
    if(!spans.length) return null;
    return Math.round(spans.reduce(function(x,y){ return x+y; }, 0) / spans.length / 60000);
  };
  /* Collections, 2026-09-25 — ETA sheet item 26: "Financial reports: Revenue
     tracking, payment collections, outstanding". Revenue already existed above;
     these are the other two.

     Measured over completedList, the same basis revenue already uses, so every
     financial figure on this page agrees about which tickets counted. Collections
     on a ticket still in flight are deliberately not counted here: a booking fee
     taken today against a job finishing next week would otherwise make Collected
     exceed Billed for the period and Outstanding go negative.

     The two fee stages carry separate settlement flags, and each is only counted
     once its own flag says the money actually arrived:
       Booking fee   -> Payment_Status  = "PAID"  (the BF Payment Status field)
       Remaining fee -> Payment_received = "Yes"   (written only by the payment step)
     Billed is Total_Service_Fee, which is the agreed price, not the sum of the two
     parts - they can differ where a fee was revised after the booking fee was
     taken, and the agreed price is what the customer owes.

     Outstanding is floored at zero: an overpayment is a refund question, not a
     negative receivable, and showing it as one would misstate the position. */
  const bookingCollected = completedList.reduce(function(acc,r){
    return acc + (String(r.Payment_Status||"").trim().toUpperCase()==="PAID" ? (Number(r.Booking_Fee)||0) : 0);
  }, 0);
  const remainingCollected = completedList.reduce(function(acc,r){
    return acc + (String(r.Payment_received||"").trim()==="Yes" ? (Number(r.Remaining_Fee)||0) : 0);
  }, 0);
  const collected = bookingCollected + remainingCollected;

  /* Collections by payment mode, 2026-09-25 — ETA sheet item 31: "Payment Modes
     report: PG, UPI, Cash, Direct".

     The mode names used are the real Payment_Method / Payment_Method_Final dropdown
     options, not the sheet's shorthand: "PG" is "Payment Gateway" here, and there
     is no "Direct" option on either field. Anything that does not match a known
     option is bucketed as Other rather than dropped, so the breakdown can never
     quietly lose money.

     Each fee stage is attributed to ITS OWN mode field — a booking fee paid by
     gateway and a remaining fee paid in cash on the same ticket land in different
     buckets, which is what actually happened. Driven by the same two settlement
     flags the Collected tile uses, so the buckets sum to that tile exactly rather
     than being a second, independently-derived figure that could disagree. */
  const PAY_MODES = ["Payment Gateway","Cash","UPI","Card","Net Banking"];
  const modeTotals = { Other: 0 };
  PAY_MODES.forEach(function(m){ modeTotals[m] = 0; });
  const addToMode = function(rawMode, amount){
    const amt = Number(amount)||0;
    if(!(amt > 0)) return;
    const m = String(rawMode||"").trim();
    modeTotals[PAY_MODES.indexOf(m)>=0 ? m : "Other"] += amt;
  };
  completedList.forEach(function(r){
    if(String(r.Payment_Status||"").trim().toUpperCase()==="PAID") addToMode(r.Payment_Method, r.Booking_Fee);
    if(String(r.Payment_received||"").trim()==="Yes") addToMode(r.Payment_Method_Final, r.Remaining_Fee);
  });
  const modeRows = Object.keys(modeTotals)
    .filter(function(k){ return modeTotals[k] > 0; })
    .sort(function(a,b){ return modeTotals[b] - modeTotals[a]; })
    .map(function(k){ return { mode: k, amount: modeTotals[k] }; });
  const billed = sumFee(completedList);
  const outstanding = Math.max(0, billed - collected);

  const slaResponseMins = avgSpanMins(completedList, function(r){ return r.Added_Time; }, acceptTimeOf);
  const slaServiceMins  = avgSpanMins(completedList, acceptTimeOf, function(r){ return r.RSP_Completion_Time || completionTime(r); });

  return { newCount, completed, cancelled, notConverted, revRSR, revTOW, avgAssignMins, slaResponseMins, slaServiceMins, billed, collected, outstanding, modeRows };
}

function statCard(icon, value, label, na){
  return '<div class="card'+(na?" na":"")+'"><div class="ic">'+icon+'</div><div class="num'+(na?" na":"")+'">'+esc(value)+'</div><div class="lbl">'+esc(label)+'</div></div>';
}
function money(v){ return "₹"+Math.round(v).toLocaleString("en-IN"); }
/* Minutes as "1h 25m" once past an hour — a service time of "312 min" is a number
   the reader has to do arithmetic on before it means anything. Under an hour it
   stays in plain minutes, which is how response times are actually discussed. */
function hoursMins(mins){
  const m = Math.max(0, Math.round(Number(mins)||0));
  if(m < 60) return m+" min";
  const h = Math.floor(m/60), rem = m%60;
  return rem ? (h+"h "+rem+"m") : (h+"h");
}

function render(stats, callStats){
  const NA = "Not available";
  /* callStats === null means Call_Log itself could not be read, so the tiles
     keep their original honest "Not available". A real (possibly all-zero)
     result means the data source works and this agent simply had no calls in
     the period - 0 is then the correct answer, not "unavailable". */
  const haveCalls = !!callStats;
  const cs = callStats || {};
  $("content").innerHTML = `
    <div class="section-title">${haveCalls ? "Call Center" : "Call Center (requires Cloud Telephony integration)"}</div>
    <div class="grid">
      ${haveCalls ? statCard(ICON_PHONE, String(cs.landed), "Number of Calls Landed") : statCard(ICON_NA, NA, "Number of Calls Landed", true)}
      ${haveCalls ? statCard(ICON_PHONE, String(cs.missed), "Number of Missed Calls") : statCard(ICON_NA, NA, "Number of Missed Calls", true)}
      ${haveCalls ? statCard(ICON_CLOCK, cs.avgAnswer==null ? "—" : mmss(cs.avgAnswer), "Avg. Call Answer Time") : statCard(ICON_NA, NA, "Avg. Call Answer Time", true)}
      ${haveCalls ? statCard(ICON_CLOCK, cs.avgTalk==null ? "—" : mmss(cs.avgTalk), "Avg. Talk Time") : statCard(ICON_NA, NA, "Avg. Talk Time", true)}
      ${haveCalls ? statCard(ICON_PHONE, cs.pctAgentHangup==null ? "—" : cs.pctAgentHangup+"%", "% of Calls Hung Up by Agent") : statCard(ICON_NA, NA, "% of Calls Hung Up by Agent", true)}
    </div>
    <div class="section-title">Tickets</div>
    <div class="grid">
      ${statCard(ICON_TICKET, stats.newCount, "New Tickets Created")}
      ${statCard(ICON_TICKET, stats.completed, "Completed Tickets")}
      ${statCard(ICON_TICKET, stats.cancelled, "Cancelled Tickets")}
      ${statCard(ICON_TICKET, stats.notConverted, "Not Converted Tickets")}
    </div>
    <div class="section-title">Revenue &amp; Efficiency</div>
    <div class="grid">
      ${statCard(ICON_MONEY, money(stats.revRSR), "On-Demand Revgen (RSR)")}
      ${statCard(ICON_MONEY, money(stats.revTOW), "On-Demand Revgen (TOW)")}
      ${stats.avgAssignMins==null ? statCard(ICON_CLOCK, "—", "Avg Time (Creation to Assignment)") : statCard(ICON_CLOCK, stats.avgAssignMins+" min", "Avg Time (Creation to Assignment)")}
    </div>
    <div class="section-title">Collections</div>
    <div class="grid">
      ${statCard(ICON_MONEY, money(stats.billed), "Total Billed")}
      ${statCard(ICON_MONEY, money(stats.collected), "Collected")}
      ${statCard(ICON_MONEY, money(stats.outstanding), "Outstanding")}
    </div>
    <div class="section-title">Collections by Payment Mode</div>
    <div class="grid">
      ${stats.modeRows.length
        ? stats.modeRows.map(function(m){ return statCard(ICON_MONEY, money(m.amount), m.mode); }).join("")
        : statCard(ICON_MONEY, money(0), "No collections in this period")}
    </div>
    <div class="section-title">SLA Adherence</div>
    <div class="grid">
      ${stats.slaResponseMins==null ? statCard(ICON_CLOCK, "—", "Avg Response Time (Created → Accepted)") : statCard(ICON_CLOCK, hoursMins(stats.slaResponseMins), "Avg Response Time (Created → Accepted)")}
      ${stats.slaServiceMins==null ? statCard(ICON_CLOCK, "—", "Avg Service Time (Accepted → Completed)") : statCard(ICON_CLOCK, hoursMins(stats.slaServiceMins), "Avg Service Time (Accepted → Completed)")}
    </div>
  `;
}
function renderError(msg){ $("content").innerHTML = '<div class="state-err">'+esc(msg)+'</div>'; }

let ALL_TICKETS=[];
function runRefresh(range){
  const days=(range.to.getTime()-range.from.getTime())/86400000;
  if(days>MAX_RANGE_DAYS){
    $("rangeWarn").style.display="";
    $("rangeWarn").textContent="Selected range is "+Math.ceil(days)+" days — performance can only be shown for up to "+MAX_RANGE_DAYS+" days at a time. Pick a shorter range.";
    return;
  }
  $("rangeWarn").style.display="none";
  render(computeStats(ALL_TICKETS, range), computeCallStats(ALL_CALLS, range));
}

async function boot(){
  let tries=0;
  while(!resolve("getRecords") && tries<40){ await new Promise(function(r){ setTimeout(r,200); }); tries++; }
  if(!resolve("getRecords")){ renderError("Couldn't connect to Zoho — please reopen this page."); return; }
  try{
    const getInit = resolve("getInitParams");
    if(getInit){ INIT_PARAMS = await getInit(); LOGIN_EMAIL = (INIT_PARAMS && INIT_PARAMS.loginUser) || ""; }
    $("agentNameLine").textContent = LOGIN_EMAIL || "Unknown agent";
    if(!LOGIN_EMAIL){ renderError("Couldn't identify your login — performance can't be scoped to an agent."); return; }
    ALL_TICKETS = await apiGetReport(CONFIG.reportName, 'Created_By_Agent_Email == "'+LOGIN_EMAIL.replace(/"/g,'\\"')+'"', 1000);
    console.log("[GR-AgentPerf] boot: "+ALL_TICKETS.length+" tickets matched Created_By_Agent_Email == \""+LOGIN_EMAIL+"\"");
    /* Call_Log load - 2026-09-23. Best-effort and deliberately AFTER the
       tickets: if this report does not exist, is not shared with this portal
       profile, or simply errors, apiGetReport() returns [] and every
       ticket-based metric on this page still renders exactly as before.
       ALL_CALLS stays null only when the call below throws outright, which is
       what keeps the five tiles on their honest "Not available" rather than
       showing a misleading 0. */
    try{
      ALL_CALLS = await apiGetReport(CONFIG.callLogReport, null, 1000);
      console.log("[GR-AgentPerf] boot: "+ALL_CALLS.length+" Call_Log rows loaded; "+
        ALL_CALLS.filter(function(c){ return String(c.Placed_By||"").trim().toLowerCase()===String(LOGIN_EMAIL||"").trim().toLowerCase(); }).length+
        " carry Placed_By == \""+LOGIN_EMAIL+"\" and are attributable to this agent.");
    }catch(e){
      ALL_CALLS = null;
      console.warn("[GR-AgentPerf] boot: Call_Log could not be read — the call-centre tiles will stay \"Not available\". Everything else is unaffected.", e);
    }
    // Default to "Today" (was "Last Month") — defaulting a live performance
    // dashboard to last month meant a ticket created/completed the same day
    // never showed up until the user manually switched presets, which read
    // as "data is missing" when it wasn't.
    applyPreset("today");
  }catch(e){
    console.error("[GR-AgentPerf] boot failed", e);
    renderError("Something went wrong loading your performance data — check the console for details.");
  }
}
boot();
