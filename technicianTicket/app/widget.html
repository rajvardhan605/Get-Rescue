async function markReached(){
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Arrival photo is required","err"); return; }
  setDisabled("reachedBtn",true);
  try{
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    // Reach Location + Distance_Reach_To_Breakdown (2026-08-11, user
    // request, "Missing Fields & Field Behavior" spec) — Reach never
    // captured a live GPS fix before this at all, unlike Accept
    // (RSP_Start_Latitude/Longitude) and Cancel (Cancel_Location_Lat/Lon),
    // both of which already do. Distance_Reach_To_Breakdown is a BRAND NEW
    // field, deliberately separate from Roundtrip_Distance just above —
    // that one is Office->Breakdown->Office and stays untouched; this is a
    // plain one-way distance from THIS click's own position to the
    // breakdown location, mirroring exactly how Distance_To_Breakdown
    // already works at Accept (see acceptService() above). Best-effort —
    // a denied/unavailable location just means these two fields are
    // skipped, same tolerance Accept/Cancel's own GPS fixes already have.
    // Fetched BEFORE the round-trip calc below (moved up 2026-09-07, see
    // that calc's own comment for why).
    const reachPos = await requireLocation();
    // Round Trip Distance (2026-09-07, user-provided LOCATIONS-DISTANCES-
    // DATETIME spec, "RSR-3(a)") — real bug fix: this used to always route
    // through the static ticket breakdown location C (r.Latitude/Longitude)
    // even though a live GPS fix (reachPos, spec's own "E" point) is taken
    // at this exact Reach click a few lines below — the fix captured E but
    // the round trip never used it. Spec defines this leg as Office->E->
    // Office, not Office->C->Office. Uses reachPos when available (matches
    // spec exactly); falls back to the static breakdown C only if GPS is
    // denied/unavailable, so Roundtrip_Distance is never simply skipped
    // the way Distance_Reach_To_Breakdown below is allowed to be.
    const rtLat = reachPos ? reachPos.lat : bLat, rtLon = reachPos ? reachPos.lon : bLon;
    /* Skipped for ON DEMAND - 2026-10-19. This calculation exists only to
       produce Roundtrip_Distance, so for a walk-in there is nothing to ask
       Google for. null,null rather than the drop pin: the spec says this leg
       is office -> reach -> office, and passing a drop made an RSR ticket that
       happened to carry one silently become a 3-leg trip. */
    const rt = isOnDemandTicket(r) ? null
      : await calcRoundTripKm(rtLat,rtLon,null,null,travelModeFor(r));
    // ETA (mins) manual-entry input hidden from this screen 2026-08-05 (user
    // request) — was captured automatically at Accept anyway; whatever's
    // already saved there stays as-is, simply not touched by this payload.
    const payload={ Reach_Time: fmtDateTime(new Date()), Status:"WORK IN PROGRESS" };
    if(rt!=null) payload.Roundtrip_Distance = rt;
    if(reachPos){
      payload.Reach_Location_Lat=reachPos.lat; payload.Reach_Location_Lon=reachPos.lon;
      const reachDist = await calcDistanceETA(reachPos.lat,reachPos.lon,bLat,bLon,travelModeFor(r));
      if(reachDist) payload.Distance_Reach_To_Breakdown=reachDist.distanceKm;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached","ok");
    // WhatsApp "Reach Time" message (2026-09-06, RESCUE Repair Service
    // Logic Flow spec: "Mechanic/Driver app - Reach Breakdown Location
    // page | on click REACH button | Send 10"). Template name/no-params
    // shape is a best-effort guess (no visible parameter slots in the
    // spec's own template text) — same "flagged, not confirmed" pattern
    // as every template name in getRescueTicket. Fire-and-forget, after
    // the real save above — a failed send never blocks the Reach action
    // itself, matching this app's existing tolerance for GPS/photo steps.
    /* Template name corrected 2026-09-22 - "reach_time" is not in the approved
       catalogue; #10 is share_rescuer_reach_time_ WITH a trailing underscore
       (the spec flags it explicitly). Still zero parameters, as approved. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescuer_reach_time_", []);
    goToStatus("WORK IN PROGRESS");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedBtn",false); }
}
async function confirmCancel(){
  const reason=$("cancelReason").value;
  if(!reason){ toast("Please pick a cancel reason","err"); return; }
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Cancel photo is required","err"); return; }
  setDisabled("confirmCancelBtn",true);
  try{
    const r=state.current;
    // "Cancellation time" = the click itself; "cancel location" = a fresh GPS
    // fix at that moment; "RSP distance" = distance from wherever this tech
    // was at Accept time (RSP_Start_Latitude/Longitude) to right now — per the Action 6
    // flow spec (2026-07-31). Field names guessed (Cancellation_Time,
    // Cancel_Location_Lat/Lon, Cancel_Distance) — flagged, not confirmed; kept
    // distinct from Step 5's own "RSP distance" (Distance_To_Breakdown) since
    // they're computed from different start/end points, not the same value.
    const payload={ Cancel_Reason:reason, Status:"RSP CANCELLED", Cancellation_Time: fmtDateTime(new Date()) };
    const pos = await requireLocation();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon,travelModeFor(r)) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Distance_Cancel_To_Breakdown (2026-08-11, user request, "Missing
      // Fields & Field Behavior" spec item 2) — BRAND NEW field, deliberately
      // different from Cancel_Distance just above (Accept location -> Cancel
      // location) — this is Cancel location -> the ticket's own static
      // breakdown location, which no field/calc covered before this at all.
      const bLatC=Number(r.Latitude), bLonC=Number(r.Longitude);
      const cancelToBreakdown = !isNaN(bLatC) && !isNaN(bLonC) ? await calcDistanceETA(pos.lat,pos.lon,bLatC,bLonC,travelModeFor(r)) : null;
      if(cancelToBreakdown) payload.Distance_Cancel_To_Breakdown=cancelToBreakdown.distanceKm;
      // Client-requested addition (2026-08-04): round trip office -> this
      // technician's current (cancel-click) position -> office, using the
      // same 2-leg calcRoundTripKm() the Reach screen uses for the
      // breakdown-location case — passing pos as the "breakdown" point and no
      // drop point gives exactly office->pos->office. Written to the same
      // Roundtrip_Distance field markReached() sets, since a ticket only ever
      // reaches this via Cancel OR Reached, never both.
      /* Not written for ON DEMAND - 2026-10-19, client spec. The calculation
         above still runs because its other legs are wanted either way. */
      /* Same as the vendor app's cancel - Task Tracker #14 (2026-10-27, "technician app
         distance calc - same as vendor app"). One office -> cancel position -> office
         lookup now gives both the total (identical to calcRoundTripKm: same Google
         request, same straight-line fallback, same rounding) and the three leg
         fields the vendor app already writes on cancel. Was: payload.Roundtrip_Distance =
         await calcRoundTripKm(pos.lat,pos.lon,null,null,travelModeFor(r)); */
      const cancelLegs = await officeRoundTripLegs(pos.lat,pos.lon,travelModeFor(r));
      if(!isOnDemandTicket(r)) payload.Roundtrip_Distance = cancelLegs.total;
      payload.Office_To_Mechanic = cancelLegs.officeToMechanic;
      payload.Mechanic_To_Breakdown = cancelLegs.mechanicToBreakdown;
      payload.Breakdown_To_Office = cancelLegs.breakdownToOffice;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not cancel","err"); }
  finally{ setDisabled("confirmCancelBtn",false); }
}

/* Payment screen auto-refresh — 2026-09-28, client list item "Auto refresh on
   PAYMENTS page for vendor app: success payment needs to show".

   The remaining fee is settled by the CUSTOMER, on their own phone, through the
   payment link. paymentWebhook.deluge then writes Payment_received / Payment_Status
   onto the ticket. Nothing told this screen any of that had happened, so the vendor
   sat looking at PENDING with the button disabled until they backed out and
   reopened the ticket — exactly while standing next to a customer who has just paid.

   Polls the vendor’s own ticket list, which is already fetched by fetchMyTickets()
   for the dashboard, rather than adding a second data path. Only re-renders when a
   settlement field actually changed: a silent re-render every 10s would fight the
   vendor for focus on the receipt-photo input and the method dropdown.

   Runs only while the payment screen is open. renderActionScreen() stops it on any
   screen change, so it cannot outlive the screen or stack timers. */
let PAYMENT_POLL_TIMER=null;
const PAYMENT_POLL_MS=10000;
function stopPaymentPoll(){ if(PAYMENT_POLL_TIMER){ clearInterval(PAYMENT_POLL_TIMER); PAYMENT_POLL_TIMER=null; } }
function startPaymentPoll(){
  stopPaymentPoll();
  PAYMENT_POLL_TIMER=setInterval(pollPaymentReceived, PAYMENT_POLL_MS);
}
async function pollPaymentReceived(){
  const cur=state.current;
  if(!cur || !cur.ID){ stopPaymentPoll(); return; }
  try{
    const fresh=await fetchMyTickets();
    const hit=(fresh||[]).find(function(x){ return String(x.ID)===String(cur.ID); });
    if(!hit) return;   // dropped out of this vendor’s list — the dashboard poll handles that
    const was=String(cur.Payment_received||"").trim()+"|"+String(cur.Payment_Status||"").trim()+"|"+String(cur.Payment_Method_Final||"").trim();
    const now=String(hit.Payment_received||"").trim()+"|"+String(hit.Payment_Status||"").trim()+"|"+String(hit.Payment_Method_Final||"").trim();
    if(was===now) return;
    console.log("[Get-Rescue] pollPaymentReceived: settlement changed on ticket", cur.ID, "|", was, "->", now);
    // Copy the settlement fields onto the in-memory record rather than replacing it
    // wholesale: state.current carries unsaved screen state (a pending receipt
    // photo, a chosen method) that a blanket overwrite would discard.
    cur.Payment_received=hit.Payment_received;
    cur.Payment_Status=hit.Payment_Status;
    cur.Payment_Method_Final=hit.Payment_Method_Final;
    cur.Remaining_Fee_Receipt_Time=hit.Remaining_Fee_Receipt_Time;
    if(String(hit.Payment_received||"").trim()==="Yes") toast("Payment received","ok");
    renderActionScreen();
  }catch(e){ console.warn("[Get-Rescue] pollPaymentReceived failed (non-blocking)", e); }
}

/* The one marker both the vendor apps and the agent Closure page check before
   sending a feedback request, and both set after. See this change's own note
   for why a shared marker was the whole design problem. */
/* The Customer Page, copied from vendorTicket 2026-10-13 so all three field
   apps send the same feedback link rather than two of them quietly falling
   back to Google.

   ⚠ CUSTOMER_PAGE_BASE_URL must stay in step with getRescueTicket's copy -
   it is a published Permalink and changes whenever the page is republished.

   The approved templates' url button is https://creatorapp.zohopublic.in/{{1}},
   so the button variable carries only the PATH after that prefix, never a
   whole URL. */
const CUSTOMER_PAGE_BASE_URL = "https://creatorapp.zohopublic.in/getrescued/get-rescue/page-perma/Customer_Page/0gVCSNX48ASbYtRFUJ563eAbKzNFNnaVwH8fPFZCqaROx4z5T6QRyEQVTshspvvXSgyt5vuyPJSQQC0dwZGyYQKdMeySnUS6mYJr";
const WA_BUTTON_URL_PREFIX = "https://creatorapp.zohopublic.in/";
function buildCustomerPageUrl(record, mode, extraParams){
  if(!CUSTOMER_PAGE_BASE_URL || !record || !record.ID) return "";
  let qs = "recordId=" + encodeURIComponent(record.ID) + "&mode=" + encodeURIComponent(mode);
  if(extraParams){
    Object.keys(extraParams).forEach(function(k){ qs += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(extraParams[k]); });
  }
  return CUSTOMER_PAGE_BASE_URL + "?" + qs;
}
function customerPageButtonPath(record, mode, extraParams){
  const full = buildCustomerPageUrl(record, mode, extraParams);
  if(!full) return "";
  if(full.indexOf(WA_BUTTON_URL_PREFIX) !== 0){
    console.warn("[Get-Rescue] customerPageButtonPath: CUSTOMER_PAGE_BASE_URL does not start with the approved WhatsApp button prefix", WA_BUTTON_URL_PREFIX, "- the template's button cannot point at this URL. Full URL was:", full);
    return "";
  }
  return full.slice(WA_BUTTON_URL_PREFIX.length);
}
const FEEDBACK_SENT_FIELD = "Feedback_Sent_At";
/* THE TEMPLATE THAT CARRIES THIS APP'S OWN FEEDBACK PAGE - 2026-10-13.

   A WhatsApp link rides a template's URL BUTTON, and only four templates in
   this workspace have one. This is the client's own choice of which to reuse:
   confirm_booking_fee_and_total_fee already points its button at the Customer
   Page (the agent's Send Payment Link sends it with mode "booking_payment"),
   so sending the same template with a "feedback" path opens the feedback form.

   ⚠ The WORDING stays the booking-fee wording. Template text is fixed and
   approved; only the button's destination changes here. The customer gets a
   message that reads like a fee confirmation with a button onto the feedback
   page. Chosen deliberately over waiting for a dedicated feedback template -
   recorded so it is not later mistaken for a bug.

   Blank this to fall back to google_feedback (Google Reviews) instead. */
const FEEDBACK_CUSTOMER_PAGE_TEMPLATE = "confirm_booking_fee_and_total_fee";
/* The two body variables the template expects, in its own order. Real figures
   rather than blanks: WhatsPortal rejects an empty parameter with 422
   message_rejected, so they must carry something. */
function feedbackTemplateParams(r){
  return [String((r && r.Total_Service_Fee) || 0), String((r && r.Booking_Fee) || 0)];
}
/* Did the agent turn the request OFF? Read tolerantly on purpose.

   Google_Feedback_Requested is a DEFAULT-TRUE checkbox on the Closure page, and
   it may not even be on the report layout these apps read - in which case it
   comes back undefined. Absence therefore means ON, not off. Only an explicit
   off suppresses the send: a field that is simply missing must never silently
   disable a feature, which on this platform is exactly how things disappear. */
function feedbackIsSuppressed(r){
  const v = r ? r.Google_Feedback_Requested : null;
  if(v === undefined || v === null || v === "") return false;
  if(v === true || v === "Yes") return false;
  if(Array.isArray(v)) return v.indexOf("Yes") === -1;
  if(v === false || v === "No") return true;
  return false;
}
/* Sends the feedback request, once. `force` is the manual button: it ignores
   the already-sent marker so a vendor can re-send on request, but still
   respects an agent who switched the request off.

   Never throws. The payment it follows is already written and closed by the
   time this runs, and nothing here may put that at risk. */
async function maybeSendFeedbackRequest(r, force){
  try{
    if(!r || !r.ID) return { sent:false, why:"No ticket is open." };
    /* The agent's checkbox governs the AUTOMATIC send only - 2026-10-13. A
       vendor who just pressed the button has given an explicit instruction, and
       obeying a default over it is what made the button appear broken. */
    if(!force && feedbackIsSuppressed(r)){
      console.log("[Get-Rescue] feedback request not sent for ticket "+r.ID+": Request Google Feedback is switched off on this ticket.");
      return { sent:false, why:"Request Google Feedback is switched off on this ticket." };
    }
    const already = String((r[FEEDBACK_SENT_FIELD] == null ? "" : r[FEEDBACK_SENT_FIELD])).trim();
    if(already && !force){
      console.log("[Get-Rescue] feedback request not sent for ticket "+r.ID+": one already went at "+already+". This is the duplicate guard doing its job.");
      return { sent:false, why:"A feedback request already went at "+already+"." };
    }
    const phone = r[CONFIG.phoneField];
    if(!phone){
      console.warn("[Get-Rescue] feedback request not sent for ticket "+r.ID+": the ticket carries no customer phone number.");
      return { sent:false, why:"This ticket has no customer phone number." };
    }
    /* The Customer Page link when a template exists to carry it, otherwise the
       Google one. See FEEDBACK_CUSTOMER_PAGE_TEMPLATE for why. */
    let ok = false;
    let sentWhat = "google_feedback (Google Reviews)";
    let buttonPath = "";
    if(FEEDBACK_CUSTOMER_PAGE_TEMPLATE && typeof customerPageButtonPath === "function"){
      buttonPath = customerPageButtonPath(r, "feedback", {});
      if(!buttonPath){
        console.warn("[Get-Rescue] feedback request: the Customer Page link could not be built for ticket "+r.ID+", so google_feedback is being sent instead.");
      }
    }
    if(buttonPath){
      ok = await sendWhatsAppTemplate(phone, FEEDBACK_CUSTOMER_PAGE_TEMPLATE, feedbackTemplateParams(r), buttonPath);
      sentWhat = FEEDBACK_CUSTOMER_PAGE_TEMPLATE + " with mode=feedback (button opens the Customer Page feedback form; the wording is the booking-fee one)";
      /* Fall back ONLY when WhatsApp says the template does not exist. Create it
         and this starts working on the next send with nothing redeployed. */
      if(waResponseSaysTemplateMissing()){
        console.warn("[Get-Rescue] feedback request: the template \"" + FEEDBACK_CUSTOMER_PAGE_TEMPLATE + "\" does not exist in the WhatsApp workspace, so google_feedback was sent instead. The customer got the Google Reviews link, NOT this app's own feedback page. Create that template with a dynamic url button and this will send the right one.");
        ok = await sendWhatsAppTemplate(phone, "google_feedback", []);
        sentWhat = "google_feedback (Google Reviews — fallback)";
      }
    }
    else{
      ok = await sendWhatsAppTemplate(phone, "google_feedback", []);
    }
    /* WhatsApp can refuse the message while the call itself succeeds - 2026-10-17.
       A rejection was being reported as "Feedback link sent" AND stamped into
       Feedback_Sent_At, which is the duplicate guard - so the automatic send then
       skipped the ticket as already done and the customer got nothing, silently.
       Checked here only: every other template caller keeps its old behaviour. */
    const waErr = ok ? waResponseError() : "";
    if(!ok || waErr){
      console.warn("[Get-Rescue] feedback request to "+phone+" for ticket "+r.ID+" was not accepted by WhatsApp. Nothing is marked as sent, so it can be retried.", LAST_WA_RESPONSE || "");
      return { sent:false, why: waErr || "WhatsApp would not accept the message. Try again shortly." };
    }
    console.log("[Get-Rescue] feedback request sent to "+phone+" for ticket "+r.ID+" using "+sentWhat+".");
    /* Stamped only after a send that landed, so a failure never blocks a retry.
       Best-effort: the message has gone, and losing the stamp costs a possible
       duplicate, not the feature. */
    const stamp = fmtDateTime(new Date());
    try{
      await apiUpdate(r.ID, { [FEEDBACK_SENT_FIELD]: stamp });
      r[FEEDBACK_SENT_FIELD] = stamp;
    }catch(e){
      r[FEEDBACK_SENT_FIELD] = stamp;
      console.warn("[Get-Rescue] feedback request WAS sent for ticket "+r.ID+", but it could not be marked as sent. Add Feedback_Sent_At (Single Line Text) to Create_Case AND to the Agent_Ticket_Report layout, or the agent Closure page may send a second one.", e);
    }
    return { sent:true };
  }catch(e){
    console.warn("[Get-Rescue] maybeSendFeedbackRequest threw (non-blocking - the payment is already recorded and is unaffected)", e);
    return { sent:false, why:"Something went wrong sending it." };
  }
}

    // own "transaction ID, time of receipt... captured in their respective
    // fields" for a real gateway "success") are NOT set here — there's no
    // real payment-gateway integration in this app; see QUESTIONS_TO_ASK.md.
    // Remaining_Fee_Receipt_Time / RSP_Closure_Time (2026-09-07, user-
    // provided LOCATIONS-DISTANCES-DATETIME spec, "#14"/"#15") — both share
    // the exact same trigger per spec (this exact click), mirrored as two
    // separate fields per the spec's own literal numbering. This function
    // only ever runs when the technician genuinely clicks "Payment
    // Received", so no extra guard is needed — same reasoning
    // Payment_received:"Yes" above already relies on.
    /* Payment_Method_Final is deliberately NOT written back over a payment the
       gateway already settled (2026-09-25). paymentWebhook.deluge sets it to
       "Payment Gateway"; this screen has nothing to add, and writing its dropdown
       value could only ever downgrade a real gateway payment to Cash. Every other
       field is written exactly as before, so a normal cash/UPI/card close is
       unchanged. */
    const gatewaySettled=String(r.Payment_Method_Final||"").trim()==="Payment Gateway" && String(r.Payment_received||"").trim()==="Yes";
    const payload={ Payment_received:"Yes", Payment_Status:"PAID", Status:"RSP CLOSED", Remaining_Fee_Receipt_Time: fmtDateTime(new Date()), RSP_Closure_Time: fmtDateTime(new Date()) };
    payload.Service_Closure_Time = payload.RSP_Closure_Time;   // Service_Closure_Time - Task Tracker #57: same time in the single field for both service types.
    const chosenMethod=($("Payment_Method_Final") && $("Payment_Method_Final").value)||"";
    if(!gatewaySettled && chosenMethod) payload.Payment_Method_Final = chosenMethod;
    // Diagnostic logging (2026-08-03) — see vendorTicket's own comment on this same call.
    console.log("[Get-Rescue] confirmPaymentReceived payload:", JSON.stringify(payload));
    // Real bug fixed 2026-09-11 — see vendorTicket's own matching comment
    // (identical fix): uploadPendingPhotos() now runs BEFORE the apiUpdate()
    // that marks the ticket Status="RSP CLOSED"/Payment_Status="PAID" — a
    // genuine photo-upload failure now blocks the close instead of the
    // ticket silently closing without its required proof-of-payment photo.
    await uploadPendingPhotos(r.ID);
    await apiUpdate(r.ID, payload);
    toast("Payment recorded — job closed","ok");
    /* FEEDBACK REQUEST - 2026-10-13, client request. Deliberately placed AFTER
       the awaited write above, so it can only ever run on a payment that is
       genuinely recorded. Not awaited and separately caught: a WhatsApp failure
       must not touch a payment that has already been taken. */
    /* CASH ONLY - 2026-10-13, see this change's own note. Matches the Send
       Feedback Link card, which the client scoped to cash the same day. */
    if(chosenMethod === "Cash" || (Number(r.Remaining_Fee)||0) <= 0){   // #86: also when nothing was owed
      maybeSendFeedbackRequest(r, false)
        .catch(function(e){ console.warn("[Get-Rescue] feedback request after payment failed (non-blocking)", e); });
    }
    else{
      console.log("[Get-Rescue] feedback request not sent for ticket "+r.ID+": payment method is "+(chosenMethod||"(none chosen)")+", and the request is cash-only.");
    }
    backToDashboard();
  }catch(e){ console.error("[Get-Rescue] confirmPaymentReceived error:", e); toast((e&&e.message)||"Could not save","err"); setDisabled("paymentReceivedBtn",false); }
}

// fileCountFor()/zohoFileDownloadUrl()/effectivePhotoCount()/
// hydrateAlreadyUploadedThumbs() (2026-08-21) — see vendorTicket's own
// matching comment for the full real-bug writeup (user-reported live:
// "vendor closes app and opens again... fields display as empty... has to
// click all photos again"). Identical port — same account/app/report.
function fileCountFor(rawValue){
  if(Array.isArray(rawValue)) return rawValue.length;
  return rawValue ? 1 : 0;
}
function zohoFileDownloadUrl(recordId, fieldName, rawValue, index){
  if(!recordId || !rawValue || rawValue===true) return null;
  const first = Array.isArray(rawValue) ? rawValue[index||0] : rawValue;
  if(!first || first===true) return null;
  const raw = (typeof first==="string") ? first
    : (first && typeof first==="object") ? (first.filepath||first.value||first.display_value||null)
    : null;
  if(!raw) return null;
  const m = raw.match(/filepath=([^&]+)/i);
  const filepath = m ? decodeURIComponent(m[1]) : raw;
  const clean = String(filepath).replace(/^\/+/,"");
  return "https://creatorapp.zoho.in/"+ZOHO_SCOPE_NAME+"/"+zohoAppLinkName()+"/report/"+CONFIG.reportName+"/"+recordId+"/"+fieldName+"/download-file?filepath=/"+encodeURIComponent(clean)+"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
function effectivePhotoCount(fieldName){
  const already=fileCountFor(state.current && state.current[fieldName]);
  const picked=(state.photos[fieldName]||[]).length;
  return already+picked;
}
function wirePhotoField(fieldName,max){

}

function uploadBadgeHtml(f){

function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){

    if(!url) return;

     // swap below, which replaces the tile's whole innerHTML (2026-10-05).
    const keepRm=el.querySelector(".rm");
    const restoreRm=function(){ if(keepRm) el.appendChild(keepRm); };

      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';

      el.appendChild(badge);

    el.innerHTML="";

/* See this file's photo-delete notes — deletion is only offered where the
   resulting field contents can actually be rebuilt. */
/* True when this field holds photos saved in an EARLIER session, so it can
   only be cleared whole, never edited photo by photo — see this change's own
   note: a saved photo is a URL, not a file, and a Creator widget cannot read
   it back (CSP blocks fetch; a canvas is cross-origin tainted), so keepers
   could not be re-uploaded after the blanking deletePhotoAt() relies on. */
function photoClearOnlyField(fieldName, max){
  if(Number(max)===1) return false;
  return fileCountFor(state.current && state.current[fieldName])>0;
}
/* Clears every photo on a field so better ones can be taken. Same write
   deletePhotoAt() makes — blank the field, purge the offline queue so nothing
   resurrects — minus the keeper re-upload, because here there are deliberately
   no keepers. The count goes in the prompt: this throws away work, and the
   vendor should see how much before agreeing. */
async function clearAllPhotos(fieldName, max){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  const n=fileCountFor(state.current && state.current[fieldName]) + (state.photos[fieldName]||[]).length;
  // No confirm() here - the button arms itself on first tap instead. A WebView
  // that suppresses dialogs returns false from confirm() without throwing, which
  // silently cancelled this on every phone. See armTwoTap().
  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[GR] clearAllPhotos: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photos — nothing was changed","err");
    return;
  }
  state.current[fieldName]="";
  (state.photos[fieldName]||[]).forEach(function(file){
    state.uploadedPhotoFiles.delete(file); state.failedPhotoFiles.delete(file);
  });
  state.photos[fieldName]=[];
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[GR] clearAllPhotos: could not purge the offline queue for "+fieldName, e); }
  renderPhotoGrid(fieldName,max);
  toast("Photos removed — take new ones","ok");
}
function photoDeleteAllowed(fieldName, max){
  if(Number(max)===1) return true;
  return fileCountFor(state.current && state.current[fieldName])===0;
}
/* Shown only where per-photo removal is impossible, so there is always SOME
   way to replace a bad photo rather than a message telling them to call an
   agent. */
function photoClearAllBtnHtml(fieldName, max){
  if(!photoClearOnlyField(fieldName, max)) return "";
  const n=fileCountFor(state.current && state.current[fieldName]);
  return '<button type="button" class="photo-clearall" data-field="'+esc(fieldName)+'" '
    + 'style="margin-top:8px;font-size:11px;padding:3px 10px;border:1px solid var(--line,#ccc);border-radius:999px;background:transparent;cursor:pointer" '
    + 'title="These photos were saved earlier, so they cannot be removed one at a time. This clears all of them so you can take better ones.">'
    + 'Clear all '+n+' photo'+(n===1?"":"s")+' and re-take</button>';
}
/* Tap once to arm, tap again to do it. Replaces confirm(), which a phone
   WebView answers "false" to without throwing - the tap then did nothing at
   all, with no dialog and no error.

   Disarms itself after four seconds, so a vendor who taps once and puts the
   phone down has not left a photo one stray touch from deletion. */
var ARM_MS = 4000;
function armTwoTap(btn, armedText, run){
  if(!btn){ run(); return; }
  if(btn.dataset.armed === "1"){
    try{ clearTimeout(Number(btn.dataset.armTimer||0)); }catch(e){}
    btn.dataset.armed = "";
    if(btn.dataset.restLabel) btn.textContent = btn.dataset.restLabel;
    btn.classList.remove("armed");
    run();
    return;
  }
  btn.dataset.restLabel = btn.textContent;
  btn.dataset.armed = "1";
  btn.textContent = armedText;
  btn.classList.add("armed");
  var t = setTimeout(function(){
    btn.dataset.armed = "";
    if(btn.dataset.restLabel) btn.textContent = btn.dataset.restLabel;
    btn.classList.remove("armed");
  }, ARM_MS);
  btn.dataset.armTimer = String(t);
  if(typeof toast==="function") toast("Tap again to confirm","err");
}
function photoRmBtnHtml(kind, idx, allowed){
  if(!allowed) return "";
  return '<button type="button" class="rm" data-kind="'+kind+'" data-i="'+idx+'" title="Remove this photo">✕</button>';

/* Removes a photo from the ticket for real.

   Order matters: the field is blanked FIRST and the keepers re-uploaded after.
   The reverse (upload then blank) would delete what was just written. A keeper
   whose re-upload fails goes onto the offline queue exactly like any other
   failed upload, so it is retried rather than lost — the queue is why this is
   safe to do at all.

   Queued rows for this field are purged too. Without that, flushPhotoQueue()
   would happily re-upload the very photo the vendor just deleted. */
async function deletePhotoAt(fieldName, max, kind, index){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  if(!photoDeleteAllowed(fieldName, max)){
    toast("This photo was saved earlier and can't be removed here — ask an agent to clear it on the ticket","err");
    return;
  }
  // No confirm() here either - see clearAllPhotos() and armTwoTap().

  const sessionFiles=(state.photos[fieldName]||[]).slice();
  const removedFile=(kind==="session") ? sessionFiles[index] : null;
  const keepers=sessionFiles.filter(function(f,i){ return !(kind==="session" && i===index); });

  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[Get-Rescue] deletePhotoAt: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photo — nothing was changed","err");
    return;
  }

  // The record no longer holds anything for this field.
  state.current[fieldName]="";
  state.photos[fieldName]=keepers;
  if(removedFile){ state.uploadedPhotoFiles.delete(removedFile); state.failedPhotoFiles.delete(removedFile); }

  // Stop a queued copy resurrecting any of this field's photos.
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[Get-Rescue] deletePhotoAt: could not purge the offline queue for "+fieldName, e); }

  // Put the keepers back.
  for(const f of keepers){
    state.uploadedPhotoFiles.delete(f);
    let ok=false;
    try{ ok=await apiUpload(r.ID, fieldName, f); }catch(e){ ok=false; }
    if(ok) state.uploadedPhotoFiles.add(f);
    else{
      state.failedPhotoFiles.add(f);
      await queuePhotoOffline(r.ID, fieldName, f);
      PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
      renderPhotoQueueNote();
    }
  }
  renderPhotoGrid(fieldName,max);
  toast("Photo removed","ok");
}
function renderPhotoGrid(fieldName,max){

        btn.disabled=true;

async function uploadPendingPhotos(recordId){
  for(const fieldName in state.photos){
    const files=state.photos[fieldName]||[];
    for(let i=0;i<files.length;i++){
      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading twice.
      if(state.uploadedPhotoFiles.has(files[i])) continue;
      // Same return-value fix as uploadPhotoNow(): a save-time failure used to
      // be discarded silently here too.
      const saved=await apiUpload(recordId, fieldName, files[i]);
      if(saved) state.uploadedPhotoFiles.add(files[i]);
      else await queuePhotoOffline(recordId, fieldName, files[i]);
    }
  }
  /* DRAIN ANYTHING QUEUED EARLIER — 2026-10-06, client-reported: "it saves the
     photos when offline, but when the app comes back online and submit is
     clicked the page moves forward and the photos are not sent."

     Exactly right, and this was the gap. The loop above only ever handles THIS
     step's own files; photos queued during an earlier offline spell sat in
     IndexedDB waiting for one of three triggers, none of which fires here:
     app boot, the browser "online" event (which never fires if the device was
     already online when the app opened), and the dashboard poll — which
     returns immediately unless the DASHBOARD is on screen, and a vendor
     submitting a step is not on the dashboard.

     So a vendor who reconnected and pressed submit saw the page advance with
     their photos still sitting in the queue. Awaited, not fire-and-forget:
     they pressed submit expecting the photos to go, and flushPhotoQueue()
     returns immediately when the queue is empty, so the normal case costs
     nothing. It guards against overlapping runs and swallows its own errors,
     so this can never block the save. */
  try{ await flushPhotoQueue(); }catch(e){ console.warn("[GR] uploadPendingPhotos: queue flush failed (non-blocking)", e); }
}
// Fire-and-forget upload the moment a photo is captured/picked — see
// vendorTicket's own matching comment, not repeated here.
/* ============================================================================
   OFFLINE PHOTO QUEUE — 2026-09-30
   Client list item: "Ability to save photos and data when offline — currently
   photos and data not stored temporarily when app does not have internet".

   A REAL BUG WAS FOUND WHILE BUILDING THIS, and it is the larger half of the
   problem. apiUpload() RETURNS false on failure, it does not throw. So
   uploadPhotoNow()'s catch never fired, the failed file was added to
   uploadedPhotoFiles as though it had succeeded, uploadPendingPhotos() then
   SKIPPED it at save time, and the "!" badge never appeared. A photo lost to a
   two-second signal drop vanished silently, with the grid showing a cheerful
   tick. That is fixed below by honouring the return value — and it matters even
   for a vendor who is never fully offline.

   SCOPE, stated plainly: this is "never lose a photo", not "run the whole app
   offline". Photos that fail to upload are kept in IndexedDB and retried until
   they land. Browsing tickets, changing status and closing a job still need a
   connection. Full offline operation would need an action queue and conflict
   resolution for status transitions — a different and much larger piece of work,
   and not what the client's wording asks for.

   IndexedDB rather than localStorage: these are JPEGs, and localStorage is a
   ~5MB string store that would need base64 (a 33% size penalty) on top. Every
   entry point degrades to today's behaviour if IndexedDB is unavailable — a
   WebView that blocks it loses nothing it would not have lost anyway.
   ========================================================================= */
const PHOTO_DB_NAME="gr_technician_photo_queue", PHOTO_STORE="pending";
let PHOTO_DB_PROMISE=null, PHOTO_FLUSH_RUNNING=false, PHOTO_QUEUE_COUNT=0;
/* Resolves to null rather than rejecting on every failure path, so no caller
   ever needs a try/catch around storage being absent. */
function photoDb(){
  if(PHOTO_DB_PROMISE) return PHOTO_DB_PROMISE;
  PHOTO_DB_PROMISE=new Promise(function(resolve){
    try{
      if(!window.indexedDB){ console.warn("[Get-Rescue] IndexedDB unavailable — photos cannot be queued offline."); resolve(null); return; }
      const req=window.indexedDB.open(PHOTO_DB_NAME,1);
      req.onupgradeneeded=function(){
        const db=req.result;
        if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE,{keyPath:"key",autoIncrement:true});
      };
      req.onsuccess=function(){ resolve(req.result); };
      req.onerror=function(){ console.warn("[Get-Rescue] could not open the photo queue database", req.error); resolve(null); };
    }catch(e){ console.warn("[Get-Rescue] IndexedDB threw on open", e); resolve(null); }
  });
  return PHOTO_DB_PROMISE;
}
function photoTx(db, mode){ return db.transaction(PHOTO_STORE, mode).objectStore(PHOTO_STORE); }
function photoQueueAll(){
  return photoDb().then(function(db){
    if(!db) return [];
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readonly").getAll();
        req.onsuccess=function(){ resolve(req.result||[]); };
        req.onerror=function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  });
}
function photoQueueDelete(key){
  return photoDb().then(function(db){
    if(!db) return;
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readwrite").delete(key); req.onsuccess=function(){ resolve(); }; req.onerror=function(){ resolve(); }; }
      catch(e){ resolve(); }
    });
  });
}
/* Stores the File itself. Name and type are kept alongside because a Blob read
   back out of IndexedDB can lose them, and uploadFile needs a real File. */
function queuePhotoOffline(ticketId, fieldName, file){
  return photoDb().then(function(db){
    if(!db || !file) return false;
    return new Promise(function(resolve){
      try{
        const req=photoTx(db,"readwrite").put({
          ticketId:String(ticketId), fieldName:fieldName,
          name:(file.name||"photo.jpg"), type:(file.type||"image/jpeg"),
          blob:file, addedAt:Date.now(), tries:0
        });
        req.onsuccess=function(){
          console.log("[Get-Rescue] photo queued for later upload —", fieldName, "on ticket", ticketId);
          resolve(true);
        };
        req.onerror=function(){ console.warn("[Get-Rescue] could not queue the photo", req.error); resolve(false); };
      }catch(e){ console.warn("[Get-Rescue] queuePhotoOffline threw", e); resolve(false); }
    });
  });
}
/* Retries everything queued. A row is deleted ONLY on a confirmed success —
   never on failure, which is the whole point: a photo that cannot upload yet
   must still be there after the app is closed and reopened. `tries` is recorded
   for diagnosis, deliberately without a cap that discards anything. */
async function flushPhotoQueue(){
  if(PHOTO_FLUSH_RUNNING) return;
  PHOTO_FLUSH_RUNNING=true;
  try{
    const items=await photoQueueAll();
    PHOTO_QUEUE_COUNT=items.length;
    if(!items.length){ renderPhotoQueueNote(); return; }
    if(typeof navigator!=="undefined" && navigator.onLine===false){
      console.log("[Get-Rescue] photo queue:", items.length, "waiting — still offline, not retrying.");
      renderPhotoQueueNote(); return;
    }
    let sent=0;
    for(const it of items){
      let file=it.blob;
      // A Blob read back from IndexedDB is not always a File any more; uploadFile
      // needs a name, so rebuild one when necessary.
      try{ if(!(file instanceof File)) file=new File([it.blob], it.name||"photo.jpg", {type:it.type||"image/jpeg"}); }
      catch(e){ /* File constructor unavailable — send the Blob as-is */ }
      const ok=await apiUpload(it.ticketId, it.fieldName, file);
      if(ok){ await photoQueueDelete(it.key); sent++; }
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    if(sent) console.log("[Get-Rescue] photo queue: uploaded", sent, "—", PHOTO_QUEUE_COUNT, "still waiting.");
    if(sent && typeof toast==="function") toast(sent+" saved photo"+(sent===1?"":"s")+" uploaded","ok");
    renderPhotoQueueNote();
  }catch(e){
    console.warn("[Get-Rescue] flushPhotoQueue failed (non-blocking)", e);
  }finally{
    PHOTO_FLUSH_RUNNING=false;
  }
}
/* One muted line under the ticket list, and only when something is actually
   waiting. Appended to the existing list rather than added to the markup, so no
   layout changes and nothing to clean up when the queue empties. */
function renderPhotoQueueNote(){
  const host=$("ticketList"); if(!host) return;
  const old=document.getElementById("photoQueueNote"); if(old) old.remove();
  if(!PHOTO_QUEUE_COUNT) return;
  const n=document.createElement("div");
  n.id="photoQueueNote";
  n.style.cssText="margin:10px 2px 0;font-family:var(--f-mono);font-size:10.5px;line-height:1.5;color:var(--muted)";
  n.textContent=PHOTO_QUEUE_COUNT+" photo"+(PHOTO_QUEUE_COUNT===1?"":"s")+" saved on this phone, waiting for signal \u2014 they upload on their own once you are back online.";
  host.appendChild(n);
}
async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  /* apiUpload() returns false on failure and does NOT throw, so the old
     try/catch here never fired and every failed upload was recorded as a
     success. Checking the return value is what makes the "!" badge and the
     save-time retry work at all. */
  let ok=false;
  try{ ok=await apiUpload(r.ID, fieldName, file); }
  catch(e){ ok=false; console.warn("[Get-Rescue] immediate upload threw for "+fieldName, e); }
  if(ok){ state.uploadedPhotoFiles.add(file); }
  else{
    state.failedPhotoFiles.add(file);
    // Kept on the device so it survives the app being closed — see the queue's
    // own header. Awaited so the badge below reflects the real queue length.
    await queuePhotoOffline(r.ID, fieldName, file);
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }
  renderPhotoGrid(fieldName, max); // refresh this slot's badge either way
}

/* ---------- camera modal: capture -> canvas GPS/timestamp watermark ---------- */
let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
// maximumAge param added 2026-09-13 (user request: "In-app image capture
// lag/time is excessively high" — re-checked after the earlier 2026-09-10/
// 2026-09-12 camera-resolution fixes, which addressed the canvas/stream size
// but left the real dominant cost untouched: getPositionSafe() itself can
// block for up to 8 FULL SECONDS per call, on every single photo, since it
// always requested a brand-new GPS fix with no maximumAge at all (defaults
// to 0 — "never accept a cached position"). Defaults to 0 here too, so every
// EXISTING call site (Accept/Reach/WIP/etc., where a fresh, current-moment
// position genuinely matters) is completely unaffected — only capturePhoto()
// below now opts into a 15s cache window, since a technician taking several
// photos in quick succession during the same job hasn't meaningfully moved
// between shots; the 2nd/3rd/4th photo in a sequence can reuse the 1st
// photo's already-resolved position instead of waiting up to 8s all over
// again. Does not touch enableHighAccuracy or the 8s timeout itself — a
// genuinely cold GPS fix (first photo of a session) is unaffected either way.
function getPositionSafe(maximumAge, timeoutMs){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03, user-reported live: "RSP_Start_Lon has
      // exceeded its maximum digits"): the browser's own GPS coordinates can
      // come back with 17 decimal places, which overflowed the Decimal
      // fields these get saved into. RSP_Start_Lat/Lon have since been
      // changed to plain Text fields and renamed RSP_Start_Latitude/
      // Longitude (2026-08-03, same day) — no digit limit applies to those
      // two anymore — but Cancel_Location_Lat/Lon is still Decimal, so this
      // rounding still matters for that pair. (RSP_Drop_Location_Lat/Lon,
      // also still Decimal, is no longer used at all as of 2026-08-04 — TOW's
      // own "Reached Drop Location" action now reuses RSP_Start_Latitude/
      // Longitude instead, same field as this Accept-time fix; see
      // driverTicket/vendorTicket's own reachedDrop().)
      // Widened to 15 decimal places that same day — rounded to match here
      // via toFixed() (not Math.round(x*1e15), which can exceed
      // Number.MAX_SAFE_INTEGER for lat/lon-sized values and silently lose
      // precision) — same approach getRescueTicket's own roundCoord() uses.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:timeoutMs||8000, maximumAge:maximumAge||0 }   // both optional, same defaults as before - 2026-10-17, the location gate asks for longer
    );
  });
}
/* ---------- Location is required to use this app - 2026-10-17 ----------
   Client request: the app may not be used without location capture. Every job
   step records where it happened, and a step recorded without a position puts a
   silent fallback into a field that reads exactly like a real measurement.

   requireLocation() resolves ONLY once the device gives a fix. Until then the
   overlay covers the app and offers one button. There is no dismiss on purpose -
   a way past this is a way to use the app without location. */
let LOCATION_GATE_EL = null;
function hideLocationGate(){
  if(LOCATION_GATE_EL && LOCATION_GATE_EL.parentNode) LOCATION_GATE_EL.parentNode.removeChild(LOCATION_GATE_EL);
  LOCATION_GATE_EL = null;
}
function requireLocation(){
  return new Promise(function(resolve){
    let attempts = 0;
    function paint(){
      if(!LOCATION_GATE_EL){
        LOCATION_GATE_EL = document.createElement("div");
        LOCATION_GATE_EL.id = "locationGate";
        LOCATION_GATE_EL.setAttribute("style","position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:var(--bg,#fff);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center");
        document.body.appendChild(LOCATION_GATE_EL);
      }
      LOCATION_GATE_EL.innerHTML =
        '<div style="max-width:420px">' +
        '<div style="font-size:38px;line-height:1;margin-bottom:12px">&#128205;</div>' +
        '<h2 style="font-family:var(--f-disp);font-weight:800;font-size:18px;margin:0 0 10px">Location is required</h2>' +
        '<p style="font-size:14px;line-height:1.6;margin:0 0 10px">This app records where each step of a job happens, so it cannot be used until location is switched on.</p>' +
        '<p style="font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 16px">Turn location on for this app in your phone settings, not only in the browser prompt - inside the Zoho Creator portal app the app itself needs the permission. Then tap Try Again.</p>' +
        '<button class="btn" id="locGateBtn" type="button">Try Again</button>' +
        (attempts > 1 ? '<p style="font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:14px 0 0">Still no position after ' + attempts + ' attempts.</p>' : "");
      const btn = LOCATION_GATE_EL.querySelector("#locGateBtn");
      if(btn) btn.onclick = attempt;
    }
    function attempt(){
      attempts++;
      const btn = LOCATION_GATE_EL && LOCATION_GATE_EL.querySelector("#locGateBtn");
      if(btn){ btn.disabled = true; btn.textContent = "Checking\u2026"; }
      /* 20s and a 60s-old fix are fine HERE and nowhere else: a cold GPS lock
         often takes longer than the 8s the job calls use, and failing this gate
         on a slow fix would lock out someone whose permission is correct. */
      getPositionSafe(60000, 20000).then(function(pos){
        if(pos){ hideLocationGate(); resolve(pos); return; }
        console.warn("[Get-Rescue Tech] location gate: no position fix (attempt " + attempts + "). In the Zoho Creator portal app this usually means the app itself lacks the OS location permission, not the browser.");
        paint();
      });
    }
    attempt();
  });
}

// capturingPhoto guard + shutter disable/feedback (2026-09-07, real bug
// fixed — confirmed live: "photo clicks are taking too much time"). Root
// cause wasn't the two camera/gallery buttons (those are intentional,
// separate features — camera vs. gallery-picker — not a duplicate, see
// renderPhotoGrid()'s own comment) but this function itself: getPositionSafe()
// can take up to 8 seconds to resolve, and until now nothing disabled the
// shutter button or showed any progress during that wait — the modal just
// sat there looking frozen, inviting repeated taps that each started a NEW
// concurrent capture (a fresh GPS request plus a duplicate photo pushed onto
// state.photos/duplicate upload). Now guarded with a simple in-flight flag
// (extra taps are ignored outright, not queued) and visible feedback (shutter
// disabled + dimmed) so the wait reads as "working," not "broken." Does not
// change the actual capture/watermark/upload logic at all — only wraps it.
let capturingPhoto=false;
// Soft-test item #14 (2026-09-10) — see vendorTicket's own matching comment
// (this exact function is copy-pasted across vendorTicket/technicianTicket/
// driverTicket — same fix applied identically to all three).
const CAPTURE_MAX_DIM = 1600;
// compressImageFile() (2026-09-11, Task Tracker: "All gallery uploads must
// be automatically compressed before transmission") — see vendorTicket's
// own matching header comment for the full reasoning (identical function,
// copy-pasted here); openGallery() above now uses this before pushing a
// gallery-picked file into state.photos.
/* Burns the capture time and GPS into the bottom of a photo — extracted from
   capturePhoto() on 2026-10-05 so the file-picker path stamps identically.

   Sizing is proportional now, where the camera had it fixed at 56px/16px. On
   a 1600px photo that bar was about 3% of the height and effectively
   unreadable once the image was opened full-size, which defeats the point of
   a proof-of-service stamp. The floors are the old fixed numbers, so a small
   image renders exactly as it did before.

   Never throws: a stamp failing must cost the caption, not the photograph. */
function drawPhotoStamp(ctx, w, h, pos){
  try{
    const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
    const lonText = pos ? pos.lon.toFixed(6) : "";
    const barH = Math.max(56, Math.round(h*0.075));
    const pad  = Math.max(14, Math.round(barH*0.25));
    const font = Math.max(16, Math.round(barH*0.28)); // 0.28 so a 56px bar lands on exactly 16px, the camera figure
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0, h-barH, w, barH);
    ctx.fillStyle="#fff";
    ctx.font=font+"px monospace";
    ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, h-barH+Math.round(barH*0.40));
    ctx.fillText(new Date().toLocaleString(), pad, h-barH+Math.round(barH*0.75));
  }catch(e){ console.warn("[photo stamp] could not draw the stamp (photo itself is unaffected)", e); }
}
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=async function(){
        try{
          const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.naturalWidth*scale);
          canvas.height=Math.round(img.naturalHeight*scale);
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          /* THE FIX — 2026-10-05. Every photo that reaches Zoho now carries the
             same stamp the in-app camera has always drawn. getPositionSafe's 15s
             cache is reused deliberately: a vendor picking several photos for one
             job has not meaningfully moved between them, and it avoids a fresh
             8s GPS wait per photo. A denied or unavailable fix still stamps the
             time and prints "GPS unavailable" rather than silently stamping
             nothing — an unstamped photo is exactly what was reported. */
          let stampPos=null;
          try{ stampPos=await getPositionSafe(15000); }catch(e){ stampPos=null; }
          drawPhotoStamp(ctx, canvas.width, canvas.height, stampPos);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            resolve(blob ? new File([blob], file.name, {type:"image/jpeg"}) : file);
          }, "image/jpeg", quality);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src=url;
    }catch(e){ resolve(file); }
  });
}
async function capturePhoto(){
  if(capturingPhoto) return;
  capturingPhoto=true;
  const shutterBtn=$("cameraShutter");
  shutterBtn.disabled=true; shutterBtn.style.opacity="0.4";
  try{
    const video=$("cameraVideo");
    const nativeW=video.videoWidth||720, nativeH=video.videoHeight||960;
    const scale=Math.min(1, CAPTURE_MAX_DIM/Math.max(nativeW,nativeH));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(nativeW*scale); canvas.height=Math.round(nativeH*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // maximumAge:15000 (2026-09-13) — see getPositionSafe()'s own comment;
    // this is the specific call site that benefits from reusing a very-
    // recent GPS fix instead of always requesting a brand-new one.
    const pos=await getPositionSafe(15000);
    // Shared with the file-picker path since 2026-10-05 — see drawPhotoStamp().
    drawPhotoStamp(ctx, canvas.width, canvas.height, pos);
    await new Promise(function(resolveBlob){
      canvas.toBlob(function(blob){
        if(!blob){ resolveBlob(); return; }
        const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
        state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
        state.photos[currentPhotoField].push(file);
        closeCamera();
        renderPhotoGrid(currentPhotoField,currentPhotoMax);
        uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
        resolveBlob();
      }, "image/jpeg", 0.85);
    });
  } finally {
    capturingPhoto=false;
    shutterBtn.disabled=false; shutterBtn.style.opacity="";
  }
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

/* ---------- online/offline toggle (folded in from toggleGetRescue) ---------- */
let currentTechRecord=null;
function lockAvailabilityToggle(){
  const el=$("availToggle"); if(!el) return;
  /* "unresolved", not "locked" - 2026-10-16. .locked also sets pointer-events:none,
     which made this button silently dead: no console on a phone, and a title
     tooltip never shows on touch. Dimmed and still tappable means onToggleClick()
     runs, retries the match once, and toasts a real reason. .locked keeps its own
     job of blocking a double tap while a write is in flight. */
  el.classList.add("unresolved");

// Extracted 2026-08-24 (see onToggleClick()'s own retry call below) — same
// "boot-time match can go stale/never land, retry the real query once
// before giving up" fix already shipped for vendorTicket's own
// resolveVendorRecord() (2026-08-19) and updateMyInvite() (2026-08-21).
// User-reported live: "online/offline toggle is not working" — the most
// likely explanation, given every other identity-resolution bug found this
// session, is that currentTechRecord simply never resolved at boot time (a
// slow connection, a login-email mismatch, etc.), leaving onToggleClick()'s
// own `if(!currentTechRecord) return;` guard silently doing nothing at all
// — no error, no toast — which reads exactly like "not working." Bumped
// 200->1000 records too, same reasoning as vendorTicket's own
// resolveVendorRecord() fix (rules out Technicians_Report simply exceeding
// the old cap).
/* Which column holds this login's address - 2026-10-16. A straight port of
   vendorTicket's vendorEmailFieldMatching(): the configured column first, then
   the usual spellings, then ANY column on the record carrying exactly this
   address. A technician who can log in but cannot be identified is the bug this
   exists for, and a scan of their own record is cheap. Returns the matching
   field name, or null. */
const TECH_EMAIL_FIELD_CANDIDATES=[CONFIG.techEmailField,"Email","email","Technician_Email","Email_Address","Login_Email","Primary_Email"];
function techEmailFieldMatching(rec, wantedLower){
  if(!rec || !wantedLower) return null;
  for(var i=0;i<TECH_EMAIL_FIELD_CANDIDATES.length;i++){
    const fld=TECH_EMAIL_FIELD_CANDIDATES[i];
    if(fld && String(readVal(rec,fld)||"").trim().toLowerCase()===wantedLower) return fld;
  }
  for(var key in rec){
    if(String(readVal(rec,key)||"").trim().toLowerCase()===wantedLower) return key;
  }
  return null;
}
async function resolveTechRecord(logContext){
  if(!LOGIN_EMAIL) return currentTechRecord;
  const recs=await apiGetReport(CONFIG.techReport, null, 1000);
  /* Widened 2026-10-16 - was CONFIG.techEmailField alone. See
     techEmailFieldMatching(): strictly more logins match than before, never fewer. */
  const wantedEmail=LOGIN_EMAIL.trim().toLowerCase();
  let techMatchField=null;
  const mine=recs.find(function(r){
    const hit=techEmailFieldMatching(r, wantedEmail);
    if(hit){ techMatchField=hit; return true; }
    return false;
  });
  if(mine && techMatchField && techMatchField!==CONFIG.techEmailField){
    console.warn("[Get-Rescue] "+logContext+": matched this login on \""+techMatchField+"\", NOT the configured CONFIG.techEmailField (\""+CONFIG.techEmailField+"\"). Identity resolves now, but set techEmailField to \""+techMatchField+"\" so the first attempt succeeds.");
  }
  if(mine){
    /* `report` - 2026-10-16. Both write sites take the id from here; they have to
       aim it at the report it actually came from. See this change's own note. */
    currentTechRecord={ id:mine.ID, data:mine, report:CONFIG.techReport };
    MY_TECH_NAME=mine[CONFIG.techNameField]||"";
    MY_TECH_PHONE=mine[CONFIG.techPhoneField]||"";
    $("techName").textContent=MY_TECH_NAME||"Technician";
  } else {
    console.warn("[Get-Rescue] "+logContext+": no", CONFIG.techReport, "record's", CONFIG.techEmailField, "matched", LOGIN_EMAIL, "— toggle stays locked/inert. Records loaded:", recs.length, "| first record's own keys:", recs[0]);
    /* SECOND CHANCE via the availability report - 2026-10-16. "Records loaded: 0"
       above is what a 2898 refusal looks like from here, and no amount of email
       matching can help with a report this login cannot read. Only reached once
       the real report has already failed, so a working workspace never comes
       here. */
    try{
      const arecs=await apiGetReport(CONFIG.availabilityReport, null, 1000);
      let availMatchField=null;
      const myAvail=arecs.find(function(r){
        const hit=techEmailFieldMatching(r, wantedEmail);
        if(hit){ availMatchField=hit; return true; }
        return false;
      });
      if(!myAvail){
        console.warn("[Get-Rescue] "+logContext+": "+CONFIG.availabilityReport+" has no record carrying "+LOGIN_EMAIL+" either, so this login matches no technician anywhere. Records loaded:", arecs.length, "| first record's own keys:", arecs[0] && Object.keys(arecs[0]));
      } else {
        /* No Invites "proof" gate here, unlike vendorTicket's equivalent - see
           this change's own note. This id is never written onto a ticket; it only
           updates the technician's own availability row. */
        currentTechRecord={ id:myAvail.ID, data:myAvail, report:CONFIG.availabilityReport };
        MY_TECH_NAME = readVal(myAvail,CONFIG.techNameField) || readVal(myAvail,"technician_name") || readVal(myAvail,"Name") || "";
        MY_TECH_PHONE = readVal(myAvail,CONFIG.techPhoneField) || "";
        if($("techName")) $("techName").textContent = MY_TECH_NAME || "Technician";
        console.warn("[Get-Rescue] "+logContext+": identity resolved through "+CONFIG.availabilityReport+" instead of "+CONFIG.techReport+" (record "+myAvail.ID+", \""+MY_TECH_NAME+"\", matched on \""+availMatchField+"\"). The availability toggle and the location heartbeat will write to THAT report. Worth granting this portal profile View access to "+CONFIG.techReport+" so the primary path works.");
      }
    }catch(e){
      console.warn("[Get-Rescue] "+logContext+": the "+CONFIG.availabilityReport+" identity fallback threw; identity stays unresolved, exactly as before this fallback existed.", e);
    }
  }
  return currentTechRecord;
}
async function loadAvailability(){
  if(!LOGIN_EMAIL){ console.warn("[Get-Rescue] loadAvailability: LOGIN_EMAIL is empty — getInitParams may have failed or returned no loginUser. Toggle stays locked."); lockAvailabilityToggle(); return; }

/* Live location heartbeat (2026-08-17, user request: "when vendor is online
