<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Get-Rescue · Technician</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as getRescueTicket/toggleGetRescue — kept identical
   across every Get-Rescue widget on purpose (2026-07-31: "the theme will be
   same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

/* ---------- topbar: brand + online/offline toggle (folded in, 2026-07-31 —
   no separate toggle widget for these three profiles) ---------- */
.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}
/* 2026-10-16 - dimmed but still tappable. A toggle that cannot be tapped cannot
   explain itself, and there is no console or tooltip on a phone. onToggleClick()
   retries the match and toasts the reason, so the tap has to reach it. */
.toggle.unresolved{opacity:.6}

/* ---------- section headings / cards ---------- */
.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.st.rej{background:var(--stop-soft);color:var(--stop)}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- action screen ---------- */
#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
/* minmax(0,1fr) + wrapping, 2026-09-25 — client-reported: the vehicle name showed
   correctly on iPhone but was clipped or missing on Android.
   Not a data difference: both devices receive the same name. A grid column sized
   plain `1fr` keeps min-width:auto, so the track REFUSES to shrink below its
   content's min-content width. A long unbroken value ("OTHER TWO WHEELER",
   "PUNCTURE-TUBELESS TYRE") therefore pushes the column wider than the card and
   overflows instead of wrapping. iOS Safari and Android Chrome differ in viewport
   width and font metrics, so the same layout clips on one and fits on the other.
   minmax(0,1fr) lets the track shrink and the wrap rules below let the text break,
   which is additive: nothing that fits today renders any differently. */
.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;margin-bottom:6px}
.info-grid .full{grid-column:1/-1}
.info-grid .k{font-family:var(--f-mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.info-grid .v{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.info-grid .tel-wrap{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.info-grid .tel-link{color:inherit;text-decoration:underline;word-break:break-word}
.info-grid .tel-copy{border:1px solid var(--line-strong);background:var(--worktop);color:var(--muted);
  font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;cursor:pointer;flex:none}
.nav-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--info-soft);color:#1d5fc0;border-radius:11px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:14px;text-decoration:none;margin:6px 0}

/* ---------- photo grid (multi-capture with min/max) ---------- */
.photo-field{margin:12px 0}
.photo-field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.photo-field .lab .l{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.photo-field .lab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.photo-field .lab .cnt.ok{color:var(--ok)}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
/* Armed state for the two-tap photo controls - the ONLY visual cue a phone
   gets that the next tap will delete, since there is no dialog. Deliberately
   loud: red, bigger, and wide enough to read the word on a small remove pill. */
.rm.armed{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;transform:scale(1.25)}
.photo-clearall.armed{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--worktop)}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;color:var(--muted-2);background:#fff}
.photo-slot.add:active{background:var(--worktop)}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,22,28,.65);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:11px}
/* Auto-upload status badge — see vendorTicket's own matching comment. */
.photo-slot .up-badge{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.photo-slot .up-badge.ok{background:var(--ok)}
.photo-slot .up-badge.pending{background:rgba(20,22,28,.65);animation:pulseBadge 1.1s ease-in-out infinite}
.photo-slot .up-badge.failed{background:var(--stop)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- form fields (radio/select/input reused) ---------- */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;font-family:var(--f-body);color:var(--text);background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld textarea{min-height:70px;resize:vertical}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;background:#fff;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:active{background:var(--signal-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:16px}
.btn-row .btn{flex:1}

/* ---------- camera modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column}
.modal.on{display:flex}
#cameraVideo{width:100%;max-width:520px;flex:1;object-fit:cover;background:#000}
.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;width:100%;max-width:520px}
.cam-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer}
.cam-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;cursor:pointer;font-size:18px}
.cam-hint{color:rgba(255,255,255,.7);font-family:var(--f-mono);font-size:11px;text-align:center;padding:8px 20px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* "New case assigned" notifications (2026-08-07) — see notifyNewCases()'s
   own comment. Stacks top-right, above everything else on screen. */
.mech-notif-stack{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.mech-notif-card{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--signal);
  border-radius:10px;padding:11px 12px;box-shadow:var(--sh-2);animation:mechNotifIn .2s ease-out}
.mech-notif-body{flex:1;cursor:pointer;font-size:13px;line-height:1.45}
.mech-notif-body b{display:block;font-size:13.5px;margin-bottom:2px}
.mech-notif-status{color:var(--muted);font-size:11.5px;margin-top:3px}
.mech-notif-close{flex:none;border:0;background:transparent;color:var(--muted-2);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.mech-notif-close:hover{color:var(--stop)}
@keyframes mechNotifIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
      <span><b id="techName">Technician</b><span>Get-Rescue</span></span>
    </div>
    <div class="toggle" id="availToggle" role="switch" aria-label="Toggle availability">
      <span class="lab off">Offline</span><span class="lab on">Online</span>
      <span class="knob"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="sec-head"><h2>My Tickets</h2><span class="cnt" id="ticketCount">0</span></div>
    <div id="ticketList"></div>
  </div>

  <div id="actionScreen" class="off">
    <div class="ascreen-top">
      <button class="back-x" id="backBtn" type="button" aria-label="Back to my tickets"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="ascreenTitle">—</h2>
    </div>
    <div class="card">
      <div class="info-grid" id="ticketInfo"></div>
    </div>
    <div id="ascreenBody"></div>
  </div>
</div>

<!-- camera modal: getUserMedia preview + GPS/timestamp-watermarked capture.
     Falls back to a plain <input type=file capture> if the camera/permission
     isn't available (see openCamera()) — best-effort, per the spec's own
     "error handling and fallback prompts" requirement. Only verifiable on a
     real device/browser with camera+location permissions; not exercised by
     the isolated Node logic tests used elsewhere in this build. -->
<div class="modal" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="cam-hint" id="cameraHint">Center the shot, then tap to capture</div>
  <div class="camera-bar">
    <button class="cam-x" id="cameraCancel" type="button" aria-label="Cancel">✕</button>
    <button class="cam-btn" id="cameraShutter" type="button" aria-label="Capture photo"></button>
    <span style="width:40px"></span>
  </div>
</div>
<input type="file" id="cameraFallbackInput" accept="image/*" capture="environment" style="display:none">
<!-- no `capture` attribute here — lets the OS picker offer Gallery too -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<!-- Real-time-ish "new case assigned" notifications (2026-08-07, user
     request) — see notifyNewCases()'s own comment. Separate from the
     single-slot toast above (auto-hides in 2.6s, would get stomped by a
     second simultaneous event); cards here stack and persist until
     dismissed or their own 12s timeout. -->
<div class="mech-notif-stack" id="mechNotifStack"></div>

<script>
/* =====================================================================
   GET-RESCUE · TECHNICIAN WIDGET (RSR field flow)
   Built 2026-07-31 from a "PROMPT FOR WIDGET CODE GENERATION" spec, the same
   session's Screen-by-Screen Flow Atlas, and the confirmed answers below.
   User-confirmed decisions this build relies on:
   - Data source is Create_Case ONLY (the prompt's own "Invites" form is
     NOT used — user explicitly said "no only use create case form only").
   - Google Maps Distance Matrix API key provided 2026-08-04 — calcDistanceETA()/
     calcRoundTripKm() below now call it first (see GOOGLE_MAPS_API_KEY),
     falling back to the original Haversine straight-line stand-in only if the
     Maps script fails to load or a request errors, so a network hiccup never
     blocks a field save.
   - Every field here mirrors what the agent-facing getRescueTicket widget
     already reads/writes for the SAME Create_Case fields (Status values,
     ETA/Distance/Image_Upload* names) so both widgets stay consistent.
   Same theme/design tokens as every other Get-Rescue widget, same
   resolve()/apiGet/apiUpdate/apiUpload data-layer pattern as getRescueTicket
   (not reinvented) plus toggleGetRescue's own toggle logic folded directly
   into this widget (per explicit request — no separate toggle widget for
   Vendor/Technician/Driver).
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  // Added 2026-08-05 (user request — "Vehicle ID showing, not the Vehicle
  // name") — see vendorTicket's own matching CONFIG comment; same fix here.
  vehicleMasterReport: "Vehicle_Master_Report",
  vehicleNameField: "Name",
  // Added 2026-08-05 (user request — "[object Object]" on the dashboard card
  // instead of the real issue name) — see vendorTicket's own matching CONFIG
  // comment; same fix here.
  issueReport: "Vehicle_Issue_Report",
  issueNameField: "Issue_Name",
  /* "assigned to me" — checks every real Create_Case field this role's
     email could be stored under, depending on which stage set it
     (Assignment vs. Acceptance) — these are two distinct real fields, not
     guesses about one field's name, so both stay checked. */
  myEmailFieldCandidates: ["Assigned_Technician_Email","Technician_Email"],
  /* toggle target — same report/field toggleGetRescue already reads/writes,
     folded directly into this widget per explicit request. */
  techReport: "Technicians_Report",
  techStatusField: "Availability_Status",
  techEmailField: "Email",
  /* Identity fallback - 2026-10-16, user-confirmed report name. Read ONLY when
     techReport above comes back refused (code 2898) or carries no row for this
     login. Same arrangement vendorTicket has had with My_Availability_Vendor
     since 2026-10-06, and for the same reason: the portal profile a technician
     actually logs in with can read this one. */
  availabilityReport: "My_Availability_Technicians",
  techNameField: "Technician_Name",
  techPhoneField: "Phone", // user-confirmed 2026-09-06 — needed for the WhatsApp "dispatched" message (spec template 8)
  // Added 2026-08-17 (user request — see pingCurrentLocation()'s own
  // comment). Same field names getRescueTicket's own vendor-assignment picker
  // expects on Technicians_Report, written here directly through this
  // technician's own techReport record (unlike vendorTicket, this widget's
  // toggle already targets Technicians_Report itself — no separate
  // My_Availability-style report in between). Brand-new fields, not yet
  // created in Zoho Studio — see FIELDS.md's own note.
  techCurrentLatField: "Current_Latitude",
  techCurrentLonField: "Current_Longitude",
  // Invites (2026-08-03, user-confirmed — "invite covers all"): the same
  // Invites/Invites_Report mechanism getRescueTicket uses for vendor invites
  // is reused for technicians too, via vendorTicket's own fleet hand-off
  // (assignTechnician) creating one Invites record with Vendor -> this
  // technician's own Technicians_Report record. Used here to find "my
  // tickets" the same way vendorTicket does — see loadDashboard().
  invitesReport: "Invites_Report"
};
/* Statuses this dashboard shows — RSR-only, and only the ones a technician
   still has an open action for. "REMAINING FEE DUE" (Work Completed's own
   target status per the flow-generation prompt) does NOT match either of
   getRescueTicket's own two guesses for the `payment` stage ("RSP COMPLETE"
   was the working guess, "RSP CLOSED" the flagged alternative) — this is
   new, better evidence and is used here as given; see QUESTIONS_TO_ASK.md
   for reconciling it back into getRescueTicket's own STAGES table. */
// "RSP REJECT" was added here 2026-08-20, then REMOVED 2026-10-13. Both were
// deliberate and they contradict each other, so the history matters: August
// asked that a rejected ticket stay visible with a "Rejected" pill, because it
// vanished with no lasting sign it was ever rejected; the client's 2 October
// email asks the opposite - "if a case is rejected, the ticket must disappear
// from the vendor app" - and that is the one being honoured. Dropping the
// status here is what makes a ticket nobody is live on disappear everywhere,
// on every device. Do not re-add without checking which request is current.
const MY_STATUSES = ["RSP IRA (INVITE RESPONSE AWAITED)","RSP ON THE WAY","WORK IN PROGRESS","REMAINING FEE DUE"];
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
// Corrected 2026-09-07 (user-provided LOCATIONS-DISTANCES-DATETIME spec) —

async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria=criteria;
  try{
    const r=await fn(cfg);

       Both still return [], because every caller is written around that; but a
       2898 now says so, instead of reading as missing data. */

      if(String(r.code)==="2898"){
        console.warn("[Get-Rescue] getRecords: PERMISSION DENIED on "+report+" (code 2898). This login's portal profile cannot view that report, so it comes back EMPTY rather than erroring. Identity and anything else derived from it will be missing until the profile is granted View access in Zoho.");
      } else {
        console.warn("[Get-Rescue] getRecords: "+report+" returned code "+r.code+" ("+(r.message||"no message")+") - treating as empty.");
      }

/* Still this login's job? - Task Tracker #51 (2026-10-29). The office can now unassign a vendor at
   any stage before closure, so a phone still showing the job must not write over the ticket after
   it was taken back. Checked only for a job already under way on this screen (accept, reject and
   hand-off are untouched); a fresh read that fails lets the write through exactly as before, so a
   weak signal never blocks real work. */
const JOB_TAKEN_BACK_STATUSES = ["READY FOR ASSIGNMENT","RSP IRA (INVITE RESPONSE AWAITED)","SCHEDULED","NEW","SERVICE FEE QUOTE","BOOKING FEE PENDING","LOCATION REQUEST","LOCATION PENDING"];
async function assertJobStillMine(id){
  const cur = state && state.current;
  if(!cur || String(cur.ID)!==String(id)) return;
  const localSt = String(cur.Status||"").trim().toUpperCase();
  if(!localSt || localSt==="RSP IRA (INVITE RESPONSE AWAITED)") return;
  let fresh = null;
  try{
    const rows = await apiGetReport(CONFIG.reportName, "ID == " + id, 200);
    fresh = rows && rows.length ? rows[0] : null;
  }catch(e){ return; }
  if(!fresh) return;
  const freshSt = String(fresh.Status||"").trim().toUpperCase();
  let takenBack = JOB_TAKEN_BACK_STATUSES.indexOf(freshSt) >= 0;
  // (technicians: the status is the signal - their record id can come from either report)
  if(!takenBack) return;
  console.warn("[Get-Rescue] assertJobStillMine: ticket "+id+" was taken back by the office (status "+freshSt+") - this write was refused (Task Tracker #51).");
  if(typeof backToDashboard==="function") setTimeout(backToDashboard, 1500);
  throw new Error("This job has been reassigned by the office - nothing was saved.");
}
async function apiUpdate(id, data){ await assertJobStillMine(id); return apiUpdateReport(CONFIG.reportName, id, data); }

// WhatsApp sending (2026-09-06) — copied verbatim from getRescueTicket's own
// already-proven sendWhatsAppTemplate()/formatIndianPhone(), per the user's
// "RESCUE - Repair Service Logic Flow" spec. This widget had zero WhatsApp
// integration before now. Same Custom API (sendWhatsAppMessage), same
// param shape, same fire-and-forget convention — never blocks or throws
// into the caller's own existing save/navigate flow.
// Real bug fixed 2026-09-13 — same fix, same reason, as getRescueTicket's
// own matching function (that file's own isValidIndianPhoneDigits() already
// anticipates and strips this exact shape for validation purposes — this
// widget has no equivalent validator, but the underlying number shape is
// the same): a 12-digit number already starting "91" (no "+") used to get
// ANOTHER "+91" prepended here, producing a broken double-country-code
// number for tel: links.
function formatIndianPhone(v){
  if(!v) return "";
  const s=String(v).trim();
  if(s.charAt(0)==="+") return "+"+s.slice(1).replace(/\D/g,"");
  let digits=s.replace(/\D/g,""); if(!digits) return "";
  if(digits.length===12 && digits.startsWith("91")) digits=digits.slice(2);
  return "+91"+digits;
}
/* What WhatsApp said about the last template send. See sendWhatsAppTemplate. */
let LAST_WA_RESPONSE = "";
/* ONLY the one failure worth acting on - 2026-10-13: the template does not
   exist. Deliberately narrow. A broad "looks like an error" test would
   eventually treat a delivered message as failed and send the customer the
   same request twice, which is worse than the problem it would solve. */
/* What WhatsApp refused with, or "" if it did not refuse - 2026-10-17.
   sendWhatsAppTemplate() returns true for any response that did not throw, and a
   rejection arrives as an ordinary response, so a refused message was counting as
   a sent one. Parsed rather than string-matched, so an error shape nobody has
   seen yet is still caught, and WhatsApp's own wording is returned so it can go
   on screen rather than into a console nobody on a phone can open. */
function waResponseError(){
  const raw = LAST_WA_RESPONSE;
  if(!raw) return "";
  let obj = null;
  try{ obj = JSON.parse(raw); }catch(e){ return ""; }
  let inner = obj && obj.result;
  if(typeof inner === "string"){ try{ inner = JSON.parse(inner); }catch(e){ inner = null; } }
  const err = (inner && inner.error) || (obj && obj.error);
  if(!err) return "";
  if(typeof err === "string") return err;
  return String(err.message || err.code || err.type || "WhatsApp would not accept the message.");
}
function waResponseSaysTemplateMissing(){
  const s = String(LAST_WA_RESPONSE || "").toLowerCase();
  if(!s) return false;
  return s.indexOf("template_not_found") !== -1
      || s.indexOf("template not found") !== -1
      || s.indexOf("does not exist") !== -1;
}
async function sendWhatsAppTemplate(phone, templateName, params, buttonParam){
  const to=formatIndianPhone(phone);
  if(!to){ console.warn("[Get-Rescue Tech] sendWhatsAppTemplate: no phone number to send to (template", templateName, ")"); return false; }
  const fn=resolve("invokeCustomApi");
  if(!fn){
    console.warn("[Get-Rescue Tech] sendWhatsAppTemplate: no \"invokeCustomApi\" method found — cannot send template", templateName, ".");
    return false;
  }
  const config = {
    api_name: "sendWhatsAppMessage",
    workspace_name: "getrescued",
    http_method: "POST",
    content_type: "application/json",
    // param3 added 2026-09-06 — the sendWhatsAppMessage Custom API already
    // accepts it (confirmed against its real Deluge source), needed for
    // the dispatch message (spec template 8: name + phone + ETA).
    payload: { phone: to, templateName: templateName, param1: params[0]||"", param2: params[1]||"", param3: params[2]||"" }
  };
  /* The dynamic URL button - 2026-10-17. This parameter existed in the vendor
     app and not here, so the feedback call's fourth argument was dropped on the
     floor: sendWhatsAppMessage.deluge received no button value for
     confirm_booking_fee_and_total_fee, which its own urlButtonTemplates list
     says has a URL button, and WhatsApp answered "(#131008) Required parameter
     is missing". param3 doubles as the button slot in that API, which is why it
     is filled too whenever it is free. Copied from vendorTicket unchanged. */
  if(buttonParam){
    config.payload.buttonParam = buttonParam;
    if(!params[2]) config.payload.param3 = buttonParam;
  }
  console.log("[Get-Rescue Tech] sendWhatsAppTemplate:", templateName, "->", to, "| payload:", JSON.stringify(config.payload));
  try{
    /* The response is KEPT now - 2026-10-13. It was fetched and discarded, which
       is how a 404 template_not_found went unnoticed for weeks. The return value
       is unchanged, so every existing caller behaves exactly as before; this is
       recorded alongside it for callers that want to know what WhatsApp said. */
    const waResp = await fn(config);
    try{ LAST_WA_RESPONSE = JSON.stringify(waResp); }catch(e){ LAST_WA_RESPONSE = String(waResp); }
    return true;
  }catch(e){
    console.warn("[Get-Rescue Tech] sendWhatsAppTemplate: invokeCustomApi failed for", templateName, e);
    return false;
  }
}

/* Finds this login's invite for a ticket WITHOUT needing their record id.
   Only called once the id-based paths in updateMyInvite() have failed - see
   that call site's own note for why they can, and why neither rule here can
   pick somebody else's row. */
/* The id this login MIGHT be, when identity could not be confirmed well enough
   to write it onto a ticket. Never written anywhere - only ever compared
   against invite rows, where a match is itself the proof. See the 2026-10-09
   note on findMyInviteByTicket(). */
let MY_TECH_ID_UNPROVEN = "";
/* id -> display name for the people this app invites, built from whichever
   report this login can actually read. Zoho returns Invites.Technician as a
   BARE id, so a name comparison has nothing to read without this. */
async function inviteeNameById(){
  const map={};
  const reports=[CONFIG.techReport].filter(Boolean);
  for(const rep of reports){
    try{
      const recs=await apiGetReport(rep, null, 1000);
      recs.forEach(function(r){
        if(r && r.ID!=null && map[String(r.ID)]==null){
          const nm=readVal(r,CONFIG.techNameField) || readVal(r,"vendor_name") || readVal(r,"Name") || "";
          if(nm) map[String(r.ID)]=nm;
        }
      });
    }catch(e){ /* an unreadable report just contributes nothing */ }
  }
  return map;
}
async function findMyInviteByTicket(ticketId){
  try{
    const all=await apiGetReport(CONFIG.invitesReport, null, 1000);
    // Only rows of this app's own kind: one ticket carries both vendor and
    // technician invites, and they are different people.
    const forTicket=all.filter(function(inv){
      if(String(lookupId(inv.RSID)||"")!==String(ticketId)) return false;
      const who=lookupId(inv.Technician);
      return who!=null && String(who).trim()!=="";
    });
    if(!forTicket.length){ console.warn("[Get-Rescue] findMyInviteByTicket: ticket "+ticketId+" has no Technician invite row at all, so there is nothing to mark."); return null; }
    if(forTicket.length===1){
      console.warn("[Get-Rescue] findMyInviteByTicket: identity never resolved, but ticket "+ticketId+" has exactly ONE technician invite (row "+forTicket[0].ID+"), and this device is holding that ticket - so the response is being recorded against it.");
      return forTicket[0];
    }
    /* THE ID RULE - 2026-10-09, and the one that actually resolves a
       multi-vendor ticket. Tried before any name comparison because an id is
       exact where a display name is a guess at formatting. */
    const myId = (currentTechRecord && currentTechRecord.id) || MY_TECH_ID_UNPROVEN || "";
    if(myId){
      const byId=forTicket.filter(function(inv){ return String(lookupId(inv.Technician))===String(myId); });
      if(byId.length===1){
        console.warn("[Get-Rescue] findMyInviteByTicket: matched invite row "+byId[0].ID+" on this login's own record id ("+myId+") among "+forTicket.length+" invites for ticket "+ticketId+".");
        return byId[0];
      }
    }
    const myName=String(MY_TECH_NAME||"").trim().toLowerCase();
    if(!myName){ console.warn("[Get-Rescue] findMyInviteByTicket: ticket "+ticketId+" has "+forTicket.length+" invites and this login has no resolved name to tell them apart, so the response is NOT being recorded. Giving up rather than guessing a row."); return null; }
    /* NAMES RESOLVED THROUGH A REPORT - 2026-10-09. This used to read
       inv.Technician.display_value, but Zoho returns that lookup as a BARE id,
       so the comparison was against "" on every row and never matched. */
    const nameById=await inviteeNameById();
    const byName=forTicket.filter(function(inv){
      const shown=String(nameById[String(lookupId(inv.Technician))]||"");
      return shown.trim().toLowerCase()===myName;
    });
    if(byName.length===1){
      console.warn("[Get-Rescue] findMyInviteByTicket: identity never resolved, but exactly one of this ticket's "+forTicket.length+" invites names \""+MY_TECH_NAME+"\" (row "+byName[0].ID+") - recording the response against it.");
      return byName[0];
    }
    console.warn("[Get-Rescue] findMyInviteByTicket: ticket "+ticketId+" has "+forTicket.length+" invites and "+byName.length+" of them match the name \""+MY_TECH_NAME+"\", so there is no single right row. The response is NOT being recorded.");
    return null;
  }catch(e){ console.warn("[Get-Rescue] findMyInviteByTicket threw - the response is not being recorded, exactly as before this fallback existed", e); return null; }
}
/* The agent's RESPONDED column. A reject has always had a time (joined from
   Task_Rejections.Rejected_At); an accept has never had one anywhere. Its OWN
   update, deliberately: an unknown column can fail a whole Creator update,
   and the accept itself has already landed by the time this runs. */
async function stampInviteResponse(inviteId, data){

  try{ await apiUpdateReport(CONFIG.invitesReport, inviteId, { Responded_At: fmtDateTime(new Date()) }); }
  catch(e){ console.warn("[Get-Rescue] stampInviteResponse: Responded_At was not written on invite "+inviteId+" - the response itself IS saved. If the agent's RESPONDED column stays blank, add Responded_At (Single Line) to the Invites FORM and to the Invites report layout.", e); }
}

const SEND9_DELAY_MINUTES = 5;
async function scheduleSend9(r){
  const phone = r ? r[CONFIG.phoneField] : "";
  if(SEND9_DELAY_MINUTES <= 0){
    return sendWhatsAppTemplate(phone, "tell_customer_to_contact_the_call_center_before_agreeing_to_any_extra_work_or_extra_charges", []);
  }
  try{
    const due = new Date(Date.now() + SEND9_DELAY_MINUTES*60000);
    await apiUpdate(r.ID, { Send_9_Due_At: fmtDateTime(due) });
    console.log("[GR-Tech] scheduleSend9: ticket "+r.ID+" marked due at "+fmtDateTime(due)+". The agent dashboard sweeps it.");
    return true;
  }catch(e){
    /* The field almost certainly does not exist yet. Sending now is strictly
       better than not sending at all, and it is what this app did before. */
    console.warn("[GR-Tech] scheduleSend9: could not mark ticket "+(r&&r.ID)+" due (is Send_9_Due_At on Create_Case?) - sending SEND 9 immediately instead, which is the pre-2026-10-10 behaviour.", e);
    return sendWhatsAppTemplate(phone, "tell_customer_to_contact_the_call_center_before_agreeing_to_any_extra_work_or_extra_charges", []);
  }

async function updateMyInvite(ticketId, data){
  let invite=state.inviteByTicketId && state.inviteByTicketId[String(ticketId)];
  if(!invite || invite.ID==null){
    // Real bug fixed (2026-08-21) — see vendorTicket's own matching
    // 2026-08-21 comment on this exact function: state.inviteByTicketId is
    // a one-time snapshot from loadDashboard() that can go stale if
    // currentTechRecord hadn't resolved yet at that moment. Retries a real,
    // direct Invites_Report lookup (matched on the Technician Lookup field,
    // not Vendor — see loadMyInvites()'s own 2026-08-03 field-name fix)
    // instead of trusting the possibly-stale cache.
    if(currentTechRecord){
      try{
        const all=await apiGetReport(CONFIG.invitesReport, null, 1000);
        const fresh=all.find(function(inv){ return String(lookupId(inv.RSID)||"")===String(ticketId) && String(lookupId(inv.Technician))===String(currentTechRecord.id); });
        if(fresh){
          invite=fresh;
          state.inviteByTicketId=state.inviteByTicketId||{};
          state.inviteByTicketId[String(ticketId)]=fresh;
          console.log("[Get-Rescue] updateMyInvite: retry found the real Invites record for ticket", ticketId, "(id "+fresh.ID+") — the earlier cache was just stale, not missing data.");
        }
      }catch(e){ console.warn("[Get-Rescue] updateMyInvite: retry lookup failed", e); }
    }
  }
  // Last resort, and the one that does not need an id - see
  // findMyInviteByTicket() above. Reached only when both paths above came
  // back empty, which is precisely when nothing used to be written at all.
  if(!invite || invite.ID==null) invite = await findMyInviteByTicket(ticketId);
  if(!invite || invite.ID==null){ console.warn("[Get-Rescue] updateMyInvite: no Invites record found for ticket", ticketId, "even after retry — Status/Service_Acceptance_Next will NOT be written this time. currentTechRecord resolved:", !!currentTechRecord); 
    /* VISIBLE, not only logged - 2026-10-09. There is no console inside the
       Creator mobile app, so this failure has twice reached a client test
       unseen. The action itself has already gone through; what did not happen
       is the office being told, and that is worth a message. */
    try{ toast("Your response was saved on the case, but the office's Accept/Reject list could not be updated - tell dispatch","err"); }catch(e){}
    return;
  }
  try{ await apiUpdateReport(CONFIG.invitesReport, invite.ID, data); }
  catch(e){ console.warn("[Get-Rescue] could not update Invites record", invite.ID, "for ticket", ticketId, e); }
  await stampInviteResponse(invite.ID, data);
}
// Real bug fixed (2026-08-07, same root cause diagnosed live in getRescueTicket
// — "Invalid Configuration...!!!" on every upload) — see vendorTicket's own
// matching comment: resolve()'s generic namespace probe could silently pick
// the wrong "uploadFile"-named function from an earlier namespace; the real,
// documented method is specifically ZOHO.CREATOR.FILE.uploadFile. Calls it
// directly now, falling back to the old generic probe only if an older SDK
// build has no FILE namespace.
async function apiUpload(id, fieldName, file){
  const C=window.ZOHO && ZOHO.CREATOR;
  const fn=(C && C.FILE && typeof C.FILE.uploadFile==="function") ? C.FILE.uploadFile.bind(C.FILE) : resolve("uploadFile");
  if(!fn || !file) return false;
  const req={ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, field_name:fieldName, file:file };
  try{
    const r=await fn(req);
    /* THE OFFLINE-PHOTO LOSS FIX — 2026-10-03, client-reported: "it seems to
       be saving the photos when offline, but when app comes back online and
       the submit button is clicked the page moves forward but the photos are
       not sent to the backend. The photos are thus lost."

       Some Creator SDK builds RESOLVE this promise on a business-logic
       rejection (code !== 3000) instead of throwing, so the catch below never
       fired and every rejected upload was reported as a success. That alone
       would only mean a missing photo — what made it data LOSS is
       flushPhotoQueue(), which deletes the queued IndexedDB row on a
       "successful" upload. A photo saved offline was therefore uploaded,
       silently rejected, reported as sent, and then deleted from the device.

       getRescueTicket hit this same bug on 2026-08-07 and has run with this
       exact check ever since; it is ported rather than rewritten. */
    if(r && typeof r==="object" && "code" in r && r.code!==3000){
      console.warn("uploadFile for "+fieldName+" resolved with a non-success code — treating as FAILED so the photo stays queued:", r);
      return false;
    }
    return true;
  }
  catch(e){ console.warn("uploadFile failed for "+fieldName, e); return false; }
}

/* ---------- distance/ETA — Google Maps Distance Matrix API, Haversine
   straight-line kept as an automatic fallback (see this file's header
   comment) ---------- */
function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// at the equator/prime meridian" instead of "not set yet" wherever a call
// site did Number(r.DropLocationLat) directly. Use this instead.
function parseCoord(v){

// and distance type should be two wheeler for REPAIR/RSR cases"). Defaults
// to "DRIVING" so any call site not yet updated keeps its exact previous
// behavior — fully backward compatible.
/* ---------- Google Routes API: computeRoutes - 2026-10-17 ----------
   Replaces the Distance Matrix engine below, which is kept as
   legacyDistanceMatrix() and still used whenever Routes is unavailable.

   The client's own spec: travelMode DRIVE for four-wheeler/TOW and TWO_WHEELER
   for RSR, routingPreference TRAFFIC_AWARE_OPTIMAL, a departureTime, and the
   X-Goog-FieldMask header - without that header the API returns no durations at
   all. travelModeFor() already made the four/two-wheeler split, so only the
   names change here. */
const ROUTES_API_URL = "https://routes.googleapis.com/directions/v2:computeRoutes";
const ROUTES_FIELD_MASK = "routes.distanceMeters,routes.duration,routes.staticDuration";
const ROUTES_TIMEOUT_MS = 10000;

   purpose: Number("") and Number(null) are both 0, so a blank Latitude on a
   ticket used to arrive here as a legal coordinate in the Atlantic and be sent,
   processed and billed. isFinite() covers null, "", undefined and NaN alike. */
function validCoord(lat, lon){
  const a = Number(lat), b = Number(lon);
  if(!isFinite(a) || !isFinite(b)) return false;
  if(a === 0 && b === 0) return false;
  return Math.abs(a) <= 90 && Math.abs(b) <= 180;
}
function routesTravelMode(mode){
  return String(mode||"").toUpperCase()==="TWO_WHEELER" ? "TWO_WHEELER" : "DRIVE";
}
/* Routes returns a duration as a string of seconds, e.g. "1131s". */
function routesSeconds(v){
  const n = parseFloat(String(v==null?"":v).replace(/[^0-9.]/g,""));
  return isNaN(n) ? 0 : Math.round(n);
}
/* Shaped exactly like a Distance Matrix element, so every existing caller reads
   it without knowing anything changed. duration carries the TRAFFIC-AWARE time
   now; static_duration is the same trip without traffic, kept for the log. */
function routesElement(route){
  if(!route) return { status:"ZERO_RESULTS" };
  const secs = routesSeconds(route.duration);
  return { status:"OK",
           distance:{ value: Number(route.distanceMeters)||0 },
           duration:{ value: secs },
           duration_in_traffic:{ value: secs },
           static_duration:{ value: routesSeconds(route.staticDuration) } };
}
/* An enablement problem, as opposed to a blip. Only this latches the session
   back to Distance Matrix; a timeout or a 500 must not. */
function routesFatal(err){
  const s = String((err && err.message) || err || "").toUpperCase();
  return s.indexOf("HTTP 401")>=0 || s.indexOf("HTTP 403")>=0
      || s.indexOf("SERVICE_DISABLED")>=0 || s.indexOf("PERMISSION_DENIED")>=0
      || s.indexOf("API_KEY")>=0 || s.indexOf("HAS NOT BEEN USED")>=0;

async function routesComputeLeg(o, d, travelMode, trafficAware){
  const mode = routesTravelMode(travelMode);
  const body = {
    origin:      { location:{ latLng:{ latitude:Number(o.lat), longitude:Number(o.lon) } } },
    destination: { location:{ latLng:{ latitude:Number(d.lat), longitude:Number(d.lon) } } },
    travelMode: mode,
    /* Traffic only where a duration is actually read - 2026-10-17, client spec
       ("traffic is important only for the two eta calculations"). An unaware
       request bills at the cheaper tier and returns the same road distance;
       departureTime is omitted with it because it only means anything to a
       traffic model. Defaults to aware, so this is opt-out. */
    routingPreference: (trafficAware===false) ? "TRAFFIC_UNAWARE" : "TRAFFIC_AWARE_OPTIMAL"
  };
  if(trafficAware!==false){
    /* 30 seconds ahead, not exactly now: Routes rejects a departureTime in the
       past, and a phone clock running slow would make "now" exactly that by the
       time the request lands. A slightly future time reads as predictive
       traffic, which is what a rescue ETA wants anyway. */
    body.departureTime = new Date(Date.now()+30000).toISOString();
  }
  let timer = null;
  const timeout = new Promise(function(_, rej){ timer = setTimeout(function(){ rej(new Error("Routes API timed out")); }, ROUTES_TIMEOUT_MS); });
  try{
    const resp = await Promise.race([
      fetch(ROUTES_API_URL, { method:"POST",
        headers:{ "Content-Type":"application/json",
                  "X-Goog-Api-Key": GOOGLE_MAPS_API_KEY,
                  "X-Goog-FieldMask": ROUTES_FIELD_MASK },
        body: JSON.stringify(body) }),
      timeout ]);
    if(!resp.ok){
      let detail = "";
      try{ detail = JSON.stringify(await resp.json()); }catch(e){}
      throw new Error("Routes API HTTP "+resp.status+" "+detail);
    }
    const data = await resp.json();
    const el = routesElement(data && data.routes && data.routes[0]);
    if(el.status==="OK"){
      console.log("[Get-Rescue] Routes "+mode+": "+(el.distance.value/1000).toFixed(1)+" km | "+Math.round(el.duration.value/60)+" min with traffic | "+Math.round(el.static_duration.value/60)+" min without");
    }
    return el;
  } finally { if(timer) clearTimeout(timer); }
}
/* The same rows[i].elements[j] shape Distance Matrix returned. Only the
   diagonal is ever read (every caller was checked); the rest is filled in so an
   off-diagonal read degrades to a miss instead of throwing. */
function routesRows(legs, n){
  const rows = [];
  for(let i=0;i<n;i++){
    const elements = [];
    for(let j=0;j<n;j++) elements.push(i===j ? legs[i] : { status:"ZERO_RESULTS" });
    rows.push({ elements: elements });
  }
  return rows;
}
/* Same name, same arguments, same return shape as the Distance Matrix version
   it replaces - which is why none of this app's call sites needed touching. */
async function googleDistanceMatrix(origins, destinations, travelMode, trafficAware){
  const n = Math.min((origins||[]).length, (destinations||[]).length);
  if(!n) return null;
  const usable = [];
  for(let i=0;i<n;i++){
    usable.push(validCoord(origins[i] && origins[i].lat, origins[i] && origins[i].lon)
             && validCoord(destinations[i] && destinations[i].lat, destinations[i] && destinations[i].lon));
  }
  /* Nothing worth asking about: returning null is exactly what a failed call
     already did, so callers fall back to their Haversine estimate as before -
     the difference is that no request is sent and nothing is billed. */
  if(usable.indexOf(true) === -1){
    console.warn("[Get-Rescue] googleDistanceMatrix: every leg has an unusable coordinate (blank or 0,0), so no request was sent. origins:", JSON.stringify(origins), "destinations:", JSON.stringify(destinations));
    return null;
  }
  if(!routesApiOff){
    try{
      const legs = await Promise.all(origins.slice(0,n).map(function(o,i){
        return usable[i] ? routesComputeLeg(o, destinations[i], travelMode, trafficAware)
                         : Promise.resolve({ status:"INVALID_REQUEST" });
      }));
      return routesRows(legs, n);
    }catch(e){
      if(routesFatal(e)){
        routesApiOff = true;
        console.warn("[Get-Rescue] Routes API refused the request, so this session falls back to the Distance Matrix service. Times will be free-flow, not traffic-aware. Enable Routes API on the Google Cloud project that owns this key, confirm billing, and add it to the key's API restrictions.", e);
      } else {
        console.warn("[Get-Rescue] Routes API call failed; using the Distance Matrix service for this calculation only. The next one will try Routes again.", e);
      }
    }
  }
  const rows = await legacyDistanceMatrix(origins, destinations, travelMode);
  /* An unusable leg must not quietly pick up a Distance Matrix answer either. */
  if(rows) for(let i=0;i<n;i++){ if(!usable[i] && rows[i] && rows[i].elements) rows[i].elements[i] = { status:"INVALID_REQUEST" }; }
  return rows;
}
/* The Distance Matrix engine, unchanged, now only a fallback. */
async function legacyDistanceMatrix(origins,destinations,travelMode){
  const mode=travelMode||"DRIVING";
  return loadGoogleMaps().then(function(ok){
    if(!ok || !window.google || !window.google.maps) return null;
    if(!dmService) dmService=new google.maps.DistanceMatrixService();
    return new Promise(function(res){
      try{
        dmService.getDistanceMatrix({
          origins: origins.map(function(o){ return new google.maps.LatLng(o.lat,o.lon); }),
          destinations: destinations.map(function(d){ return new google.maps.LatLng(d.lat,d.lon); }),
          travelMode: mode
        }, function(resp,status){
          if(status!=="OK" || !resp){ console.warn("[Get-Rescue] DistanceMatrix request failed:",status,"(travelMode:",mode+")"); res(null); return; }
          res(resp.rows);

      }catch(e){ console.warn("[Get-Rescue] DistanceMatrix threw",e); res(null); }
    });

// vendorTicket's own travelModeFor() this always resolves to "TWO_WHEELER"
// (Google's own two-wheeler routing mode, India-only, matching this app's
// Karnataka/GST operating area — a mechanic riding a bike can take narrower
// streets/one-ways a car-based DRIVING route wouldn't). Kept as its own named
// function, not a hardcoded literal at each call site, so the app's intent

function travelModeFor(record){

}

   and must keep doing. Only Accept (start -> breakdown) and Vehicle Picked
   (breakdown -> drop) pass true. */
async function calcDistanceETA(fromLat,fromLon,toLat,toLon,travelMode,useGoogle){
  if([fromLat,fromLon,toLat,toLon].some(function(n){ return n==null || isNaN(n); })) return null;

  if(el && el.status==="OK") return { distanceKm:Math.round((el.distance.value/1000)*10)/10, etaMins:Math.max(1,Math.round(el.duration.value/60)) };
  const distanceKm=Math.round(haversineKm(fromLat,fromLon,toLat,toLon)*10)/10;

/* Is this an ON-DEMAND (walk-in) ticket? - 2026-10-19, client spec: the round

function isOnDemandTicket(r){

    : (raw==null ? "" : raw);

async function calcRoundTripKm(bLat,bLon,dLat,dLon,travelMode){
  const hasDrop = dLat!=null && dLon!=null && !isNaN(dLat) && !isNaN(dLon);

  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests, travelMode, false);
  if(rows){
    let total=0, ok=true;
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      total+=el.distance.value/1000;
    }

  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);

/* Same office->breakdown->office trip as calcRoundTripKm() above, but also

   this) get real values on Work Completed. mechanicToBreakdown is always 0 —
   there's no separate "Mechanic" waypoint distinct from the office/RESCUE
   point, same resolved understanding driverTicket's/vendorTicket's own TOW
   calc4PointRoundtrip() already relies on (see QUESTIONS_TO_ASK.md) —
   "Office_To_Mechanic" here just means office->breakdown. */
async function officeRoundTripLegs(bLat,bLon,travelMode){
  const rows=await googleDistanceMatrix([{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}], [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}], travelMode, false);
  let officeToBreakdown, breakdownToOffice, ok=!!rows;
  if(ok){
    const e0=rows[0] && rows[0].elements && rows[0].elements[0];
    const e1=rows[1] && rows[1].elements && rows[1].elements[1];
    if(e0 && e0.status==="OK" && e1 && e1.status==="OK"){ officeToBreakdown=e0.distance.value/1000; breakdownToOffice=e1.distance.value/1000; }

  }
  if(!ok){ officeToBreakdown=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon); breakdownToOffice=officeToBreakdown; }
  const total=officeToBreakdown+breakdownToOffice;
  return {
    officeToMechanic: Math.round(officeToBreakdown*10)/10,
    mechanicToBreakdown: 0,
    breakdownToOffice: Math.round(breakdownToOffice*10)/10,
    total: Math.round(total*10)/10
  };

function bmLonToX(lon,zoom){ return (lon+180)/360*OSM_TILE_SIZE*Math.pow(2,zoom); }
function bmLatToY(lat,zoom){
  const rad=lat*Math.PI/180;
  return (1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*OSM_TILE_SIZE*Math.pow(2,zoom);

function breakdownMapHtml(lat, lon){
  const la=parseCoord(lat), lo=parseCoord(lon);
  if(la==null || lo==null) return "";

  // wide enough to place it against a landmark.
  //
  // The tile layer is a FIXED 768x256 block centred in the container, not sized to
  // the container itself. The container is width:100%, and a widget cannot know how
  // wide that is at render time — computing tiles for an assumed width left a bare
  // strip on any phone wider than the guess. 768 covers every phone in portrait
  // with room to spare, overflow:hidden crops the rest, and the pin sits at the
  // centre of both boxes so it stays on the breakdown point whatever the crop.

// Extracted 2026-08-07 (was inline in loadDashboard() below) so the new
// background poll (pollForNewCases()) can fetch the exact same "my tickets"
// list without duplicating this filtering logic — see that function's own
// comment for why a separate fetch (rather than just reusing state.tickets)
// is what actually detects a newly-arrived case.
async function fetchMyTickets(){
  let inviteMap={};
  try{ inviteMap = await loadMyInvites(); }catch(e){ console.warn("[Get-Rescue] loadMyInvites failed (falling back to email match only)", e); }
  state.inviteByTicketId = inviteMap;
  const criteria = '(Service_Type == "RSR")';
  const recs = await apiGetReport(CONFIG.reportName, criteria, 200);
  return recs.filter(function(r){ const st=String(r[CONFIG.stageField]||"").trim().toUpperCase(); return MY_STATUSES.indexOf(st)>=0; })
    /* 2 Oct email point 4 - 2026-10-13. A ticket this technician/driver has
       already rejected leaves their list. Only their OWN Invites row can say so:
       while other invited vendors are still live the shared ticket deliberately
       stays at RSP IRA (point 5), so its Status cannot be the signal. Reads the
       inviteMap already in hand - no extra fetch. */
    .filter(function(r){
      const inv = inviteMap[String(r.ID)];
      /* Not for a ticket I am now holding - 2026-10-14. A ticket I turned down
         is not assigned to me, so every genuine reject still leaves the list at
         once; what no longer happens is a reject from an earlier round hiding a
         job I have since been given. Holder fields only - see ticketIsMineNow(). */
      if(inviteIsRejected(inv) && !ticketIsMineNow(r)) return false;
      /* Rejected and handed back to the vendor (#15.7): gone from this list even if
         the ticket still names this technician. */
      if(inviteIsRejected(inv) && String(r[CONFIG.stageField]||"").trim().toUpperCase()==="RSP IRA (INVITE RESPONSE AWAITED)") return false;
      return inv!=null || isMine(r);
    });
}
/* A GENUINE reject, not the Invites form's own default - 2026-10-13.
   Invites.Status has an INITIAL VALUE of "RSP REJECT" in Zoho, and invite
   creation never sent a Status, so every row is born carrying it. Testing
   Status alone therefore reads every pending AND every accepted invite as
   rejected. Three conditions instead: not accepted, Status says REJECT, and
   something corroborates a real response. Every reject path in every app
   writes Reject_Reason with the status, so a real reject always has one and a
   defaulted row never does. */
function inviteIsRejected(inv){
  if(!inv) return false;
  if(String(inv.Service_Acceptance_Next||"").trim().toUpperCase()==="YES") return false;
  if(String(inv.Status||"").toUpperCase().indexOf("REJECT")===-1) return false;
  const reason=String(inv.Reject_Reason||"").trim();
  const responded=String(inv.Responded_At||"").trim();
  return reason!=="" || responded!=="";
}

let KNOWN_TICKET_IDS=null; // null = not yet baselined (covers the very first load); a Set thereafter

const NOTIF_SOUND_STATE={ctx:null};
// Browsers block audio without a prior real user gesture — this creates (or
// resumes) a single shared AudioContext on the FIRST genuine click anywhere
// on the page, so a later background poll's sound is already unlocked by
// the time it actually needs to play. Cheap to call repeatedly.
function unlockNotifSound(){
  try{
    if(!NOTIF_SOUND_STATE.ctx) NOTIF_SOUND_STATE.ctx=new (window.AudioContext||window.webkitAudioContext)();
    else if(NOTIF_SOUND_STATE.ctx.state==="suspended") NOTIF_SOUND_STATE.ctx.resume().catch(function(){});
  }catch(e){}
}
document.addEventListener("click", unlockNotifSound);
// Three quick square-wave beeps, generated on the fly via a Web Audio
// oscillator — no audio file to bundle or host. Deliberately different from
// vendorTicket's/driverTicket's own tone (2026-09-10, client soft-test
// feedback: "the 'New Ticket Received' audio alert/buzzer needs to be
// distinct, unique, and sufficiently loud" — all 3 field-facing apps
// previously played the identical 2-beep sine tone) — 3 sharper beeps at a
// higher pitch (square wave, not sine) so this app is audibly identifiable
// on its own, and louder (gain 0.28 -> 0.5) than before.
/* Volume raised again 2026-09-23 (user request: "increase volume") — peak
   gain 0.5/0.55 -> 0.85. Still under Web Audio's clipping ceiling of 1.0, so
   the tone stays clean rather than distorting. The PATTERN (pulse count,
   waveform, frequency, spacing) is deliberately unchanged: each of the three
   field apps has its own signature so someone in earshot of more than one
   device can tell which app a ticket landed on by sound alone. */
function playNotifSound(){
  try{
    unlockNotifSound();
    const ctx=NOTIF_SOUND_STATE.ctx; if(!ctx) return;
    [0,0.16,0.32].forEach(function(offset){
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type="square"; osc.frequency.value=1046;
      const t=ctx.currentTime+offset;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.linearRampToValueAtTime(0.85,t+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.14);
    });
  }catch(e){ console.warn("[Get-Rescue] playNotifSound failed", e); }
}

// Caps how many cards stack at once — a burst of many simultaneous new
// invites would otherwise fill the whole screen; anything past the cap
// folds into one plain toast instead.
/* ---------- Loud buzzer for a new ticket - Task Tracker #9 / #15.2, 2026-10-27 ----------
   A burst of this app's own tone (playNotifSound, unchanged) plus vibration,
   repeated every BUZZER_REPEAT_MS until the person taps anywhere, and never
   for longer than an invite stays open. Phones only allow sound after a first
   tap, so a banner asks for one when the app opens. A locked phone or a
   backgrounded app pauses this page entirely - no web app can ring then. */
const BUZZER_REPEAT_MS = 4000, BUZZER_MAX_MS = 3*60*1000;
const BUZZER = { timer:null, until:0 };
function buzzOnce(){
  playNotifSound();
  setTimeout(playNotifSound, 400);
  setTimeout(playNotifSound, 800);
  try{ if(navigator.vibrate) navigator.vibrate([500,150,500,150,500]); }catch(e){}
}
function stopBuzzer(){
  if(BUZZER.timer){ clearInterval(BUZZER.timer); BUZZER.timer=null; }
  BUZZER.until = 0;
}
function startBuzzer(){
  stopBuzzer();
  BUZZER.until = Date.now() + BUZZER_MAX_MS;
  buzzOnce();
  BUZZER.timer = setInterval(function(){
    if(Date.now() > BUZZER.until){ stopBuzzer(); return; }
    buzzOnce();
  }, BUZZER_REPEAT_MS);
}
// Any tap acknowledges the alert (capture phase, before the tap does anything else).
document.addEventListener("pointerdown", function(){ if(BUZZER.timer) stopBuzzer(); }, true);
/* "Turn on alerts" banner: shown only while sound is still locked; the tap that

async function pollForNewCases(){
  if(!isDashboardVisible()){ stopDashboardPoll(); return; }
  // Piggy-backs on the poll that already runs every 30s while the list is on
  // screen rather than adding a second timer. flushPhotoQueue() guards itself
  // against overlapping runs and returns immediately when the queue is empty.
  flushPhotoQueue();
  try{
    const fresh=await fetchMyTickets();
    const freshIds=new Set(fresh.map(function(r){ return String(r.ID); }));
    const newOnes = KNOWN_TICKET_IDS ? fresh.filter(function(r){ return !KNOWN_TICKET_IDS.has(String(r.ID)); }) : [];
    // Real bug fixed 2026-09-01 (found while fixing the identical gap in
    // getRescueTicket's own dashboard poll) — this used to only re-render
    // when a brand-new ticket arrived. Two related gaps fixed together:
    // (1) an already-known ticket's status silently changing elsewhere
    // updated state.tickets in the background but never refreshed the
    // screen; (2) a ticket dropping out of "my tickets" entirely (no longer
    // matches this technician's own filters) had the same problem, the
    // stale row just stayed on screen. Neither plays the new-case sound —
    // that's reserved for a genuinely new arrival — they just make sure the
    // screen itself never goes stale.
    const hasStatusChange = KNOWN_TICKET_IDS ? fresh.some(function(r){
      const id=String(r.ID);
      if(!KNOWN_TICKET_IDS.has(id)) return false; // a new ticket, already covered by newOnes
      const st=String(r[CONFIG.stageField]||"").trim().toUpperCase();
      return KNOWN_TICKET_STATUSES[id]!=null && KNOWN_TICKET_STATUSES[id]!==st;
    }) : false;
    const hasRemoval = KNOWN_TICKET_IDS ? Array.from(KNOWN_TICKET_IDS).some(function(id){ return !freshIds.has(id); }) : false;
    updateKnownTicketIds(fresh);
    state.tickets=fresh;
    if(newOnes.length) notifyNewCases(newOnes);
    if(newOnes.length || hasStatusChange || hasRemoval) renderDashboard();
  }catch(e){ console.warn("[Get-Rescue] pollForNewCases failed (non-blocking)", e); }
}

/* Who holds this case right now, read fresh - 2026-10-12. See this change's
   own note for why a stale list made this necessary.

   Returns one of:
     { won:true }                 nobody holds it, or this technician does
     { won:true, unchecked:true } the check could not run, so accept as before
     { won:false, holder:"..." }  somebody else got there first */
async function claimCheck(recordId){
  let fresh = null;
  try{
    const rows = await apiGetReport(CONFIG.reportName, 'ID == ' + recordId, 200);
    fresh = rows && rows.length ? rows[0] : null;
    /* Criteria refused, or the row did not come back under it. Falling back to
       a plain read and a client-side match keeps this working even where the
       criteria form is rejected, which has happened on this platform before. */
    if(!fresh){
      const all = await apiGetReport(CONFIG.reportName, null, 1000);
      fresh = (all || []).find(function(x){ return String(x.ID) === String(recordId); }) || null;
    }
  }catch(e){
    console.warn("[Get-Rescue] claimCheck: could not re-read ticket " + recordId + " - accepting as before rather than blocking a technician who may be on their way.", e);
    return { won:true, unchecked:true };
  }
  if(!fresh){
    console.warn("[Get-Rescue] claimCheck: ticket " + recordId + " did not come back on a fresh read - accepting as before.");
    return { won:true, unchecked:true };
  }
  const holderId = lookupId(fresh.Assigned_Technician);
  const myId = currentTechRecord && currentTechRecord.id;
  if(holderId != null && String(holderId).trim() !== "" && myId){
    if(String(holderId) === String(myId)) return { won:true };
    return { won:false, holder:lookupNameOf(fresh.Assigned_Technician) };
  }
  return { won:true, unchecked:!myId };
}
/* A display name for whoever holds it, for the message on screen. Falls back
   to "another technician" rather than printing a raw record id at someone. */
function lookupNameOf(v){
  if(v && typeof v === "object"){
    const n = v.display_value || v.zc_display_value || v.name;
    if(n) return String(n);
  }
  return "another technician";
}
/* Said once, the same way, from both the before and after checks. */
function reportMissedCase(holder){
  toast((holder || "Another technician") + " accepted this case first - it is no longer yours.", "err");
  try{ loadDashboard(); }catch(e){}
}
async function acceptService(){
  setDisabled("acceptBtn",true);
  try{
    const pos = await requireLocation();
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    // Google ON - Accept: start -> breakdown (item 1).
    const dist = pos ? await calcDistanceETA(pos.lat,pos.lon,bLat,bLon,travelModeFor(r),true) : null;
    const payload={
      Service_Acceptance: fmtDateTime(new Date()),
      Status: "RSP ON THE WAY"
    };
    // Real bug fixed (2026-08-06, user-reported live: "Assigned Technician"/
    // "Technician Email" always blank on the agent's own Service Acceptance
    // screen) — see vendorTicket's own matching comment on Assigned_Vendor/
    // Vendor_Email1/2: this direct-acceptance path never recorded who
    // actually accepted, only the fleet hand-off path (assignTechnician() in
    // vendorTicket) did.
    if(currentTechRecord){
      payload.Assigned_Technician=currentTechRecord.id;
      const myEmail=currentTechRecord.data && currentTechRecord.data[CONFIG.techEmailField];
      if(myEmail) payload.Technician_Email=myEmail;
    }
    if(dist){ payload.ETA=dist.etaMins; payload.Distance_To_Breakdown=dist.distanceKm; }
    // Persisted so Action 6's Cancel flow can later compute "distance from RSP
    // Start location to present location" (per its own flow spec, 2026-07-31)
    // — this technician's own location was previously only used transiently
    // to compute the breakdown ETA/distance above, never saved anywhere.
    // Field names guessed, not confirmed — see FIELDS.md/QUESTIONS_TO_ASK.md.
    // Set on both the payload (persisted) AND state.current (r) itself — the
    // ticket stays open in-session (goToStatus, not a re-fetch), so Cancel
    // needs to read this back off r without requiring a reopen.
    if(pos){ payload.RSP_Start_Latitude=pos.lat; payload.RSP_Start_Longitude=pos.lon; r.RSP_Start_Latitude=pos.lat; r.RSP_Start_Longitude=pos.lon; }
    // Diagnostic logging (2026-08-03, user still seeing "exceeded its maximum
    // digits" after the toFixed(15) fix) — logs the exact values/types being
    // sent, including their raw string form, so the actual digit count is
    // visible (typeof/JSON.stringify can hide trailing zeros or reveal if a
    // value is a string vs. a number, either of which could matter here).
    console.log("[Get-Rescue] acceptService payload:", JSON.stringify(payload), "| pos:", pos, "| RSP_Start_Latitude raw:", payload.RSP_Start_Latitude, typeof payload.RSP_Start_Latitude, String(payload.RSP_Start_Latitude), "| RSP_Start_Longitude raw:", payload.RSP_Start_Longitude, typeof payload.RSP_Start_Longitude, String(payload.RSP_Start_Longitude));
    /* FIRST ACCEPT WINS, check 1 of 2 - 2026-10-12. The list this was tapped
       from may be minutes old; this is the only read that knows who holds the
       case now. See claimCheck()'s own note. */
    const claimBefore = await claimCheck(r.ID);
    if(!claimBefore.won){
      console.log("[Get-Rescue] acceptService: ticket " + r.ID + " is already held by " + claimBefore.holder + " - nothing was written.");
      reportMissedCase(claimBefore.holder);
      return;
    }
    await apiUpdate(r.ID, payload);
    /* FIRST ACCEPT WINS, check 2 of 2 - 2026-10-12. Somebody else's write can
       still land between the check above and the write just made. Reading back
       settles it, and everything below - the invite stamp, the customer
       message, the screen change - happens ONLY on a confirmed win. That is
       what stops two vendors both showing Accepted on the agent's panel. */
    const claimAfter = await claimCheck(r.ID);
    if(!claimAfter.won){
      console.warn("[Get-Rescue] acceptService: ticket " + r.ID + " went to " + claimAfter.holder + " while this accept was in flight. Backing out - the invite is NOT stamped and no customer message is sent.");
      reportMissedCase(claimAfter.holder);
      return;
    }
    // Invites (2026-08-03) — see vendorTicket's own acceptService() comment.
    // 2026-08-03: see vendorTicket's own comment on this same call — a
    // boolean `true` was confirmed rejected live, switched to "Yes".
    updateMyInvite(r.ID, { Service_Acceptance_Next: "Yes", Status: "RSP ACCEPT" });   // Status too - 2026-10-13, it defaults to "RSP REJECT" on the form and accept never cleared it
    toast("Service accepted","ok");
    // WhatsApp dispatch message (2026-09-06, RESCUE Repair Service Logic
    // Flow spec: "Mechanic/Driver app - ACCEPT/REJECT page | on click
    // ACCEPT button | Send 8 with vendor/mechanic name and number").
    // Template name and exact param ORDER (name, phone, ETA) are a
    // best-effort guess, not confirmed against the real approved WhatsApp
    // Business template — same "flagged, not confirmed" pattern as every
    // other template name in this app. Fire-and-forget, same as the Reach
    // message above — a failed send never blocks the real Accept action.
    /* Template name corrected 2026-09-22 against the approved WhatsPortal
       catalogue ("Get Rescued - WhatsApp Template API", revised 16 Sep 2026).
       "dispatch_eta" does not exist in the workspace and was returning 404
       template_not_found on every send - the real approved template is #8,
       share_rescue_service_details_and_eta, the same one getRescueTicket's own
       sendRescuerEtaMessage() already uses. Two further spec rules applied:
       the template writes the literal word "Hrs" after {{3}}, so the ETA is
       converted from minutes to hours (sending 45 would otherwise read
       "45 Hrs"); and empty strings are rejected with 422 message_rejected, so
       every missing value is sent as "-" instead. */
    /* SEND 8, then SEND 9 — LOGIC-REPAIR / LOGIC-TOW: "SEND 8 with vendor/mechanic
       name and number, AND then send 9 after 5 minutes".

       SEND 9 goes out immediately rather than 5 minutes later. A widget cannot
       hold a 5-minute timer — the app is closed or the screen locked long before
       it fires, and the message would simply never arrive. Honouring the gap needs
       a scheduled Deluge function sweeping a due-time field on the ticket, which
       is new Zoho infrastructure; delivered-now beats delivered-never until that
       exists. Chained after SEND 8 so the order the customer sees is still right.

       Template 9 takes no parameters. Failures are logged, never toasted: SEND 8
       already reports its own outcome and this must not turn one failure into two
       error messages on the vendor's screen. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescue_service_details_and_eta", [MY_TECH_NAME||"-", MY_TECH_PHONE||"-", customerEtaText(dist&&dist.etaMins)||"-"])
      /* SEND 9 is SCHEDULED, not sent here - 2026-10-10. See scheduleSend9()
         for the five-minute rule and for what happens when the field does not
         exist yet. The chain is kept so a scheduling failure still cannot
         disturb SEND 8, which has already gone. */
      .then(function(){ return scheduleSend9(r); })
      .then(function(ok9){ if(!ok9) console.warn("[GR] SEND 9 extra-charges advisory failed (non-blocking) for ticket", r.ID); })
      .catch(function(e){ console.warn("[GR] SEND 8/9 chain threw (non-blocking)", e); });
    // Navigates straight to "Reach Breakdown Location" per the flow spec —
    // see goToStatus()'s own comment.
    goToStatus("RSP ON THE WAY");
  }catch(e){ console.error("[Get-Rescue] acceptService error:", e); toast((e&&e.message)||"Could not accept","err"); }
  finally{ setDisabled("acceptBtn",false); }
}
/* A ticket a vendor handed to this technician (Task Tracker #15.7): the vendor is
   still on it, and the office has not taken it over. */
function rejectReturnsToVendor(r){
  const vendorId = lookupId(r && r.Assigned_Vendor);
  if(vendorId==null || String(vendorId).trim()==="") return false;
  return String(readVal(r,"Acceptance_Mode")||"").trim()!=="Agent Entering on Behalf of Vendor";
}
/* Best-effort and separate, so a refused column can never undo the reject above.
   The emails are what put this ticket on this technician's own list. */
async function releaseTechnicianFromTicket(ticketId){
  try{ await apiUpdate(ticketId, { Assigned_Technician_Email:"", Technician_Email:"", Technician_Emails:"" }); }
  catch(e){ console.warn("[Get-Rescue] releaseTechnicianFromTicket: technician emails not cleared on ticket "+ticketId+" - the rejected invite still hides it from this app", e); }
  try{ await apiUpdate(ticketId, { Assigned_Technician:"" }); }
  catch(e){ console.warn("[Get-Rescue] releaseTechnicianFromTicket: Assigned_Technician not cleared on ticket "+ticketId+" - the vendor app ignores a technician who rejected", e); }
}
async function rejectService(){
  const reason=$("rejectReason").value;
  if(!reason){ toast("Please pick a reject reason","err"); return; }
  setDisabled("confirmRejectBtn",true);
  try{
    const r=state.current;
    // "Service_Reject_Time" is its own distinct timestamp per the Action 5
    // flow spec (2026-07-31) — was previously (incorrectly) reusing
    // Service_Acceptance for both accept and reject; kept unconfirmed (❓ in
    // FIELDS.md) since this field name hasn't been independently verified.
    /* Back to the vendor who handed it over - Task Tracker #15.7 (2026-10-28). That
       vendor still holds the case (Assigned_Vendor), so the ticket returns to their
       Service Acceptance screen - accept it themselves or pick another technician -
       instead of RSP REJECT, which took it off the vendor's app and left only the
       office able to act. This technician is released from the ticket so a
       re-assignment starts fresh. Any other ticket is rejected exactly as before. */
    if(rejectReturnsToVendor(r)){
      await apiUpdate(r.ID, { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason: reason, Status:"RSP IRA (INVITE RESPONSE AWAITED)" });
      releaseTechnicianFromTicket(r.ID);
    } else {
      await apiUpdate(r.ID, { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason: reason, Status:"RSP REJECT" });
    }
    // Invites (2026-08-03) — see vendorTicket's own rejectService() comment.
    updateMyInvite(r.ID, { Status:"RSP REJECT", Reject_Reason: reason });
    // best-effort duplicate into Task_Rejections — RSP name + task details,
    // per the Action 5 flow spec's own instruction ("create a copy of the
    // rejection with RSP name, times & Task details in Task rejections
    // table"). Report/field names unconfirmed; deliberately non-blocking (a
    // logging failure must never block the actual rejection).
    try{
      const fn=resolve("addRecords");
      // RSID/Vehicle are real Lookup fields on Task_Rejections — Lookups
      // need the linked record's own ID, not a display string. RSID
      // (renamed 2026-08-03 from Case_ID, to match Invites' own naming for
      // the same "Lookup back to Create_Case" concept) -> this ticket's own
      // Create_Case record ID (r.ID, same ID apiUpdate targets). Vehicle ->
      // whatever raw value Create_Case's own Vehicle lookup field came back
      // as on this record, passed through unconverted (this widget never
      // needed its ID before) — best-effort, verify live. 2026-07-31:
      // briefly tried wrapping both as {"ID":...} objects, but that broke
      // saving (see getRescueTicket's idsFor() comment) — reverted.
      if(fn) await fn({ app_name:CONFIG.appName, form_name:"Task_Rejections", payload:{ data:{
        /* RSID on Task_Rejections is a single-line TEXT field (2026-10-22), so it
           stores what is sent: the Case_ID ("RSID079004") reads as a ticket; the
           record id read as a bare number. Record id only if no Case_ID exists. */
        RSID:(readVal(r,CONFIG.caseIdField)||r.ID), RSP_Name:$("techName").textContent, Reason:reason,
        Rejected_At:fmtDateTime(new Date()), Vehicle:r[CONFIG.vehicleField], Vehicle_Issue:issueNamesFor(r)
      } } });
    }catch(e){ console.warn("Task_Rejections log failed (non-blocking)", e); }
    toast("Rejected","ok");
    // "navigate to home page of app user" per the flow spec — unlike Accept,
    // this technician's involvement with this ticket ends here.
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not reject","err"); }
  finally{ setDisabled("confirmRejectBtn",false); }
}
