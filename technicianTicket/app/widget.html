<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Get-Rescue · Technician</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as getRescueTicket/toggleGetRescue — kept identical
   across every Get-Rescue widget on purpose (2026-07-31: "the theme will be
   same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

/* ---------- topbar: brand + online/offline toggle (folded in, 2026-07-31 —
   no separate toggle widget for these three profiles) ---------- */
.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}

/* ---------- section headings / cards ---------- */
.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.st.rej{background:var(--stop-soft);color:var(--stop)}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- action screen ---------- */
#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
/* minmax(0,1fr) + wrapping, 2026-09-25 — client-reported: the vehicle name showed
   correctly on iPhone but was clipped or missing on Android.
   Not a data difference: both devices receive the same name. A grid column sized
   plain `1fr` keeps min-width:auto, so the track REFUSES to shrink below its
   content's min-content width. A long unbroken value ("OTHER TWO WHEELER",
   "PUNCTURE-TUBELESS TYRE") therefore pushes the column wider than the card and
   overflows instead of wrapping. iOS Safari and Android Chrome differ in viewport
   width and font metrics, so the same layout clips on one and fits on the other.
   minmax(0,1fr) lets the track shrink and the wrap rules below let the text break,
   which is additive: nothing that fits today renders any differently. */
.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;margin-bottom:6px}
.info-grid .full{grid-column:1/-1}
.info-grid .k{font-family:var(--f-mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.info-grid .v{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.nav-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--info-soft);color:#1d5fc0;border-radius:11px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:14px;text-decoration:none;margin:6px 0}

/* ---------- photo grid (multi-capture with min/max) ---------- */
.photo-field{margin:12px 0}
.photo-field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.photo-field .lab .l{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.photo-field .lab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.photo-field .lab .cnt.ok{color:var(--ok)}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--worktop)}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;color:var(--muted-2);background:#fff}
.photo-slot.add:active{background:var(--worktop)}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,22,28,.65);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:11px}
/* Auto-upload status badge — see vendorTicket's own matching comment. */
.photo-slot .up-badge{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.photo-slot .up-badge.ok{background:var(--ok)}
.photo-slot .up-badge.pending{background:rgba(20,22,28,.65);animation:pulseBadge 1.1s ease-in-out infinite}
.photo-slot .up-badge.failed{background:var(--stop)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- form fields (radio/select/input reused) ---------- */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;font-family:var(--f-body);color:var(--text);background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld textarea{min-height:70px;resize:vertical}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;background:#fff;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:active{background:var(--signal-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:16px}
.btn-row .btn{flex:1}

/* ---------- camera modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column}
.modal.on{display:flex}
#cameraVideo{width:100%;max-width:520px;flex:1;object-fit:cover;background:#000}
.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;width:100%;max-width:520px}
.cam-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer}
.cam-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;cursor:pointer;font-size:18px}
.cam-hint{color:rgba(255,255,255,.7);font-family:var(--f-mono);font-size:11px;text-align:center;padding:8px 20px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* "New case assigned" notifications (2026-08-07) — see notifyNewCases()'s
   own comment. Stacks top-right, above everything else on screen. */
.mech-notif-stack{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.mech-notif-card{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--signal);
  border-radius:10px;padding:11px 12px;box-shadow:var(--sh-2);animation:mechNotifIn .2s ease-out}
.mech-notif-body{flex:1;cursor:pointer;font-size:13px;line-height:1.45}
.mech-notif-body b{display:block;font-size:13.5px;margin-bottom:2px}
.mech-notif-status{color:var(--muted);font-size:11.5px;margin-top:3px}
.mech-notif-close{flex:none;border:0;background:transparent;color:var(--muted-2);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.mech-notif-close:hover{color:var(--stop)}
@keyframes mechNotifIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
      <span><b id="techName">Technician</b><span>Get-Rescue</span></span>
    </div>
    <div class="toggle" id="availToggle" role="switch" aria-label="Toggle availability">
      <span class="lab off">Offline</span><span class="lab on">Online</span>
      <span class="knob"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="sec-head"><h2>My Tickets</h2><span class="cnt" id="ticketCount">0</span></div>
    <div id="ticketList"></div>
  </div>

  <div id="actionScreen" class="off">
    <div class="ascreen-top">
      <button class="back-x" id="backBtn" type="button" aria-label="Back to my tickets"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="ascreenTitle">—</h2>
    </div>
    <div class="card">
      <div class="info-grid" id="ticketInfo"></div>
    </div>
    <div id="ascreenBody"></div>
  </div>
</div>

<!-- camera modal: getUserMedia preview + GPS/timestamp-watermarked capture.
     Falls back to a plain <input type=file capture> if the camera/permission
     isn't available (see openCamera()) — best-effort, per the spec's own
     "error handling and fallback prompts" requirement. Only verifiable on a
     real device/browser with camera+location permissions; not exercised by
     the isolated Node logic tests used elsewhere in this build. -->
<div class="modal" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="cam-hint" id="cameraHint">Center the shot, then tap to capture</div>
  <div class="camera-bar">
    <button class="cam-x" id="cameraCancel" type="button" aria-label="Cancel">✕</button>
    <button class="cam-btn" id="cameraShutter" type="button" aria-label="Capture photo"></button>
    <span style="width:40px"></span>
  </div>
</div>
<input type="file" id="cameraFallbackInput" accept="image/*" capture="environment" style="display:none">
<!-- no `capture` attribute here — lets the OS picker offer Gallery too -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<!-- Real-time-ish "new case assigned" notifications (2026-08-07, user
     request) — see notifyNewCases()'s own comment. Separate from the
     single-slot toast above (auto-hides in 2.6s, would get stomped by a
     second simultaneous event); cards here stack and persist until
     dismissed or their own 12s timeout. -->
<div class="mech-notif-stack" id="mechNotifStack"></div>

<script>
/* =====================================================================
   GET-RESCUE · TECHNICIAN WIDGET (RSR field flow)
   Built 2026-07-31 from a "PROMPT FOR WIDGET CODE GENERATION" spec, the same
   session's Screen-by-Screen Flow Atlas, and the confirmed answers below.
   User-confirmed decisions this build relies on:
   - Data source is Create_Case ONLY (the prompt's own "Invites" form is
     NOT used — user explicitly said "no only use create case form only").
   - Google Maps Distance Matrix API key provided 2026-08-04 — calcDistanceETA()/
     calcRoundTripKm() below now call it first (see GOOGLE_MAPS_API_KEY),
     falling back to the original Haversine straight-line stand-in only if the
     Maps script fails to load or a request errors, so a network hiccup never
     blocks a field save.
   - Every field here mirrors what the agent-facing getRescueTicket widget
     already reads/writes for the SAME Create_Case fields (Status values,
     ETA/Distance/Image_Upload* names) so both widgets stay consistent.
   Same theme/design tokens as every other Get-Rescue widget, same
   resolve()/apiGet/apiUpdate/apiUpload data-layer pattern as getRescueTicket
   (not reinvented) plus toggleGetRescue's own toggle logic folded directly
   into this widget (per explicit request — no separate toggle widget for
   Vendor/Technician/Driver).
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  // Added 2026-08-05 (user request — "Vehicle ID showing, not the Vehicle
  // name") — see vendorTicket's own matching CONFIG comment; same fix here.
  vehicleMasterReport: "Vehicle_Master_Report",
  vehicleNameField: "Name",
  // Added 2026-08-05 (user request — "[object Object]" on the dashboard card
  // instead of the real issue name) — see vendorTicket's own matching CONFIG
  // comment; same fix here.
  issueReport: "Vehicle_Issue_Report",
  issueNameField: "Issue_Name",
  /* "assigned to me" — checks every real Create_Case field this role's
     email could be stored under, depending on which stage set it
     (Assignment vs. Acceptance) — these are two distinct real fields, not
     guesses about one field's name, so both stay checked. */
  myEmailFieldCandidates: ["Assigned_Technician_Email","Technician_Email"],
  /* toggle target — same report/field toggleGetRescue already reads/writes,
     folded directly into this widget per explicit request. */
  techReport: "Technicians_Report",
  techStatusField: "Availability_Status",
  techEmailField: "Email",
  techNameField: "Technician_Name",
  techPhoneField: "Phone", // user-confirmed 2026-09-06 — needed for the WhatsApp "dispatched" message (spec template 8)
  // Added 2026-08-17 (user request — see pingCurrentLocation()'s own
  // comment). Same field names getRescueTicket's own vendor-assignment picker
  // expects on Technicians_Report, written here directly through this
  // technician's own techReport record (unlike vendorTicket, this widget's
  // toggle already targets Technicians_Report itself — no separate
  // My_Availability-style report in between). Brand-new fields, not yet
  // created in Zoho Studio — see FIELDS.md's own note.
  techCurrentLatField: "Current_Latitude",
  techCurrentLonField: "Current_Longitude",
  // Invites (2026-08-03, user-confirmed — "invite covers all"): the same
  // Invites/Invites_Report mechanism getRescueTicket uses for vendor invites
  // is reused for technicians too, via vendorTicket's own fleet hand-off
  // (assignTechnician) creating one Invites record with Vendor -> this
  // technician's own Technicians_Report record. Used here to find "my
  // tickets" the same way vendorTicket does — see loadDashboard().
  invitesReport: "Invites_Report"
};
/* Statuses this dashboard shows — RSR-only, and only the ones a technician
   still has an open action for. "REMAINING FEE DUE" (Work Completed's own
   target status per the flow-generation prompt) does NOT match either of
   getRescueTicket's own two guesses for the `payment` stage ("RSP COMPLETE"
   was the working guess, "RSP CLOSED" the flagged alternative) — this is
   new, better evidence and is used here as given; see QUESTIONS_TO_ASK.md
   for reconciling it back into getRescueTicket's own STAGES table. */
// "RSP REJECT" added 2026-08-20 — see vendorTicket's own matching comment
// (same fix, same day, same root cause: a rejected ticket used to vanish
// from "My Tickets" with no lasting sign it was ever rejected).
const MY_STATUSES = ["RSP IRA (INVITE RESPONSE AWAITED)","RSP ON THE WAY","WORK IN PROGRESS","REMAINING FEE DUE","RSP REJECT"];
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
// Corrected 2026-09-07 (user-provided LOCATIONS-DISTANCES-DATETIME spec) —
// previous value (12.967827711025203, 77.611228) was off by ~13-20m from the
// spec's confirmed office coordinates.
const OFFICE_LAT=12.967945122837245, OFFICE_LON=77.6110507612277; // same static office coords as getRescueTicket — see its own README caveat

/* ---------- SDK boot (no ZOHO.CREATOR.init in this SDK build) ---------- */
// Direct download-URL construction (2026-08-21, ported from getRescueTicket's
// own already-working zohoFileDownloadUrl()) — see fileCountFor()/
// zohoFileDownloadUrl() below for why this is needed here too. Same
// account/app/report as getRescueTicket (CONFIG.appName/reportName below
// are identical), so reusing this exact constant/pattern is not a new guess.
const ZOHO_SCOPE_NAME = "getrescued";
let INIT_PARAMS = null;
function zohoAppLinkName(){
  const frag = (INIT_PARAMS && INIT_PARAMS.envUrlFragment) || "";
  return CONFIG.appName + (/development/i.test(frag) ? "-development" : "");
}
let SDK_READY=false, LOGIN_EMAIL="", MY_TECH_NAME="", MY_TECH_PHONE="";
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams==="function"; }
function resolve(method){
  const C=window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces=[C.DATA,C.PUBLISH,C.META,C.UTIL,C.FILE];
  for(let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria=criteria;

/* ---------- distance/ETA — Google Maps Distance Matrix API, Haversine
   straight-line kept as an automatic fallback (see this file's header
   comment) ---------- */
function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// at the equator/prime meridian" instead of "not set yet" wherever a call
// site did Number(r.DropLocationLat) directly. Use this instead.
function parseCoord(v){
  if(v==null || v==="") return null;

}

function googleDistanceMatrix(origins,destinations,travelMode){
  const mode=travelMode||"DRIVING";

// Karnataka/GST operating area — a mechanic riding a bike can take narrower

async function calcDistanceETA(fromLat,fromLon,toLat,toLon,travelMode){
  if([fromLat,fromLon,toLat,toLon].some(function(n){ return n==null || isNaN(n); })) return null;
  const rows=await googleDistanceMatrix([{lat:fromLat,lon:fromLon}],[{lat:toLat,lon:toLon}],travelMode);
  const el=rows && rows[0] && rows[0].elements && rows[0].elements[0];
  if(el && el.status==="OK") return { distanceKm:Math.round((el.distance.value/1000)*10)/10, etaMins:Math.max(1,Math.round(el.duration.value/60)) };
  const distanceKm=Math.round(haversineKm(fromLat,fromLon,toLat,toLon)*10)/10;
  const etaMins=Math.max(1, Math.round((distanceKm/ASSUMED_SPEED_KMH)*60));
  return { distanceKm:distanceKm, etaMins:etaMins };
}
// bLat/bLon/dLat/dLon kept as this function's own names (breakdown/drop) even
// though RSR has no drop point — dLat/dLon simply stay null/NaN for every RSR
// call site, same as before this Google swap.
async function calcRoundTripKm(bLat,bLon,dLat,dLon,travelMode){
  const hasDrop = dLat!=null && dLon!=null && !isNaN(dLat) && !isNaN(dLon);
  const origins = hasDrop ? [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon},{lat:dLat,lon:dLon}] : [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}];
  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests,travelMode);
  if(rows){
    let total=0, ok=true;
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      total+=el.distance.value/1000;
    }
    if(ok) return Math.round(total*10)/10;
  }
  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
  if(hasDrop){ total+=haversineKm(bLat,bLon,dLat,dLon); total+=haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON); }
  else{ total+=haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON); }
  return Math.round(total*10)/10;
}
/* Same office->breakdown->office trip as calcRoundTripKm() above, but also
   exposing the two individual legs — added 2026-08-04 so Step 7's own
   Office_To_Mechanic/Mechanic_To_Breakdown/Breakdown_To_Office fields
   (documented in FIELDS.md, never actually written by any widget before
   this) get real values on Work Completed. mechanicToBreakdown is always 0 —
   there's no separate "Mechanic" waypoint distinct from the office/RESCUE
   point, same resolved understanding driverTicket's/vendorTicket's own TOW
   calc4PointRoundtrip() already relies on (see QUESTIONS_TO_ASK.md) —
   "Office_To_Mechanic" here just means office->breakdown. */
async function officeRoundTripLegs(bLat,bLon,travelMode){
  const rows=await googleDistanceMatrix([{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}], [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}],travelMode);
  let officeToBreakdown, breakdownToOffice, ok=!!rows;
  if(ok){
    const e0=rows[0] && rows[0].elements && rows[0].elements[0];
    const e1=rows[1] && rows[1].elements && rows[1].elements[1];
    if(e0 && e0.status==="OK" && e1 && e1.status==="OK"){ officeToBreakdown=e0.distance.value/1000; breakdownToOffice=e1.distance.value/1000; }
    else ok=false;
  }
  if(!ok){ officeToBreakdown=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon); breakdownToOffice=officeToBreakdown; }
  const total=officeToBreakdown+breakdownToOffice;
  return {
    officeToMechanic: Math.round(officeToBreakdown*10)/10,
    mechanicToBreakdown: 0,
    breakdownToOffice: Math.round(breakdownToOffice*10)/10,
    total: Math.round(total*10)/10
  };
}

// Real-time-ish "new case assigned" notifications (2026-08-07, user request:
// "Enable real-time notifications (including sound alerts) when mechanics
// receive or update assigned cases" — mechanic side; the agent side was
// already built in getRescueTicket this same session). This platform has no
// push/WebSocket channel at all, so "real-time" here means periodic polling
// while the dashboard list is actually on screen — same approach used there.
// Detects a ticket ID showing up in "my tickets" that WASN'T there on the
// previous check, i.e. a brand-new invite/assignment just landed.
let KNOWN_TICKET_IDS=null; // null = not yet baselined (covers the very first load); a Set thereafter
// KNOWN_TICKET_STATUSES (2026-09-01) — companion to KNOWN_TICKET_IDS, added
// so pollForNewCases() can also detect a status CHANGE on an already-known
// ticket, not just a brand-new ticket arriving. Same gap getRescueTicket's
// own dashboard poll had, fixed there first (see
// pollDashboardForMechanicUpdates's own comment for the full reasoning
// behind splitting "render" from "notify"), then mirrored into vendorTicket.
let KNOWN_TICKET_STATUSES={};
function updateKnownTicketIds(recs){
  KNOWN_TICKET_IDS=new Set(recs.map(function(r){ return String(r.ID); }));
  const statuses={};
  recs.forEach(function(r){ statuses[String(r.ID)]=String(r[CONFIG.stageField]||"").trim().toUpperCase(); });
  KNOWN_TICKET_STATUSES=statuses;
}
const NOTIF_SOUND_STATE={ctx:null};
// Browsers block audio without a prior real user gesture — this creates (or
// resumes) a single shared AudioContext on the FIRST genuine click anywhere
// on the page, so a later background poll's sound is already unlocked by
// the time it actually needs to play. Cheap to call repeatedly.
function unlockNotifSound(){
  try{
    if(!NOTIF_SOUND_STATE.ctx) NOTIF_SOUND_STATE.ctx=new (window.AudioContext||window.webkitAudioContext)();
    else if(NOTIF_SOUND_STATE.ctx.state==="suspended") NOTIF_SOUND_STATE.ctx.resume().catch(function(){});
  }catch(e){}
}
document.addEventListener("click", unlockNotifSound);
// Three quick square-wave beeps, generated on the fly via a Web Audio
// oscillator — no audio file to bundle or host. Deliberately different from
// vendorTicket's/driverTicket's own tone (2026-09-10, client soft-test
// feedback: "the 'New Ticket Received' audio alert/buzzer needs to be
// distinct, unique, and sufficiently loud" — all 3 field-facing apps
// previously played the identical 2-beep sine tone) — 3 sharper beeps at a
// higher pitch (square wave, not sine) so this app is audibly identifiable
// on its own, and louder (gain 0.28 -> 0.5) than before.
/* Volume raised again 2026-09-23 (user request: "increase volume") — peak
   gain 0.5/0.55 -> 0.85. Still under Web Audio's clipping ceiling of 1.0, so
   the tone stays clean rather than distorting. The PATTERN (pulse count,
   waveform, frequency, spacing) is deliberately unchanged: each of the three
   field apps has its own signature so someone in earshot of more than one
   device can tell which app a ticket landed on by sound alone. */
function playNotifSound(){
  try{
    unlockNotifSound();
    const ctx=NOTIF_SOUND_STATE.ctx; if(!ctx) return;
    [0,0.16,0.32].forEach(function(offset){
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type="square"; osc.frequency.value=1046;
      const t=ctx.currentTime+offset;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.linearRampToValueAtTime(0.85,t+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.14);
    });
  }catch(e){ console.warn("[Get-Rescue] playNotifSound failed", e); }
}
// One stacking card per new case (see #mechNotifStack's own HTML/CSS

// Caps how many cards stack at once — a burst of many simultaneous new
// invites would otherwise fill the whole screen; anything past the cap

function notifyNewCases(list){

function isDashboardVisible(){

let DASHBOARD_POLL_TIMER=null;
const DASHBOARD_POLL_MS=30000;
function stopDashboardPoll(){ if(DASHBOARD_POLL_TIMER){ clearInterval(DASHBOARD_POLL_TIMER); DASHBOARD_POLL_TIMER=null; } }
function startDashboardPollIfNeeded(){
  stopDashboardPoll(); // never let two timers stack across repeated loadDashboard() calls
  if(!isDashboardVisible()) return;
  DASHBOARD_POLL_TIMER=setInterval(pollForNewCases, DASHBOARD_POLL_MS);
}
async function pollForNewCases(){
  if(!isDashboardVisible()){ stopDashboardPoll(); return; }
  try{
    const fresh=await fetchMyTickets();
    const freshIds=new Set(fresh.map(function(r){ return String(r.ID); }));
    const newOnes = KNOWN_TICKET_IDS ? fresh.filter(function(r){ return !KNOWN_TICKET_IDS.has(String(r.ID)); }) : [];
    // Real bug fixed 2026-09-01 (found while fixing the identical gap in
    // getRescueTicket's own dashboard poll) — this used to only re-render
    // when a brand-new ticket arrived. Two related gaps fixed together:
    // (1) an already-known ticket's status silently changing elsewhere
    // updated state.tickets in the background but never refreshed the
    // screen; (2) a ticket dropping out of "my tickets" entirely (no longer
    // matches this technician's own filters) had the same problem, the
    // stale row just stayed on screen. Neither plays the new-case sound —
    // that's reserved for a genuinely new arrival — they just make sure the
    // screen itself never goes stale.
    const hasStatusChange = KNOWN_TICKET_IDS ? fresh.some(function(r){
      const id=String(r.ID);
      if(!KNOWN_TICKET_IDS.has(id)) return false; // a new ticket, already covered by newOnes
      const st=String(r[CONFIG.stageField]||"").trim().toUpperCase();
      return KNOWN_TICKET_STATUSES[id]!=null && KNOWN_TICKET_STATUSES[id]!==st;
    }) : false;
    const hasRemoval = KNOWN_TICKET_IDS ? Array.from(KNOWN_TICKET_IDS).some(function(id){ return !freshIds.has(id); }) : false;
    updateKnownTicketIds(fresh);
    state.tickets=fresh;
    if(newOnes.length) notifyNewCases(newOnes);
    if(newOnes.length || hasStatusChange || hasRemoval) renderDashboard();
  }catch(e){ console.warn("[Get-Rescue] pollForNewCases failed (non-blocking)", e); }
}

async function acceptService(){
  setDisabled("acceptBtn",true);
  try{
    const pos = await getPositionSafe();
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    const dist = pos ? await calcDistanceETA(pos.lat,pos.lon,bLat,bLon,travelModeFor(r)) : null;
    const payload={
      Service_Acceptance: fmtDateTime(new Date()),
      Status: "RSP ON THE WAY"
    };
    // Real bug fixed (2026-08-06, user-reported live: "Assigned Technician"/
    // "Technician Email" always blank on the agent's own Service Acceptance
    // screen) — see vendorTicket's own matching comment on Assigned_Vendor/
    // Vendor_Email1/2: this direct-acceptance path never recorded who
    // actually accepted, only the fleet hand-off path (assignTechnician() in
    // vendorTicket) did.
    if(currentTechRecord){
      payload.Assigned_Technician=currentTechRecord.id;
      const myEmail=currentTechRecord.data && currentTechRecord.data[CONFIG.techEmailField];
      if(myEmail) payload.Technician_Email=myEmail;
    }
    if(dist){ payload.ETA=dist.etaMins; payload.Distance_To_Breakdown=dist.distanceKm; }
    // Persisted so Action 6's Cancel flow can later compute "distance from RSP
    // Start location to present location" (per its own flow spec, 2026-07-31)
    // — this technician's own location was previously only used transiently
    // to compute the breakdown ETA/distance above, never saved anywhere.
    // Field names guessed, not confirmed — see FIELDS.md/QUESTIONS_TO_ASK.md.
    // Set on both the payload (persisted) AND state.current (r) itself — the
    // ticket stays open in-session (goToStatus, not a re-fetch), so Cancel
    // needs to read this back off r without requiring a reopen.
    if(pos){ payload.RSP_Start_Latitude=pos.lat; payload.RSP_Start_Longitude=pos.lon; r.RSP_Start_Latitude=pos.lat; r.RSP_Start_Longitude=pos.lon; }
    // Diagnostic logging (2026-08-03, user still seeing "exceeded its maximum
    // digits" after the toFixed(15) fix) — logs the exact values/types being
    // sent, including their raw string form, so the actual digit count is
    // visible (typeof/JSON.stringify can hide trailing zeros or reveal if a
    // value is a string vs. a number, either of which could matter here).
    console.log("[Get-Rescue] acceptService payload:", JSON.stringify(payload), "| pos:", pos, "| RSP_Start_Latitude raw:", payload.RSP_Start_Latitude, typeof payload.RSP_Start_Latitude, String(payload.RSP_Start_Latitude), "| RSP_Start_Longitude raw:", payload.RSP_Start_Longitude, typeof payload.RSP_Start_Longitude, String(payload.RSP_Start_Longitude));
    await apiUpdate(r.ID, payload);
    // Invites (2026-08-03) — see vendorTicket's own acceptService() comment.
    // 2026-08-03: see vendorTicket's own comment on this same call — a
    // boolean `true` was confirmed rejected live, switched to "Yes".
    updateMyInvite(r.ID, { Service_Acceptance_Next: "Yes" });
    toast("Service accepted","ok");
    // WhatsApp dispatch message (2026-09-06, RESCUE Repair Service Logic
    // Flow spec: "Mechanic/Driver app - ACCEPT/REJECT page | on click
    // ACCEPT button | Send 8 with vendor/mechanic name and number").
    // Template name and exact param ORDER (name, phone, ETA) are a
    // best-effort guess, not confirmed against the real approved WhatsApp
    // Business template — same "flagged, not confirmed" pattern as every
    // other template name in this app. Fire-and-forget, same as the Reach
    // message above — a failed send never blocks the real Accept action.
    /* Template name corrected 2026-09-22 against the approved WhatsPortal
       catalogue ("Get Rescued - WhatsApp Template API", revised 16 Sep 2026).
       "dispatch_eta" does not exist in the workspace and was returning 404
       template_not_found on every send - the real approved template is #8,
       share_rescue_service_details_and_eta, the same one getRescueTicket's own
       sendRescuerEtaMessage() already uses. Two further spec rules applied:
       the template writes the literal word "Hrs" after {{3}}, so the ETA is
       converted from minutes to hours (sending 45 would otherwise read
       "45 Hrs"); and empty strings are rejected with 422 message_rejected, so
       every missing value is sent as "-" instead. */
    /* SEND 8, then SEND 9 — LOGIC-REPAIR / LOGIC-TOW: "SEND 8 with vendor/mechanic
       name and number, AND then send 9 after 5 minutes".

       SEND 9 goes out immediately rather than 5 minutes later. A widget cannot
       hold a 5-minute timer — the app is closed or the screen locked long before
       it fires, and the message would simply never arrive. Honouring the gap needs
       a scheduled Deluge function sweeping a due-time field on the ticket, which
       is new Zoho infrastructure; delivered-now beats delivered-never until that
       exists. Chained after SEND 8 so the order the customer sees is still right.

       Template 9 takes no parameters. Failures are logged, never toasted: SEND 8
       already reports its own outcome and this must not turn one failure into two
       error messages on the vendor's screen. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescue_service_details_and_eta", [MY_TECH_NAME||"-", MY_TECH_PHONE||"-", (dist&&dist.etaMins)?String(Math.round((dist.etaMins/60)*10)/10):"-"])
      .then(function(){ return sendWhatsAppTemplate(r[CONFIG.phoneField], "tell_customer_to_contact_the_call_center_before_agreeing_to_any_extra_work_or_extra_charges", []); })
      .then(function(ok9){ if(!ok9) console.warn("[GR] SEND 9 extra-charges advisory failed (non-blocking) for ticket", r.ID); })

  finally{ setDisabled("acceptBtn",false); }
}

async function markReached(){
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Arrival photo is required","err"); return; }
  setDisabled("reachedBtn",true);
  try{
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    // Reach Location + Distance_Reach_To_Breakdown (2026-08-11, user
    // request, "Missing Fields & Field Behavior" spec) — Reach never
    // captured a live GPS fix before this at all, unlike Accept
    // (RSP_Start_Latitude/Longitude) and Cancel (Cancel_Location_Lat/Lon),
    // both of which already do. Distance_Reach_To_Breakdown is a BRAND NEW
    // field, deliberately separate from Roundtrip_Distance just above —
    // that one is Office->Breakdown->Office and stays untouched; this is a
    // plain one-way distance from THIS click's own position to the
    // breakdown location, mirroring exactly how Distance_To_Breakdown
    // already works at Accept (see acceptService() above). Best-effort —
    // a denied/unavailable location just means these two fields are
    // skipped, same tolerance Accept/Cancel's own GPS fixes already have.
    // Fetched BEFORE the round-trip calc below (moved up 2026-09-07, see
    // that calc's own comment for why).
    const reachPos = await getPositionSafe();
    // Round Trip Distance (2026-09-07, user-provided LOCATIONS-DISTANCES-
    // DATETIME spec, "RSR-3(a)") — real bug fix: this used to always route
    // through the static ticket breakdown location C (r.Latitude/Longitude)
    // even though a live GPS fix (reachPos, spec's own "E" point) is taken
    // at this exact Reach click a few lines below — the fix captured E but
    // the round trip never used it. Spec defines this leg as Office->E->
    // Office, not Office->C->Office. Uses reachPos when available (matches
    // spec exactly); falls back to the static breakdown C only if GPS is
    // denied/unavailable, so Roundtrip_Distance is never simply skipped
    // the way Distance_Reach_To_Breakdown below is allowed to be.
    const rtLat = reachPos ? reachPos.lat : bLat, rtLon = reachPos ? reachPos.lon : bLon;
    const rt=await calcRoundTripKm(rtLat,rtLon,parseCoord(r.DropLocationLat),parseCoord(r.DropLocationLong),travelModeFor(r));
    // ETA (mins) manual-entry input hidden from this screen 2026-08-05 (user
    // request) — was captured automatically at Accept anyway; whatever's
    // already saved there stays as-is, simply not touched by this payload.
    const payload={ Reach_Time: fmtDateTime(new Date()), Roundtrip_Distance: rt, Status:"WORK IN PROGRESS" };
    if(reachPos){
      payload.Reach_Location_Lat=reachPos.lat; payload.Reach_Location_Lon=reachPos.lon;
      const reachDist = await calcDistanceETA(reachPos.lat,reachPos.lon,bLat,bLon,travelModeFor(r));
      if(reachDist) payload.Distance_Reach_To_Breakdown=reachDist.distanceKm;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached","ok");
    // WhatsApp "Reach Time" message (2026-09-06, RESCUE Repair Service
    // Logic Flow spec: "Mechanic/Driver app - Reach Breakdown Location
    // page | on click REACH button | Send 10"). Template name/no-params
    // shape is a best-effort guess (no visible parameter slots in the
    // spec's own template text) — same "flagged, not confirmed" pattern
    // as every template name in getRescueTicket. Fire-and-forget, after
    // the real save above — a failed send never blocks the Reach action
    // itself, matching this app's existing tolerance for GPS/photo steps.
    /* Template name corrected 2026-09-22 - "reach_time" is not in the approved
       catalogue; #10 is share_rescuer_reach_time_ WITH a trailing underscore
       (the spec flags it explicitly). Still zero parameters, as approved. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescuer_reach_time_", []);
    goToStatus("WORK IN PROGRESS");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedBtn",false); }
}
async function confirmCancel(){
  const reason=$("cancelReason").value;
  if(!reason){ toast("Please pick a cancel reason","err"); return; }
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Cancel photo is required","err"); return; }
  setDisabled("confirmCancelBtn",true);
  try{
    const r=state.current;
    // "Cancellation time" = the click itself; "cancel location" = a fresh GPS
    // fix at that moment; "RSP distance" = distance from wherever this tech
    // was at Accept time (RSP_Start_Latitude/Longitude) to right now — per the Action 6
    // flow spec (2026-07-31). Field names guessed (Cancellation_Time,
    // Cancel_Location_Lat/Lon, Cancel_Distance) — flagged, not confirmed; kept
    // distinct from Step 5's own "RSP distance" (Distance_To_Breakdown) since
    // they're computed from different start/end points, not the same value.
    const payload={ Cancel_Reason:reason, Status:"RSP CANCELLED", Cancellation_Time: fmtDateTime(new Date()) };
    const pos = await getPositionSafe();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon,travelModeFor(r)) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Distance_Cancel_To_Breakdown (2026-08-11, user request, "Missing
      // Fields & Field Behavior" spec item 2) — BRAND NEW field, deliberately
      // different from Cancel_Distance just above (Accept location -> Cancel
      // location) — this is Cancel location -> the ticket's own static
      // breakdown location, which no field/calc covered before this at all.
      const bLatC=Number(r.Latitude), bLonC=Number(r.Longitude);
      const cancelToBreakdown = !isNaN(bLatC) && !isNaN(bLonC) ? await calcDistanceETA(pos.lat,pos.lon,bLatC,bLonC,travelModeFor(r)) : null;
      if(cancelToBreakdown) payload.Distance_Cancel_To_Breakdown=cancelToBreakdown.distanceKm;
      // Client-requested addition (2026-08-04): round trip office -> this
      // technician's current (cancel-click) position -> office, using the
      // same 2-leg calcRoundTripKm() the Reach screen uses for the
      // breakdown-location case — passing pos as the "breakdown" point and no
      // drop point gives exactly office->pos->office. Written to the same
      // Roundtrip_Distance field markReached() sets, since a ticket only ever
      // reaches this via Cancel OR Reached, never both.
      payload.Roundtrip_Distance = await calcRoundTripKm(pos.lat,pos.lon,null,null,travelModeFor(r));
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not cancel","err"); }
  finally{ setDisabled("confirmCancelBtn",false); }
}

  // config): Payment_Status is the SAME field already used at the agent's
  // own Quote step for the booking fee — not a separate "Pending"/"Success"
  // field as originally guessed. Real options are PAID / PENDING / NOT
  // APPLICABLE. Was sending "Success" (rejected live) — now uses "PAID".
  // Real bug fixed 2026-09-12 — see vendorTicket's own matching comment
  // (identical bug: Payment_Status is shared with the agent's Booking Fee
  // stage, so it could already read "PAID" before this screen was ever
  // opened, bypassing the mandatory-photo gate). Payment_received is only
  // ever written by this exact confirmPaymentReceived() action.
  const alreadySuccess=r.Payment_received==="Yes";
  /* Payment Method now reflects what the ticket ALREADY holds (2026-09-25,
     user-reported live: a gateway-settled ticket still showed "Cash"). The five
     options used to be hardcoded with Cash pre-selected, so reopening this screen
     after paymentWebhook.deluge had written "Payment Gateway" showed Cash, and
     confirmPaymentReceived() then wrote that Cash straight back. That is a money
     bug, not a display one: getRescueTicket cashCollectedForTicket() deducts the
     Remaining Fee from the vendor payout whenever this field reads "Cash", so a
     mislabelled gateway payment underpays the vendor by money they never held. */
  const PAY_METHOD_OPTIONS=["Cash","UPI","Card","Net Banking","Payment Gateway"];
  const storedPayMethod=String(r.Payment_Method_Final||"").trim();
  const selectedPayMethod=PAY_METHOD_OPTIONS.indexOf(storedPayMethod)>=0?storedPayMethod:"";
  /* No method is pre-selected (2026-09-25, user request): Cash used to be the
     pre-picked option, so a vendor who never touched the dropdown recorded Cash
     whatever they were actually paid. The placeholder is disabled so it cannot
     be chosen back once a real method is picked. */
  const payMethodOptionsHtml='<option value=""'+(selectedPayMethod?'':' selected')+' disabled>— Select payment method —</option>'+PAY_METHOD_OPTIONS.map(function(m){
    return '<option value="'+m+'"'+(m===selectedPayMethod?' selected':'')+'>'+m+'</option>';
  }).join("");
  // Payment_Method_Final's real options confirmed 2026-08-03 (user's own Zoho
  // field screenshot): Cash / UPI / Card / Net Banking — replaces the
  // earlier guessed "Payment Gateway / Direct / Cash" list. None of these
  // is an automatic online gateway, so the QR/auto-pay block was removed —
  // every method required the receipt photo (or remaining<=0) before
  // "Payment Received" unlocked.
  // Restored 2026-08-06 (user request — parity with vendorTicket, which
  // already got this back 2026-08-04) — brings back the "Payment Gateway"
  // QR display. Still just a decorative placeholder — no real gateway/
  // webhook is wired up to this app, same as vendorTicket's own copy.
  $("ascreenBody").innerHTML = `
    <div class="card">
      <div class="fld"><label>Remaining Fee</label><input type="text" value="₹ ${esc(remaining)}" readonly></div>
      <div class="fld"><label>Payment Method</label>
        <select id="Payment_Method_Final">
          ${payMethodOptionsHtml}
        </select>
      </div>
      <div id="qrBlock" style="text-align:center;margin:10px 0;display:none">
        <div style="border:2px solid #111;border-radius:12px;width:120px;height:120px;margin:0 auto 8px;background:repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 8px)"></div>
        <span style="font-family:var(--f-mono);font-size:11px;color:var(--muted)">Scan to pay — status updates automatically</span>
      </div>
      <div id="receiptBlock">${photoFieldHtml("Upload_Photo_of_receipt","Receipt Photo",1,1)}</div>
      <div class="fld"><label>Payment Status</label><input type="text" id="paymentStatusDisplay" value="${alreadySuccess?"PAID":"PENDING"}" readonly></div>
    </div>
    <button class="btn ok" id="paymentReceivedBtn" type="button" disabled>Payment Received</button>`;
  wirePhotoField("Upload_Photo_of_receipt",1);
  const methodEl=$("Payment_Method_Final");
  function syncMethod(){
    const gateway=methodEl.value==="Payment Gateway";
    $("qrBlock").style.display=gateway?"":"none";
    $("receiptBlock").style.display=gateway?"none":"";
    refreshPayButton();
  }
  methodEl.onchange=syncMethod; syncMethod();
  function refreshPayButton(){
    const gateway=methodEl.value==="Payment Gateway";
    const receiptOk=effectivePhotoCount("Upload_Photo_of_receipt")>=1;
    /* The button now also waits for a method to be chosen, since nothing is
       pre-selected. alreadySuccess (the gateway already settled it) and
       remaining<=0 (nothing to collect) still bypass it exactly as before. */
    const methodChosen = PAY_METHOD_OPTIONS.indexOf(methodEl.value)>=0;
    const success = alreadySuccess || (methodChosen && !gateway && receiptOk);
    $("paymentStatusDisplay").value = success ? "PAID" : "PENDING";
    $("paymentReceivedBtn").disabled = !(remaining<=0 || success);
  }
  document.getElementById("ascreenBody").addEventListener("click", refreshPayButton);
  $("paymentReceivedBtn").onclick=confirmPaymentReceived;
}
async function confirmPaymentReceived(){
  setDisabled("paymentReceivedBtn",true);
  try{
    const r=state.current;
    // Clicking this button IS the payment attestation, so Payment_Status is
    // always written as "PAID" here (whether it got there via a receipt
    // photo or a zero balance). Transaction_ID/Time_Of_Receipt (the mock's
    // own "transaction ID, time of receipt... captured in their respective
    // fields" for a real gateway "success") are NOT set here — there's no
    // real payment-gateway integration in this app; see QUESTIONS_TO_ASK.md.
    // Remaining_Fee_Receipt_Time / RSP_Closure_Time (2026-09-07, user-
    // provided LOCATIONS-DISTANCES-DATETIME spec, "#14"/"#15") — both share
    // the exact same trigger per spec (this exact click), mirrored as two
    // separate fields per the spec's own literal numbering. This function
    // only ever runs when the technician genuinely clicks "Payment
    // Received", so no extra guard is needed — same reasoning
    // Payment_received:"Yes" above already relies on.
    /* Payment_Method_Final is deliberately NOT written back over a payment the
       gateway already settled (2026-09-25). paymentWebhook.deluge sets it to
       "Payment Gateway"; this screen has nothing to add, and writing its dropdown
       value could only ever downgrade a real gateway payment to Cash. Every other
       field is written exactly as before, so a normal cash/UPI/card close is
       unchanged. */
    const gatewaySettled=String(r.Payment_Method_Final||"").trim()==="Payment Gateway" && String(r.Payment_received||"").trim()==="Yes";
    const payload={ Payment_received:"Yes", Payment_Status:"PAID", Status:"RSP CLOSED", Remaining_Fee_Receipt_Time: fmtDateTime(new Date()), RSP_Closure_Time: fmtDateTime(new Date()) };
    const chosenMethod=($("Payment_Method_Final") && $("Payment_Method_Final").value)||"";
    if(!gatewaySettled && chosenMethod) payload.Payment_Method_Final = chosenMethod;
    // Diagnostic logging (2026-08-03) — see vendorTicket's own comment on this same call.
    console.log("[Get-Rescue] confirmPaymentReceived payload:", JSON.stringify(payload));
    // Real bug fixed 2026-09-11 — see vendorTicket's own matching comment
    // (identical fix): uploadPendingPhotos() now runs BEFORE the apiUpdate()
    // that marks the ticket Status="RSP CLOSED"/Payment_Status="PAID" — a
    // genuine photo-upload failure now blocks the close instead of the
    // ticket silently closing without its required proof-of-payment photo.
    await uploadPendingPhotos(r.ID);
    await apiUpdate(r.ID, payload);
    toast("Payment recorded — job closed","ok");
    backToDashboard();
  }catch(e){ console.error("[Get-Rescue] confirmPaymentReceived error:", e); toast((e&&e.message)||"Could not save","err"); setDisabled("paymentReceivedBtn",false); }
}

function photoFieldHtml(fieldName,label,min,max){
  return `<div class="photo-field" id="pf_${fieldName}">
    <div class="lab"><span class="l">${esc(label)}</span><span class="cnt" id="pf_${fieldName}_cnt">0 / ${min>0?("min "+min):("up to "+max)}</span></div>
    <div class="photo-grid" id="pf_${fieldName}_grid"></div>

// fileCountFor()/zohoFileDownloadUrl()/effectivePhotoCount()/
// hydrateAlreadyUploadedThumbs() (2026-08-21) — see vendorTicket's own
// matching comment for the full real-bug writeup (user-reported live:
// "vendor closes app and opens again... fields display as empty... has to
// click all photos again"). Identical port — same account/app/report.
function fileCountFor(rawValue){
  if(Array.isArray(rawValue)) return rawValue.length;
  return rawValue ? 1 : 0;
}
function zohoFileDownloadUrl(recordId, fieldName, rawValue, index){
  if(!recordId || !rawValue || rawValue===true) return null;
  const first = Array.isArray(rawValue) ? rawValue[index||0] : rawValue;
  if(!first || first===true) return null;
  const raw = (typeof first==="string") ? first
    : (first && typeof first==="object") ? (first.filepath||first.value||first.display_value||null)
    : null;
  if(!raw) return null;
  const m = raw.match(/filepath=([^&]+)/i);
  const filepath = m ? decodeURIComponent(m[1]) : raw;
  const clean = String(filepath).replace(/^\/+/,"");
  return "https://creatorapp.zoho.in/"+ZOHO_SCOPE_NAME+"/"+zohoAppLinkName()+"/report/"+CONFIG.reportName+"/"+recordId+"/"+fieldName+"/download-file?filepath=/"+encodeURIComponent(clean)+"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
function effectivePhotoCount(fieldName){
  const already=fileCountFor(state.current && state.current[fieldName]);
  const picked=(state.photos[fieldName]||[]).length;
  return already+picked;
}
function wirePhotoField(fieldName,max){
  renderPhotoGrid(fieldName,max);
}
// See vendorTicket's own matching comment.
function uploadBadgeHtml(f){
  if(state.uploadedPhotoFiles.has(f)) return '<span class="up-badge ok" title="Saved">✓</span>';
  if(state.failedPhotoFiles.has(f)) return '<span class="up-badge failed" title="Save failed — will retry when you submit">!</span>';
  return '<span class="up-badge pending" title="Saving…">⋯</span>';
}
function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){
    const idx=Number(el.dataset.alreadyIdx||0);
    const url=zohoFileDownloadUrl(state.current.ID, fieldName, rawValue, idx);
    if(!url) return;
    const img=document.createElement("img");
    img.onerror=function(){
      console.warn("[Get-Rescue] hydrateAlreadyUploadedThumbs: direct URL failed to load for", fieldName, "index", idx, "— reverting to the plain 'Saved' badge.");
      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';
    };
    img.onload=function(){
      const badge=document.createElement("span");
      badge.className="up-badge ok"; badge.title="Already saved"; badge.textContent="✓";
      el.appendChild(badge);
    };
    img.src=url;
    el.innerHTML="";
    el.appendChild(img);
  });
}
function renderPhotoGrid(fieldName,max){
  const files=state.photos[fieldName]||[];
  const grid=$("pf_"+fieldName+"_grid"); if(!grid) return;
  const alreadyRaw = state.current && state.current[fieldName];
  const alreadyCount = fileCountFor(alreadyRaw);
  let html="";
  for(let i=0;i<alreadyCount;i++){
    html += `<div class="photo-slot" data-already-field="${esc(fieldName)}" data-already-idx="${i}"><span class="up-badge ok" title="Already saved">✓ Saved</span></div>`;
  }
  files.forEach(function(f,i){
    html+=`<div class="photo-slot"><img src="${URL.createObjectURL(f)}">${uploadBadgeHtml(f)}<button type="button" class="rm" data-i="${i}">✕</button></div>`;
  });
  if((alreadyCount+files.length)<max){
    // Two explicit add tiles (2026-08-03, user-requested) — live camera
    // capture (with GPS/time watermark) and a plain gallery picker.
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addCam" title="Take Photo">📷</div>`;
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addGal" title="Choose from Gallery">🖼️</div>`;
  }
  grid.innerHTML=html;
  if(alreadyCount>0) hydrateAlreadyUploadedThumbs(fieldName, alreadyRaw);
  const addCamEl=$("pf_"+fieldName+"_addCam");
  if(addCamEl) addCamEl.onclick=function(){ openCamera(fieldName,max); };
  const addGalEl=$("pf_"+fieldName+"_addGal");
  if(addGalEl) addGalEl.onclick=function(){ openGallery(fieldName,max); };
  grid.querySelectorAll(".rm").forEach(function(btn){
    btn.onclick=function(){ files.splice(Number(btn.dataset.i),1); renderPhotoGrid(fieldName,max); };
  });
  const cntEl=$("pf_"+fieldName+"_cnt");
  const minLabel=cntEl?cntEl.textContent.split("/")[1]:"";
  if(cntEl) cntEl.textContent=(alreadyCount+files.length)+" /"+minLabel;
}
async function uploadPendingPhotos(recordId){
  for(const fieldName in state.photos){
    const files=state.photos[fieldName]||[];
    for(let i=0;i<files.length;i++){
      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading twice.
      if(state.uploadedPhotoFiles.has(files[i])) continue;
      await apiUpload(recordId, fieldName, files[i]);
    }
  }
}
// Fire-and-forget upload the moment a photo is captured/picked — see
// vendorTicket's own matching comment, not repeated here.
async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  try{ await apiUpload(r.ID, fieldName, file); state.uploadedPhotoFiles.add(file); }
  catch(e){ console.warn("[Get-Rescue] immediate upload failed for "+fieldName+" — will retry on save", e); state.failedPhotoFiles.add(file); }
  renderPhotoGrid(fieldName, max);
}

/* ---------- camera modal: capture -> canvas GPS/timestamp watermark ---------- */
let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
// maximumAge param added 2026-09-13 (user request: "In-app image capture
// lag/time is excessively high" — re-checked after the earlier 2026-09-10/
// 2026-09-12 camera-resolution fixes, which addressed the canvas/stream size
// but left the real dominant cost untouched: getPositionSafe() itself can
// block for up to 8 FULL SECONDS per call, on every single photo, since it
// always requested a brand-new GPS fix with no maximumAge at all (defaults
// to 0 — "never accept a cached position"). Defaults to 0 here too, so every
// EXISTING call site (Accept/Reach/WIP/etc., where a fresh, current-moment
// position genuinely matters) is completely unaffected — only capturePhoto()
// below now opts into a 15s cache window, since a technician taking several
// photos in quick succession during the same job hasn't meaningfully moved
// between shots; the 2nd/3rd/4th photo in a sequence can reuse the 1st
// photo's already-resolved position instead of waiting up to 8s all over
// again. Does not touch enableHighAccuracy or the 8s timeout itself — a
// genuinely cold GPS fix (first photo of a session) is unaffected either way.
function getPositionSafe(maximumAge){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03, user-reported live: "RSP_Start_Lon has
      // exceeded its maximum digits"): the browser's own GPS coordinates can
      // come back with 17 decimal places, which overflowed the Decimal
      // fields these get saved into. RSP_Start_Lat/Lon have since been
      // changed to plain Text fields and renamed RSP_Start_Latitude/
      // Longitude (2026-08-03, same day) — no digit limit applies to those
      // two anymore — but Cancel_Location_Lat/Lon is still Decimal, so this
      // rounding still matters for that pair. (RSP_Drop_Location_Lat/Lon,
      // also still Decimal, is no longer used at all as of 2026-08-04 — TOW's
      // own "Reached Drop Location" action now reuses RSP_Start_Latitude/
      // Longitude instead, same field as this Accept-time fix; see
      // driverTicket/vendorTicket's own reachedDrop().)
      // Widened to 15 decimal places that same day — rounded to match here
      // via toFixed() (not Math.round(x*1e15), which can exceed
      // Number.MAX_SAFE_INTEGER for lat/lon-sized values and silently lose
      // precision) — same approach getRescueTicket's own roundCoord() uses.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:maximumAge||0 }
    );
  });
}
async function openCamera(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  try{
    // width/height ideal constraints added 2026-09-12 — see vendorTicket's
    // own matching comment (client email: capture lag) for the full
    // reasoning. Soft `ideal` preference, matches CAPTURE_MAX_DIM below.
    cameraStream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:"environment", width:{ideal:1600}, height:{ideal:1600}}, audio:false });
    $("cameraVideo").srcObject=cameraStream;
    $("cameraModal").classList.add("on");
  }catch(e){
    toast("Camera unavailable — pick a photo instead","err");
    $("cameraFallbackInput").onchange=function(){
      const f=$("cameraFallbackInput").files[0]; if(!f) return;
      $("cameraFallbackInput").value="";
      // Compressed 2026-09-12 — see vendorTicket's own matching comment
      // (identical fix, same gap: this fallback path skipped compression
      // entirely until now).
      compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
        state.photos[fieldName]=state.photos[fieldName]||[];
        state.photos[fieldName].push(compressed);
        renderPhotoGrid(fieldName,max);
        uploadPhotoNow(fieldName,compressed,max);
      });
    };
    $("cameraFallbackInput").click();
  }
}
function openGallery(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  $("galleryInput").onchange=function(){
    const f=$("galleryInput").files[0]; if(!f) return;
    $("galleryInput").value="";
    // Compressed before it ever enters state.photos (2026-09-11) — see
    // vendorTicket's own matching compressImageFile() header comment
    // (identical function, copy-pasted here).
    compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
      state.photos[fieldName]=state.photos[fieldName]||[];
      state.photos[fieldName].push(compressed);
      renderPhotoGrid(fieldName,max);
      uploadPhotoNow(fieldName,compressed,max);
    });
  };
  $("galleryInput").click();
}
function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(function(t){ t.stop(); }); cameraStream=null; }
  $("cameraModal").classList.remove("on");
}
// capturingPhoto guard + shutter disable/feedback (2026-09-07, real bug
// fixed — confirmed live: "photo clicks are taking too much time"). Root
// cause wasn't the two camera/gallery buttons (those are intentional,
// separate features — camera vs. gallery-picker — not a duplicate, see
// renderPhotoGrid()'s own comment) but this function itself: getPositionSafe()
// can take up to 8 seconds to resolve, and until now nothing disabled the
// shutter button or showed any progress during that wait — the modal just
// sat there looking frozen, inviting repeated taps that each started a NEW
// concurrent capture (a fresh GPS request plus a duplicate photo pushed onto
// state.photos/duplicate upload). Now guarded with a simple in-flight flag
// (extra taps are ignored outright, not queued) and visible feedback (shutter
// disabled + dimmed) so the wait reads as "working," not "broken." Does not
// change the actual capture/watermark/upload logic at all — only wraps it.
let capturingPhoto=false;
// Soft-test item #14 (2026-09-10) — see vendorTicket's own matching comment
// (this exact function is copy-pasted across vendorTicket/technicianTicket/
// driverTicket — same fix applied identically to all three).
const CAPTURE_MAX_DIM = 1600;
// compressImageFile() (2026-09-11, Task Tracker: "All gallery uploads must
// be automatically compressed before transmission") — see vendorTicket's
// own matching header comment for the full reasoning (identical function,
// copy-pasted here); openGallery() above now uses this before pushing a
// gallery-picked file into state.photos.
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=function(){
        try{
          const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.naturalWidth*scale);
          canvas.height=Math.round(img.naturalHeight*scale);
          canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            resolve(blob ? new File([blob], file.name, {type:"image/jpeg"}) : file);
          }, "image/jpeg", quality);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src=url;
    }catch(e){ resolve(file); }
  });
}
async function capturePhoto(){
  if(capturingPhoto) return;
  capturingPhoto=true;
  const shutterBtn=$("cameraShutter");
  shutterBtn.disabled=true; shutterBtn.style.opacity="0.4";
  try{
    const video=$("cameraVideo");
    const nativeW=video.videoWidth||720, nativeH=video.videoHeight||960;
    const scale=Math.min(1, CAPTURE_MAX_DIM/Math.max(nativeW,nativeH));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(nativeW*scale); canvas.height=Math.round(nativeH*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // maximumAge:15000 (2026-09-13) — see getPositionSafe()'s own comment;
    // this is the specific call site that benefits from reusing a very-
    // recent GPS fix instead of always requesting a brand-new one.
    const pos=await getPositionSafe(15000);
    const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
    const lonText = pos ? pos.lon.toFixed(6) : "";
    const barH=56, pad=14;
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,canvas.height-barH,canvas.width,barH);
    ctx.fillStyle="#fff"; ctx.font="16px monospace";
    ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, canvas.height-barH+22);
    ctx.fillText(new Date().toLocaleString(), pad, canvas.height-barH+42);
    await new Promise(function(resolveBlob){
      canvas.toBlob(function(blob){
        if(!blob){ resolveBlob(); return; }
        const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
        state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
        state.photos[currentPhotoField].push(file);
        closeCamera();
        renderPhotoGrid(currentPhotoField,currentPhotoMax);
        uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
        resolveBlob();
      }, "image/jpeg", 0.85);
    });
  } finally {
    capturingPhoto=false;
    shutterBtn.disabled=false; shutterBtn.style.opacity="";
  }
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

/* ---------- online/offline toggle (folded in from toggleGetRescue) ---------- */
let currentTechRecord=null;
function lockAvailabilityToggle(){
  const el=$("availToggle"); if(!el) return;
  el.classList.add("locked");
  el.title="Availability unavailable — no matching "+CONFIG.techReport+" record found for your login.";
}
// Extracted 2026-08-24 (see onToggleClick()'s own retry call below) — same
// "boot-time match can go stale/never land, retry the real query once
// before giving up" fix already shipped for vendorTicket's own
// resolveVendorRecord() (2026-08-19) and updateMyInvite() (2026-08-21).
// User-reported live: "online/offline toggle is not working" — the most
// likely explanation, given every other identity-resolution bug found this
// session, is that currentTechRecord simply never resolved at boot time (a
// slow connection, a login-email mismatch, etc.), leaving onToggleClick()'s
// own `if(!currentTechRecord) return;` guard silently doing nothing at all
// — no error, no toast — which reads exactly like "not working." Bumped
// 200->1000 records too, same reasoning as vendorTicket's own
// resolveVendorRecord() fix (rules out Technicians_Report simply exceeding
// the old cap).
async function resolveTechRecord(logContext){
  if(!LOGIN_EMAIL) return currentTechRecord;
  const recs=await apiGetReport(CONFIG.techReport, null, 1000);
  const mine=recs.find(function(r){ return String(r[CONFIG.techEmailField]||"").trim().toLowerCase()===LOGIN_EMAIL.trim().toLowerCase(); });
  if(mine){
    currentTechRecord={ id:mine.ID, data:mine };
    MY_TECH_NAME=mine[CONFIG.techNameField]||"";
    MY_TECH_PHONE=mine[CONFIG.techPhoneField]||"";
    $("techName").textContent=MY_TECH_NAME||"Technician";
  } else {
    console.warn("[Get-Rescue] "+logContext+": no", CONFIG.techReport, "record's", CONFIG.techEmailField, "matched", LOGIN_EMAIL, "— toggle stays locked/inert. Records loaded:", recs.length, "| first record's own keys:", recs[0]);
  }
  return currentTechRecord;
}
async function loadAvailability(){
  if(!LOGIN_EMAIL){ console.warn("[Get-Rescue] loadAvailability: LOGIN_EMAIL is empty — getInitParams may have failed or returned no loginUser. Toggle stays locked."); lockAvailabilityToggle(); return; }
  // Real bug fixed (2026-08-05, user-reported: "online offline toggle is not
  // working"): fetched with a server-side exact-match criteria on
  // techEmailField — Zoho Creator criteria matches are case-sensitive, and a
  // login email differing only in case from the Technicians_Report record
  // would silently return zero records, leaving currentTechRecord null and
  // the toggle clickable-but-inert (onToggleClick's own guard). Also breaks
  // the ID-based loadMyInvites() matching above, since it needs
  // currentTechRecord to resolve at all. Now matches client-side,
  // case-insensitive + trimmed — see resolveTechRecord() above.
  await resolveTechRecord("loadAvailability");
  if(!currentTechRecord){ lockAvailabilityToggle(); return; }
  const mine=currentTechRecord.data;
  const isOnline=String(mine[CONFIG.techStatusField])==="Online";
  $("availToggle").classList.toggle("on", isOnline);
  // Reopening the app while already Online (2026-08-17) — start the
  // heartbeat here too, not just from onToggleClick()'s own toggle action,
  // so location stays fresh across a page refresh/reopen without the
  // technician having to toggle off and back on.
  if(isOnline) startLocationHeartbeat();
}
/* Live location heartbeat (2026-08-17, user request: "when vendor is online
   it is supposed to show the distance from the vendor's current location
   (latest location from app); ... this applies to Technicians/Drivers too,
   not just Vendors") — while toggled Online, refreshes this technician's own
   Current_Latitude/Current_Longitude every ~2.5 minutes (the midpoint of the
   user's own requested 2-3 min range), read by getRescueTicket's own
   Assignment-step vendor picker once Online — see vendorTicket's own matching
   comment for the fuller cross-widget picture. An immediate fix is taken the
   moment they toggle online, rather than waiting for the first interval
   tick — see startLocationHeartbeat(). Best-effort throughout: a denied/
   unavailable fix, or a failed write, just silently skips that one tick —
   never blocks the toggle itself or any other part of this app. */
const LOCATION_HEARTBEAT_MS=150000; // 2.5 min
let locationHeartbeatTimer=null;
async function pingCurrentLocation(){
  if(!currentTechRecord) return;
  try{
    const pos=await getPositionSafe();
    if(!pos) return;
    const fn=resolve("updateRecordById"); if(!fn) return;
    const payload={};
    payload[CONFIG.techCurrentLatField]=pos.lat;
    payload[CONFIG.techCurrentLonField]=pos.lon;
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
  }catch(e){ console.warn("[Get-Rescue] pingCurrentLocation failed (non-fatal, retries next tick):", e); }
}
function startLocationHeartbeat(){
  stopLocationHeartbeat(); // never let two timers stack
  pingCurrentLocation(); // immediate fix now, don't wait for the first interval tick
  locationHeartbeatTimer=setInterval(pingCurrentLocation, LOCATION_HEARTBEAT_MS);
}
function stopLocationHeartbeat(){ if(locationHeartbeatTimer){ clearInterval(locationHeartbeatTimer); locationHeartbeatTimer=null; } }
async function onToggleClick(){
  if(!currentTechRecord){
    // Real bug fixed 2026-08-24 (user-reported live: "online/offline toggle
    // is not working") — this used to just silently return here with zero
    // feedback whenever currentTechRecord hadn't resolved, which reads
    // exactly like a dead button. Retries the real match once (see
    // resolveTechRecord()'s own comment) before finally telling the
    // technician clearly why, instead of doing nothing.
    console.warn("[Get-Rescue] onToggleClick: currentTechRecord was null at tap time; retrying the "+CONFIG.techReport+" match once before giving up.");
    await resolveTechRecord("onToggleClick retry");
  }
  if(!currentTechRecord){ toast("Availability unavailable — no matching technician record found for your login","err"); return; }
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.techStatusField]=wantOnline?"Online":"Offline";
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
    if(wantOnline) startLocationHeartbeat(); else stopLocationHeartbeat();
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

/* ---------- date formatting (same 24h format getRescueTicket uses for
   generic datetime fields) ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

/* ---------- wiring + boot ---------- */
$("backBtn").onclick=backToDashboard;
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
    INIT_PARAMS=params; // zohoAppLinkName()'s own envUrlFragment lookup
  }catch(e){ console.warn("getInitParams failed", e); }
  await loadAvailability();
  await loadVehicleNames();
  await loadIssueNames();
  await loadDashboard();
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
