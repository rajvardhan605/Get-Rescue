// fileCountFor()/zohoFileDownloadUrl()/effectivePhotoCount()/
// hydrateAlreadyUploadedThumbs() (2026-08-21) — see vendorTicket's own
// matching comment for the full real-bug writeup (user-reported live:
// "vendor closes app and opens again... fields display as empty... has to
// click all photos again"). Identical port — same account/app/report.
function fileCountFor(rawValue){
  if(Array.isArray(rawValue)) return rawValue.length;
  return rawValue ? 1 : 0;
}
function zohoFileDownloadUrl(recordId, fieldName, rawValue, index){
  if(!recordId || !rawValue || rawValue===true) return null;
  const first = Array.isArray(rawValue) ? rawValue[index||0] : rawValue;
  if(!first || first===true) return null;
  const raw = (typeof first==="string") ? first
    : (first && typeof first==="object") ? (first.filepath||first.value||first.display_value||null)
    : null;
  if(!raw) return null;
  const m = raw.match(/filepath=([^&]+)/i);
  const filepath = m ? decodeURIComponent(m[1]) : raw;
  const clean = String(filepath).replace(/^\/+/,"");
  return "https://creatorapp.zoho.in/"+ZOHO_SCOPE_NAME+"/"+zohoAppLinkName()+"/report/"+CONFIG.reportName+"/"+recordId+"/"+fieldName+"/download-file?filepath=/"+encodeURIComponent(clean)+"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
function effectivePhotoCount(fieldName){
  const already=fileCountFor(state.current && state.current[fieldName]);
  const picked=(state.photos[fieldName]||[]).length;
  return already+picked;
}
function wirePhotoField(fieldName,max){
  renderPhotoGrid(fieldName,max);
}
// See vendorTicket's own matching comment.
function uploadBadgeHtml(f){
  if(state.uploadedPhotoFiles.has(f)) return '<span class="up-badge ok" title="Saved">✓</span>';
  if(state.failedPhotoFiles.has(f)) return '<span class="up-badge failed" title="Save failed — will retry when you submit">!</span>';
  return '<span class="up-badge pending" title="Saving…">⋯</span>';
}
function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){
    const idx=Number(el.dataset.alreadyIdx||0);
    const url=zohoFileDownloadUrl(state.current.ID, fieldName, rawValue, idx);
    if(!url) return;
    const img=document.createElement("img");
    // The remove button is part of the tile and must survive the thumbnail
     // swap below, which replaces the tile's whole innerHTML (2026-10-05).
    const keepRm=el.querySelector(".rm");
    const restoreRm=function(){ if(keepRm) el.appendChild(keepRm); };
    img.onerror=function(){
      console.warn("[Get-Rescue] hydrateAlreadyUploadedThumbs: direct URL failed to load for", fieldName, "index", idx, "— reverting to the plain 'Saved' badge.");
      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';
      restoreRm();
    };
    img.onload=function(){
      const badge=document.createElement("span");
      badge.className="up-badge ok"; badge.title="Already saved"; badge.textContent="✓";
      el.appendChild(badge);
    };
    img.src=url;
    el.innerHTML="";
    el.appendChild(img);
    restoreRm();
  });
}
/* See this file's photo-delete notes — deletion is only offered where the
   resulting field contents can actually be rebuilt. */
function photoDeleteAllowed(fieldName, max){
  if(Number(max)===1) return true;
  return fileCountFor(state.current && state.current[fieldName])===0;
}
function photoRmBtnHtml(kind, idx, allowed){
  if(!allowed) return "";
  return '<button type="button" class="rm" data-kind="'+kind+'" data-i="'+idx+'" title="Remove this photo">✕</button>';
}
/* Removes a photo from the ticket for real.

   Order matters: the field is blanked FIRST and the keepers re-uploaded after.
   The reverse (upload then blank) would delete what was just written. A keeper
   whose re-upload fails goes onto the offline queue exactly like any other
   failed upload, so it is retried rather than lost — the queue is why this is
   safe to do at all.

   Queued rows for this field are purged too. Without that, flushPhotoQueue()
   would happily re-upload the very photo the vendor just deleted. */
async function deletePhotoAt(fieldName, max, kind, index){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  if(!photoDeleteAllowed(fieldName, max)){
    toast("This photo was saved earlier and can't be removed here — ask an agent to clear it on the ticket","err");
    return;
  }
  let go=true;
  try{ if(typeof confirm==="function") go=confirm("Remove this photo from the ticket?"); }
  catch(e){ go=true; } // a WebView that blocks confirm() must not block the action
  if(!go) return;

  const sessionFiles=(state.photos[fieldName]||[]).slice();
  const removedFile=(kind==="session") ? sessionFiles[index] : null;
  const keepers=sessionFiles.filter(function(f,i){ return !(kind==="session" && i===index); });

  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[Get-Rescue] deletePhotoAt: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photo — nothing was changed","err");
    return;
  }

  // The record no longer holds anything for this field.
  state.current[fieldName]="";
  state.photos[fieldName]=keepers;
  if(removedFile){ state.uploadedPhotoFiles.delete(removedFile); state.failedPhotoFiles.delete(removedFile); }

  // Stop a queued copy resurrecting any of this field's photos.
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[Get-Rescue] deletePhotoAt: could not purge the offline queue for "+fieldName, e); }

  // Put the keepers back.
  for(const f of keepers){
    state.uploadedPhotoFiles.delete(f);
    let ok=false;
    try{ ok=await apiUpload(r.ID, fieldName, f); }catch(e){ ok=false; }
    if(ok) state.uploadedPhotoFiles.add(f);
    else{
      state.failedPhotoFiles.add(f);
      await queuePhotoOffline(r.ID, fieldName, f);
      PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
      renderPhotoQueueNote();
    }
  }
  renderPhotoGrid(fieldName,max);
  toast("Photo removed","ok");
}
function renderPhotoGrid(fieldName,max){
  const files=state.photos[fieldName]||[];
  const grid=$("pf_"+fieldName+"_grid"); if(!grid) return;
  const alreadyRaw = state.current && state.current[fieldName];
  const alreadyCount = fileCountFor(alreadyRaw);
  let html="";
  const rmAllowed=photoDeleteAllowed(fieldName, max);
  for(let i=0;i<alreadyCount;i++){
    // ✕ on an already-saved photo — 2026-10-05, client item 21. Only offered
    // where photoDeleteAllowed() says the end state is rebuildable.
    html += `<div class="photo-slot" data-already-field="${esc(fieldName)}" data-already-idx="${i}"><span class="up-badge ok" title="Already saved">✓ Saved</span>${photoRmBtnHtml("saved",i,rmAllowed)}</div>`;
  }
  files.forEach(function(f,i){
    html+=`<div class="photo-slot"><img src="${URL.createObjectURL(f)}">${uploadBadgeHtml(f)}${photoRmBtnHtml("session",i,true)}</div>`;
  });
  if((alreadyCount+files.length)<max){
    // Was TWO add tiles (2026-08-03) — live in-app camera capture and a
    // gallery picker. The camera tile is HIDDEN as of 2026-09-28 (user
    // request: the field apps should offer the file option only).
    //
    // Removed from the RENDER only — openCamera() itself is deliberately
    // left in place and untouched, so restoring the tile is putting this
    // one line back. Its click-wiring below is already null-guarded
    // ($("...addCam") simply returns null now), so nothing else changes.
    //
    // KNOWN CONSEQUENCE, not an oversight: the in-app camera was the only
    // path that stamped a GPS + timestamp watermark onto the photo
    // (shootPhoto()); the gallery picker only compresses. Vendors can
    // still TAKE a photo — galleryInput carries no `capture` attribute, so
    // the OS sheet still offers Camera next to Files — but photos arriving
    // this way have no watermark. Applied to vendorTicket, technicianTicket
    // and driverTicket together — all three field apps behave identically.
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addGal" title="Choose a File">🖼️</div>`;
  }
  grid.innerHTML=html;
  if(alreadyCount>0) hydrateAlreadyUploadedThumbs(fieldName, alreadyRaw);
  const addCamEl=$("pf_"+fieldName+"_addCam");
  if(addCamEl) addCamEl.onclick=function(){ openCamera(fieldName,max); };
  const addGalEl=$("pf_"+fieldName+"_addGal");
  if(addGalEl) addGalEl.onclick=function(){ openGallery(fieldName,max); };
  grid.querySelectorAll(".rm").forEach(function(btn){
    // Was files.splice() alone — which only ever removed the TILE, while the
    // photo stayed on the ticket because uploadPhotoNow() had already sent it.
    btn.onclick=function(){
      btn.disabled=true;
      deletePhotoAt(fieldName, max, btn.dataset.kind||"session", Number(btn.dataset.i))
        .catch(function(e){ console.warn("[Get-Rescue] deletePhotoAt threw", e); toast("Couldn't remove the photo","err"); })
        .then(function(){ if(btn) btn.disabled=false; });
    };
  });
  const cntEl=$("pf_"+fieldName+"_cnt");
  const minLabel=cntEl?cntEl.textContent.split("/")[1]:"";
  if(cntEl) cntEl.textContent=(alreadyCount+files.length)+" /"+minLabel;
}
async function uploadPendingPhotos(recordId){
  for(const fieldName in state.photos){
    const files=state.photos[fieldName]||[];
    for(let i=0;i<files.length;i++){
      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading twice.
      if(state.uploadedPhotoFiles.has(files[i])) continue;
      // Same return-value fix as uploadPhotoNow(): a save-time failure used to
      // be discarded silently here too.
      const saved=await apiUpload(recordId, fieldName, files[i]);
      if(saved) state.uploadedPhotoFiles.add(files[i]);
      else await queuePhotoOffline(recordId, fieldName, files[i]);
    }
  }
}
// Fire-and-forget upload the moment a photo is captured/picked — see
// vendorTicket's own matching comment, not repeated here.
/* ============================================================================
   OFFLINE PHOTO QUEUE — 2026-09-30
   Client list item: "Ability to save photos and data when offline — currently
   photos and data not stored temporarily when app does not have internet".

   A REAL BUG WAS FOUND WHILE BUILDING THIS, and it is the larger half of the
   problem. apiUpload() RETURNS false on failure, it does not throw. So
   uploadPhotoNow()'s catch never fired, the failed file was added to
   uploadedPhotoFiles as though it had succeeded, uploadPendingPhotos() then
   SKIPPED it at save time, and the "!" badge never appeared. A photo lost to a
   two-second signal drop vanished silently, with the grid showing a cheerful
   tick. That is fixed below by honouring the return value — and it matters even
   for a vendor who is never fully offline.

   SCOPE, stated plainly: this is "never lose a photo", not "run the whole app
   offline". Photos that fail to upload are kept in IndexedDB and retried until
   they land. Browsing tickets, changing status and closing a job still need a
   connection. Full offline operation would need an action queue and conflict
   resolution for status transitions — a different and much larger piece of work,
   and not what the client's wording asks for.

   IndexedDB rather than localStorage: these are JPEGs, and localStorage is a
   ~5MB string store that would need base64 (a 33% size penalty) on top. Every
   entry point degrades to today's behaviour if IndexedDB is unavailable — a
   WebView that blocks it loses nothing it would not have lost anyway.
   ========================================================================= */
const PHOTO_DB_NAME="gr_technician_photo_queue", PHOTO_STORE="pending";
let PHOTO_DB_PROMISE=null, PHOTO_FLUSH_RUNNING=false, PHOTO_QUEUE_COUNT=0;
/* Resolves to null rather than rejecting on every failure path, so no caller
   ever needs a try/catch around storage being absent. */
function photoDb(){
  if(PHOTO_DB_PROMISE) return PHOTO_DB_PROMISE;
  PHOTO_DB_PROMISE=new Promise(function(resolve){
    try{
      if(!window.indexedDB){ console.warn("[Get-Rescue] IndexedDB unavailable — photos cannot be queued offline."); resolve(null); return; }
      const req=window.indexedDB.open(PHOTO_DB_NAME,1);
      req.onupgradeneeded=function(){
        const db=req.result;
        if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE,{keyPath:"key",autoIncrement:true});
      };
      req.onsuccess=function(){ resolve(req.result); };
      req.onerror=function(){ console.warn("[Get-Rescue] could not open the photo queue database", req.error); resolve(null); };
    }catch(e){ console.warn("[Get-Rescue] IndexedDB threw on open", e); resolve(null); }
  });
  return PHOTO_DB_PROMISE;
}
function photoTx(db, mode){ return db.transaction(PHOTO_STORE, mode).objectStore(PHOTO_STORE); }
function photoQueueAll(){
  return photoDb().then(function(db){
    if(!db) return [];
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readonly").getAll();
        req.onsuccess=function(){ resolve(req.result||[]); };
        req.onerror=function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  });
}
function photoQueueDelete(key){
  return photoDb().then(function(db){
    if(!db) return;
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readwrite").delete(key); req.onsuccess=function(){ resolve(); }; req.onerror=function(){ resolve(); }; }
      catch(e){ resolve(); }
    });
  });
}
/* Stores the File itself. Name and type are kept alongside because a Blob read
   back out of IndexedDB can lose them, and uploadFile needs a real File. */
function queuePhotoOffline(ticketId, fieldName, file){
  return photoDb().then(function(db){
    if(!db || !file) return false;
    return new Promise(function(resolve){
      try{
        const req=photoTx(db,"readwrite").put({
          ticketId:String(ticketId), fieldName:fieldName,
          name:(file.name||"photo.jpg"), type:(file.type||"image/jpeg"),
          blob:file, addedAt:Date.now(), tries:0
        });
        req.onsuccess=function(){
          console.log("[Get-Rescue] photo queued for later upload —", fieldName, "on ticket", ticketId);
          resolve(true);
        };
        req.onerror=function(){ console.warn("[Get-Rescue] could not queue the photo", req.error); resolve(false); };
      }catch(e){ console.warn("[Get-Rescue] queuePhotoOffline threw", e); resolve(false); }
    });
  });
}
/* Retries everything queued. A row is deleted ONLY on a confirmed success —
   never on failure, which is the whole point: a photo that cannot upload yet
   must still be there after the app is closed and reopened. `tries` is recorded
   for diagnosis, deliberately without a cap that discards anything. */
async function flushPhotoQueue(){
  if(PHOTO_FLUSH_RUNNING) return;
  PHOTO_FLUSH_RUNNING=true;
  try{
    const items=await photoQueueAll();
    PHOTO_QUEUE_COUNT=items.length;
    if(!items.length){ renderPhotoQueueNote(); return; }
    if(typeof navigator!=="undefined" && navigator.onLine===false){
      console.log("[Get-Rescue] photo queue:", items.length, "waiting — still offline, not retrying.");
      renderPhotoQueueNote(); return;
    }
    let sent=0;
    for(const it of items){
      let file=it.blob;
      // A Blob read back from IndexedDB is not always a File any more; uploadFile
      // needs a name, so rebuild one when necessary.
      try{ if(!(file instanceof File)) file=new File([it.blob], it.name||"photo.jpg", {type:it.type||"image/jpeg"}); }
      catch(e){ /* File constructor unavailable — send the Blob as-is */ }
      const ok=await apiUpload(it.ticketId, it.fieldName, file);
      if(ok){ await photoQueueDelete(it.key); sent++; }
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    if(sent) console.log("[Get-Rescue] photo queue: uploaded", sent, "—", PHOTO_QUEUE_COUNT, "still waiting.");
    if(sent && typeof toast==="function") toast(sent+" saved photo"+(sent===1?"":"s")+" uploaded","ok");
    renderPhotoQueueNote();
  }catch(e){
    console.warn("[Get-Rescue] flushPhotoQueue failed (non-blocking)", e);
  }finally{
    PHOTO_FLUSH_RUNNING=false;
  }
}
/* One muted line under the ticket list, and only when something is actually
   waiting. Appended to the existing list rather than added to the markup, so no
   layout changes and nothing to clean up when the queue empties. */
function renderPhotoQueueNote(){
  const host=$("ticketList"); if(!host) return;
  const old=document.getElementById("photoQueueNote"); if(old) old.remove();
  if(!PHOTO_QUEUE_COUNT) return;
  const n=document.createElement("div");
  n.id="photoQueueNote";
  n.style.cssText="margin:10px 2px 0;font-family:var(--f-mono);font-size:10.5px;line-height:1.5;color:var(--muted)";
  n.textContent=PHOTO_QUEUE_COUNT+" photo"+(PHOTO_QUEUE_COUNT===1?"":"s")+" saved on this phone, waiting for signal \u2014 they upload on their own once you are back online.";
  host.appendChild(n);
}
async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  /* apiUpload() returns false on failure and does NOT throw, so the old
     try/catch here never fired and every failed upload was recorded as a
     success. Checking the return value is what makes the "!" badge and the
     save-time retry work at all. */
  let ok=false;
  try{ ok=await apiUpload(r.ID, fieldName, file); }
  catch(e){ ok=false; console.warn("[Get-Rescue] immediate upload threw for "+fieldName, e); }
  if(ok){ state.uploadedPhotoFiles.add(file); }
  else{
    state.failedPhotoFiles.add(file);
    // Kept on the device so it survives the app being closed — see the queue's
    // own header. Awaited so the badge below reflects the real queue length.
    await queuePhotoOffline(r.ID, fieldName, file);
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }
  renderPhotoGrid(fieldName, max); // refresh this slot's badge either way
}

/* ---------- camera modal: capture -> canvas GPS/timestamp watermark ---------- */
let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
// maximumAge param added 2026-09-13 (user request: "In-app image capture
// lag/time is excessively high" — re-checked after the earlier 2026-09-10/
// 2026-09-12 camera-resolution fixes, which addressed the canvas/stream size
// but left the real dominant cost untouched: getPositionSafe() itself can
// block for up to 8 FULL SECONDS per call, on every single photo, since it
// always requested a brand-new GPS fix with no maximumAge at all (defaults
// to 0 — "never accept a cached position"). Defaults to 0 here too, so every
// EXISTING call site (Accept/Reach/WIP/etc., where a fresh, current-moment
// position genuinely matters) is completely unaffected — only capturePhoto()
// below now opts into a 15s cache window, since a technician taking several
// photos in quick succession during the same job hasn't meaningfully moved
// between shots; the 2nd/3rd/4th photo in a sequence can reuse the 1st
// photo's already-resolved position instead of waiting up to 8s all over
// again. Does not touch enableHighAccuracy or the 8s timeout itself — a
// genuinely cold GPS fix (first photo of a session) is unaffected either way.
function getPositionSafe(maximumAge){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03, user-reported live: "RSP_Start_Lon has
      // exceeded its maximum digits"): the browser's own GPS coordinates can
      // come back with 17 decimal places, which overflowed the Decimal
      // fields these get saved into. RSP_Start_Lat/Lon have since been
      // changed to plain Text fields and renamed RSP_Start_Latitude/
      // Longitude (2026-08-03, same day) — no digit limit applies to those
      // two anymore — but Cancel_Location_Lat/Lon is still Decimal, so this
      // rounding still matters for that pair. (RSP_Drop_Location_Lat/Lon,
      // also still Decimal, is no longer used at all as of 2026-08-04 — TOW's
      // own "Reached Drop Location" action now reuses RSP_Start_Latitude/
      // Longitude instead, same field as this Accept-time fix; see
      // driverTicket/vendorTicket's own reachedDrop().)
      // Widened to 15 decimal places that same day — rounded to match here
      // via toFixed() (not Math.round(x*1e15), which can exceed
      // Number.MAX_SAFE_INTEGER for lat/lon-sized values and silently lose
      // precision) — same approach getRescueTicket's own roundCoord() uses.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:maximumAge||0 }
    );
  });
}
async function openCamera(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  try{
    // width/height ideal constraints added 2026-09-12 — see vendorTicket's
    // own matching comment (client email: capture lag) for the full
    // reasoning. Soft `ideal` preference, matches CAPTURE_MAX_DIM below.
    cameraStream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:"environment", width:{ideal:1600}, height:{ideal:1600}}, audio:false });
    $("cameraVideo").srcObject=cameraStream;
    $("cameraModal").classList.add("on");
  }catch(e){
    toast("Camera unavailable — pick a photo instead","err");
    $("cameraFallbackInput").onchange=function(){
      const f=$("cameraFallbackInput").files[0]; if(!f) return;
      $("cameraFallbackInput").value="";
      // Compressed 2026-09-12 — see vendorTicket's own matching comment
      // (identical fix, same gap: this fallback path skipped compression
      // entirely until now).
      compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
        state.photos[fieldName]=state.photos[fieldName]||[];
        state.photos[fieldName].push(compressed);
        renderPhotoGrid(fieldName,max);
        uploadPhotoNow(fieldName,compressed,max);
      });
    };
    $("cameraFallbackInput").click();
  }
}
function openGallery(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  $("galleryInput").onchange=function(){
    const f=$("galleryInput").files[0]; if(!f) return;
    $("galleryInput").value="";
    // Compressed before it ever enters state.photos (2026-09-11) — see
    // vendorTicket's own matching compressImageFile() header comment
    // (identical function, copy-pasted here).
    compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
      state.photos[fieldName]=state.photos[fieldName]||[];
      state.photos[fieldName].push(compressed);
      renderPhotoGrid(fieldName,max);
      uploadPhotoNow(fieldName,compressed,max);
    });
  };
  $("galleryInput").click();
}
function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(function(t){ t.stop(); }); cameraStream=null; }
  $("cameraModal").classList.remove("on");
}
// capturingPhoto guard + shutter disable/feedback (2026-09-07, real bug
// fixed — confirmed live: "photo clicks are taking too much time"). Root
// cause wasn't the two camera/gallery buttons (those are intentional,
// separate features — camera vs. gallery-picker — not a duplicate, see
// renderPhotoGrid()'s own comment) but this function itself: getPositionSafe()
// can take up to 8 seconds to resolve, and until now nothing disabled the
// shutter button or showed any progress during that wait — the modal just
// sat there looking frozen, inviting repeated taps that each started a NEW
// concurrent capture (a fresh GPS request plus a duplicate photo pushed onto
// state.photos/duplicate upload). Now guarded with a simple in-flight flag
// (extra taps are ignored outright, not queued) and visible feedback (shutter
// disabled + dimmed) so the wait reads as "working," not "broken." Does not
// change the actual capture/watermark/upload logic at all — only wraps it.
let capturingPhoto=false;
// Soft-test item #14 (2026-09-10) — see vendorTicket's own matching comment
// (this exact function is copy-pasted across vendorTicket/technicianTicket/
// driverTicket — same fix applied identically to all three).
const CAPTURE_MAX_DIM = 1600;
// compressImageFile() (2026-09-11, Task Tracker: "All gallery uploads must
// be automatically compressed before transmission") — see vendorTicket's
// own matching header comment for the full reasoning (identical function,
// copy-pasted here); openGallery() above now uses this before pushing a
// gallery-picked file into state.photos.
/* Burns the capture time and GPS into the bottom of a photo — extracted from
   capturePhoto() on 2026-10-05 so the file-picker path stamps identically.

   Sizing is proportional now, where the camera had it fixed at 56px/16px. On
   a 1600px photo that bar was about 3% of the height and effectively
   unreadable once the image was opened full-size, which defeats the point of
   a proof-of-service stamp. The floors are the old fixed numbers, so a small
   image renders exactly as it did before.

   Never throws: a stamp failing must cost the caption, not the photograph. */
function drawPhotoStamp(ctx, w, h, pos){
  try{
    const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
    const lonText = pos ? pos.lon.toFixed(6) : "";
    const barH = Math.max(56, Math.round(h*0.075));
    const pad  = Math.max(14, Math.round(barH*0.25));
    const font = Math.max(16, Math.round(barH*0.28)); // 0.28 so a 56px bar lands on exactly 16px, the camera figure
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0, h-barH, w, barH);
    ctx.fillStyle="#fff";
    ctx.font=font+"px monospace";
    ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, h-barH+Math.round(barH*0.40));
    ctx.fillText(new Date().toLocaleString(), pad, h-barH+Math.round(barH*0.75));
  }catch(e){ console.warn("[photo stamp] could not draw the stamp (photo itself is unaffected)", e); }
}
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=async function(){
        try{
          const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.naturalWidth*scale);
          canvas.height=Math.round(img.naturalHeight*scale);
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          /* THE FIX — 2026-10-05. Every photo that reaches Zoho now carries the
             same stamp the in-app camera has always drawn. getPositionSafe's 15s
             cache is reused deliberately: a vendor picking several photos for one
             job has not meaningfully moved between them, and it avoids a fresh
             8s GPS wait per photo. A denied or unavailable fix still stamps the
             time and prints "GPS unavailable" rather than silently stamping
             nothing — an unstamped photo is exactly what was reported. */
          let stampPos=null;
          try{ stampPos=await getPositionSafe(15000); }catch(e){ stampPos=null; }
          drawPhotoStamp(ctx, canvas.width, canvas.height, stampPos);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            resolve(blob ? new File([blob], file.name, {type:"image/jpeg"}) : file);
          }, "image/jpeg", quality);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src=url;
    }catch(e){ resolve(file); }
  });
}
async function capturePhoto(){
  if(capturingPhoto) return;
  capturingPhoto=true;
  const shutterBtn=$("cameraShutter");
  shutterBtn.disabled=true; shutterBtn.style.opacity="0.4";
  try{
    const video=$("cameraVideo");
    const nativeW=video.videoWidth||720, nativeH=video.videoHeight||960;
    const scale=Math.min(1, CAPTURE_MAX_DIM/Math.max(nativeW,nativeH));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(nativeW*scale); canvas.height=Math.round(nativeH*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // maximumAge:15000 (2026-09-13) — see getPositionSafe()'s own comment;
    // this is the specific call site that benefits from reusing a very-
    // recent GPS fix instead of always requesting a brand-new one.
    const pos=await getPositionSafe(15000);
    // Shared with the file-picker path since 2026-10-05 — see drawPhotoStamp().
    drawPhotoStamp(ctx, canvas.width, canvas.height, pos);
    await new Promise(function(resolveBlob){
      canvas.toBlob(function(blob){
        if(!blob){ resolveBlob(); return; }
        const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
        state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
        state.photos[currentPhotoField].push(file);
        closeCamera();
        renderPhotoGrid(currentPhotoField,currentPhotoMax);
        uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
        resolveBlob();
      }, "image/jpeg", 0.85);
    });
  } finally {
    capturingPhoto=false;
    shutterBtn.disabled=false; shutterBtn.style.opacity="";
  }
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

/* ---------- online/offline toggle (folded in from toggleGetRescue) ---------- */
let currentTechRecord=null;
function lockAvailabilityToggle(){
  const el=$("availToggle"); if(!el) return;
  el.classList.add("locked");
  el.title="Availability unavailable — no matching "+CONFIG.techReport+" record found for your login.";
}
// Extracted 2026-08-24 (see onToggleClick()'s own retry call below) — same
// "boot-time match can go stale/never land, retry the real query once
// before giving up" fix already shipped for vendorTicket's own
// resolveVendorRecord() (2026-08-19) and updateMyInvite() (2026-08-21).
// User-reported live: "online/offline toggle is not working" — the most
// likely explanation, given every other identity-resolution bug found this
// session, is that currentTechRecord simply never resolved at boot time (a
// slow connection, a login-email mismatch, etc.), leaving onToggleClick()'s
// own `if(!currentTechRecord) return;` guard silently doing nothing at all
// — no error, no toast — which reads exactly like "not working." Bumped
// 200->1000 records too, same reasoning as vendorTicket's own
// resolveVendorRecord() fix (rules out Technicians_Report simply exceeding
// the old cap).
async function resolveTechRecord(logContext){
  if(!LOGIN_EMAIL) return currentTechRecord;
  const recs=await apiGetReport(CONFIG.techReport, null, 1000);
  const mine=recs.find(function(r){ return String(r[CONFIG.techEmailField]||"").trim().toLowerCase()===LOGIN_EMAIL.trim().toLowerCase(); });
  if(mine){
    currentTechRecord={ id:mine.ID, data:mine };
    MY_TECH_NAME=mine[CONFIG.techNameField]||"";
    MY_TECH_PHONE=mine[CONFIG.techPhoneField]||"";
    $("techName").textContent=MY_TECH_NAME||"Technician";
  } else {
    console.warn("[Get-Rescue] "+logContext+": no", CONFIG.techReport, "record's", CONFIG.techEmailField, "matched", LOGIN_EMAIL, "— toggle stays locked/inert. Records loaded:", recs.length, "| first record's own keys:", recs[0]);
  }
  return currentTechRecord;
}
async function loadAvailability(){
  if(!LOGIN_EMAIL){ console.warn("[Get-Rescue] loadAvailability: LOGIN_EMAIL is empty — getInitParams may have failed or returned no loginUser. Toggle stays locked."); lockAvailabilityToggle(); return; }
  // Real bug fixed (2026-08-05, user-reported: "online offline toggle is not
  // working"): fetched with a server-side exact-match criteria on
  // techEmailField — Zoho Creator criteria matches are case-sensitive, and a
  // login email differing only in case from the Technicians_Report record
  // would silently return zero records, leaving currentTechRecord null and
  // the toggle clickable-but-inert (onToggleClick's own guard). Also breaks
  // the ID-based loadMyInvites() matching above, since it needs
  // currentTechRecord to resolve at all. Now matches client-side,
  // case-insensitive + trimmed — see resolveTechRecord() above.
  await resolveTechRecord("loadAvailability");
  if(!currentTechRecord){ lockAvailabilityToggle(); return; }
  const mine=currentTechRecord.data;
  const isOnline=String(mine[CONFIG.techStatusField])==="Online";
  $("availToggle").classList.toggle("on", isOnline);
  // Reopening the app while already Online (2026-08-17) — start the
  // heartbeat here too, not just from onToggleClick()'s own toggle action,
  // so location stays fresh across a page refresh/reopen without the
  // technician having to toggle off and back on.
  if(isOnline) startLocationHeartbeat();
}
/* Live location heartbeat (2026-08-17, user request: "when vendor is online
   it is supposed to show the distance from the vendor's current location
   (latest location from app); ... this applies to Technicians/Drivers too,
   not just Vendors") — while toggled Online, refreshes this technician's own
   Current_Latitude/Current_Longitude every ~2.5 minutes (the midpoint of the
   user's own requested 2-3 min range), read by getRescueTicket's own
   Assignment-step vendor picker once Online — see vendorTicket's own matching
   comment for the fuller cross-widget picture. An immediate fix is taken the
   moment they toggle online, rather than waiting for the first interval
   tick — see startLocationHeartbeat(). Best-effort throughout: a denied/
   unavailable fix, or a failed write, just silently skips that one tick —
   never blocks the toggle itself or any other part of this app. */
const LOCATION_HEARTBEAT_MS=150000; // 2.5 min
let locationHeartbeatTimer=null;
/* announce=true only for the fix taken the moment they come on duty — a
   deliberate action they are waiting on. Interval ticks pass nothing and stay
   silent, so this never nags every 2.5 minutes. */
async function pingCurrentLocation(announce){
  if(!currentTechRecord) return false;
  const say=function(msg,kind){ if(announce && typeof toast==="function") toast(msg,kind); };
  try{
    const pos=await getPositionSafe();
    if(!pos){
      /* The portal-app case. A WebView gets location only if the host app has
         the OS permission and passes it through, so this can fail here while
         working perfectly in the phone browser. Said out loud because there is
         no console inside the app to find it in. */
      console.warn("[Get-Rescue] pingCurrentLocation: no position fix. In the Zoho Creator portal app this usually means the app itself lacks location permission — check the OS app settings, not just the browser prompt.");
      say("Location unavailable — you may not show correctly on the dispatch map. Check location permission for this app.","err");
      return false;
    }
    const fn=resolve("updateRecordById");
    if(!fn){ say("Couldn't save your location right now","err"); return false; }
    const payload={};
    payload[CONFIG.techCurrentLatField]=pos.lat;
    payload[CONFIG.techCurrentLonField]=pos.lon;
    /* Location_Last_Updated_At stamped here 2026-09-25 — the field was created in
       Zoho on 2026-08-17 but nothing had ever written to it, so the assignment
       popup and the Ops Map had no way to tell a fix from thirty seconds ago from
       one left over from yesterday. Written in the SAME update as the coordinates,
       so the timestamp can never disagree with the position it describes. */
    payload["Location_Last_Updated_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
    // Logged so a wrong-but-present fix (a VPN or a desktop IP lookup putting
    // someone in another country) is visible rather than guessed at.
    console.log("[Get-Rescue] location updated —", pos.lat, pos.lon);
    say("Location updated","ok");
    return true;
  }catch(e){
    console.warn("[Get-Rescue] pingCurrentLocation failed (non-fatal, retries next tick):", e);
    say("Couldn't save your location — check your connection","err");
    return false;
  }
}
function startLocationHeartbeat(){
  stopLocationHeartbeat(); // never let two timers stack
  pingCurrentLocation(true); // immediate fix now, and say how it went
  locationHeartbeatTimer=setInterval(function(){ pingCurrentLocation(false); }, LOCATION_HEARTBEAT_MS);
}
function stopLocationHeartbeat(){ if(locationHeartbeatTimer){ clearInterval(locationHeartbeatTimer); locationHeartbeatTimer=null; } }
async function onToggleClick(){
  if(!currentTechRecord){
    // Real bug fixed 2026-08-24 (user-reported live: "online/offline toggle
    // is not working") — this used to just silently return here with zero
    // feedback whenever currentTechRecord hadn't resolved, which reads
    // exactly like a dead button. Retries the real match once (see
    // resolveTechRecord()'s own comment) before finally telling the
    // technician clearly why, instead of doing nothing.
    console.warn("[Get-Rescue] onToggleClick: currentTechRecord was null at tap time; retrying the "+CONFIG.techReport+" match once before giving up.");
    await resolveTechRecord("onToggleClick retry");
  }
  if(!currentTechRecord){ toast("Availability unavailable — no matching technician record found for your login","err"); return; }
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.techStatusField]=wantOnline?"Online":"Offline";
    /* Last_Online_At stamped on going ONLINE only, 2026-09-25 — same story as
       Location_Last_Updated_At: created in Zoho 2026-08-17, never written. Not
       touched when going offline, because the field records when someone last came
       online, and overwriting it on sign-off would turn it into "last toggled"
       and lose that. */
    if(wantOnline) payload["Last_Online_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
    if(wantOnline) startLocationHeartbeat(); else stopLocationHeartbeat();
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

/* ---------- date formatting (same 24h format getRescueTicket uses for
   generic datetime fields) ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

/* ---------- wiring + boot ---------- */
$("backBtn").onclick=backToDashboard;
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
    INIT_PARAMS=params; // zohoAppLinkName()'s own envUrlFragment lookup
  }catch(e){ console.warn("getInitParams failed", e); }
  await loadAvailability();
  await loadVehicleNames();
  await loadIssueNames();
  await loadDashboard();
  // Repair pass: only does anything when a vehicle this user can actually
  // see failed to resolve, and only re-renders when the retry genuinely helped.
  /* Anything left over from a previous session goes up now (2026-09-30). Not
     awaited: a queued photo must never delay the app opening, and flushPhotoQueue()
     re-renders its own badge when it finishes. */
  flushPhotoQueue();
  /* Retry the moment the device says it is back online. Cheap, and it is the
     difference between a photo landing when the technician walks out of a basement
     and it sitting there until they happen to reopen the app. */
  if(typeof window!=="undefined" && window.addEventListener){
    window.addEventListener("online", function(){
      console.log("[Get-Rescue] back online — retrying any queued photos.");
      flushPhotoQueue();
    });
  }
  try{ if(await ensureVehicleNamesForLoadedTickets()) await loadDashboard(); }
  catch(e){ console.warn("[GR] vehicle-name repair pass failed (non-blocking)", e); }
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
