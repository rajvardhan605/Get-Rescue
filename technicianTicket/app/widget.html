   (latest location from app); ... this applies to Technicians/Drivers too,
   not just Vendors") — while toggled Online, refreshes this technician's own
   Current_Latitude/Current_Longitude every ~2.5 minutes (the midpoint of the
   user's own requested 2-3 min range), read by getRescueTicket's own
   Assignment-step vendor picker once Online — see vendorTicket's own matching
   comment for the fuller cross-widget picture. An immediate fix is taken the
   moment they toggle online, rather than waiting for the first interval
   tick — see startLocationHeartbeat(). Best-effort throughout: a denied/
   unavailable fix, or a failed write, just silently skips that one tick —
   never blocks the toggle itself or any other part of this app. */
const LOCATION_HEARTBEAT_MS=150000; // 2.5 min
let locationHeartbeatTimer=null;
/* announce=true only for the fix taken the moment they come on duty — a
   deliberate action they are waiting on. Interval ticks pass nothing and stay
   silent, so this never nags every 2.5 minutes. */
async function pingCurrentLocation(announce){
  if(!currentTechRecord) return false;
  const say=function(msg,kind){ if(announce && typeof toast==="function") toast(msg,kind); };
  try{
    const pos=await getPositionSafe();
    if(!pos){
      /* The portal-app case. A WebView gets location only if the host app has
         the OS permission and passes it through, so this can fail here while
         working perfectly in the phone browser. Said out loud because there is
         no console inside the app to find it in. */
      console.warn("[Get-Rescue] pingCurrentLocation: no position fix. In the Zoho Creator portal app this usually means the app itself lacks location permission — check the OS app settings, not just the browser prompt.");
      // say("Location unavailable — you may not show correctly on the dispatch map. Check location permission for this app.","err");
      return false;
    }
    const fn=resolve("updateRecordById");
    if(!fn){ say("Couldn't save your location right now","err"); return false; }
    const payload={};
    payload[CONFIG.techCurrentLatField]=pos.lat;
    payload[CONFIG.techCurrentLonField]=pos.lon;
    /* Location_Last_Updated_At stamped here 2026-09-25 — the field was created in
       Zoho on 2026-08-17 but nothing had ever written to it, so the assignment
       popup and the Ops Map had no way to tell a fix from thirty seconds ago from
       one left over from yesterday. Written in the SAME update as the coordinates,
       so the timestamp can never disagree with the position it describes. */
    payload["Location_Last_Updated_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:(currentTechRecord.report||CONFIG.techReport), id:currentTechRecord.id, payload:{data:payload} });
    // Logged so a wrong-but-present fix (a VPN or a desktop IP lookup putting
    // someone in another country) is visible rather than guessed at.
    console.log("[Get-Rescue] location updated —", pos.lat, pos.lon);
    say("Location updated","ok");
    return true;
  }catch(e){
    console.warn("[Get-Rescue] pingCurrentLocation failed (non-fatal, retries next tick):", e);
    // say("Couldn't save your location — check your connection","err");
    return false;
  }
}
function startLocationHeartbeat(){
  stopLocationHeartbeat(); // never let two timers stack
  pingCurrentLocation(true); // immediate fix now, and say how it went
  locationHeartbeatTimer=setInterval(function(){ pingCurrentLocation(false); }, LOCATION_HEARTBEAT_MS);
}
function stopLocationHeartbeat(){ if(locationHeartbeatTimer){ clearInterval(locationHeartbeatTimer); locationHeartbeatTimer=null; } }
/* ATTENDANCE - 2026-10-15, client request: every online/offline change is
   logged with name, status, time and position. See this change's own note for
   why it is called after the write and never awaited.

   Best-effort by construction: every failure path - no addRecords method, no
   GPS, no Attendance form in Zoho yet, a refused write - is caught here and
   logged, so nothing it does can reach the toggle. */
const ATTENDANCE_FORM = "Attendance";
/* Who to put in the Name column - 2026-10-15. See this change's own note: the
   display name is not always resolved even when the toggle works, so this tries
   the record the toggle just wrote to before giving up and using the login. */
const ATTENDANCE_NAME_FIELDS = [CONFIG.techNameField, "Technician_Name","Name","Full_Name","Technician"];
function attendanceName(){
  const resolved = String(MY_TECH_NAME||"").trim();
  if(resolved) return { name:resolved, from:"the resolved profile name" };
  const rec = currentTechRecord && currentTechRecord.data;
  if(rec){
    for(var i=0;i<ATTENDANCE_NAME_FIELDS.length;i++){
      const key = ATTENDANCE_NAME_FIELDS[i];
      if(!key) continue;
      const v = String(readVal(rec, key)||"").trim();
      /* An address in a name column is not a name - skipping it stops this
         quietly reproducing the exact bug it was written to fix. */
      if(v && v.indexOf("@")===-1) return { name:v, from:"the availability record’s " + key + " column" };
    }
  }
  /* fallback:true is what triggers the email lookup in logAttendance() - see
     attendanceNameByEmail(). Marked rather than inferred, so a real name that
     happens to equal the login can never be mistaken for a failure. */
  return { name:String(LOGIN_EMAIL||"").trim(), from:"the login email - no name is on file for this address", fallback:true };
}
/* The name for this login, searched for rather than remembered - 2026-10-15.
   Only called when attendanceName() has already given up; see this change’s
   own note. Cached per session - a second toggle costs nothing. */
/* Both reports - 2026-10-16. A technician whose identity came from the
   availability report is logged by name rather than by email. */
const ATTENDANCE_NAME_REPORTS = [CONFIG.techReport, CONFIG.availabilityReport];
const ATTENDANCE_EMAIL_FIELDS = [CONFIG.techEmailField, "Email", "Technician_Email", "Email_Address"];
let ATTENDANCE_NAME_LOOKUP = null;
function attendanceEmailMatches(rec, wantedLower){
  if(!rec || !wantedLower) return false;
  for(var i=0;i<ATTENDANCE_EMAIL_FIELDS.length;i++){
    const fld = ATTENDANCE_EMAIL_FIELDS[i];
    if(fld && String(readVal(rec,fld)||"").trim().toLowerCase()===wantedLower) return true;
  }
  /* ANY column carrying exactly this address. Same last resort, and the same
     reasoning, as vendorEmailFieldMatching(): being unable to name someone who
     can log in is the bug, and a scan of their own record is cheap. */
  for(var key in rec){
    if(String(readVal(rec,key)||"").trim().toLowerCase()===wantedLower) return true;
  }
  return false;
}
async function attendanceNameByEmail(){
  if(ATTENDANCE_NAME_LOOKUP) return ATTENDANCE_NAME_LOOKUP;
  const wanted = String(LOGIN_EMAIL||"").trim().toLowerCase();
  if(!wanted) return null;
  for(var r=0;r<ATTENDANCE_NAME_REPORTS.length;r++){
    const rep = ATTENDANCE_NAME_REPORTS[r];
    if(!rep) continue;
    try{
      const recs = await apiGetReport(rep, null, 1000);
      for(var i=0;i<recs.length;i++){
        if(!attendanceEmailMatches(recs[i], wanted)) continue;
        for(var n=0;n<ATTENDANCE_NAME_FIELDS.length;n++){
          const key = ATTENDANCE_NAME_FIELDS[n];
          if(!key) continue;
          const v = String(readVal(recs[i], key)||"").trim();
          if(v && v.indexOf("@")===-1){
            ATTENDANCE_NAME_LOOKUP = { name:v, from:rep+"."+key+", matched on the login email" };
            return ATTENDANCE_NAME_LOOKUP;
          }
        }
        console.warn("[Get-Rescue] attendance: found a record in "+rep+" for "+LOGIN_EMAIL+", but none of "+ATTENDANCE_NAME_FIELDS.join(" / ")+" held a usable name on it. Its own columns:", Object.keys(recs[i]));
      }
    }catch(e){ console.warn("[Get-Rescue] attendance: could not read "+rep+" to look up a name (not fatal - the record is still written).", e); }
  }
  return null;
}
async function logAttendance(statusText){
  try{
    const fn = resolve("addRecords");
    if(!fn){ console.warn("[Get-Rescue] attendance: addRecords is unavailable, so this technician status change was not logged. The toggle itself worked."); return; }
    /* Never blocks and never rejects - getPositionSafe() resolves null on a
       denied permission or a timeout. 30s lets a fix the heartbeat already took
       be reused rather than waking the GPS on every tap. */
    /* The search only runs when the answer would otherwise be the login itself,
       so a vendor whose name already resolves pays for no extra read. */
    let who = attendanceName();
    if(who.fallback){
      const found = await attendanceNameByEmail();
      if(found) who = found;
    }
    let pos = null;
    try{ pos = await getPositionSafe(30000); }catch(e){ pos = null; }
    const data = {
      Name: who.name,
      Status: statusText,
      /* fmtDateTime() is what writes Last_Online_At in this same handler, and
         that is a real Zoho Date-Time column - so this format is already proven
         against this field type. */
      Date_Time: fmtDateTime(new Date()),
      LatLong: pos ? (pos.lat + "," + pos.lon) : "",
      User_Type: "Technician",
      /* The stable key. Two people can share a display name; a login cannot. */
      Email: String(LOGIN_EMAIL || "").trim()
    };
    await fn({ app_name:CONFIG.appName, form_name:ATTENDANCE_FORM, payload:{ data:data } });
    console.log("[Get-Rescue] attendance logged:", data.Status, data.Date_Time, data.LatLong||"(no location)", "| Name taken from " + who.from + ".");
  }catch(e){
    console.warn("[Get-Rescue] attendance was NOT logged for this status change - the toggle itself worked and the technician is now the status they chose. Most likely the \"Attendance\" form does not exist in Zoho yet, or one of its field names differs from Name / Status / Date_Time / LatLong / User_Type / Email.", e);
  }
}
async function onToggleClick(){
  if(!currentTechRecord){
    // Real bug fixed 2026-08-24 (user-reported live: "online/offline toggle
    // is not working") — this used to just silently return here with zero
    // feedback whenever currentTechRecord hadn't resolved, which reads
    // exactly like a dead button. Retries the real match once (see
    // resolveTechRecord()'s own comment) before finally telling the
    // technician clearly why, instead of doing nothing.
    console.warn("[Get-Rescue] onToggleClick: currentTechRecord was null at tap time; retrying the "+CONFIG.techReport+" match once before giving up.");
    await resolveTechRecord("onToggleClick retry");
  }
  if(!currentTechRecord){ toast("Availability unavailable — no matching technician record found for your login","err"); return; }
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.techStatusField]=wantOnline?"Online":"Offline";
    /* Last_Online_At stamped on going ONLINE only, 2026-09-25 — same story as
       Location_Last_Updated_At: created in Zoho 2026-08-17, never written. Not
       touched when going offline, because the field records when someone last came
       online, and overwriting it on sign-off would turn it into "last toggled"
       and lose that. */
    if(wantOnline) payload["Last_Online_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:(currentTechRecord.report||CONFIG.techReport), id:currentTechRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
    if(wantOnline) startLocationHeartbeat(); else stopLocationHeartbeat();
    /* Attendance - 2026-10-15. Deliberately here: after the awaited write, so
       only a change that really landed is logged; and NOT awaited, so it cannot
       delay the toggle or fall into the catch below and revert a status change
       that already succeeded. Repeat taps are already impossible meanwhile -
       .toggle.locked sets pointer-events:none until the finally clause. */
    logAttendance(wantOnline?"Online":"Offline");
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

/* ---------- date formatting (same 24h format getRescueTicket uses for
   generic datetime fields) ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* The customer-facing ETA - 2026-10-08, see this change's own note, including
   the WhatsApp template dependency. Flip ETA_AS_CLOCK_TIME to false to go back
   to the hours-to-one-decimal the approved template text still expects. */
const ETA_AS_CLOCK_TIME = true;
const ETA_CUSTOMER_PAD_MINS = 10;   // spec 5.4, vendor-app cases only
function fmtClockTime24(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
/* This app only ever sends at the moment the VENDOR accepts in their own app,
   so acceptance time is now and the +10 always applies - the agent-on-behalf
   half of the rule lives in getRescueTicket, which is where that case runs. */
function customerEtaText(etaMins){
  const mins=Number(etaMins);
  if(!mins || isNaN(mins)) return "";
  if(!ETA_AS_CLOCK_TIME) return String(Math.round((mins/60)*10)/10);
  return fmtClockTime24(new Date(Date.now()+(mins+ETA_CUSTOMER_PAD_MINS)*60000));
}
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

/* ---------- wiring + boot ---------- */
$("backBtn").onclick=backToDashboard;
/* Last_Seen_At - Task Tracker #85.5 (2026-10-29): the "Login" column on the agent's assignment
   picker. Stamped when the app opens and every LAST_SEEN_MS while it is on screen, Online or
   Offline alike, so the office can tell "app open" from "switched to Online". Its own small
   update, separate from every other write, so a refused field can never affect anything else;
   a failure is logged once and retried on the next tick. */
const LAST_SEEN_MS = 3*60*1000;
let LAST_SEEN_TIMER = null, LAST_SEEN_FAILED = false;
async function stampLastSeen(){
  if(typeof document!=="undefined" && document.visibilityState && document.visibilityState!=="visible") return;
  const rec = currentTechRecord;
  if(!rec || rec.id==null) return;
  try{
    await apiUpdateReport((rec.report || CONFIG.techReport), rec.id, { Last_Seen_At: fmtDateTime(new Date()) });
    LAST_SEEN_FAILED = false;
  }catch(e){
    if(!LAST_SEEN_FAILED) console.warn("[Get-Rescue] Last_Seen_At not written (is the field on the form?) - nothing else is affected", e);
    LAST_SEEN_FAILED = true;
  }
}
function startLastSeen(){
  if(LAST_SEEN_TIMER) return;
  stampLastSeen();
  LAST_SEEN_TIMER = setInterval(stampLastSeen, LAST_SEEN_MS);
  if(typeof document!=="undefined" && document.addEventListener){
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") stampLastSeen(); });
  }
}
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
    INIT_PARAMS=params; // zohoAppLinkName()'s own envUrlFragment lookup
  }catch(e){ console.warn("getInitParams failed", e); }
  /* Nothing loads until there is a position - 2026-10-17, client request. Placed
     before the first fetch so an app without location never reaches a dashboard,
     and before any render so the overlay is the first thing on screen. */
  await requireLocation();
  await loadAvailability();
  startLastSeen();   // Task Tracker #85.5 - not awaited, never delays the app opening
  await loadVehicleNames();
  await loadIssueNames();
  await loadDashboard();
  // Repair pass: only does anything when a vehicle this user can actually
  // see failed to resolve, and only re-renders when the retry genuinely helped.
  /* Anything left over from a previous session goes up now (2026-09-30). Not
     awaited: a queued photo must never delay the app opening, and flushPhotoQueue()
     re-renders its own badge when it finishes. */
  flushPhotoQueue();
  /* Retry the moment the device says it is back online. Cheap, and it is the
     difference between a photo landing when the technician walks out of a basement
     and it sitting there until they happen to reopen the app. */
  if(typeof window!=="undefined" && window.addEventListener){
    window.addEventListener("online", function(){
      console.log("[Get-Rescue] back online — retrying any queued photos.");
      flushPhotoQueue();
    });
  }
  try{ if(await ensureVehicleNamesForLoadedTickets()) await loadDashboard(); }
  catch(e){ console.warn("[GR] vehicle-name repair pass failed (non-blocking)", e); }
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
