<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Get-Rescue · Vendor</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as every other Get-Rescue widget — kept identical on
   purpose (2026-07-31: "the theme will be same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}

.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.st.rej{background:var(--stop-soft);color:var(--stop)}
.svc{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;margin-right:6px}
.svc.rsr{background:var(--signal-soft);color:var(--signal-deep)}
.svc.tow{background:var(--info-soft);color:#1d5fc0}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:6px}
.info-grid .full{grid-column:1/-1}
.info-grid .k{font-family:var(--f-mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.info-grid .v{font-size:14px;font-weight:600}
.nav-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--info-soft);color:#1d5fc0;border-radius:11px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:14px;text-decoration:none;margin:6px 0}

.photo-field{margin:12px 0}
.photo-field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.photo-field .lab .l{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.photo-field .lab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.photo-field .lab .cnt.ok{color:var(--ok)}
.photo-field.collapsible .lab{cursor:pointer;user-select:none}
.photo-field.collapsible .lab .chev{color:var(--muted);vertical-align:middle;margin-right:4px;transition:transform .2s}
.photo-field.collapsible.collapsed .lab .chev{transform:rotate(-90deg)}
.photo-field.collapsible.collapsed .photo-grid{display:none}
/* Generic collapsible section card (2026-08-04, user request — "make this
   screen accordion like") — used to turn the whole RSR WIP screen into a
   stack of independently-collapsible sections, same chevron-toggle idea as
   the photo fields above but for arbitrary content (Issue Resolved, Expense). */
.acc-card{padding:0;overflow:hidden}
.acc-card .acc-head{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;user-select:none}
.acc-card .acc-head .t{font-family:var(--f-disp);font-weight:800;font-size:14.5px;flex:1}
.acc-card .acc-head .chev{color:var(--muted);flex:none;transition:transform .2s}
.acc-card.collapsed .acc-head .chev{transform:rotate(-90deg)}
.acc-card .acc-body{padding:0 16px 16px}
.acc-card.collapsed .acc-body{display:none}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--worktop)}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;color:var(--muted-2);background:#fff}
.photo-slot.add:active{background:var(--worktop)}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,22,28,.65);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:11px}
/* Auto-upload status badge (2026-08-04, per user request) — visible
   confirmation that a photo's background upload (see uploadPhotoNow)
   actually reached Zoho, instead of it happening silently. */
.photo-slot .up-badge{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.photo-slot .up-badge.ok{background:var(--ok)}
.photo-slot .up-badge.pending{background:rgba(20,22,28,.65);animation:pulseBadge 1.1s ease-in-out infinite}
.photo-slot .up-badge.failed{background:var(--stop)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.35}}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;font-family:var(--f-body);color:var(--text);background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld textarea{min-height:70px;resize:vertical}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;background:#fff;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}

.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:active{background:var(--signal-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:16px}
.btn-row .btn{flex:1}

.tech-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.tech-row .av{width:32px;height:32px;border-radius:50%;background:var(--worktop);display:grid;place-items:center;flex:none}
.tech-row .nm{font-family:var(--f-disp);font-weight:800;font-size:14px}
.tech-row .sub{font-size:11.5px;color:var(--muted)}
.tech-row .assign{flex:none}

.modal{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column}
.modal.on{display:flex}
#cameraVideo{width:100%;max-width:520px;flex:1;object-fit:cover;background:#000}
.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;width:100%;max-width:520px}
.cam-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer}
.cam-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;cursor:pointer;font-size:18px}
.cam-hint{color:rgba(255,255,255,.7);font-family:var(--f-mono);font-size:11px;text-align:center;padding:8px 20px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* "New case assigned" notifications (2026-08-07) — see notifyNewCases()'s
   own comment. Stacks top-right, above everything else on screen. */
.mech-notif-stack{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.mech-notif-card{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--signal);
  border-radius:10px;padding:11px 12px;box-shadow:var(--sh-2);animation:mechNotifIn .2s ease-out}
.mech-notif-body{flex:1;cursor:pointer;font-size:13px;line-height:1.45}
.mech-notif-body b{display:block;font-size:13.5px;margin-bottom:2px}
.mech-notif-status{color:var(--muted);font-size:11.5px;margin-top:3px}
.mech-notif-close{flex:none;border:0;background:transparent;color:var(--muted-2);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.mech-notif-close:hover{color:var(--stop)}
@keyframes mechNotifIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
      <span><b id="techName">Vendor</b><span>Get-Rescue</span></span>
    </div>
    <div class="toggle" id="availToggle" role="switch" aria-label="Toggle availability">
      <span class="lab off">Offline</span><span class="lab on">Online</span>
      <span class="knob"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="sec-head"><h2>My Tickets</h2><span class="cnt" id="ticketCount">0</span></div>
    <div id="ticketList"></div>
  </div>

  <div id="actionScreen" class="off">
    <div class="ascreen-top">
      <button class="back-x" id="backBtn" type="button" aria-label="Back to my tickets"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="ascreenTitle">—</h2>
    </div>
    <div class="card">
      <div class="info-grid" id="ticketInfo"></div>
    </div>
    <div id="ascreenBody"></div>
  </div>
</div>

<!-- camera modal — see technicianTicket's own copy for the full rationale
     comment; identical here, not re-explained. -->
<div class="modal" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="cam-hint" id="cameraHint">Center the shot, then tap to capture</div>
  <div class="camera-bar">
    <button class="cam-x" id="cameraCancel" type="button" aria-label="Cancel">✕</button>
    <button class="cam-btn" id="cameraShutter" type="button" aria-label="Capture photo"></button>
    <span style="width:40px"></span>
  </div>
</div>
<input type="file" id="cameraFallbackInput" accept="image/*" capture="environment" style="display:none">
<!-- no `capture` attribute here — lets the OS picker offer Gallery too -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<!-- Real-time-ish "new case assigned" notifications (2026-08-07, user
     request) — see notifyNewCases()'s own comment. Separate from the
     single-slot toast above (auto-hides in 2.6s, would get stomped by a
     second simultaneous event); cards here stack and persist until
     dismissed or their own 12s timeout. -->
<div class="mech-notif-stack" id="mechNotifStack"></div>

<script>
/* =====================================================================
   GET-RESCUE · VENDOR WIDGET
   Sibling of technicianTicket/driverTicket's widget.html — same CORE, but
   covers a vendor's own full lifecycle across BOTH RSR and TOW tickets:
   - Accept/Reject (common to both branches).
   - If the logged-in vendor is INDIVIDUAL: does the full on-road flow
     themselves (Reach->WIP->Payment for RSR, Reach->Loading->ReachedDrop->
     Unloading->Payment for TOW) — literally the same screens as
     technicianTicket/driverTicket, branched here by Service_Type instead of
     being two separate widgets.
   - If the logged-in vendor is FLEET: after Accept, shows a hand-off screen
     to assign one of their own technicians instead of doing the on-road
     work themselves — user-confirmed 2026-07-31 ("Vendor does everything an
     individual, PLUS hands off if fleet").
   See technicianTicket/app/widget.html's own header comment for the fuller
   set of confirmed decisions this whole build relies on (Create_Case only,
   no "Invites" form, etc.) — not re-explained per file here. Google Maps
   Distance Matrix API key provided 2026-08-04 (see GOOGLE_MAPS_API_KEY
   below) — Haversine is now only the fallback if that call fails.
   SCHEMA DECISIONS (2026-08-03 — all Zoho forms were deleted and rebuilt
   from scratch this round, so these are now the authored field names, not
   guesses against a pre-existing form — see FIELDS.md/ACCESS.md):
   - Individual vs. Fleet lives on `Vendors_Report.Vendor_Type`
     (values "Individual"/"Fleet").
   - A technician's owning fleet vendor lives on
     `Technicians_Report.Fleet_Vendor`, matched by name string (not ID).
   - Whether a fleet vendor's Accept should write "RSP ON THE WAY" directly
     (as implemented) or some other intermediate status before a technician
     is actually picked.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  // Added 2026-08-05 (user request — "Vehicle ID showing, not the Vehicle
  // name") — Vehicle is a real Lookup; this widget's own fetch (field_config
  // "all" included) still comes back with a bare Vehicle_Master_Report id,
  // not an enriched display object, so readVal() alone can't show a name.
  // Same report/name-field convention getRescueTicket's own vehicle picker
  // already uses — see vehicleDisplayFor()'s own comment for how a wrong
  // guess here degrades safely.
  vehicleMasterReport: "Vehicle_Master_Report",
  vehicleNameField: "Name",
  // Added 2026-08-05 (user request — "[object Object]" shown instead of the
  // real issue name on the dashboard card) — Vehicle_Issue is a multiselect
  // Lookup; its raw array items come back as Lookup objects with no usable
  // display_value of their own, so a plain .join() (readVal()'s own array
  // handling) stringified each one to "[object Object]". Same report/label
  // convention getRescueTicket's own Vehicle_Issue picker already uses.
  issueReport: "Vehicle_Issue_Report",
  issueNameField: "Issue_Name",
  // Vendors_Report — this vendor's own identity for ticket matching
  // (Assigned_Vendor/Vendors1/Invites, all real Lookups into THIS report).
  vendorReport: "Vendors_Report",
  vendorEmailField: "Email",
  vendorNameField: "Vendor_Name",
  vendorPhoneField: "Mobile_Number_01", // confirmed (FIELDS.md, and already used in getRescueTicket's recordVendorPayment) — needed for the WhatsApp "dispatched" message (spec template 8)
  /* NOT confirmed live — see this file's own header comment. */
  vendorTypeField: "Vendor_Type",
  // Availability toggle target corrected 2026-08-05 (user request) — this
  // widget's own comment previously claimed toggleGetRescue used Vendors_Report
  // for the toggle too, but toggleGetRescue's OWN CONFIG actually says
  // "My_Availability_Vendor" (a separate report from the vendor master) —
  // that comment was simply wrong. Deliberately kept independent of
  // vendorReport above: My_Availability_Vendor's own record id is NOT a
  // Vendors_Report id, so it must never be used for Assigned_Vendor/ticket
  // matching (see currentAvailabilityRecord's own comment) — only for this
  // toggle's own on/off state. Field names match toggleGetRescue's own
  // (working) guesses for this exact report.
  availabilityReport: "My_Availability_Vendor",
  availabilityEmailField: "Email",
  availabilityStatusField: "Availability_Status",
  // Added 2026-08-17 (user request — see pingCurrentLocation()'s own
  // comment). Same field names getRescueTicket's own CONFIG.vendorCurrentLatField/
  // vendorCurrentLonField expect on Vendors_Report — written here through
  // My_Availability_Vendor's own record, same as Availability_Status itself
  // already is; that report's writes are already confirmed to reflect
  // correctly into Vendors_Report's own reads (the Online/Offline toggle
  // already works this way live). Brand-new fields, not yet created in Zoho
  // Studio — see FIELDS.md's own note.
  availabilityCurrentLatField: "Current_Latitude",
  availabilityCurrentLonField: "Current_Longitude",
  fleetTechnicianReport: "Technicians_Report",
  // Superseded 2026-08-06 (user request) — see showHandoffPanel()'s own
  // comment for the full switch from a Fleet_Vendor name-match to a real
  // multi-lookup field read directly off this vendor's own Vendors_Report
  // record. fleetTechnicianLinkField kept only as a fallback if that new
  // field ever comes back empty/unreadable, not the primary path anymore.
  fleetTechnicianLinkField: "Fleet_Vendor",
  // Both confirmed wrong live 2026-08-06 (every row showed "—") — kept as the
  // FIRST candidate in FLEET_TECH_NAME_CANDIDATES/FLEET_TECH_PHONE_CANDIDATES
  // rather than deleted, so a future correction just needs updating the one
  // value here, not the candidate list itself.
  fleetTechnicianNameField: "Technician_Name",
  fleetTechnicianPhoneField: "Phone",
  fleetTechnicianEmailField: "Email",
  fleetTechnicianStatusField: "Availability_Status",

function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// "for all distance calculations that use google api - ensure that travel
// type has to be four wheeler for TOW cases and distance type should be
// two wheeler for REPAIR/RSR cases"). Defaults to "DRIVING" (Google's own
// car/four-wheeler routing) so any call site not yet updated keeps its
// exact previous behavior — fully backward compatible.
function googleDistanceMatrix(origins,destinations,travelMode){
  const mode=travelMode||"DRIVING";

    if(!ok || !window.google || !window.google.maps) return null;
    if(!dmService) dmService=new google.maps.DistanceMatrixService();

      try{
        dmService.getDistanceMatrix({
          origins: origins.map(function(o){ return new google.maps.LatLng(o.lat,o.lon); }),
          destinations: destinations.map(function(d){ return new google.maps.LatLng(d.lat,d.lon); }),
          travelMode: mode
        }, function(resp,status){
          if(status!=="OK" || !resp){ console.warn("[GR-Vendor] DistanceMatrix request failed:",status,"(travelMode:",mode+")"); res(null); return; }

async function calcDistanceETA(fromLat,fromLon,toLat,toLon,travelMode){
  if([fromLat,fromLon,toLat,toLon].some(function(n){ return n==null || isNaN(n); })) return null;
  const rows=await googleDistanceMatrix([{lat:fromLat,lon:fromLon}],[{lat:toLat,lon:toLon}],travelMode);
  const el=rows && rows[0] && rows[0].elements && rows[0].elements[0];
  if(el && el.status==="OK") return { distanceKm:Math.round((el.distance.value/1000)*10)/10, etaMins:Math.max(1,Math.round(el.duration.value/60)) };
  const distanceKm=Math.round(haversineKm(fromLat,fromLon,toLat,toLon)*10)/10;

async function calcRoundTripKm(bLat,bLon,dLat,dLon,travelMode){

  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests,travelMode);
  if(rows){
    let total=0, ok=true;
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      total+=el.distance.value/1000;
    }
    if(ok) return Math.round(total*10)/10;
  }
  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
  if(hasDrop){ total+=haversineKm(bLat,bLon,dLat,dLon); total+=haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON); }

  }
  const total=officeToBreakdown+breakdownToDrop+dropToOffice;
  return {
    officeToMechanic: Math.round(officeToBreakdown*10)/10,
    mechanicToBreakdown: 0, // see driverTicket's own comment / QUESTIONS_TO_ASK.md
    breakdownToDrop: Math.round(breakdownToDrop*10)/10,
    dropToOffice: Math.round(dropToOffice*10)/10,
    total: Math.round(total*10)/10

}

// using it in place of buildNavUrl() on Android bypasses that fix completely
// whenever it happens to be populated — which is most real tickets. Doesn't
// touch iOS/desktop at all (still prefers the stored link there, unchanged,
// since that's the platform this was never reported broken on) — only

let DASHBOARD_POLL_TIMER=null;
const DASHBOARD_POLL_MS=30000;
function stopDashboardPoll(){ if(DASHBOARD_POLL_TIMER){ clearInterval(DASHBOARD_POLL_TIMER); DASHBOARD_POLL_TIMER=null; } }
function startDashboardPollIfNeeded(){
  stopDashboardPoll(); // never let two timers stack across repeated loadDashboard() calls
  if(!isDashboardVisible()) return;
  DASHBOARD_POLL_TIMER=setInterval(pollForNewCases, DASHBOARD_POLL_MS);
}
async function pollForNewCases(){
  if(!isDashboardVisible()){ stopDashboardPoll(); return; }
  try{
    const fresh=await fetchMyTickets();
    const freshIds=new Set(fresh.map(function(r){ return String(r.ID); }));
    const newOnes = KNOWN_TICKET_IDS ? fresh.filter(function(r){ return !KNOWN_TICKET_IDS.has(String(r.ID)); }) : [];
    // Real bug fixed 2026-09-01 (found while fixing the identical gap in
    // getRescueTicket's own dashboard poll) — this used to only re-render
    // when a brand-new ticket arrived. Two related gaps fixed together:
    // (1) an already-known ticket's status silently changing elsewhere
    // (another vendor took a shared invite first, the agent cancelled it)
    // updated state.tickets in the background but never refreshed the
    // screen; (2) a ticket dropping out of "my tickets" entirely (no longer
    // matches this vendor's own filters — e.g. someone else got assigned)
    // had the same problem, the stale row just stayed on screen. Neither
    // plays the new-case sound — that's reserved for a genuinely new
    // arrival — they just make sure the screen itself never goes stale.
    const hasStatusChange = KNOWN_TICKET_IDS ? fresh.some(function(r){
      const id=String(r.ID);
      if(!KNOWN_TICKET_IDS.has(id)) return false; // a new ticket, already covered by newOnes
      const st=String(r[CONFIG.stageField]||"").trim().toUpperCase();
      return KNOWN_TICKET_STATUSES[id]!=null && KNOWN_TICKET_STATUSES[id]!==st;
    }) : false;
    const hasRemoval = KNOWN_TICKET_IDS ? Array.from(KNOWN_TICKET_IDS).some(function(id){ return !freshIds.has(id); }) : false;
    updateKnownTicketIds(fresh);
    state.tickets=fresh;
    if(newOnes.length) notifyNewCases(newOnes);
    if(newOnes.length || hasStatusChange || hasRemoval) renderDashboard();
  }catch(e){ console.warn("[GR-Vendor] pollForNewCases failed (non-blocking)", e); }
}
const STATUS_PILL = {
  "RSP IRA (INVITE RESPONSE AWAITED)": {cls:"invite", label:"New Invite"},
  "RSP ON THE WAY": {cls:"otw", label:"On The Way"},
  "WORK IN PROGRESS": {cls:"wip", label:"In Progress"},
  "LOADING": {cls:"wip", label:"Loading"},
  "TO DROP LOCATION": {cls:"wip", label:"To Drop"},
  "UNLOADING": {cls:"wip", label:"Unloading"},
  "REMAINING FEE DUE": {cls:"pay", label:"Payment Due"},
  "RSP REJECT": {cls:"rej", label:"Rejected"}
};
function renderDashboard(){
  $("ticketCount").textContent=state.tickets.length;
  if(!state.tickets.length){
    $("ticketList").innerHTML='<div class="empty-state"><h3>No open tickets</h3><p>New invites and active jobs will show up here.</p></div>';
    return;
  }
  $("ticketList").innerHTML = state.tickets.map(function(r){
    const st = String(r[CONFIG.stageField]||"").trim().toUpperCase();
    const pill = STATUS_PILL[st] || {cls:"", label:st};
    const svc = String(r[CONFIG.serviceTypeField]||"").toUpperCase();
    return `<div class="tcard" data-id="${esc(r.ID)}">
      <div class="top"><span class="cid">${esc(caseLabel(r))}</span><span class="st ${pill.cls}">${esc(pill.label)}</span></div>
      <h3>${svc?`<span class="svc ${svc==='TOW'?'tow':'rsr'}">${esc(svc)}</span>`:""}${esc(vehicleDisplayFor(r)||"Vehicle")}</h3>
      <div class="meta">${esc(issueNamesFor(r)||"")} · ${esc(readVal(r,CONFIG.nameField)||"")}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".tcard").forEach(function(el){
    el.onclick=function(){ openTicket(el.dataset.id); };
  });
}
function openTicket(id){
  const rec = state.tickets.find(function(r){ return String(r.ID)===String(id); });
  if(!rec) return;
  state.current = Object.assign({}, rec);
  state.photos = {}; state.files = {};
  $("dashboard").classList.add("off"); $("dashboard").style.display="none";
  $("actionScreen").classList.remove("off");
  // Stop the "new case" background poll the instant a ticket's own screen
  // opens (2026-08-07) — isDashboardVisible() would eventually catch this on
  // its own next tick anyway, but stopping it immediately here avoids up to
  // one full poll interval of pointless background fetching right after
  // navigating away.
  stopDashboardPoll();
  renderActionScreen();
}
function backToDashboard(){
  $("actionScreen").classList.add("off");
  $("dashboard").style.display=""; $("dashboard").classList.remove("off");
  loadDashboard();
}
/* Moves straight into the next action screen for the SAME ticket, instead of
   dropping back to the dashboard list — see technicianTicket's own comment
   on this function for the full rationale (Action 5 flow spec, 2026-07-31). */
function goToStatus(newStatus){

  renderActionScreen();
}
function renderTicketInfo(){
  const r=state.current;
  // Real bug fixed 2026-08-21 (user request, screenshot: "Location" showed
  // raw decimal Latitude/Longitude digits — "28.53000000000000,
  // 77.17000000000000" — when Break_Down_Location1 wasn't set) — that
  // fallback removed; Location now only shows when there's a real address
  // string. The rows filter below already drops any row with a falsy
  // value, so an empty string here correctly hides the row entirely rather
  // than showing raw coordinates.
  const loc = r.Break_Down_Location1 ? String(r.Break_Down_Location1) : "";
  // Added 2026-09-02 (user request) — see driverTicket's own matching
  // comment. TOW only — RSR tickets have no drop location concept at all.
  const isTowForInfo = String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
  const drop = isTowForInfo && r.Navigate_To_Drop_Link ? String(r.Navigate_To_Drop_Link) : "";
  const rows=[
    ["Case ID", caseLabel(r)],
    ["Service", r[CONFIG.serviceTypeField]||""],
    ["Customer", readVal(r,CONFIG.nameField)],
    ["Phone", r[CONFIG.phoneField]||""],
    ["Vehicle", vehicleDisplayFor(r)],
    ["Location", loc],
    ["Drop", drop],
    ["Issue", issueNamesFor(r)]
  ].filter(function(p){ return p[1]; });
  // Phone row made click-to-dial (2026-09-10, client soft-test feedback:
  // "Customer mobile numbers must be formatted as clickable links to allow
  // quick dial-out") — reuses formatIndianPhone() (already proven elsewhere
  // in this same file for WhatsApp sending) for the tel: URI's own value,
  // while the visible text stays exactly what was already shown (the raw
  // field value, not the normalized +91 form) so this is purely additive —
  // every other row in this table is completely unchanged.
  $("ticketInfo").innerHTML = rows.map(function(p){
    const valueHtml = (p[0]==="Phone")
      ? `<a class="v" href="tel:${esc(formatIndianPhone(p[1]))}" style="color:inherit;text-decoration:underline">${esc(p[1])}</a>`
      : `<span class="v">${esc(p[1])}</span>`;
    return `<div><span class="k">${esc(p[0])}</span>${valueHtml}</div>`;
  }).join("");
}

/* ---------- per-status, per-Service_Type action screen router ---------- */
function renderActionScreen(){
  renderTicketInfo();
  const st=String(state.current[CONFIG.stageField]||"").trim().toUpperCase();
  const isTow=String(state.current[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
  if(st==="RSP IRA (INVITE RESPONSE AWAITED)"){ $("ascreenTitle").textContent="Service Acceptance"; renderAcceptScreen(); }
  else if(st==="RSP ON THE WAY"){ $("ascreenTitle").textContent="Reach Breakdown Location"; isTow?renderReachScreenTow():renderReachScreenRsr(); }
  else if(st==="WORK IN PROGRESS"){ $("ascreenTitle").textContent="Work In Progress"; renderWipScreen(); }
  else if(st==="LOADING"){ $("ascreenTitle").textContent="Loading"; renderLoadingScreen(); }
  else if(st==="TO DROP LOCATION"){ $("ascreenTitle").textContent="Reached Drop Location"; renderReachedDropScreen(); }
  else if(st==="UNLOADING"){ $("ascreenTitle").textContent="Unloading & Handover"; renderUnloadingScreen(); }
  else if(st==="REMAINING FEE DUE"){ $("ascreenTitle").textContent="Final Payment"; renderPaymentScreen(); }
  // Added 2026-08-20 (see MY_STATUSES' own matching comment) — this branch
  // only ever becomes reachable now that RSP REJECT is in MY_STATUSES at
  // all; before this fix, a rejected ticket never stayed in "My Tickets"
  // long enough to be tapped back open, so this generic fallback never had
  // to say anything specific about it.
  else if(st==="RSP REJECT"){
    $("ascreenTitle").textContent="Rejected";
    const reason = isTow ? state.current.Reject_Reason1 : state.current.Reject_Reason;
    $("ascreenBody").innerHTML = `<div class="empty-state">
      <h3 style="color:var(--stop)">You Rejected This Ticket</h3>
      <p>${reason?esc(reason):"No reason recorded."}</p>
    </div>`;
  }
  else { $("ascreenBody").innerHTML='<div class="empty-state"><p>Nothing to do on this ticket right now.</p></div>'; }
}

  // Navigate to Breakdown (2026-08-21, user request: "NAVIGATE TO BREAKDOWN
  // & NAVIGATE TO DROP LOCATION buttons to be available in vendor app...
  // shows based on the service type") — same computation the Reach
  // screens already use (renderReachScreenRsr()/renderReachScreenTow()),
  // added here too so the vendor can start navigating right from Accept
  // instead of having to wait until the separate Reach step. Shown for
  // BOTH RSR and TOW — breakdown location matters either way; only the
  // Drop Location button just below stays TOW-only.
  const navHref = resolveNavHref(r.Break_Down_Location1, r.Latitude, r.Longitude);
  // Real bug fixed (2026-08-04, TOW ticket check) — Start Odometer used to
  // live INSIDE the dropHref-conditional block, so a vendor whose ticket had
  // no Navigate_To_Drop_Link (which has no confirmed writer anywhere in this
  // app — see FIELDS.md) never even saw the odometer input at all, and
  // acceptService() silently skipped capturing it. Now the card (and its
  // Start Odometer field) always renders for TOW; only the drop-location
  // info row itself is conditional. Also added the same DropLocationLat/Long
  // fallback the breakdown nav-link already uses.
  const dropLat=parseCoord(r.DropLocationLat), dropLon=parseCoord(r.DropLocationLong);
  const dropHref = isTow ? resolveNavHref(r.Navigate_To_Drop_Link, dropLat, dropLon) : "";
  $("ascreenBody").innerHTML = `
    ${navHref?`<a class="nav-link" href="${esc(navHref)}" target="_blank" rel="noopener">🧭 Navigate to Breakdown</a>`:`<div class="hint" style="margin-bottom:8px">Breakdown location not available yet</div>`}
    ${isTow?`${dropHref?`<a class="nav-link" href="${esc(dropHref)}" target="_blank" rel="noopener">🧭 Navigate to Drop Location</a>`:`<div class="hint" style="margin-bottom:8px">Drop location not available yet</div>`}<div class="card"><div class="fld"><label>Start Odometer</label><input type="number" id="startOdometer"></div></div>`:""}
    <div class="btn-row">
      <button class="btn danger" id="rejectBtn" type="button">Reject</button>
      <button class="btn ok" id="acceptBtn" type="button">Accept Service</button>
    </div>
    <div class="card" id="rejectPanel" style="display:none;margin-top:12px">
      <div class="fld"><label>Reject Reason<span style="color:var(--stop)">*</span></label>
        <select id="rejectReason"><option value="">— select —</option>${REJECT_REASONS.map(function(rr){return `<option value="${esc(rr)}">${esc(rr)}</option>`;}).join("")}</select>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="backFromRejectBtn" type="button">Back</button>
        <button class="btn danger" id="confirmRejectBtn" type="button">RSP Reject</button>
      </div>
    </div>
    <div class="card" id="handoffPanel" style="display:none;margin-top:12px">
      <h3 style="font-family:var(--f-disp);font-weight:800;font-size:15px;margin-bottom:10px">Assign to a technician</h3>
      <p class="hint" style="margin-bottom:10px">Hand this job to one of your own technicians instead of accepting it yourself — they'll get their own Accept/Reject screen for it.</p>
      <div id="fleetTechList"></div>
    </div>`;
  $("acceptBtn").onclick=acceptService;
  $("rejectBtn").onclick=()=>{ $("rejectPanel").style.display="block"; };
  $("backFromRejectBtn").onclick=()=>{ $("rejectPanel").style.display="none"; };
  $("confirmRejectBtn").onclick=rejectService;
  // Real change (2026-08-06, user request): the technician hand-off option
  // now shows on THIS screen directly, as an alternative to accepting
  // yourself — not only after you've already accepted it personally.
  // Accept Service always means "I'll do this myself" now (see
  // acceptService()'s own comment); this is the only path into a hand-off.
  // Real bug fixed (2026-08-06): this used to only call showHandoffPanel()
  // when MY_TECHNICIAN_IDS was already non-empty — but the fallback that
  // checks the OTHER relationship direction (Technicians_Report's own
  // vendor-link field) lives INSIDE that function, specifically for the case
  // where MY_TECHNICIAN_IDS came back empty. Gating the call on the same
  // condition the fallback exists to handle meant the fallback could never
  // actually run. Always call it now; it decides internally (via both
  // attempts) whether there's anything to show.
  // Real bug fixed (2026-08-06, user request: "vendor should only be able to
  // assign to ONE technician") — reopening this same still-pending ticket
  // after already assigning it showed the full, freshly-clickable picker
  // again with nothing marking it as already decided, so a second Assign
  // click would silently create a second Invites record for a different
  // technician while the first one's still active. Once Assigned_Technician
  // is set on the ticket, show a locked confirmation instead of the picker —
  // no fetch, no Assign buttons, nothing left to click.
  // Real bug fixed (2026-08-06, user-reported live: this locked message
  // showed even though no technician was ever actually assigned) —
  // Assigned_Technician comes back as a Zoho User-field object with every
  // sub-property empty ({prefix:"",first_name:"",...}) when nobody's been
  // picked, not null/"" — and an object like that is still truthy in JS, so
  // the plain truthy check above always locked the panel. lookupId() pulls
  // the real .ID (or bare id) out of it — undefined/empty when nothing was
  // ever actually assigned, a real id once someone genuinely is.
  if(lookupId(r.Assigned_Technician)){
    $("handoffPanel").style.display="block";
    $("fleetTechList").innerHTML='<p style="font-size:13px;color:var(--muted)">Already assigned to a technician — waiting on their response.</p>';
  } else {
    showHandoffPanel();
  }
}
async function acceptService(){
  setDisabled("acceptBtn",true);
  try{
    const pos = await getPositionSafe();
    const r=state.current;
    const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    const dist = pos ? await calcDistanceETA(pos.lat,pos.lon,bLat,bLon,travelModeFor(r)) : null;
    // Real bug fixed 2026-08-19 (user-reported live, TWICE — RSID396825 and
    // RSID396829 — Assigned_Vendor/Vendor_Email still blank on the agent's
    // own Accept screen after a DIRECT vendor acceptance on their own phone,
    // even with the same-day accept-time fix already redeployed). The
    // payload below only ever carried a real Assigned_Vendor/Vendor_Email if
    // currentVendorRecord had resolved at boot (loadAvailability()'s own
    // match, see resolveVendorRecord()'s own comment) — a vendor being able
    // to see/accept the ticket at all only ever proves the SEPARATE
    // Vendor_Emails/Invites/isMine() match worked, not this one, so the two
    // reports going out of sync for a given vendor was silently possible.
    // Retries the SAME real Vendors_Report query once, right here, before
    // giving up — a real re-check, not a guess, so it directly fixes a slow-
    // network/boot-timing race outright.
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] acceptService — currentVendorRecord was NULL at accept time; retrying the "+CONFIG.vendorReport+" match once before falling back. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL));
      await resolveVendorRecord("acceptService retry");
    }
    // Still no match after the retry — a genuine Vendors_Report data gap for
    // this vendor's login email, not a timing issue. Assigned_Vendor (a real
    // Lookup targeting Vendors_Report) is deliberately left blank rather than
    // guessed — writing the wrong vendor's id in would be worse than a
    // clearly blank one. The plain Vendor_Email fields don't carry that same
    // risk though: LOGIN_EMAIL is the actual authenticated login that just
    // tapped Accept, a real fact rather than a guess, so it's used as the
    // fallback for those below instead of leaving them blank too.
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] acceptService — currentVendorRecord STILL NULL after retry: Assigned_Vendor will stay blank (see this block's own comment on why it's not guessed). Vendor_Email/Vendor_Email1(2) will use LOGIN_EMAIL itself instead. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL), "| currentAvailabilityRecord resolved:", !!currentAvailabilityRecord, currentAvailabilityRecord ? ("(id "+currentAvailabilityRecord.id+", own email field "+JSON.stringify(currentAvailabilityRecord.data && currentAvailabilityRecord.data[CONFIG.availabilityEmailField])+")") : "", "— see loadAvailability()'s own matching warning (fired at boot, above this in the console) for the full list of Vendors_Report records that were checked.");
    }
    // Assigned_Vendor (2026-08-04, now buildable — the Vendors_Report/
    // My_Availability_Vendor schema merge means currentVendorRecord.id IS a
    // real Vendors_Report ID, unlike before the schema rebuild). Per the
    // Action 4 mock ("1st person to accept will get assigned & the task goes
    // away from other providers' apps") — this is what loadDashboard() below
    // now checks to hide the ticket from every OTHER invited vendor once one
    // of them has accepted. Best-effort, client-side only: two vendors
    // tapping Accept within the same instant could both still write this —
    // there's no atomic/locking write available from a plain widget without
    // a server-side workflow, so this narrows the race rather than closing it.
    const payload={ Status:"RSP ON THE WAY", Assigned_Vendor: currentVendorRecord && currentVendorRecord.id };
    // Real bug fixed (2026-08-06, user-reported live: "Vendor Email"/"Vendor
    // Email (Assignment)" always blank on the agent's own Service Acceptance
    // screen, even after a vendor directly accepted) — confirmed via code +
    // FIELDS.md that Vendor_Email1/Vendor_Email2 had NO writer anywhere at
    // all (unlike Technician_Email/Assigned_Technician_Email, which DO get
    // set on their own equivalent paths — direct technician acceptance, or a
    // fleet vendor's own hand-off). Assigned_Vendor itself was always set
    // correctly; this vendor's own email just never rode along with it.
    // Real bug fixed 2026-08-19 (user-reported live, screenshot: Vendor
    // Email/Vendor Email (Assignment)/Assigned Vendor ALL still blank on the
    // agent's own Accept screen) — this 2026-08-06 fix's own comment claimed
    // "Vendor Email (Assignment)" was covered too, but the code only ever
    // set Vendor_Email1/Vendor_Email2 — the bare Vendor_Email field
    // (getRescueTicket's own "Vendor Email (Assignment)" label) was never
    // actually written here at all. Added below, alongside the branch-
    // specific field, using the same vendor identity.
    const myEmail = (currentVendorRecord && currentVendorRecord.data && currentVendorRecord.data[CONFIG.vendorEmailField]) || LOGIN_EMAIL;
    if(myEmail){ payload.Vendor_Email=myEmail; if(isTow) payload.Vendor_Email2=myEmail; else payload.Vendor_Email1=myEmail; }
    if(isTow){
      payload.Service_Acceptance_For_Tow=fmtDateTime(new Date());
      if(dist){ payload.ETA_TOW=dist.etaMins; payload.Distance_To_Breakdown_TOW=dist.distanceKm; }
      const odoEl=$("startOdometer"); if(odoEl && odoEl.value!=="") payload.Odometer_Reading=Number(odoEl.value);
    } else {
      payload.Service_Acceptance=fmtDateTime(new Date());
      if(dist){ payload.ETA=dist.etaMins; payload.Distance_To_Breakdown=dist.distanceKm; }
    }
    // See technicianTicket's own comment — persisted so the Cancel flow can
    // compute "distance from RSP Start location to present location."
    // Guessed field names, not confirmed.
    if(pos){ payload.RSP_Start_Latitude=pos.lat; payload.RSP_Start_Longitude=pos.lon; r.RSP_Start_Latitude=pos.lat; r.RSP_Start_Longitude=pos.lon; }
    // Diagnostic logging (2026-08-03) — see technicianTicket's own comment on this same call.
    console.log("[GR-Vendor] acceptService payload:", JSON.stringify(payload), "| pos:", pos, "| RSP_Start_Latitude raw:", payload.RSP_Start_Latitude, typeof payload.RSP_Start_Latitude, String(payload.RSP_Start_Latitude), "| RSP_Start_Longitude raw:", payload.RSP_Start_Longitude, typeof payload.RSP_Start_Longitude, String(payload.RSP_Start_Longitude));
    await apiUpdate(r.ID, payload);
    // Invites (2026-08-03, user-confirmed): stamp this invite's own
    // "advance step flag" on Accept. Exact value format wasn't fully nailed
    // down (boolean vs. mirroring the Status string) — sending true for now;
    // best-effort/non-blocking either way, see updateMyInvite()'s own comment.
    // 2026-08-03: confirmed live via console — sending a JS boolean `true`
    // was rejected ("Invalid column value for Service_Acceptance_Next"), so
    // this is a Yes/No-style field expecting the literal string, same
    // convention every other Yes/No field in this codebase already uses
    // (Payment_received, Assignment_Sent, etc.) — not a real Boolean/Decision
    // box. Still a guess whether "Yes" itself is right; updateMyInvite()'s
    // own console.warn will show if this specific attempt also fails.
    updateMyInvite(r.ID, { Service_Acceptance_Next: "Yes" });
    // Simplified 2026-08-06 (user request) — the technician hand-off option
    // now lives directly on the Service Acceptance screen itself (see
    // renderAcceptScreen()'s own comment), as an alternative to accepting.
    // Clicking Accept Service always means "I'll do this myself" now; the
    // hand-off decision no longer happens after the fact.
    toast("Service accepted","ok");
    // WhatsApp dispatch message (2026-09-06, Repair/Towing Service Logic
    // Flow specs: "ACCEPT/REJECT page | on click ACCEPT button | Send 8
    // with vendor/mechanic name and number"). Same template for both RSR
    // and TOW branches (the two spec PDFs list it identically). Template
    // name and exact param ORDER (name, phone, ETA) are a best-effort
    // guess, not confirmed against the real approved WhatsApp Business
    // template — same "flagged, not confirmed" pattern as every other
    // template name in this app. Fire-and-forget, same as the Reach
    // message above — a failed send never blocks the real Accept action.
    /* Template name corrected 2026-09-22 against the approved WhatsPortal
       catalogue ("Get Rescued - WhatsApp Template API", revised 16 Sep 2026).
       "dispatch_eta" does not exist in the workspace and was returning 404
       template_not_found on every send - the real approved template is #8,
       share_rescue_service_details_and_eta, the same one getRescueTicket's own
       sendRescuerEtaMessage() already uses. Two further spec rules applied:
       the template writes the literal word "Hrs" after {{3}}, so the ETA is
       converted from minutes to hours (sending 45 would otherwise read
       "45 Hrs"); and empty strings are rejected with 422 message_rejected, so
       every missing value is sent as "-" instead. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescue_service_details_and_eta", [MY_VENDOR_NAME||"-", MY_VENDOR_PHONE||"-", (dist&&dist.etaMins)?String(Math.round((dist.etaMins/60)*10)/10):"-"]);
    // Navigates straight to "Reach Breakdown Location" per the flow spec —
    // see goToStatus()'s own comment.
    goToStatus("RSP ON THE WAY");
  }catch(e){ console.error("[GR-Vendor] acceptService error:", e); toast((e&&e.message)||"Could not accept","err"); }
  finally{ setDisabled("acceptBtn",false); }
}
async function rejectService(){
  const reason=$("rejectReason").value;
  if(!reason){ toast("Please pick a reject reason","err"); return; }
  setDisabled("confirmRejectBtn",true);
  try{
    const r=state.current;
    const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
    // "Service_Reject_Time" — see technicianTicket's own comment; same field,
    // same Action 5 flow-spec correction, not repeated here.
    const payload=isTow
      ? { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason1: reason, Status:"RSP REJECT" }
      : { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason: reason, Status:"RSP REJECT" };
    await apiUpdate(r.ID, payload);
    // Invites (2026-08-03) — mirror the reject onto this invite too, so a
    // rejected invite doesn't look like it's still awaiting a response.
    // Field name guessed (not given for the reject path specifically) — flag
    // if this errors out live (best-effort/non-blocking either way).
    updateMyInvite(r.ID, { Status:"RSP REJECT", Reject_Reason: reason });
    try{
      const fn=resolve("addRecords");
      // RSID/Vehicle are real Lookup fields on Task_Rejections — see

const FLEET_TECH_NAME_CANDIDATES=[CONFIG.fleetTechnicianNameField,"technician_name","Name","name"];

function fleetTechFirstMatch(rec, candidates){

/* Technician hand-off (user-confirmed 2026-07-31: individual vendors do the
   full on-road flow themselves; vendors with technicians under them hand off
   instead). Two real changes 2026-08-06 (user request):
   1. Called directly from renderAcceptScreen() now, right when the Service

      Fleet_Vendor == this vendor's own NAME (a fragile text match — same
      class of bug fixed everywhere else this week, just via a name instead
      of an id) — now reads the technician ids straight off this vendor's own
      Vendors_Report record (MY_TECHNICIAN_IDS, extracted in
      loadAvailability()) and fetches exactly those records by id. */
async function showHandoffPanel(){
  $("handoffPanel").style.display="block";
  $("fleetTechList").innerHTML='<div class="spin"></div>';
  const r=state.current;
  let techs=[];
  if(MY_TECHNICIAN_IDS.length){
    try{
      // max_records only accepts 200/500/1000 (Zoho error 9250) — was 100.
      const criteria = "("+MY_TECHNICIAN_IDS.map(function(id){ return "ID == "+id; }).join(" || ")+")";
      techs = await apiGetReport(CONFIG.fleetTechnicianReport, criteria, 200);
    }catch(e){ console.warn("[GR-Vendor] showHandoffPanel: multi-lookup fetch failed", e); }
  }
  // Fallback (2026-08-06, user-shown live: Technicians_Report has its own
  // "Vendor Name" column pointing back to the vendor — the OPPOSITE
  // relationship direction from the multi-lookup attempt above, which may
  // not be the real field/may not exist at all). Only runs if that attempt
  // found nothing — fetches every technician and matches client-side against
  // this vendor's own id (if the field turns out to be a real Lookup) or its
  // name (if it's plain text/display-only), trying both of the two most
  // likely link names for that "Vendor Name" column.
  if(!techs.length){
    console.warn("[GR-Vendor] showHandoffPanel: 0 records via", CONFIG.vendorReport+"."+CONFIG.vendorTechniciansField, "(ids:", MY_TECHNICIAN_IDS, ") — falling back to Technicians_Report's own vendor-link field instead.");
    try{
      const all = await apiGetReport(CONFIG.fleetTechnicianReport, null, 200);
      const candidates=["Vendor_Name","Fleet_Vendor"];
      for(const field of candidates){
        const matched = all.filter(function(t){
          const v=t[field];
          const vid=lookupId(v);
          if(currentVendorRecord && vid!=null && String(vid)===String(currentVendorRecord.id)) return true;
          return String(readVal(t,field)||"").trim().toLowerCase()===MY_VENDOR_NAME.trim().toLowerCase();
        });
        if(matched.length){ techs=matched; console.warn("[GR-Vendor] showHandoffPanel: fallback matched", matched.length, "technician(s) via", CONFIG.fleetTechnicianReport+"."+field, "— consider switching CONFIG.vendorTechniciansField/the multi-lookup approach off if this fallback is what's actually working."); break; }
      }
    }catch(e){ console.warn("[GR-Vendor] showHandoffPanel: fallback fetch failed", e); }
  }
  if(!techs.length){ state.fleetTechs=techs; $("fleetTechList").innerHTML='<p style="font-size:13px;color:var(--muted)">No technicians found under this fleet account.</p>'; return; }
  // Added 2026-09-02 (build-plan item #3, wireframe: "Employee list filtered
  // by service type: Mechanics for RSR, Drivers for Towing") — same idea as
  // getRescueTicket's own vendorsFor()/vendorCapabilityMatches(), using
  // Technicians_Report's own "service_capability" field (RSR/TOW/Both,
  // user-created 2026-09-02, user-confirmed exact lowercase API name) — a
  // fleet vendor with both RSR and TOW technicians shouldn't be able to hand
  // a TOW job to an RSR-only technician, or vice versa. A technician with the
  // field left blank still shows (same "missing data shows rather than
  // silently vanishes" philosophy as the rest of this file).
  const capableTechs=techs.filter(function(t){
    const cap=String(t.service_capability||"").trim().toUpperCase();
    if(!cap) return true;
    if(cap==="BOTH") return true;
    return cap===String(r.Service_Type||"").trim().toUpperCase();
  });
  state.fleetTechs=techs=capableTechs;
  if(!techs.length){ $("fleetTechList").innerHTML='<p style="font-size:13px;color:var(--muted)">No technicians capable of '+esc(r.Service_Type||"this")+' work found under this fleet account.</p>'; return; }

  $("fleetTechList").innerHTML = techs.map(function(t){
    const online=String(t[CONFIG.fleetTechnicianStatusField])==="Online";
    const name=fleetTechName(t)||"—";
    const phone=fleetTechPhone(t);
    return `<div class="tech-row"><span class="av">🔧</span>
      <div style="flex:1"><div class="nm">${esc(name)}</div><div class="sub">${phone?esc(phone)+" · ":""}${online?"● Online":"● Offline"}</div></div>

    </div>`;
  }).join("");
  document.querySelectorAll(".tech-row .assign").forEach(function(btn){
    // Disables every Assign button the instant one is clicked (2026-08-06) —
    // belt-and-suspenders alongside renderAcceptScreen()'s own
    // Assigned_Technician check: that one only catches a REOPENED ticket,
    // not a rapid double-click on this same still-open screen before
    // assignTechnician()'s own backToDashboard() navigation completes.
    btn.onclick=function(){
      document.querySelectorAll(".tech-row .assign").forEach(function(b){ b.disabled=true; });
      assignTechnician(btn.dataset.id);
    };
  });
}
async function assignTechnician(techId){
  const tech=state.fleetTechs.find(function(t){ return String(t.ID)===String(techId); });
  if(!tech) return;
  try{
    const r=state.current;
    const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
    const name=fleetTechName(tech)||"";
    const email=tech[CONFIG.fleetTechnicianEmailField]||"";
    // Same retry/fallback as acceptService()'s own 2026-08-19 fix a few
    // dozen lines up: if currentVendorRecord itself never resolved at boot,
    // this hand-off's own Assigned_Vendor/Vendor_Email write (below) would
    // otherwise silently have nothing to write, even though the fleet vendor
    // is clearly logged in and actively handing this job off right now.
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] assignTechnician — currentVendorRecord was NULL at hand-off time; retrying the "+CONFIG.vendorReport+" match once. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL));
      await resolveVendorRecord("assignTechnician retry");
    }
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] assignTechnician — currentVendorRecord STILL NULL after retry: Assigned_Vendor will stay blank (not guessed). Vendor_Email will use LOGIN_EMAIL itself instead. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL), "| currentAvailabilityRecord resolved:", !!currentAvailabilityRecord);
    }
    // Real bug fixed (2026-08-05) — Assigned_Technician is a confirmed
    // useId:true Lookup in getRescueTicket (live "[object Object]" screenshot
    // investigation the same week), but this sent the technician's NAME, not
    // their Technicians_Report id — a Lookup field rejects/silently drops a
    // plain name. Send tech.ID instead; also explains why getRescueTicket's
    // own "Assigned Technician" dropdown always showed "— select —" after a
    // fleet hand-off (that display bug is fixed separately, but this write
    // was sending the wrong value regardless).
    // Technician_Emails (2026-07-31, per user request): a hidden field the
    // user will hide on the real form, mirroring whichever technician's
    // email(s) are involved — just this one for now, since this hand-off
    // still direct-assigns a single technician rather than requesting
    // several at once (see QUESTIONS_TO_ASK.md — will hold a comma-separated
    // list instead, once that multi-request flow exists).
    // Real bug fixed (2026-08-19, user-reported live, screenshot: a ticket
    // handed off to a technician showed Vendor Email/Vendor Email
    // (Assignment)/Assigned Vendor ALL blank on the agent's own Accept
    // screen, even though the technician clearly went on to accept —
    // Expected Arrival Time was populated). Root cause: this hand-off never
    // recorded the FLEET VENDOR's own identity anywhere — only the
    // technician's. technicianTicket's own direct acceptance (acceptService())
    // has no reliable way to know which vendor a job came through, so THIS
    // function is the right place to fix it — currentVendorRecord (this
    // logged-in fleet vendor, handing the job off right now) is directly,
    // reliably available here, exactly like a direct Individual-vendor
    // acceptance's own acceptService() already records for itself. Sets the
    // SAME three fields that path writes (Assigned_Vendor, the branch-
    // specific Vendor_Email1/Vendor_Email2, and the bare Vendor_Email — see
    // that function's own matching 2026-08-19 fix) so a fleet hand-off looks
    // identical, from the agent's own Accept screen, to a vendor accepting
    // directly.
    const vendorId = currentVendorRecord && currentVendorRecord.id;
    const vendorEmail = (currentVendorRecord && currentVendorRecord.data && currentVendorRecord.data[CONFIG.vendorEmailField]) || LOGIN_EMAIL;
    const payload = isTow
      ? { Assigned_Technician:tech.ID, Assigned_Technician_Email:email, Technician_Email1:email, Technician_Emails:email,
          Assigned_Vendor:vendorId, Vendor_Email:vendorEmail, Vendor_Email2:vendorEmail }
      : { Assigned_Technician:tech.ID, Assigned_Technician_Email:email, Technician_Email:email, Technician_Emails:email,
          Assigned_Vendor:vendorId, Vendor_Email:vendorEmail, Vendor_Email1:vendorEmail };
    await apiUpdate(r.ID, payload);
    // Invites (2026-08-03, user-confirmed "invite covers all") — same
    // mechanism as the agent's own vendor invites, one record per assigned
    // technician, so this technician's own dashboard picks the ticket up via
    // Invites_Report. Best-effort/non-blocking, same pattern as Task_Rejections.
    // Real bug fixed 2026-08-03 (schema rebuild): this used to write
    // tech.ID (a Technicians_Report ID) into the `Vendor` field, which is a
    // Lookup targeting Vendors_Report — a Zoho Lookup can only point at one
    // form, so that could never have actually resolved. Invites now has a
    // separate `Technician` Lookup (-> Technicians_Report) for exactly this
    // case; getRescueTicket's own vendor invites still use `Vendor` only.
    try{
      const fn=resolve("addRecords");
      if(fn) await fn({ app_name:CONFIG.appName, form_name:CONFIG.invitesForm, payload:{ data:{ RSID:r.ID, Technician:tech.ID } } });
    }catch(e){ console.warn("[GR-Vendor] could not create Invites record for technician", name, e); }
    toast("Assigned to "+name,"ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not assign","err"); }
}

async function markReachedRsr(){
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Arrival photo is required","err"); return; }
  setDisabled("reachedBtn",true);
  try{
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    // Reach Location + Distance_Reach_To_Breakdown (2026-08-11, user
    // request, "Missing Fields & Field Behavior" spec) — Reach never
    // captured a live GPS fix before this at all, unlike Accept
    // (RSP_Start_Latitude/Longitude) and Cancel (Cancel_Location_Lat/Lon),
    // both of which already do. Distance_Reach_To_Breakdown is a BRAND NEW
    // field, deliberately separate from Roundtrip_Distance just above —
    // that one is Office→Breakdown→Office and stays untouched; this is a
    // plain one-way distance from THIS click's own position to the
    // breakdown location, mirroring exactly how Distance_To_Breakdown
    // already works at Accept (see acceptService() below). Best-effort —
    // a denied/unavailable location just means these two fields are
    // skipped, same tolerance Accept/Cancel's own GPS fixes already have.
    // Fetched BEFORE the round-trip calc below (moved up 2026-09-07, see
    // that calc's own comment for why).
    const reachPos = await getPositionSafe();
    // Round Trip Distance (2026-09-07, user-provided LOCATIONS-DISTANCES-
    // DATETIME spec, "RSR-3(a)") — real bug fix: this used to always route
    // through the static ticket breakdown location C (r.Latitude/Longitude)
    // even though a live GPS fix (reachPos, spec's own "E" point) is taken
    // at this exact Reach click a few lines below — the fix captured E but
    // the round trip never used it. Spec defines this leg as Office->E->
    // Office, not Office->C->Office. Uses reachPos when available (matches
    // spec exactly); falls back to the static breakdown C only if GPS is
    // denied/unavailable, so Roundtrip_Distance is never simply skipped
    // the way Distance_Reach_To_Breakdown below is allowed to be.
    const rtLat = reachPos ? reachPos.lat : bLat, rtLon = reachPos ? reachPos.lon : bLon;
    const rt=await calcRoundTripKm(rtLat,rtLon,parseCoord(r.DropLocationLat),parseCoord(r.DropLocationLong),travelModeFor(r));
    // ETA (mins) input hidden from this screen 2026-08-05 (user request) —
    // whatever ETA was already computed/saved at Accept time stays as-is;
    // simply not included in this payload, same as leaving the old manual
    // box blank always did (Zoho keeps the existing stored value untouched).
    const payload={ Reach_Time: fmtDateTime(new Date()), Roundtrip_Distance: rt, Status:"WORK IN PROGRESS" };
    if(reachPos){
      payload.Reach_Location_Lat=reachPos.lat; payload.Reach_Location_Lon=reachPos.lon;
      const reachDist = await calcDistanceETA(reachPos.lat,reachPos.lon,bLat,bLon,travelModeFor(r));
      if(reachDist) payload.Distance_Reach_To_Breakdown=reachDist.distanceKm;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached","ok");
    // WhatsApp "Reach Time" message (2026-09-06, RESCUE Repair Service
    // Logic Flow spec: "Mechanic/Driver app - Reach Breakdown Location
    // page | on click REACH button | Send 10"). Template name/no-params
    // shape is a best-effort guess (no visible parameter slots in the
    // spec's own template text) — same "flagged, not confirmed" pattern
    // as every template name in getRescueTicket. Fire-and-forget, after
    // the real save above — a failed send never blocks the Reach action
    // itself, matching this app's existing tolerance for GPS/photo steps.
    /* Template name corrected 2026-09-22 - "reach_time" is not in the approved
       catalogue; #10 is share_rescuer_reach_time_ WITH a trailing underscore
       (the spec flags it explicitly). Still zero parameters, as approved. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescuer_reach_time_", []);
    goToStatus("WORK IN PROGRESS");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedBtn",false); }
}

    // Cancellation_Time/Cancel_Location_Lat/Lon/Cancel_Distance capture,
    // not repeated here.
    const payload=isTow ? { Reject_Reason2:reason, Status:"RSP CANCELLED" } : { Cancel_Reason:reason, Status:"RSP CANCELLED" };
    payload.Cancellation_Time=fmtDateTime(new Date());
    const pos = await getPositionSafe();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon,cancelTravelMode) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Distance_Cancel_To_Breakdown (2026-08-11, user request, "Missing
      // Fields & Field Behavior" spec item 2) — BRAND NEW field, deliberately
      // different from Cancel_Distance just above (Accept location → Cancel
      // location) — this is Cancel location → the ticket's own static
      // breakdown location, which no field/calc covered before this at all.
      const bLatC=Number(r.Latitude), bLonC=Number(r.Longitude);
      const cancelToBreakdown = !isNaN(bLatC) && !isNaN(bLonC) ? await calcDistanceETA(pos.lat,pos.lon,bLatC,bLonC,cancelTravelMode) : null;
      if(cancelToBreakdown) payload.Distance_Cancel_To_Breakdown=cancelToBreakdown.distanceKm;
      // Client-requested addition (2026-08-04) — see technicianTicket's/
      // driverTicket's own matching comments: round trip office -> this
      // vendor's current (cancel-click) position -> office, for both branches
      // (calc4PointRoundtrip's no-drop case covers RSR just as well as
      // calcRoundTripKm did — switched to it here so both branches also get
      // the Office_To_Mechanic/Mechanic_To_Breakdown/Breakdown_To_Office
      // per-leg fields "this also work for the Driver" asked for, not just
      // the Roundtrip_Distance total).
      const legs = await calc4PointRoundtrip(pos.lat,pos.lon,null,null,cancelTravelMode);
      payload.Roundtrip_Distance = legs.total;
      payload.Office_To_Mechanic = legs.officeToMechanic;
      payload.Mechanic_To_Breakdown = legs.mechanicToBreakdown;
      payload.Breakdown_To_Office = legs.dropToOffice;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not cancel","err"); }
  finally{ setDisabled("confirmCancelBtn",false); }
}

    // though (a) the vendor's own live GPS fix from the earlier Reach click
    // is already stored in Reach_Location_Lat/Lon (spec's "E"), and (b) a
    // fresh live GPS fix is taken a few lines below at THIS click (spec's

    // never fed into this round-trip calc. Spec defines this leg as
    // Office->E->B->Office, not Office->C->A->Office. Falls back to the
    // static C/A only when the live/stored point isn't available (e.g. a
    // ticket that reached before Reach_Location_Lat/Lon existed, or GPS
    // denied here), so this never simply breaks on older/incomplete data.
    const eLat=parseCoord(r.Reach_Location_Lat), eLon=parseCoord(r.Reach_Location_Lon);

// fileCountFor()/zohoFileDownloadUrl() (2026-08-21, ported from
// getRescueTicket's own already-working versions — same account/app/report,
// CONFIG.appName/reportName below are identical to that widget's, so this
// isn't a new guess) — real bug fixed, user-reported live: "when photo is
// clicked it's sent immediately... but if vendor closes app and opens
// again... fields display as empty, so vendor has to click all photos
// again." Root cause: renderPhotoGrid() and every "N photos required" check
// below only ever looked at state.photos[field] — browser File objects
// picked THIS session — which starts fresh/empty on every app load
// regardless of what's genuinely already saved on the ticket record itself.
function fileCountFor(rawValue){
  if(Array.isArray(rawValue)) return rawValue.length;
  return rawValue ? 1 : 0;
}
function zohoFileDownloadUrl(recordId, fieldName, rawValue, index){
  if(!recordId || !rawValue || rawValue===true) return null;
  const first = Array.isArray(rawValue) ? rawValue[index||0] : rawValue;
  if(!first || first===true) return null;
  const raw = (typeof first==="string") ? first
    : (first && typeof first==="object") ? (first.filepath||first.value||first.display_value||null)
    : null;
  if(!raw) return null;
  const m = raw.match(/filepath=([^&]+)/i);
  const filepath = m ? decodeURIComponent(m[1]) : raw;
  const clean = String(filepath).replace(/^\/+/,"");
  return "https://creatorapp.zoho.in/"+ZOHO_SCOPE_NAME+"/"+zohoAppLinkName()+"/report/"+CONFIG.reportName+"/"+recordId+"/"+fieldName+"/download-file?filepath=/"+encodeURIComponent(clean)+"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
// Combined "how many photos does this field genuinely have right now" —
// whatever's already saved on the ticket record (from a PREVIOUS session —
// state.current is only ever set fresh by openTicket(), never mutated after
// an upload, so these two counts can never overlap/double-count) plus
// whatever's been picked/captured THIS session. Every "N photos required"
// check below uses this instead of state.photos[field] alone, so a vendor
// who already satisfied a field in an earlier session is never wrongly
// blocked from proceeding again just because they reopened the app.
function effectivePhotoCount(fieldName){
  const already=fileCountFor(state.current && state.current[fieldName]);
  const picked=(state.photos[fieldName]||[]).length;
  return already+picked;
}
function wirePhotoField(fieldName,max){ renderPhotoGrid(fieldName,max); }
// Visible confirmation of uploadPhotoNow()'s own background upload for this
// exact file — "ok" once apiUpload() has actually succeeded, "failed" if it
// errored (uploadPendingPhotos() will still retry it at the normal save
// step either way), "pending" (not yet in either set) while still in flight.
function uploadBadgeHtml(f){
  if(state.uploadedPhotoFiles.has(f)) return '<span class="up-badge ok" title="Saved">✓</span>';
  if(state.failedPhotoFiles.has(f)) return '<span class="up-badge failed" title="Save failed — will retry when you submit">!</span>';
  return '<span class="up-badge pending" title="Saving…">⋯</span>';
}
// Swaps each already-uploaded placeholder tile's plain "Saved" badge for a
// real thumbnail when a usable direct URL can be built — same
// onerror-recovery idea as getRescueTicket's own hydrateFilePreviewsIn():
// reverts cleanly back to the plain badge instead of leaving a permanently
// broken image icon if the URL happens to fail to load.
function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){
    const idx=Number(el.dataset.alreadyIdx||0);
    const url=zohoFileDownloadUrl(state.current.ID, fieldName, rawValue, idx);
    if(!url) return; // stays as the plain "✓ Saved" badge placeholder already in the DOM
    const img=document.createElement("img");
    img.onerror=function(){
      console.warn("[GR-Vendor] hydrateAlreadyUploadedThumbs: direct URL failed to load for", fieldName, "index", idx, "— reverting to the plain 'Saved' badge.");
      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';
    };
    img.onload=function(){
      const badge=document.createElement("span");
      badge.className="up-badge ok"; badge.title="Already saved"; badge.textContent="✓";
      el.appendChild(badge);
    };
