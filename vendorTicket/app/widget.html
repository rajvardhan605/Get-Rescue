<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as every other Get-Rescue widget — kept identical on
   purpose (2026-07-31: "the theme will be same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}

.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.st.rej{background:var(--stop-soft);color:var(--stop)}
.svc{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;margin-right:6px}
.svc.rsr{background:var(--signal-soft);color:var(--signal-deep)}
.svc.tow{background:var(--info-soft);color:#1d5fc0}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
/* minmax(0,1fr) + wrapping, 2026-09-25 — client-reported: the vehicle name showed
   correctly on iPhone but was clipped or missing on Android.
   Not a data difference: both devices receive the same name. A grid column sized
   plain `1fr` keeps min-width:auto, so the track REFUSES to shrink below its
   content's min-content width. A long unbroken value ("OTHER TWO WHEELER",
   "PUNCTURE-TUBELESS TYRE") therefore pushes the column wider than the card and
   overflows instead of wrapping. iOS Safari and Android Chrome differ in viewport
   width and font metrics, so the same layout clips on one and fits on the other.
   minmax(0,1fr) lets the track shrink and the wrap rules below let the text break,
   which is additive: nothing that fits today renders any differently. */
.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;margin-bottom:6px}

  border-radius:10px;padding:11px 12px;box-shadow:var(--sh-2);animation:mechNotifIn .2s ease-out}

<script>
/* =====================================================================
   GET-RESCUE · VENDOR WIDGET
   Sibling of technicianTicket/driverTicket's widget.html — same CORE, but
   covers a vendor's own full lifecycle across BOTH RSR and TOW tickets:
   - Accept/Reject (common to both branches).
   - If the logged-in vendor is INDIVIDUAL: does the full on-road flow
     themselves (Reach->WIP->Payment for RSR, Reach->Loading->ReachedDrop->
     Unloading->Payment for TOW) — literally the same screens as
     technicianTicket/driverTicket, branched here by Service_Type instead of
     being two separate widgets.
   - If the logged-in vendor is FLEET: after Accept, shows a hand-off screen
     to assign one of their own technicians instead of doing the on-road
     work themselves — user-confirmed 2026-07-31 ("Vendor does everything an
     individual, PLUS hands off if fleet").
   See technicianTicket/app/widget.html's own header comment for the fuller
   set of confirmed decisions this whole build relies on (Create_Case only,
   no "Invites" form, etc.) — not re-explained per file here. Google Maps
   Distance Matrix API key provided 2026-08-04 (see GOOGLE_MAPS_API_KEY
   below) — Haversine is now only the fallback if that call fails.
   SCHEMA DECISIONS (2026-08-03 — all Zoho forms were deleted and rebuilt
   from scratch this round, so these are now the authored field names, not
   guesses against a pre-existing form — see FIELDS.md/ACCESS.md):
   - Individual vs. Fleet lives on `Vendors_Report.Vendor_Type`
     (values "Individual"/"Fleet").
   - A technician's owning fleet vendor lives on
     `Technicians_Report.Fleet_Vendor`, matched by name string (not ID).
   - Whether a fleet vendor's Accept should write "RSP ON THE WAY" directly
     (as implemented) or some other intermediate status before a technician
     is actually picked.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  // Added 2026-08-05 (user request — "Vehicle ID showing, not the Vehicle
  // name") — Vehicle is a real Lookup; this widget's own fetch (field_config
  // "all" included) still comes back with a bare Vehicle_Master_Report id,
  // not an enriched display object, so readVal() alone can't show a name.
  // Same report/name-field convention getRescueTicket's own vehicle picker
  // already uses — see vehicleDisplayFor()'s own comment for how a wrong
  // guess here degrades safely.
  vehicleMasterReport: "Vehicle_Master_Report",
  vehicleNameField: "Name",
  // Added 2026-08-05 (user request — "[object Object]" shown instead of the
  // real issue name on the dashboard card) — Vehicle_Issue is a multiselect
  // Lookup; its raw array items come back as Lookup objects with no usable
  // display_value of their own, so a plain .join() (readVal()'s own array
  // handling) stringified each one to "[object Object]". Same report/label
  // convention getRescueTicket's own Vehicle_Issue picker already uses.
  issueReport: "Vehicle_Issue_Report",
  issueNameField: "Issue_Name",
  // Vendors_Report — this vendor's own identity for ticket matching
  // (Assigned_Vendor/Vendors1/Invites, all real Lookups into THIS report).
  vendorReport: "Vendors_Report",
  vendorEmailField: "Email",
  vendorNameField: "Vendor_Name",
  vendorPhoneField: "Mobile_Number_01", // confirmed (FIELDS.md, and already used in getRescueTicket's recordVendorPayment) — needed for the WhatsApp "dispatched" message (spec template 8)
  /* NOT confirmed live — see this file's own header comment. */
  vendorTypeField: "Vendor_Type",
  // Availability toggle target corrected 2026-08-05 (user request) — this
  // widget's own comment previously claimed toggleGetRescue used Vendors_Report
  // for the toggle too, but toggleGetRescue's OWN CONFIG actually says
  // "My_Availability_Vendor" (a separate report from the vendor master) —
  // that comment was simply wrong. Deliberately kept independent of
  // vendorReport above: My_Availability_Vendor is a SEPARATE form, so its own
  // record id is NOT a Vendors_Report id and must never be used directly for
  // Assigned_Vendor/ticket matching.
  //
  // 2026-10-06: I briefly recorded here that this note was stale, reasoning
  // from the Current_Latitude round trip below that the two had to be one
  // form. That was WRONG, and ACCESS.md says so plainly: the 2026-08-03
  // unification was UN-DONE on 2026-08-05 because it did not work for the
  // vendor portal. The note stands.
  //
  // resolveVendorRecord() does still consult this report when Vendors_Report
  // yields no match - but it adopts the id ONLY after finding a real Invites
  // row that references it. If the two id spaces differ, as this comment says
  // they do, no such row exists and the fallback never fires. That guard is
  // why being wrong above cost nothing. Field names match toggleGetRescue's own
  // toggle's own on/off state. Field names match toggleGetRescue's own
  // (working) guesses for this exact report.
  availabilityReport: "My_Availability_Vendor",
  availabilityEmailField: "Email",
  availabilityStatusField: "Availability_Status",
  // Added 2026-08-17 (user request — see pingCurrentLocation()'s own
  // comment). Same field names getRescueTicket's own CONFIG.vendorCurrentLatField/
  // vendorCurrentLonField expect on Vendors_Report — written here through
  // My_Availability_Vendor's own record, same as Availability_Status itself
  // already is; that report's writes are already confirmed to reflect
  // correctly into Vendors_Report's own reads (the Online/Offline toggle
  // already works this way live). Brand-new fields, not yet created in Zoho
  // Studio — see FIELDS.md's own note.
  availabilityCurrentLatField: "Current_Latitude",
  availabilityCurrentLonField: "Current_Longitude",
  fleetTechnicianReport: "Technicians_Report",
  // Superseded 2026-08-06 (user request) — see showHandoffPanel()'s own
  // comment for the full switch from a Fleet_Vendor name-match to a real
  // multi-lookup field read directly off this vendor's own Vendors_Report
  // record. fleetTechnicianLinkField kept only as a fallback if that new
  // field ever comes back empty/unreadable, not the primary path anymore.
  fleetTechnicianLinkField: "Fleet_Vendor",
  // Both confirmed wrong live 2026-08-06 (every row showed "—") — kept as the
  // FIRST candidate in FLEET_TECH_NAME_CANDIDATES/FLEET_TECH_PHONE_CANDIDATES
  // rather than deleted, so a future correction just needs updating the one
  // value here, not the candidate list itself.
  fleetTechnicianNameField: "Technician_Name",
  fleetTechnicianPhoneField: "Phone",
  fleetTechnicianEmailField: "Email",
  fleetTechnicianStatusField: "Availability_Status",
  // NOT confirmed — user described this as "the technicians multi lookup
  // field" on Vendors_Report without giving its exact link name; "Technicians"
  // is the natural guess by analogy with every other field-name convention in
  // this app. loadAvailability()'s own diagnostic will say clearly if this is
  // wrong (0 ids extracted despite the vendor genuinely having technicians).
  vendorTechniciansField: "Technicians",
  // Invites (2026-08-03, user-confirmed): one record per invited vendor per
  // ticket — RSID (Lookup -> Create_Case), Vendor (Lookup -> Vendors_Report).
  // getRescueTicket's own JS creates these when the agent saves the
  // Assignment step. This widget's dashboard now finds "my tickets" by first
  // finding MY Invites records, then loading the linked Create_Case tickets —
  // see loadDashboard().
  invitesForm: "Invites",
  invitesReport: "Invites_Report"
};
// "RSP REJECT" added 2026-08-20 (user-reported live: after rejecting a
// ticket, it just vanished from "My Tickets" with no lasting sign it was
// ever rejected — confirmed as the actual gap, and confirmed the fix should
// keep it visible here with a clear "Rejected" pill rather than a separate
// screen/tab). See STATUS_PILL's own new entry and renderActionScreen()'s
// own new branch for the rest of this fix.
const MY_STATUSES = ["RSP IRA (INVITE RESPONSE AWAITED)","RSP ON THE WAY","WORK IN PROGRESS","LOADING","TO DROP LOCATION","UNLOADING","REMAINING FEE DUE","RSP REJECT"];
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
// Corrected 2026-09-07 (user-provided LOCATIONS-DISTANCES-DATETIME spec) —
// previous value (12.967827711025203, 77.611228) was off by ~13-20m from the
// spec's confirmed office coordinates.
const OFFICE_LAT=12.967945122837245, OFFICE_LON=77.6110507612277;

// Direct download-URL construction (2026-08-21, ported from getRescueTicket's
// own already-working zohoFileDownloadUrl()) — see fileCountFor()/
// zohoFileDownloadUrl() below for why this is needed here too. Same account/
// app/report as getRescueTicket (CONFIG.appName/reportName below are
// identical — "get-rescue"/"Agent_Ticket_Report" — confirmed live there
// already), so reusing this exact constant/pattern is not a new guess.
const ZOHO_SCOPE_NAME = "getrescued";
let INIT_PARAMS = null;
function zohoAppLinkName(){
  const frag = (INIT_PARAMS && INIT_PARAMS.envUrlFragment) || "";
  return CONFIG.appName + (/development/i.test(frag) ? "-development" : "");
}
let SDK_READY=false, LOGIN_EMAIL="", IS_FLEET=false, MY_VENDOR_NAME="", MY_VENDOR_PHONE="";
// This vendor's own assigned technician ids, read straight off their own
// Vendors_Report record's multi-lookup field (2026-08-06, user request) —
// see CONFIG.vendorTechniciansField's own comment. Empty array = no
// technicians under this vendor, regardless of Vendor_Type/IS_FLEET.
let MY_TECHNICIAN_IDS=[];
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams==="function"; }
function resolve(method){
  const C=window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces=[C.DATA,C.PUBLISH,C.META,C.UTIL,C.FILE];
  for(let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria=criteria;
  // Debug logging (2026-07-31) — every getRecords call this widget makes
  // (dashboard tickets, own availability record, fleet technician list) goes
  // through here, so this is the one place to see the exact request payload
  // and the raw response while diagnosing why a ticket does/doesn't show up.
  console.log("[GR-Vendor] getRecords request:", JSON.parse(JSON.stringify(cfg)));
  try{
    const r=await fn(cfg);
    console.log("[GR-Vendor] getRecords response:", r);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  } catch(e){ console.log("[GR-Vendor] getRecords error:", e); return []; }
}
async function apiUpdate(id, data){ return apiUpdateReport(CONFIG.reportName, id, data); }
async function apiUpdateReport(report, id, data){
  const fn=resolve("updateRecordById") || resolve("updateRecord"); if(!fn) throw new Error("updateRecordById unavailable");
  const r=await fn({ app_name:CONFIG.appName, report_name:report, id:id, payload:{ data:data } });
  if(!r || r.code!==3000) throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Update failed");
  return true;
}
// WhatsApp sending (2026-09-06) — copied verbatim from getRescueTicket's own
// already-proven sendWhatsAppTemplate()/formatIndianPhone(), per the user's
// Repair/Towing Service Logic Flow specs (this widget covers both branches).
// This widget had zero WhatsApp integration before now. Same Custom API
// (sendWhatsAppMessage), same param shape, same fire-and-forget convention
// — never blocks or throws into the caller's own existing save/navigate flow.
// Real bug fixed 2026-09-13 — same fix, same reason, as getRescueTicket's
// own matching function (that file's own isValidIndianPhoneDigits() already
// anticipates and strips this exact shape for validation purposes — this
// widget has no equivalent validator, but the underlying number shape is
// the same): a 12-digit number already starting "91" (no "+") used to get
// ANOTHER "+91" prepended here, producing a broken double-country-code
// number for tel: links.
function formatIndianPhone(v){
  if(!v) return "";
  const s=String(v).trim();
  if(s.charAt(0)==="+") return "+"+s.slice(1).replace(/\D/g,"");

    if(r && typeof r==="object" && "code" in r && r.code!==3000){

function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function telViaIframe(url){

   at all, with no error to catch.

   Fixed by reusing openViaParentNavigation() — the host hand-off the map links were
   already given for this identical problem. It posts PARENT_NAVIGATION to the
   Creator app, which is native code and can pass a URL to the OS; the WebView
   cannot. Nothing new is invented here, the same escape hatch is simply applied to
   tel: as well as to maps.

   the path they use now, byte for byte — this cannot regress them. Two reasons not
   to make the host attempt universal: it is still unproven which action shape (if
   any) the host honours, and a host that ACCEPTED the event without acting would
   swallow the call silently on the one platform that currently works.

   "still visible after N ms" reads as failure on the platform where it succeeded.

   client's request, so with nothing else there the vendor gets no feedback

function dialNumber(tel){

     than assumed, so this function stays correct if it is ever called from
     somewhere else. */
  if(!IS_ANDROID){ telViaIframe(url); return; }

    .then(function(){ return openViaParentNavigation(url); })
    .catch(function(){ return false; })
    .then(function(ok){
      if(ok){ console.log("[GR] dialNumber: handed tel: to the Creator app"); return; }

      // that refuses it, and it still works on an Android browser outside the app.
      telViaIframe(url);

function copyNumber(tel){
  const num = String(tel||"").trim();
  if(!num) return;
  let ok = false;

    // A temporary textarea rather than navigator.clipboard: the clipboard API
    // needs a secure context and a permission this WebView does not reliably
    // grant, and execCommand still works where it does not.
    const ta = document.createElement("textarea");
    ta.value = num;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, num.length);
    ok = document.execCommand("copy");
    ta.remove();
  }catch(e){ ok = false; }
  toast(ok ? ("Copied " + num) : num, ok ? "ok" : "");
}
function wireTelActions(){
  document.querySelectorAll("#ticketInfo .tel-link").forEach(function(a){
    /* Real bug fixed 2026-09-29, client-reported: tapping the number on an iPhone
       inside the Creator app did nothing whatsoever.

       Root cause, and it was my own earlier change: this handler called
       preventDefault() on EVERY platform and then routed the tap into a hidden
       tel: iframe. WKWebView has not acted on a tel: iframe since iOS 9 — Apple
       dropped it; the trick only ever worked in the old UIWebView. So on iPhone
       this was cancelling the one thing that does work (the anchor's own href,
       which WKWebView hands to the OS natively from a real link click) and
       substituting the one thing iOS ignores. Silent failure, no error to see.

       The two platforms want opposite treatment, which is why one code path could
       never satisfy both:
         iOS / desktop — let the href navigate. Native, no interception.
         Android       — the href navigating is exactly what produced

                         handed to the Creator host instead (see dialNumber).

       on the anchor either way. */
    a.onclick = function(ev){
      if(!IS_ANDROID) return;            // iOS / desktop: the href does the work
      ev.preventDefault();
      dialNumber(a.getAttribute("data-tel"));
    };
  });
  document.querySelectorAll("#ticketInfo .tel-copy").forEach(function(b){
    b.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); copyNumber(b.getAttribute("data-tel")); };
  });
}

/* Zoho hands dates back as "29-Sep-2026 15:52:11" or "29-Sep-2026 03:52:11 PM",

   an ISO value still works, then both Zoho shapes in one pattern. Returns a
   number for comparing, or null when the value is absent or unrecognised — the
   caller treats null as "no usable time" and falls back rather than guessing. */
function parseInvitedAt(str){

  const native = new Date(str);
  if(!isNaN(native)) return native.getTime();
  const m = String(str).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?$/);

  if(ap==="am" && hh===12) hh = 0;

  return isNaN(d) ? null : d.getTime();

   then every read returns undefined while every write still succeeds — which
   is silent, and is why the 2-minute timeout never fired for anyone.
   Added_Time is a system field Zoho stamps on every record, so it is the
   natural second answer: an invite row is created at invite time, making the
   two values the same moment in practice.

   which at a 30s poll would be hundreds of identical lines an hour. If that

    if(!INVITED_AT_WARNED){

   raised. Those are different things, and the difference IS the bug: the ticket
   the client was looking at was their newest invite yet carried the LOWEST
   record id, because it was an older case invited out moments earlier. Sorting
   on the ticket's own id or creation time would have left it exactly where it
   was — at the bottom — and looked like the fix had done nothing.

   is that arrival time. Two fallbacks behind it, because a field can be absent

function sortMyTicketsNewestFirst(list){
  const keyOf = function(r){
    const inv = state.inviteByTicketId ? state.inviteByTicketId[String(r.ID)] : null;

  // field value, not the normalized +91 form) so this is purely additive —
  // every other row in this table is completely unchanged.
  $("ticketInfo").innerHTML = rows.map(function(p){
    const valueHtml = (p[0]==="Phone")
      /* Dial handling, rewritten 2026-09-27.

         The previous attempt used target="_top". That was wrong here: the Zoho
         Creator Android app's WebView does not hand tel: to the OS, it tries to
         LOAD it, so forcing a top-frame navigation replaced the whole app with
         "Webpage not available / ERR_UNKNOWN_URL_SCHEME". Worse than doing nothing.

         Now the tap goes through dialNumber(), which points a HIDDEN IFRAME at the
         tel: URI. Where the platform handles the scheme (iOS, desktop, an Android
         browser) the dialler opens exactly as before. Where it does not, the
         failure is contained inside that throwaway iframe — the page the vendor is
         looking at never navigates, so there is no error screen.

         A Copy button sits beside the number because that containment cuts both
         ways: on a WebView that refuses tel: entirely, nothing visible happens, and
         the vendor needs a way to get the number into their dialler. Deliberately a
         real button rather than guessing after a timeout whether the call started —
         iOS shows a confirm dialog and leaves the page visible, so any such guess
         fires a false "it did not work" on the platform where it did.

         The href is kept on the anchor so a long-press still offers Call / Add to
         contacts natively; the click handler prevents the default navigation. */
      ? `<span class="v tel-wrap"><a class="tel-link" href="tel:${esc(formatIndianPhone(p[1]))}" data-tel="${esc(formatIndianPhone(p[1]))}">${esc(p[1])}</a></span>`
      : `<span class="v">${esc(p[1])}</span>`;
    return `<div><span class="k">${esc(p[0])}</span>${valueHtml}</div>`;
  }).join("");
  wireTelActions();
}

/* ---------- per-status, per-Service_Type action screen router ---------- */
function renderActionScreen(){
  renderTicketInfo();
  // Any screen change cancels the payment poll; renderPaymentScreen() restarts it.
  stopPaymentPoll();
  const st=String(state.current[CONFIG.stageField]||"").trim().toUpperCase();
  const isTow=String(state.current[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
  /* MY OWN REJECT WINS OVER THE TICKET STATUS — 2026-10-03. Now that a reject
     no longer moves the shared ticket, a vendor who rejected would otherwise
     still be looking at "RSP IRA" and be shown the Accept screen again. This
     branch is what makes the kept-visible ticket genuinely read-only: it
     renders a message and no actions at all. */
  const myInv=state.inviteByTicketId && state.inviteByTicketId[String(state.current.ID)];
  if(inviteIsRejected(myInv) || st==="RSP REJECT"){
    $("ascreenTitle").textContent="Rejected";
    const reason=(myInv && myInv.Reject_Reason) || (isTow ? state.current.Reject_Reason1 : state.current.Reject_Reason);
    $("ascreenBody").innerHTML = `<div class="empty-state">
      <h3 style="color:var(--stop)">You Rejected This Ticket</h3>
      <p>${reason?esc(reason):"No reason recorded."}</p>
      <p style="font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:10px">This ticket is no longer actionable by you and will clear from your list automatically.</p>
    </div>`;
  }
  else if(st==="RSP IRA (INVITE RESPONSE AWAITED)"){ $("ascreenTitle").textContent="Service Acceptance"; renderAcceptScreen(); }
  else if(st==="RSP ON THE WAY"){ $("ascreenTitle").textContent="Reach Breakdown Location"; isTow?renderReachScreenTow():renderReachScreenRsr(); }
  else if(st==="WORK IN PROGRESS"){ $("ascreenTitle").textContent="Work In Progress"; renderWipScreen(); }
  else if(st==="LOADING"){ $("ascreenTitle").textContent="Loading"; renderLoadingScreen(); }
  else if(st==="TO DROP LOCATION"){ $("ascreenTitle").textContent="Reached Drop Location"; renderReachedDropScreen(); }
  else if(st==="UNLOADING"){ $("ascreenTitle").textContent="Unloading & Handover"; renderUnloadingScreen(); }
  else if(st==="REMAINING FEE DUE"){ $("ascreenTitle").textContent="Final Payment"; renderPaymentScreen(); }
  // The RSP REJECT branch moved to the top of this chain on 2026-10-03 so it
  // can also catch a reject that lives only on this vendor's own invite.
  else { $("ascreenBody").innerHTML='<div class="empty-state"><p>Nothing to do on this ticket right now.</p></div>'; }
}

  // vendor-link field) lives INSIDE that function, specifically for the case

  // actually run. Always call it now; it decides internally (via both
  // attempts) whether there's anything to show.
  // Real bug fixed (2026-08-06, user request: "vendor should only be able to
  // assign to ONE technician") — reopening this same still-pending ticket

    // and TOW branches (the two spec PDFs list it identically). Template

    // template — same "flagged, not confirmed" pattern as every other
    // template name in this app. Fire-and-forget, same as the Reach

    /* Template name corrected 2026-09-22 against the approved WhatsPortal
       catalogue ("Get Rescued - WhatsApp Template API", revised 16 Sep 2026).
       "dispatch_eta" does not exist in the workspace and was returning 404

       share_rescue_service_details_and_eta, the same one getRescueTicket's own
       sendRescuerEtaMessage() already uses. Two further spec rules applied:
       the template writes the literal word "Hrs" after {{3}}, so the ETA is
       converted from minutes to hours (sending 45 would otherwise read
       "45 Hrs"); and empty strings are rejected with 422 message_rejected, so
       every missing value is sent as "-" instead. */
    /* SEND 8, then SEND 9 — LOGIC-REPAIR / LOGIC-TOW: "SEND 8 with vendor/mechanic

       SEND 9 goes out immediately rather than 5 minutes later. A widget cannot

    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescue_service_details_and_eta", [MY_VENDOR_NAME||"-", MY_VENDOR_PHONE||"-", customerEtaText(dist&&dist.etaMins)||"-"])

async function rejectService(){
  const reason=$("rejectReason").value;
  if(!reason){ toast("Please pick a reject reason","err"); return; }
  setDisabled("confirmRejectBtn",true);
  try{
    const r=state.current;
    const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
    // "Service_Reject_Time" — see technicianTicket's own comment; same field,
    // same Action 5 flow-spec correction, not repeated here.
    /* THE REJECT GOES ON THIS VENDOR'S INVITE FIRST — 2026-10-03.
       Deliberately unchanged in shape from the 2026-08-03 call it replaces:
       the same two fields, so it carries no new risk of an unknown column
       taking the whole update down with it. */
    updateMyInvite(r.ID, { Status:"RSP REJECT", Reject_Reason: reason });
    stampRejectLocally(r.ID);
    /* THE SHARED TICKET IS ONLY TOUCHED WHEN NOBODY ELSE IS LEFT.
       Client-reported 2026-10-03: "if one vendor clicks reject, the ticket on
       all the other vendors' apps is also marked as REJECTED, preventing
       further action by them." Root cause was writing Status:"RSP REJECT"
       straight onto the Create_Case record every invited vendor is reading.
       A single-vendor reject still moves the ticket exactly as before, so the
       agent-side view of that case is unchanged. */
    if(await otherInvitesStillLive(r.ID)){
      console.log("[GR-Vendor] rejectService: other invited vendors are still live on ticket", r.ID, "— leaving the shared ticket status alone so they can still accept it.");
    } else {
      const payload=isTow
        ? { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason1: reason, Status:"RSP REJECT" }
        : { Service_Reject_Time: fmtDateTime(new Date()), Reject_Reason: reason, Status:"RSP REJECT" };
      await apiUpdate(r.ID, payload);
    }
    try{
      const fn=resolve("addRecords");
      // RSID/Vehicle are real Lookup fields on Task_Rejections — see
      // technicianTicket's own comment on this same call (incl. the
      // 2026-08-03 Case_ID -> RSID rename).
      // Reverted the {"ID":...} object-wrapping attempt — broke saving.
      if(fn) await fn({ app_name:CONFIG.appName, form_name:"Task_Rejections", payload:{ data:{
        RSID:r.ID, RSP_Name:$("techName").textContent, Reason:reason,
        Rejected_At:fmtDateTime(new Date()), Vehicle:r[CONFIG.vehicleField], Vehicle_Issue:issueNamesFor(r)
      } } });
    }catch(e){ console.warn("Task_Rejections log failed (non-blocking)", e); }
    toast("Rejected","ok");
    // "navigate to home page of app user" per the flow spec.
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not reject","err"); }
  finally{ setDisabled("confirmRejectBtn",false); }
}

  // not be the real field/may not exist at all). Only runs if that attempt
  // found nothing — fetches every technician and matches client-side against
  // this vendor's own id (if the field turns out to be a real Lookup) or its
  // name (if it's plain text/display-only), trying both of the two most
  // likely link names for that "Vendor Name" column.
  if(!techs.length){
    console.warn("[GR-Vendor] showHandoffPanel: 0 records via", CONFIG.vendorReport+"."+CONFIG.vendorTechniciansField, "(ids:", MY_TECHNICIAN_IDS, ") — falling back to Technicians_Report's own vendor-link field instead.");
    try{
      const all = await apiGetReport(CONFIG.fleetTechnicianReport, null, 200);
      const candidates=["Vendor_Name","Fleet_Vendor"];
      for(const field of candidates){
        const matched = all.filter(function(t){
          const v=t[field];
          const vid=lookupId(v);
          if(currentVendorRecord && vid!=null && String(vid)===String(currentVendorRecord.id)) return true;
          return String(readVal(t,field)||"").trim().toLowerCase()===MY_VENDOR_NAME.trim().toLowerCase();
        });
        if(matched.length){ techs=matched; console.warn("[GR-Vendor] showHandoffPanel: fallback matched", matched.length, "technician(s) via", CONFIG.fleetTechnicianReport+"."+field, "— consider switching CONFIG.vendorTechniciansField/the multi-lookup approach off if this fallback is what's actually working."); break; }
      }
    }catch(e){ console.warn("[GR-Vendor] showHandoffPanel: fallback fetch failed", e); }
  }
  if(!techs.length){ state.fleetTechs=techs; $("fleetTechList").innerHTML='<p style="font-size:13px;color:var(--muted)">No technicians found under this fleet account.</p>'; return; }
  // Added 2026-09-02 (build-plan item #3, wireframe: "Employee list filtered
  // by service type: Mechanics for RSR, Drivers for Towing") — same idea as
  // getRescueTicket's own vendorsFor()/vendorCapabilityMatches(), using
  // Technicians_Report's own "service_capability" field (RSR/TOW/Both,
  // user-created 2026-09-02, user-confirmed exact lowercase API name) — a
  // fleet vendor with both RSR and TOW technicians shouldn't be able to hand
  // a TOW job to an RSR-only technician, or vice versa. A technician with the
  // field left blank still shows (same "missing data shows rather than
  // silently vanishes" philosophy as the rest of this file).
  const capableTechs=techs.filter(function(t){
    const cap=String(t.service_capability||"").trim().toUpperCase();
    if(!cap) return true;
    if(cap==="BOTH") return true;
    return cap===String(r.Service_Type||"").trim().toUpperCase();
  });
  state.fleetTechs=techs=capableTechs;
  if(!techs.length){ $("fleetTechList").innerHTML='<p style="font-size:13px;color:var(--muted)">No technicians capable of '+esc(r.Service_Type||"this")+' work found under this fleet account.</p>'; return; }
  if(!fleetTechName(techs[0])) console.warn("[GR-Vendor] showHandoffPanel: none of", FLEET_TECH_NAME_CANDIDATES, "resolved a name on the first matched technician — real keys:", Object.keys(techs[0]), "| full record:", techs[0]);
  $("fleetTechList").innerHTML = techs.map(function(t){
    const online=String(t[CONFIG.fleetTechnicianStatusField])==="Online";
    const name=fleetTechName(t)||"—";
    const phone=fleetTechPhone(t);
    return `<div class="tech-row"><span class="av">🔧</span>
      <div style="flex:1"><div class="nm">${esc(name)}</div><div class="sub">${phone?esc(phone)+" · ":""}${online?"● Online":"● Offline"}</div></div>
      <button class="btn ${online?"primary":"ghost"} assign" type="button" data-id="${esc(t.ID)}" ${online?"":"disabled"} style="width:auto;padding:9px 16px;font-size:12.5px">Assign</button>
    </div>`;
  }).join("");
  document.querySelectorAll(".tech-row .assign").forEach(function(btn){
    // Disables every Assign button the instant one is clicked (2026-08-06) —
    // belt-and-suspenders alongside renderAcceptScreen()'s own
    // Assigned_Technician check: that one only catches a REOPENED ticket,
    // not a rapid double-click on this same still-open screen before
    // assignTechnician()'s own backToDashboard() navigation completes.
    btn.onclick=function(){
      document.querySelectorAll(".tech-row .assign").forEach(function(b){ b.disabled=true; });
      assignTechnician(btn.dataset.id);
    };
  });
}
async function assignTechnician(techId){
  const tech=state.fleetTechs.find(function(t){ return String(t.ID)===String(techId); });
  if(!tech) return;
  try{
    const r=state.current;
    const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
    const name=fleetTechName(tech)||"";
    const email=tech[CONFIG.fleetTechnicianEmailField]||"";
    // Same retry/fallback as acceptService()'s own 2026-08-19 fix a few
    // dozen lines up: if currentVendorRecord itself never resolved at boot,
    // this hand-off's own Assigned_Vendor/Vendor_Email write (below) would
    // otherwise silently have nothing to write, even though the fleet vendor
    // is clearly logged in and actively handing this job off right now.
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] assignTechnician — currentVendorRecord was NULL at hand-off time; retrying the "+CONFIG.vendorReport+" match once. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL));
      await resolveVendorRecord("assignTechnician retry");
    }
    if(!currentVendorRecord){
      console.warn("[GR-Vendor] assignTechnician — currentVendorRecord STILL NULL after retry: Assigned_Vendor will stay blank (not guessed). Vendor_Email will use LOGIN_EMAIL itself instead. LOGIN_EMAIL:", JSON.stringify(LOGIN_EMAIL), "| currentAvailabilityRecord resolved:", !!currentAvailabilityRecord);
    }
    // Real bug fixed (2026-08-05) — Assigned_Technician is a confirmed
    // useId:true Lookup in getRescueTicket (live "[object Object]" screenshot
    // investigation the same week), but this sent the technician's NAME, not
    // their Technicians_Report id — a Lookup field rejects/silently drops a
    // plain name. Send tech.ID instead; also explains why getRescueTicket's
    // own "Assigned Technician" dropdown always showed "— select —" after a
    // fleet hand-off (that display bug is fixed separately, but this write
    // was sending the wrong value regardless).
    // Technician_Emails (2026-07-31, per user request): a hidden field the
    // user will hide on the real form, mirroring whichever technician's
    // email(s) are involved — just this one for now, since this hand-off
    // still direct-assigns a single technician rather than requesting
    // several at once (see QUESTIONS_TO_ASK.md — will hold a comma-separated
    // list instead, once that multi-request flow exists).
    // Real bug fixed (2026-08-19, user-reported live, screenshot: a ticket
    // handed off to a technician showed Vendor Email/Vendor Email
    // (Assignment)/Assigned Vendor ALL blank on the agent's own Accept
    // screen, even though the technician clearly went on to accept —
    // Expected Arrival Time was populated). Root cause: this hand-off never
    // recorded the FLEET VENDOR's own identity anywhere — only the
    // technician's. technicianTicket's own direct acceptance (acceptService())
    // has no reliable way to know which vendor a job came through, so THIS
    // function is the right place to fix it — currentVendorRecord (this
    // logged-in fleet vendor, handing the job off right now) is directly,
    // reliably available here, exactly like a direct Individual-vendor
    // acceptance's own acceptService() already records for itself. Sets the
    // SAME three fields that path writes (Assigned_Vendor, the branch-
    // specific Vendor_Email1/Vendor_Email2, and the bare Vendor_Email — see
    // that function's own matching 2026-08-19 fix) so a fleet hand-off looks
    // identical, from the agent's own Accept screen, to a vendor accepting
    // directly.
    const vendorId = currentVendorRecord && currentVendorRecord.id;
    const vendorEmail = (currentVendorRecord && currentVendorRecord.data && currentVendorRecord.data[CONFIG.vendorEmailField]) || LOGIN_EMAIL;
    const payload = isTow
      ? { Assigned_Technician:tech.ID, Assigned_Technician_Email:email, Technician_Email1:email, Technician_Emails:email,
          Assigned_Vendor:vendorId, Vendor_Email:vendorEmail, Vendor_Email2:vendorEmail }
      : { Assigned_Technician:tech.ID, Assigned_Technician_Email:email, Technician_Email:email, Technician_Emails:email,
          Assigned_Vendor:vendorId, Vendor_Email:vendorEmail, Vendor_Email1:vendorEmail };
    await apiUpdate(r.ID, payload);
    // Invites (2026-08-03, user-confirmed "invite covers all") — same
    // mechanism as the agent's own vendor invites, one record per assigned
    // technician, so this technician's own dashboard picks the ticket up via
    // Invites_Report. Best-effort/non-blocking, same pattern as Task_Rejections.
    // Real bug fixed 2026-08-03 (schema rebuild): this used to write
    // tech.ID (a Technicians_Report ID) into the `Vendor` field, which is a
    // Lookup targeting Vendors_Report — a Zoho Lookup can only point at one
    // form, so that could never have actually resolved. Invites now has a
    // separate `Technician` Lookup (-> Technicians_Report) for exactly this
    // case; getRescueTicket's own vendor invites still use `Vendor` only.
    try{
      const fn=resolve("addRecords");
      if(fn) await fn({ app_name:CONFIG.appName, form_name:CONFIG.invitesForm, payload:{ data:{ RSID:r.ID, Technician:tech.ID } } });
    }catch(e){ console.warn("[GR-Vendor] could not create Invites record for technician", name, e); }
    toast("Assigned to "+name,"ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not assign","err"); }
}

async function markReachedRsr(){
  if(effectivePhotoCount("Image_Upload2")<1){ toast("Arrival photo is required","err"); return; }
  setDisabled("reachedBtn",true);
  try{
    const r=state.current;
    const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
    // Reach Location + Distance_Reach_To_Breakdown (2026-08-11, user
    // request, "Missing Fields & Field Behavior" spec) — Reach never
    // captured a live GPS fix before this at all, unlike Accept
    // (RSP_Start_Latitude/Longitude) and Cancel (Cancel_Location_Lat/Lon),
    // both of which already do. Distance_Reach_To_Breakdown is a BRAND NEW
    // field, deliberately separate from Roundtrip_Distance just above —
    // that one is Office→Breakdown→Office and stays untouched; this is a
    // plain one-way distance from THIS click's own position to the
    // breakdown location, mirroring exactly how Distance_To_Breakdown
    // already works at Accept (see acceptService() below). Best-effort —
    // a denied/unavailable location just means these two fields are
    // skipped, same tolerance Accept/Cancel's own GPS fixes already have.
    // Fetched BEFORE the round-trip calc below (moved up 2026-09-07, see
    // that calc's own comment for why).
    const reachPos = await getPositionSafe();
    // Round Trip Distance (2026-09-07, user-provided LOCATIONS-DISTANCES-
    // DATETIME spec, "RSR-3(a)") — real bug fix: this used to always route
    // through the static ticket breakdown location C (r.Latitude/Longitude)
    // even though a live GPS fix (reachPos, spec's own "E" point) is taken
    // at this exact Reach click a few lines below — the fix captured E but
    // the round trip never used it. Spec defines this leg as Office->E->
    // Office, not Office->C->Office. Uses reachPos when available (matches
    // spec exactly); falls back to the static breakdown C only if GPS is
    // denied/unavailable, so Roundtrip_Distance is never simply skipped
    // the way Distance_Reach_To_Breakdown below is allowed to be.
    const rtLat = reachPos ? reachPos.lat : bLat, rtLon = reachPos ? reachPos.lon : bLon;
    const rt=await calcRoundTripKm(rtLat,rtLon,parseCoord(r.DropLocationLat),parseCoord(r.DropLocationLong),travelModeFor(r));
    // ETA (mins) input hidden from this screen 2026-08-05 (user request) —
    // whatever ETA was already computed/saved at Accept time stays as-is;
    // simply not included in this payload, same as leaving the old manual
    // box blank always did (Zoho keeps the existing stored value untouched).
    const payload={ Reach_Time: fmtDateTime(new Date()), Roundtrip_Distance: rt, Status:"WORK IN PROGRESS" };
    if(reachPos){
      payload.Reach_Location_Lat=reachPos.lat; payload.Reach_Location_Lon=reachPos.lon;
      const reachDist = await calcDistanceETA(reachPos.lat,reachPos.lon,bLat,bLon,travelModeFor(r));
      if(reachDist) payload.Distance_Reach_To_Breakdown=reachDist.distanceKm;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached","ok");
    // WhatsApp "Reach Time" message (2026-09-06, RESCUE Repair Service
    // Logic Flow spec: "Mechanic/Driver app - Reach Breakdown Location
    // page | on click REACH button | Send 10"). Template name/no-params
    // shape is a best-effort guess (no visible parameter slots in the
    // spec's own template text) — same "flagged, not confirmed" pattern
    // as every template name in getRescueTicket. Fire-and-forget, after
    // the real save above — a failed send never blocks the Reach action
    // itself, matching this app's existing tolerance for GPS/photo steps.
    /* Template name corrected 2026-09-22 - "reach_time" is not in the approved
       catalogue; #10 is share_rescuer_reach_time_ WITH a trailing underscore
       (the spec flags it explicitly). Still zero parameters, as approved. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescuer_reach_time_", []);
    goToStatus("WORK IN PROGRESS");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedBtn",false); }
}

async function confirmCancelCommon(){
  const reason=$("cancelReason").value;
  if(!reason){ toast("Please pick a cancel reason","err"); return; }
  const isTow=String(state.current[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
  const photoField=isTow?"Image_Upload5":"Image_Upload2";
  if(effectivePhotoCount(photoField)<1){ toast("Cancel photo is required","err"); return; }
  setDisabled("confirmCancelBtn",true);
  try{
    const r=state.current;
    // TOW -> four-wheeler (DRIVING), REPAIR/RSR -> two-wheeler — same
    // isTow this function already computed above, reused here rather than
    // calling travelModeFor(r) again (identical result, avoids recomputing).
    const cancelTravelMode=isTow?"DRIVING":"TWO_WHEELER";
    // See technicianTicket's own comment on confirmCancel() — same
    // Cancellation_Time/Cancel_Location_Lat/Lon/Cancel_Distance capture,
    // not repeated here.
    const payload=isTow ? { Reject_Reason2:reason, Status:"RSP CANCELLED" } : { Cancel_Reason:reason, Status:"RSP CANCELLED" };
    payload.Cancellation_Time=fmtDateTime(new Date());
    const pos = await getPositionSafe();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon,cancelTravelMode) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Distance_Cancel_To_Breakdown (2026-08-11, user request, "Missing
      // Fields & Field Behavior" spec item 2) — BRAND NEW field, deliberately
      // different from Cancel_Distance just above (Accept location → Cancel
      // location) — this is Cancel location → the ticket's own static
      // breakdown location, which no field/calc covered before this at all.
      const bLatC=Number(r.Latitude), bLonC=Number(r.Longitude);
      const cancelToBreakdown = !isNaN(bLatC) && !isNaN(bLonC) ? await calcDistanceETA(pos.lat,pos.lon,bLatC,bLonC,cancelTravelMode) : null;
      if(cancelToBreakdown) payload.Distance_Cancel_To_Breakdown=cancelToBreakdown.distanceKm;
      // Client-requested addition (2026-08-04) — see technicianTicket's/
      // driverTicket's own matching comments: round trip office -> this
      // vendor's current (cancel-click) position -> office, for both branches
      // (calc4PointRoundtrip's no-drop case covers RSR just as well as
      // calcRoundTripKm did — switched to it here so both branches also get
      // the Office_To_Mechanic/Mechanic_To_Breakdown/Breakdown_To_Office
      // per-leg fields "this also work for the Driver" asked for, not just
      // the Roundtrip_Distance total).
      const legs = await calc4PointRoundtrip(pos.lat,pos.lon,null,null,cancelTravelMode);
      payload.Roundtrip_Distance = legs.total;
      payload.Office_To_Mechanic = legs.officeToMechanic;
      payload.Mechanic_To_Breakdown = legs.mechanicToBreakdown;
      payload.Breakdown_To_Office = legs.dropToOffice;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not cancel","err"); }
  finally{ setDisabled("confirmCancelBtn",false); }
}

async function vehiclePicked(){
  const r0=state.current;
  // Real bug fixed (2026-08-07, same as driverTicket) — explicit click-time
  // guard so a TOW ticket can never be marked picked up without a real drop
  // location, with an actual error toast instead of relying on the button's
  // `disabled` state alone.
  const dropLat0=parseCoord(r0.DropLocationLat), dropLon0=parseCoord(r0.DropLocationLong);
  const dropReady0=!!r0.Navigate_To_Drop_Link || (dropLat0!=null && dropLon0!=null);
  if(!dropReady0){ toast("Drop location is required before the vehicle can be marked picked up — ask dispatch to add it, then try again.","err"); return; }
  if(effectivePhotoCount("Pre_service_Photo")<4){ toast("4 pre-service photos required","err"); return; }
  if(effectivePhotoCount("Image_Upload_On_truck")<3){ toast("3 on-truck photos required","err"); return; }
  if(effectivePhotoCount("VCRF")<1){ toast("VCRF upload required","err"); return; }
  setDisabled("vehiclePickedBtn",true);
  try{
    const r=state.current;
    // Mock says Drop distance/ETA are "based on current GPS location of
    // Driver" (not the ticket's static breakdown Lat/Lon) — use a live fix,
    // falling back to the breakdown location if GPS isn't available.
    const pos = await getPositionSafe();
    /* MEASURED FROM THE STORED REACH POSITION - 2026-10-09, per the spec:
       "from vendor REACH BREAKDOWN location to Drop Location". This used to
       use the live fix taken at the Picked-Up tap. The two are metres apart in
       practice - the vendor is standing at the vehicle - but the stored point
       is the one the specification names, and it is also the point the closure
       round-trip already measures from, so the two now agree.
       The live fix stays as the fallback, so a case where Reach was never
       recorded behaves exactly as it does today. Pickup_Location_Lat/Lon below
       is untouched and still records the live position. */
    const reachLat=parseCoord(r.Reach_Location_Lat), reachLon=parseCoord(r.Reach_Location_Lon);
    const bLat = (reachLat!=null) ? reachLat : (pos?pos.lat:Number(r.Latitude));
    const bLon = (reachLon!=null) ? reachLon : (pos?pos.lon:Number(r.Longitude));
    console.log("[GR] breakdown->drop origin:", (reachLat!=null?"stored Reach position (Reach_Location_*)":(pos?"live GPS at Picked-Up":"the ticket's breakdown location")));
    const dLat=parseCoord(r.DropLocationLat), dLon=parseCoord(r.DropLocationLong);
    // Google ON - Vehicle Picked: breakdown -> drop (item 4).
    const dist=await calcDistanceETA(bLat,bLon,dLat,dLon,travelModeFor(r),true);
    const payload={ Pickup_Time: fmtDateTime(new Date()), Status:"TO DROP LOCATION" };
    if(dist){ payload.Breakdown_To_Drop_Distance=dist.distanceKm; payload.Return_Journey_ETA=dist.etaMins; }
    // Pickup_Location_Lat/Lon (2026-09-11) — see driverTicket's own matching
    // comment: persists the SAME `pos` already fetched above for the
    // distance/ETA calc, instead of discarding it.
    if(pos){ payload.Pickup_Location_Lat=pos.lat; payload.Pickup_Location_Lon=pos.lon; }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Vehicle picked up","ok");
    goToStatus("TO DROP LOCATION");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("vehiclePickedBtn",false); }
}

async function reachedDrop(){

    // DATETIME spec, "TOW-4(a)") — real bug fix: this used to always route
    // through the static ticket breakdown/drop coordinates (spec's C/A) even
    // though (a) the vendor's own live GPS fix from the earlier Reach click
    // is already stored in Reach_Location_Lat/Lon (spec's "E"), and (b) a
    // fresh live GPS fix is taken a few lines below at THIS click (spec's
    // "B") but only ever got written into RSP_Start_Latitude/Longitude,
    // never fed into this round-trip calc. Spec defines this leg as
    // Office->E->B->Office, not Office->C->A->Office. Falls back to the
    // static C/A only when the live/stored point isn't available (e.g. a
    // ticket that reached before Reach_Location_Lat/Lon existed, or GPS
    // denied here), so this never simply breaks on older/incomplete data.
    const eLat=parseCoord(r.Reach_Location_Lat), eLon=parseCoord(r.Reach_Location_Lon);
    const bLat = eLat!=null ? eLat : Number(r.Latitude), bLon = eLon!=null ? eLon : Number(r.Longitude);
    const pos=await getPositionSafe();
    const dLat = pos ? pos.lat : parseCoord(r.DropLocationLat), dLon = pos ? pos.lon : parseCoord(r.DropLocationLong);
    const legs=await calc4PointRoundtrip(bLat,bLon,dLat,dLon,travelModeFor(r));

    // Now writes into the new, dedicated RSP_Drop_Latitude/Longitude pair

    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached drop location","ok");
    goToStatus("UNLOADING");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedDropBtn",false); }

/* ===== Action 8: Final Payment Collection (shared RSR & TOW) ===== */
/* Payment screen auto-refresh — 2026-09-28, client list item "Auto refresh on
   PAYMENTS page for vendor app: success payment needs to show".

   The remaining fee is settled by the CUSTOMER, on their own phone, through the
   payment link. paymentWebhook.deluge then writes Payment_received / Payment_Status
   onto the ticket. Nothing told this screen any of that had happened, so the vendor
   sat looking at PENDING with the button disabled until they backed out and
   reopened the ticket — exactly while standing next to a customer who has just paid.

   Polls the vendor’s own ticket list, which is already fetched by fetchMyTickets()
   for the dashboard, rather than adding a second data path. Only re-renders when a
   settlement field actually changed: a silent re-render every 10s would fight the
   vendor for focus on the receipt-photo input and the method dropdown.

   Runs only while the payment screen is open. renderActionScreen() stops it on any
   screen change, so it cannot outlive the screen or stack timers. */
let PAYMENT_POLL_TIMER=null;
const PAYMENT_POLL_MS=10000;
function stopPaymentPoll(){ if(PAYMENT_POLL_TIMER){ clearInterval(PAYMENT_POLL_TIMER); PAYMENT_POLL_TIMER=null; } }
function startPaymentPoll(){
  stopPaymentPoll();
  PAYMENT_POLL_TIMER=setInterval(pollPaymentReceived, PAYMENT_POLL_MS);
}
async function pollPaymentReceived(){
  const cur=state.current;
  if(!cur || !cur.ID){ stopPaymentPoll(); return; }
  try{
    const fresh=await fetchMyTickets();
    const hit=(fresh||[]).find(function(x){ return String(x.ID)===String(cur.ID); });
    if(!hit) return;   // dropped out of this vendor’s list — the dashboard poll handles that
    const was=String(cur.Payment_received||"").trim()+"|"+String(cur.Payment_Status||"").trim()+"|"+String(cur.Payment_Method_Final||"").trim();

   The link only exists once Send Payment Link has been pressed, because that is what

   Fill UPI_VPA with the real receiving UPI ID, e.g. "getrescued@okhdfcbank".
   LEAVE IT EMPTY UNLESS YOU HAVE THE REAL ONE — an invented VPA sends real
   money to a stranger. Blank simply keeps today's Zoho checkout QR. */
const UPI_VPA = "";
const UPI_PAYEE_NAME = "Rescue Vehicle Services Pvt Ltd";
/* Builds a upi://pay link — the format every Indian UPI app reads.

   tr (transaction reference) is stripped to letters and digits: the UPI spec
   allows only those, and a stray dash is enough for some apps to reject the
   whole code. tn (note) is kept short for the same reason. The amount is fixed
   to 2 decimals so the app shows an exact figure the customer cannot edit. */
function upiPaymentUri(amount, note, ref){
  if(!UPI_VPA) return "";
  const amt=Number(amount);
  const parts=["pa="+encodeURIComponent(UPI_VPA), "pn="+encodeURIComponent(UPI_PAYEE_NAME)];
  if(amt>0) parts.push("am="+amt.toFixed(2));
  parts.push("cu=INR");
  if(note) parts.push("tn="+encodeURIComponent(String(note).slice(0,40)));
  const cleanRef=String(ref||"").replace(/[^A-Za-z0-9]/g,"").slice(0,35);

function renderPaymentQr(){

     https:// URL, and a UPI app will not read one (see the wording note below,
     written when exactly that was reported). A upi:// code opens GPay/PhonePe
     directly, which is what was asked for.

     this cannot leave the vendor with no QR at all. */

function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){
    const idx=Number(el.dataset.alreadyIdx||0);
    const url=zohoFileDownloadUrl(state.current.ID, fieldName, rawValue, idx);
    if(!url) return; // stays as the plain "✓ Saved" badge placeholder already in the DOM
    const img=document.createElement("img");
    // The remove button is part of the tile and must survive the thumbnail
     // swap below, which replaces the tile's whole innerHTML (2026-10-05).
    const keepRm=el.querySelector(".rm");
    const restoreRm=function(){ if(keepRm) el.appendChild(keepRm); };
    img.onerror=function(){
      console.warn("[GR-Vendor] hydrateAlreadyUploadedThumbs: direct URL failed to load for", fieldName, "index", idx, "— reverting to the plain 'Saved' badge.");
      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';
      restoreRm();
    };
    img.onload=function(){
      const badge=document.createElement("span");
      badge.className="up-badge ok"; badge.title="Already saved"; badge.textContent="✓";
      el.appendChild(badge);
    };
    img.src=url;
    el.innerHTML="";
    el.appendChild(img);
    restoreRm();
  });
}
// Real bug fixed 2026-08-21 (see fileCountFor()'s own comment above) — this
// used to render ONLY state.photos[fieldName] (this session's own picks),
// so reopening the app after already uploading photos in an earlier
// session showed a completely empty grid, even though the photos were
// genuinely saved server-side. Now renders whatever's already on the
// ticket record FIRST (as a placeholder, hydrated to a real thumbnail
// right after by hydrateAlreadyUploadedThumbs() — same async pattern
// getRescueTicket's own file previews use), then this session's own
// newly-picked files after that. Already-saved tiles have no ✕ remove
// button — there's no "delete an already-uploaded photo" flow here, only
// newly-picked-but-not-yet-final ones can be removed before upload.
/* See this file's photo-delete notes — deletion is only offered where the
   resulting field contents can actually be rebuilt. */
/* True when this field holds photos saved in an EARLIER session, so it can
   only be cleared whole, never edited photo by photo — see this change's own
   note: a saved photo is a URL, not a file, and a Creator widget cannot read
   it back (CSP blocks fetch; a canvas is cross-origin tainted), so keepers
   could not be re-uploaded after the blanking deletePhotoAt() relies on. */
function photoClearOnlyField(fieldName, max){
  if(Number(max)===1) return false;
  return fileCountFor(state.current && state.current[fieldName])>0;
}
/* Clears every photo on a field so better ones can be taken. Same write
   deletePhotoAt() makes — blank the field, purge the offline queue so nothing
   resurrects — minus the keeper re-upload, because here there are deliberately
   no keepers. The count goes in the prompt: this throws away work, and the
   vendor should see how much before agreeing. */
async function clearAllPhotos(fieldName, max){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  const n=fileCountFor(state.current && state.current[fieldName]) + (state.photos[fieldName]||[]).length;
  // No confirm() here - the button arms itself on first tap instead. A WebView
  // that suppresses dialogs returns false from confirm() without throwing, which
  // silently cancelled this on every phone. See armTwoTap().
  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[GR] clearAllPhotos: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photos — nothing was changed","err");
    return;
  }
  state.current[fieldName]="";
  (state.photos[fieldName]||[]).forEach(function(file){
    state.uploadedPhotoFiles.delete(file); state.failedPhotoFiles.delete(file);
  });
  state.photos[fieldName]=[];
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[GR] clearAllPhotos: could not purge the offline queue for "+fieldName, e); }
  renderPhotoGrid(fieldName,max);
  toast("Photos removed — take new ones","ok");
}
function photoDeleteAllowed(fieldName, max){
  if(Number(max)===1) return true;
  return fileCountFor(state.current && state.current[fieldName])===0;
}
/* Shown only where per-photo removal is impossible, so there is always SOME
   way to replace a bad photo rather than a message telling them to call an
   agent. */
function photoClearAllBtnHtml(fieldName, max){
  if(!photoClearOnlyField(fieldName, max)) return "";
  const n=fileCountFor(state.current && state.current[fieldName]);
  return '<button type="button" class="photo-clearall" data-field="'+esc(fieldName)+'" '
    + 'style="margin-top:8px;font-size:11px;padding:3px 10px;border:1px solid var(--line,#ccc);border-radius:999px;background:transparent;cursor:pointer" '
    + 'title="These photos were saved earlier, so they cannot be removed one at a time. This clears all of them so you can take better ones.">'
    + 'Clear all '+n+' photo'+(n===1?"":"s")+' and re-take</button>';

/* Tap once to arm, tap again to do it. Replaces confirm(), which a phone
   WebView answers "false" to without throwing - the tap then did nothing at
   all, with no dialog and no error.

   Disarms itself after four seconds, so a vendor who taps once and puts the
   phone down has not left a photo one stray touch from deletion. */
var ARM_MS = 4000;
function armTwoTap(btn, armedText, run){
  if(!btn){ run(); return; }
  if(btn.dataset.armed === "1"){
    try{ clearTimeout(Number(btn.dataset.armTimer||0)); }catch(e){}
    btn.dataset.armed = "";
    if(btn.dataset.restLabel) btn.textContent = btn.dataset.restLabel;
    btn.classList.remove("armed");
    run();
    return;
  }
  btn.dataset.restLabel = btn.textContent;
  btn.dataset.armed = "1";
  btn.textContent = armedText;
  btn.classList.add("armed");
  var t = setTimeout(function(){
    btn.dataset.armed = "";
    if(btn.dataset.restLabel) btn.textContent = btn.dataset.restLabel;
    btn.classList.remove("armed");
  }, ARM_MS);
  btn.dataset.armTimer = String(t);
  if(typeof toast==="function") toast("Tap again to confirm","err");
}
function photoRmBtnHtml(kind, idx, allowed){
  if(!allowed) return "";
  return '<button type="button" class="rm" data-kind="'+kind+'" data-i="'+idx+'" title="Remove this photo">✕</button>';
}
/* Removes a photo from the ticket for real.

   Order matters: the field is blanked FIRST and the keepers re-uploaded after.
   The reverse (upload then blank) would delete what was just written. A keeper
   whose re-upload fails goes onto the offline queue exactly like any other
   failed upload, so it is retried rather than lost — the queue is why this is
   safe to do at all.

   Queued rows for this field are purged too. Without that, flushPhotoQueue()
   would happily re-upload the very photo the vendor just deleted. */
async function deletePhotoAt(fieldName, max, kind, index){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  if(!photoDeleteAllowed(fieldName, max)){
    toast("This photo was saved earlier and can't be removed here — ask an agent to clear it on the ticket","err");
    return;
  }
  // No confirm() here either - see clearAllPhotos() and armTwoTap().

  const sessionFiles=(state.photos[fieldName]||[]).slice();
  const removedFile=(kind==="session") ? sessionFiles[index] : null;
  const keepers=sessionFiles.filter(function(f,i){ return !(kind==="session" && i===index); });

  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[GR-Vendor] deletePhotoAt: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photo — nothing was changed","err");
    return;
  }

  // The record no longer holds anything for this field.
  state.current[fieldName]="";
  state.photos[fieldName]=keepers;
  if(removedFile){ state.uploadedPhotoFiles.delete(removedFile); state.failedPhotoFiles.delete(removedFile); }

  // Stop a queued copy resurrecting any of this field's photos.
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[GR-Vendor] deletePhotoAt: could not purge the offline queue for "+fieldName, e); }

  // Put the keepers back.
  for(const f of keepers){
    state.uploadedPhotoFiles.delete(f);
    let ok=false;
    try{ ok=await apiUpload(r.ID, fieldName, f); }catch(e){ ok=false; }
    if(ok) state.uploadedPhotoFiles.add(f);
    else{
      state.failedPhotoFiles.add(f);
      await queuePhotoOffline(r.ID, fieldName, f);
      PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
      renderPhotoQueueNote();
    }
  }
  renderPhotoGrid(fieldName,max);
  toast("Photo removed","ok");
}
function renderPhotoGrid(fieldName,max){
