<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Get-Rescue · Vendor</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as every other Get-Rescue widget — kept identical on
   purpose (2026-07-31: "the theme will be same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}

.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.svc{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;margin-right:6px}
.svc.rsr{background:var(--signal-soft);color:var(--signal-deep)}
.svc.tow{background:var(--info-soft);color:#1d5fc0}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:6px}
.info-grid .full{grid-column:1/-1}
.info-grid .k{font-family:var(--f-mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.info-grid .v{font-size:14px;font-weight:600}
.nav-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--info-soft);color:#1d5fc0;border-radius:11px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:14px;text-decoration:none;margin:6px 0}

.photo-field{margin:12px 0}
.photo-field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.photo-field .lab .l{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.photo-field .lab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.photo-field .lab .cnt.ok{color:var(--ok)}
.photo-field.collapsible .lab{cursor:pointer;user-select:none}
.photo-field.collapsible .lab .chev{color:var(--muted);vertical-align:middle;margin-right:4px;transition:transform .2s}
.photo-field.collapsible.collapsed .lab .chev{transform:rotate(-90deg)}
.photo-field.collapsible.collapsed .photo-grid{display:none}
/* Generic collapsible section card (2026-08-04, user request — "make this
   screen accordion like") — used to turn the whole RSR WIP screen into a
   stack of independently-collapsible sections, same chevron-toggle idea as
   the photo fields above but for arbitrary content (Issue Resolved, Expense). */
.acc-card{padding:0;overflow:hidden}
.acc-card .acc-head{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;user-select:none}
.acc-card .acc-head .t{font-family:var(--f-disp);font-weight:800;font-size:14.5px;flex:1}
.acc-card .acc-head .chev{color:var(--muted);flex:none;transition:transform .2s}
.acc-card.collapsed .acc-head .chev{transform:rotate(-90deg)}
.acc-card .acc-body{padding:0 16px 16px}
.acc-card.collapsed .acc-body{display:none}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--worktop)}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;color:var(--muted-2);background:#fff}
.photo-slot.add:active{background:var(--worktop)}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,22,28,.65);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:11px}
/* Auto-upload status badge (2026-08-04, per user request) — visible
   confirmation that a photo's background upload (see uploadPhotoNow)
   actually reached Zoho, instead of it happening silently. */
.photo-slot .up-badge{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.photo-slot .up-badge.ok{background:var(--ok)}
.photo-slot .up-badge.pending{background:rgba(20,22,28,.65);animation:pulseBadge 1.1s ease-in-out infinite}
.photo-slot .up-badge.failed{background:var(--stop)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.35}}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;font-family:var(--f-body);color:var(--text);background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld textarea{min-height:70px;resize:vertical}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;background:#fff;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}

.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:active{background:var(--signal-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:16px}
.btn-row .btn{flex:1}

.tech-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.tech-row .av{width:32px;height:32px;border-radius:50%;background:var(--worktop);display:grid;place-items:center;flex:none}
.tech-row .nm{font-family:var(--f-disp);font-weight:800;font-size:14px}
.tech-row .sub{font-size:11.5px;color:var(--muted)}
.tech-row .assign{flex:none}

.modal{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column}
.modal.on{display:flex}
#cameraVideo{width:100%;max-width:520px;flex:1;object-fit:cover;background:#000}
.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;width:100%;max-width:520px}
.cam-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer}
.cam-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;cursor:pointer;font-size:18px}
.cam-hint{color:rgba(255,255,255,.7);font-family:var(--f-mono);font-size:11px;text-align:center;padding:8px 20px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
      <span><b id="techName">Vendor</b><span>Get-Rescue</span></span>
    </div>
    <div class="toggle" id="availToggle" role="switch" aria-label="Toggle availability">
      <span class="lab off">Offline</span><span class="lab on">Online</span>
      <span class="knob"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="sec-head"><h2>My Tickets</h2><span class="cnt" id="ticketCount">0</span></div>
    <div id="ticketList"></div>
  </div>

  <div id="actionScreen" class="off">
    <div class="ascreen-top">
      <button class="back-x" id="backBtn" type="button" aria-label="Back to my tickets"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="ascreenTitle">—</h2>
    </div>
    <div class="card">
      <div class="info-grid" id="ticketInfo"></div>
    </div>
    <div id="ascreenBody"></div>
  </div>
</div>

<!-- camera modal — see technicianTicket's own copy for the full rationale
     comment; identical here, not re-explained. -->
<div class="modal" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="cam-hint" id="cameraHint">Center the shot, then tap to capture</div>
  <div class="camera-bar">
    <button class="cam-x" id="cameraCancel" type="button" aria-label="Cancel">✕</button>
    <button class="cam-btn" id="cameraShutter" type="button" aria-label="Capture photo"></button>
    <span style="width:40px"></span>
  </div>
</div>
<input type="file" id="cameraFallbackInput" accept="image/*" capture="environment" style="display:none">
<!-- no `capture` attribute here — lets the OS picker offer Gallery too -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   GET-RESCUE · VENDOR WIDGET
   Sibling of technicianTicket/driverTicket's widget.html — same CORE, but
   covers a vendor's own full lifecycle across BOTH RSR and TOW tickets:
   - Accept/Reject (common to both branches).
   - If the logged-in vendor is INDIVIDUAL: does the full on-road flow
     themselves (Reach->WIP->Payment for RSR, Reach->Loading->ReachedDrop->
     Unloading->Payment for TOW) — literally the same screens as
     technicianTicket/driverTicket, branched here by Service_Type instead of
     being two separate widgets.
   - If the logged-in vendor is FLEET: after Accept, shows a hand-off screen
     to assign one of their own technicians instead of doing the on-road
     work themselves — user-confirmed 2026-07-31 ("Vendor does everything an
     individual, PLUS hands off if fleet").
   See technicianTicket/app/widget.html's own header comment for the fuller
   set of confirmed decisions this whole build relies on (Create_Case only,
   no "Invites" form, etc.) — not re-explained per file here. Google Maps
   Distance Matrix API key provided 2026-08-04 (see GOOGLE_MAPS_API_KEY
   below) — Haversine is now only the fallback if that call fails.
   SCHEMA DECISIONS (2026-08-03 — all Zoho forms were deleted and rebuilt
   from scratch this round, so these are now the authored field names, not
   guesses against a pre-existing form — see FIELDS.md/ACCESS.md):
   - Individual vs. Fleet lives on `Vendors_Report.Vendor_Type`
     (values "Individual"/"Fleet").
   - A technician's owning fleet vendor lives on
     `Technicians_Report.Fleet_Vendor`, matched by name string (not ID).
   - Whether a fleet vendor's Accept should write "RSP ON THE WAY" directly
     (as implemented) or some other intermediate status before a technician
     is actually picked.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  /* toggle target — the vendor-specific report toggleGetRescue's own CONFIG
     already used (Vendors_Report), folded directly into this widget
     per explicit request — no separate toggle widget. */
  vendorReport: "Vendors_Report",
  vendorStatusField: "Availability_Status",
  vendorEmailField: "Email",
  vendorNameField: "Vendor_Name",
  /* NOT confirmed live — see this file's own header comment. */
  vendorTypeField: "Vendor_Type",
  fleetTechnicianReport: "Technicians_Report",
  fleetTechnicianLinkField: "Fleet_Vendor",
  fleetTechnicianNameField: "Technician_Name",
  fleetTechnicianEmailField: "Email",
  fleetTechnicianStatusField: "Availability_Status",
  // Invites (2026-08-03, user-confirmed): one record per invited vendor per
  // ticket — RSID (Lookup -> Create_Case), Vendor (Lookup -> Vendors_Report).
  // getRescueTicket's own JS creates these when the agent saves the
  // Assignment step. This widget's dashboard now finds "my tickets" by first
  // finding MY Invites records, then loading the linked Create_Case tickets —
  // see loadDashboard().
  invitesForm: "Invites",
  invitesReport: "Invites_Report"
};
const MY_STATUSES = ["RSP IRA (INVITE RESPONSE AWAITED)","RSP ON THE WAY","WORK IN PROGRESS","LOADING","TO DROP LOCATION","UNLOADING","REMAINING FEE DUE"];
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
const OFFICE_LAT=12.967827711025203, OFFICE_LON=77.611228;

let SDK_READY=false, LOGIN_EMAIL="", IS_FLEET=false, MY_VENDOR_NAME="";
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams==="function"; }
function resolve(method){
  const C=window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces=[C.DATA,C.PUBLISH,C.META,C.UTIL,C.FILE];
  for(let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria=criteria;
  // Debug logging (2026-07-31) — every getRecords call this widget makes
  // (dashboard tickets, own availability record, fleet technician list) goes
  // through here, so this is the one place to see the exact request payload
  // and the raw response while diagnosing why a ticket does/doesn't show up.
  console.log("[GR-Vendor] getRecords request:", JSON.parse(JSON.stringify(cfg)));
  try{
    const r=await fn(cfg);
    console.log("[GR-Vendor] getRecords response:", r);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  } catch(e){ console.log("[GR-Vendor] getRecords error:", e); return []; }
}
async function apiUpdate(id, data){ return apiUpdateReport(CONFIG.reportName, id, data); }
async function apiUpdateReport(report, id, data){
  const fn=resolve("updateRecordById") || resolve("updateRecord"); if(!fn) throw new Error("updateRecordById unavailable");
  const r=await fn({ app_name:CONFIG.appName, report_name:report, id:id, payload:{ data:data } });
  if(!r || r.code!==3000) throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Update failed");
  return true;
}
// Writes to THIS vendor's own Invites record for a given ticket (found via
// state.inviteByTicketId, populated in loadDashboard()) — best-effort/
// non-blocking, same "never let a log/side-write break the real action"
// pattern as the Task_Rejections call. If no Invites record was found for
// this ticket (e.g. it predates the Invites mechanism), this quietly no-ops.
async function updateMyInvite(ticketId, data){
  const invite=state.inviteByTicketId && state.inviteByTicketId[String(ticketId)];
  if(!invite || invite.ID==null) return;
  try{ await apiUpdateReport(CONFIG.invitesReport, invite.ID, data); }
  catch(e){ console.warn("[GR-Vendor] could not update Invites record", invite.ID, "for ticket", ticketId, e); }
}
async function apiUpload(id, fieldName, file){
  const fn=resolve("uploadFile"); if(!fn || !file) return false;
  try{ await fn({ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, field_name:fieldName, file:file }); return true; }
  catch(e){ console.warn("uploadFile failed for "+fieldName, e); return false; }
}

function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
// Real bug fixed 2026-08-04 (see getRescueTicket's own matching comment):
// Number("") is 0, not NaN, so a blank DropLocationLat/Long (the normal state
// before a TOW drop point is set) was silently treated as "drop location is
// at the equator/prime meridian" instead of "not set yet" wherever a call
// site did Number(r.DropLocationLat) directly. Use this instead.
function parseCoord(v){
  if(v==null || v==="") return null;
  const n=Number(v);
  return isNaN(n) ? null : n;
}
const ASSUMED_SPEED_KMH=30; // Haversine-fallback-only speed guess, unused whenever the real Maps API call succeeds
// Google Maps Distance Matrix — see technicianTicket's own comment on this
// same block (client-provided key, 2026-08-04; Haversine above is now only
// the fallback if the Maps script fails to load or a request errors).
const GOOGLE_MAPS_API_KEY="AIzaSyAVVbr5XJ9mSNLMUBNa2JD7mkwkSF0e-UM";
let mapsApiReady=null;
function loadGoogleMaps(){
  if(mapsApiReady) return mapsApiReady;
  mapsApiReady=new Promise(function(res){
    if(window.google && window.google.maps && window.google.maps.DistanceMatrixService){ res(true); return; }
    const cb="__gmapsReady"+Date.now();
    window[cb]=function(){ res(true); };
    const s=document.createElement("script");
    s.src="https://maps.googleapis.com/maps/api/js?key="+GOOGLE_MAPS_API_KEY+"&callback="+cb;
    s.async=true;
    s.onerror=function(){ console.warn("[GR-Vendor] Google Maps script failed to load — falling back to Haversine"); res(false); };
    document.head.appendChild(s);
  });
  return mapsApiReady;
}
let dmService=null;
function googleDistanceMatrix(origins,destinations){
  return loadGoogleMaps().then(function(ok){
    if(!ok || !window.google || !window.google.maps) return null;
    if(!dmService) dmService=new google.maps.DistanceMatrixService();
    return new Promise(function(res){
      try{
        dmService.getDistanceMatrix({
          origins: origins.map(function(o){ return new google.maps.LatLng(o.lat,o.lon); }),
          destinations: destinations.map(function(d){ return new google.maps.LatLng(d.lat,d.lon); }),
          travelMode: "DRIVING"
        }, function(resp,status){
          if(status!=="OK" || !resp){ console.warn("[GR-Vendor] DistanceMatrix request failed:",status); res(null); return; }
          res(resp.rows);
        });
      }catch(e){ console.warn("[GR-Vendor] DistanceMatrix threw",e); res(null); }
    });
  });
}
async function calcDistanceETA(fromLat,fromLon,toLat,toLon){
  if([fromLat,fromLon,toLat,toLon].some(function(n){ return n==null || isNaN(n); })) return null;
  const rows=await googleDistanceMatrix([{lat:fromLat,lon:fromLon}],[{lat:toLat,lon:toLon}]);
  const el=rows && rows[0] && rows[0].elements && rows[0].elements[0];
  if(el && el.status==="OK") return { distanceKm:Math.round((el.distance.value/1000)*10)/10, etaMins:Math.max(1,Math.round(el.duration.value/60)) };
  const distanceKm=Math.round(haversineKm(fromLat,fromLon,toLat,toLon)*10)/10;
  const etaMins=Math.max(1, Math.round((distanceKm/ASSUMED_SPEED_KMH)*60));
  return { distanceKm:distanceKm, etaMins:etaMins };
}
async function calcRoundTripKm(bLat,bLon,dLat,dLon){
  const hasDrop = dLat!=null && dLon!=null && !isNaN(dLat) && !isNaN(dLon);
  const origins = hasDrop ? [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon},{lat:dLat,lon:dLon}] : [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}];
  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests);
  if(rows){
    let total=0, ok=true;
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      total+=el.distance.value/1000;
    }
    if(ok) return Math.round(total*10)/10;
  }
  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
  if(hasDrop){ total+=haversineKm(bLat,bLon,dLat,dLon); total+=haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON); }
  else{ total+=haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON); }
  return Math.round(total*10)/10;
}
async function calc4PointRoundtrip(bLat,bLon,dLat,dLon){
  const hasDrop = dLat!=null && dLon!=null && !isNaN(dLat) && !isNaN(dLon);
  const origins = hasDrop ? [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon},{lat:dLat,lon:dLon}] : [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}];
  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests);
  let officeToBreakdown,breakdownToDrop,dropToOffice,ok=!!rows;
  if(ok){
    const legs=[];
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      legs.push(el.distance.value/1000);
    }
    if(ok){ officeToBreakdown=legs[0]; breakdownToDrop=hasDrop?legs[1]:0; dropToOffice=hasDrop?legs[2]:legs[1]; }
  }
  if(!ok){
    officeToBreakdown=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
    breakdownToDrop = hasDrop ? haversineKm(bLat,bLon,dLat,dLon) : 0;
    dropToOffice = hasDrop ? haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON) : haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON);
  }
  const total=officeToBreakdown+breakdownToDrop+dropToOffice;
  return {
    officeToMechanic: Math.round(officeToBreakdown*10)/10,
    mechanicToBreakdown: 0, // see driverTicket's own comment / QUESTIONS_TO_ASK.md
    breakdownToDrop: Math.round(breakdownToDrop*10)/10,
    dropToOffice: Math.round(dropToOffice*10)/10,
    total: Math.round(total*10)/10
  };
}

function readVal(rec,key){ let v=rec?rec[key]:null; if(v==null) return ""; if(Array.isArray(v)) return v.join(", "); if(typeof v==="object") return v.display_value||v.zc_display_value||v.value||""; return String(v); }

function unwrapLookup(v){

// "Vendors1" is saved as a composite "[priority] Name | Phone | Status" string
// per chip — strip that down to just the name (same parsing getRescueTicket's
// own vendorDisplayName() uses) so it can be compared against this vendor's
// own name.
function vendorChipName(v){
  return String(v||"").trim().replace(/^\[[^\]]*\]\s*/,"").split("|")[0].trim();
}
// 2026-07-31: dropped the old 3-field email guess (Vendor_Email/1/2) entirely
// — Vendors1 is a real Lookup, and getRescueTicket now auto-populates a
// hidden Vendor_Emails field (comma-separated) whenever Vendors1 is saved,
// which is a more reliable match than the name-comparison below (no
// dependency on the Assignment picker's own vendor name string matching
// this vendor's own logged-in profile name exactly). Checking both:
// Vendor_Emails first (real email,
// exact match), falling back to the Vendors1 name-match for any older
// ticket saved before Vendor_Emails existed.
function isMine(rec){
  const tag="[GR-Vendor] isMine "+caseLabel(rec)+":";
  if(!LOGIN_EMAIL){ console.log(tag,"no LOGIN_EMAIL yet -> true"); return true; }
  const emails = String(rec.Vendor_Emails||"").split(",").map(function(e){ return e.trim().toLowerCase(); });
  const emailMatch = emails.indexOf(LOGIN_EMAIL.trim().toLowerCase())>=0;
  if(emailMatch){ console.log(tag,"matched via Vendor_Emails -> true"); return true; }
  const list = Array.isArray(rec.Vendors1) ? rec.Vendors1 : (rec.Vendors1 ? [rec.Vendors1] : []);
  const chipNames = list.map(vendorChipName);
  const nameMatch = MY_VENDOR_NAME && chipNames.some(function(n){ return n.toLowerCase()===MY_VENDOR_NAME.toLowerCase(); });
  console.log(tag, {
    LOGIN_EMAIL:LOGIN_EMAIL,
    Vendor_Emails_raw:rec.Vendor_Emails,
    MY_VENDOR_NAME:MY_VENDOR_NAME,
    Vendors1_raw:rec.Vendors1,
    Vendors1_parsedNames:chipNames,
    nameMatch:nameMatch
  });
  return !!nameMatch;
}

// 2026-08-03 (user-confirmed architecture change): "my tickets" is now found
// via Invites_Report first (one record per invited vendor per ticket,
// created by getRescueTicket when the Assignment step is saved), not by
// scanning Create_Case directly. state.inviteByTicketId maps each matched
// Create_Case record's own ID -> its Invites record, so Accept/Reject can
// write back to the RIGHT Invites record (see acceptService/rejectService).
// The older Vendor_Emails/Vendors1-name match (isMine()) is kept as a
// fallback for any ticket that doesn't have a matching Invites record yet
// (e.g. one assigned before this mechanism existed), so nothing that used to
// show up silently disappears.
async function loadMyInvites(){
  const all = await apiGetReport(CONFIG.invitesReport, null, 200);
  console.log("[GR-Vendor] loadMyInvites: fetched "+all.length+" total Invites records; MY_VENDOR_NAME="+MY_VENDOR_NAME);
  const mine = all.filter(function(inv){
    const vName=String(unwrapLookup(inv.Vendor)||"").trim().toLowerCase();
    return MY_VENDOR_NAME && vName===MY_VENDOR_NAME.trim().toLowerCase();
  });
  console.log("[GR-Vendor] loadMyInvites: "+mine.length+" match MY_VENDOR_NAME", mine);
  const map={};
  mine.forEach(function(inv){
    const tid=lookupId(inv.RSID);
    if(tid!=null) map[String(tid)]=inv;
  });
  return map;
}

    // Cancellation_Time/Cancel_Location_Lat/Lon/Cancel_Distance capture,
    // not repeated here.
    const payload=isTow ? { Reject_Reason2:reason, Status:"RSP CANCELLED" } : { Cancel_Reason:reason, Status:"RSP CANCELLED" };
    payload.Cancellation_Time=fmtDateTime(new Date());
    const pos = await getPositionSafe();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Client-requested addition (2026-08-04) — see technicianTicket's/
      // driverTicket's own matching comments: round trip office -> this
      // vendor's current (cancel-click) position -> office, for both branches
      // (calc4PointRoundtrip's no-drop case covers RSR just as well as
      // calcRoundTripKm did — switched to it here so both branches also get
      // the Office_To_Mechanic/Mechanic_To_Breakdown/Breakdown_To_Office
      // per-leg fields "this also work for the Driver" asked for, not just
      // the Roundtrip_Distance total).
      const legs = await calc4PointRoundtrip(pos.lat,pos.lon,null,null);
      payload.Roundtrip_Distance = legs.total;
      payload.Office_To_Mechanic = legs.officeToMechanic;
      payload.Mechanic_To_Breakdown = legs.mechanicToBreakdown;
      payload.Breakdown_To_Office = legs.dropToOffice;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");

    const dist=await calcDistanceETA(bLat,bLon,dLat,dLon);
    const payload={ Pickup_Time: fmtDateTime(new Date()), Status:"TO DROP LOCATION" };
    if(dist){ payload.Breakdown_To_Drop_Distance=dist.distanceKm; payload.Return_Journey_ETA=dist.etaMins; }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Vehicle picked up","ok");
    goToStatus("TO DROP LOCATION");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("vehiclePickedBtn",false); }
}
async function confirmCxRejectLoading(){

    <div class="card">

/* ===== Action 8: Final Payment Collection (shared RSR & TOW) ===== */
function renderPaymentScreen(){
  const r=state.current;
  const remaining=Number(r.Remaining_Fee)||0;
  // Real bug fixed (2026-08-03, user-confirmed via the actual Zoho field
  // config): Payment_Status is the SAME field already used at the Quote step
  // for the booking fee — not a separate "Pending"/"Success" field as
  // originally guessed. Its real options are PAID / PENDING / NOT APPLICABLE.
  // Was sending "Success" (rejected live: "Invalid column value for
  // Payment_Status") — now uses "PAID".
  const alreadySuccess=String(r.Payment_Status||"").toUpperCase()==="PAID";
  // Payment_Method_Final's real options confirmed 2026-08-03 (user's own Zoho
  // field screenshot): Cash / UPI / Card / Net Banking — replaces the
  // earlier guessed "Payment Gateway / Direct / Cash" list. None of these
  // is an automatic online gateway, so the QR/auto-pay block is gone —
  // every method now requires the receipt photo (or remaining<=0) before
  // "Payment Received" unlocks.
  $("ascreenBody").innerHTML = `
    <div class="card">
      <div class="fld"><label>Remaining Fee</label><input type="text" value="₹ ${esc(remaining)}" readonly></div>
      <div class="fld"><label>Payment Method</label>
        <select id="Payment_Method_Final">
          <option value="Cash" selected>Cash</option>
          <option value="UPI">UPI</option>
          <option value="Card">Card</option>
          <option value="Net Banking">Net Banking</option>
          <option value="Payment Gateway">Payment Gateway</option>
        </select>
      </div>
      <div id="qrBlock" style="text-align:center;margin:10px 0;display:none">
        <div style="border:2px solid #111;border-radius:12px;width:120px;height:120px;margin:0 auto 8px;background:repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 8px)"></div>
        <span style="font-family:var(--f-mono);font-size:11px;color:var(--muted)">Scan to pay — status updates automatically</span>
      </div>
      <div id="receiptBlock">${photoFieldHtml("Upload_Photo_of_receipt","Receipt Photo",1,1)}</div>
      <div class="fld"><label>Payment Status</label><input type="text" id="paymentStatusDisplay" value="${alreadySuccess?"PAID":"PENDING"}" readonly></div>
    </div>
    <button class="btn ok" id="paymentReceivedBtn" type="button" disabled>Payment Received</button>`;
  wirePhotoField("Upload_Photo_of_receipt",1);
  const methodEl=$("Payment_Method_Final");
  // Restored 2026-08-04 (per user request) — brings back the "Payment
  // Gateway" QR display removed during the 2026-08-03 schema rebuild (once
  // Payment_Method_Final's confirmed real options turned out to be Cash/UPI/
  // Card/Net Banking, none of them an online gateway). "Payment Gateway" is
  // back in the dropdown above too. Still just a decorative placeholder —
  // no real gateway/webhook is wired up to this app, same as the very first
  // build this exact block came from.
  function syncMethod(){
    const gateway=methodEl.value==="Payment Gateway";
    $("qrBlock").style.display=gateway?"":"none";
    $("receiptBlock").style.display=gateway?"none":"";
    refreshPayButton();
  }
  methodEl.onchange=syncMethod; syncMethod();
  function refreshPayButton(){
    const gateway=methodEl.value==="Payment Gateway";
    const receiptOk=(state.photos.Upload_Photo_of_receipt||[]).length>=1;
    // See technicianTicket's own comment on this exact block — same
    // Payment_Status Pending/Success logic, not repeated here.
    const success = alreadySuccess || (!gateway && receiptOk);
    $("paymentStatusDisplay").value = success ? "PAID" : "PENDING";
    $("paymentReceivedBtn").disabled = !(remaining<=0 || success);
  }
  document.getElementById("ascreenBody").addEventListener("click", refreshPayButton);
  $("paymentReceivedBtn").onclick=confirmPaymentReceived;
}
async function confirmPaymentReceived(){
  setDisabled("paymentReceivedBtn",true);
  try{
    const r=state.current;
    // See technicianTicket's own comment — Payment_Status always written
    // "PAID" here since clicking this button is itself the attestation.
    const payload={ Payment_Method_Final: $("Payment_Method_Final").value, Payment_received:"Yes", Payment_Status:"PAID", Status:"RSP CLOSED" };
    // Diagnostic logging (2026-08-03, user-reported live: "Invalid column
    // value for Payment_Status") — same pattern as workCompleted's own logging.
    console.log("[GR-Vendor] confirmPaymentReceived payload:", JSON.stringify(payload));
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Payment recorded — job closed","ok");
    backToDashboard();
  }catch(e){ console.error("[GR-Vendor] confirmPaymentReceived error:", e); toast((e&&e.message)||"Could not save","err"); setDisabled("paymentReceivedBtn",false); }
}

/* ---------- multi-photo capture (min/max, camera+GPS watermark) — shared
   with technicianTicket/driverTicket, not re-explained here ---------- */
// Chevron icon for the optional collapsible photo-field header (RSR WIP
// screen's Pre-/Post-service sections, 2026-08-03 user request) — same glyph
// as getRescueTicket's own CHEV_ICON, kept local since nothing else here
// shares JS across widget files.
const CHEV_ICON='<svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M8 5l8 7-8 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function photoFieldHtml(fieldName,label,min,max,collapsible){
  return `<div class="photo-field${collapsible?" collapsible":""}" id="pf_${fieldName}">
    <div class="lab"><span class="l">${collapsible?CHEV_ICON:""}${esc(label)}</span><span class="cnt" id="pf_${fieldName}_cnt">0 / ${min>0?("min "+min):("up to "+max)}</span></div>
    <div class="photo-grid" id="pf_${fieldName}_grid"></div>
  </div>`;
}
function wireCollapsibleField(fieldName){
  const wrap=$("pf_"+fieldName); const lab=wrap&&wrap.querySelector(".lab");
  if(lab) lab.onclick=function(){ wrap.classList.toggle("collapsed"); };
}
// Generic collapsible section card — same click-to-toggle idea as
// wireCollapsibleField() above, but for a titled card wrapping arbitrary
// field HTML rather than a photo grid specifically (see .acc-card CSS).
function accordionHtml(id,title,bodyHtml){
  return `<div class="card acc-card" id="${id}">
    <div class="acc-head">${CHEV_ICON}<span class="t">${esc(title)}</span></div>
    <div class="acc-body">${bodyHtml}</div>
  </div>`;
}
function wireAccordion(id){
  const box=$(id); const head=box&&box.querySelector(".acc-head");
  if(head) head.onclick=function(){ box.classList.toggle("collapsed"); };
}
function wirePhotoField(fieldName,max){ renderPhotoGrid(fieldName,max); }
// Visible confirmation of uploadPhotoNow()'s own background upload for this
// exact file — "ok" once apiUpload() has actually succeeded, "failed" if it
// errored (uploadPendingPhotos() will still retry it at the normal save
// step either way), "pending" (not yet in either set) while still in flight.
function uploadBadgeHtml(f){
  if(state.uploadedPhotoFiles.has(f)) return '<span class="up-badge ok" title="Saved">✓</span>';
  if(state.failedPhotoFiles.has(f)) return '<span class="up-badge failed" title="Save failed — will retry when you submit">!</span>';
  return '<span class="up-badge pending" title="Saving…">⋯</span>';
}
function renderPhotoGrid(fieldName,max){
  const files=state.photos[fieldName]||[];
  const grid=$("pf_"+fieldName+"_grid"); if(!grid) return;
  let html="";
  files.forEach(function(f,i){
    html+=`<div class="photo-slot"><img src="${URL.createObjectURL(f)}">${uploadBadgeHtml(f)}<button type="button" class="rm" data-i="${i}">✕</button></div>`;
  });
  if(files.length<max){
    // Two explicit add tiles (2026-08-03, user-requested) — live camera
    // capture (with GPS/time watermark) and a plain gallery picker.
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addCam" title="Take Photo">📷</div>`;
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addGal" title="Choose from Gallery">🖼️</div>`;
  }
  grid.innerHTML=html;
  const addCamEl=$("pf_"+fieldName+"_addCam");
  if(addCamEl) addCamEl.onclick=function(){ openCamera(fieldName,max); };
  const addGalEl=$("pf_"+fieldName+"_addGal");
  if(addGalEl) addGalEl.onclick=function(){ openGallery(fieldName,max); };
  grid.querySelectorAll(".rm").forEach(function(btn){
    btn.onclick=function(){ files.splice(Number(btn.dataset.i),1); renderPhotoGrid(fieldName,max); };
  });
  const cntEl=$("pf_"+fieldName+"_cnt");
  const minLabel=cntEl?cntEl.textContent.split("/")[1]:"";
  if(cntEl) cntEl.textContent=files.length+" /"+minLabel;
}
async function uploadPendingPhotos(recordId){
  for(const fieldName in state.photos){
    const files=state.photos[fieldName]||[];
    for(let i=0;i<files.length;i++){
      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading the same
      // file twice. Anything still not in the set (immediate upload failed,
      // or a live SDK became available only after it was taken) still gets
      // uploaded here as a fallback, same as before this change.
      if(state.uploadedPhotoFiles.has(files[i])) continue;
      await apiUpload(recordId, fieldName, files[i]);
    }
  }
}
// Fire-and-forget upload the moment a photo is captured/picked, so it's
// saved before the vendor ever taps a final action button (2026-08-04, per
// user request). Best-effort: a failure here just leaves the file for
// uploadPendingPhotos() to retry at the normal save step, so nothing is lost
// either way — this only makes the common case faster to actually persist.
async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  try{ await apiUpload(r.ID, fieldName, file); state.uploadedPhotoFiles.add(file); }
  catch(e){ console.warn("[GR-Vendor] immediate upload failed for "+fieldName+" — will retry on save", e); state.failedPhotoFiles.add(file); }
  renderPhotoGrid(fieldName, max); // refresh this slot's badge either way
}

let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
function getPositionSafe(){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03) — see technicianTicket's own comment on
      // this same function. Rounded to 15 decimal places via toFixed() (the
      // fields were widened to 15 places the same day) — not Math.round(x*1e15),
      // which can exceed Number.MAX_SAFE_INTEGER for lat/lon-sized values.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:8000 }
    );
  });
}
async function openCamera(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:"environment"}, audio:false });
    $("cameraVideo").srcObject=cameraStream;
    $("cameraModal").classList.add("on");
  }catch(e){
    toast("Camera unavailable — pick a photo instead","err");
    $("cameraFallbackInput").onchange=function(){
      const f=$("cameraFallbackInput").files[0]; if(!f) return;
      state.photos[fieldName]=state.photos[fieldName]||[];
      state.photos[fieldName].push(f);
      renderPhotoGrid(fieldName,max);
      uploadPhotoNow(fieldName,f,max);
      $("cameraFallbackInput").value="";
    };
    $("cameraFallbackInput").click();
  }
}
function openGallery(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  $("galleryInput").onchange=function(){
    const f=$("galleryInput").files[0]; if(!f) return;
    state.photos[fieldName]=state.photos[fieldName]||[];
    state.photos[fieldName].push(f);
    renderPhotoGrid(fieldName,max);
    uploadPhotoNow(fieldName,f,max);
    $("galleryInput").value="";
  };
  $("galleryInput").click();
}
function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(function(t){ t.stop(); }); cameraStream=null; }
  $("cameraModal").classList.remove("on");
}
async function capturePhoto(){
  const video=$("cameraVideo");
  const canvas=document.createElement("canvas");
  canvas.width=video.videoWidth||720; canvas.height=video.videoHeight||960;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const pos=await getPositionSafe();
  const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
  const lonText = pos ? pos.lon.toFixed(6) : "";
  const barH=56, pad=14;
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,canvas.height-barH,canvas.width,barH);
  ctx.fillStyle="#fff"; ctx.font="16px monospace";
  ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, canvas.height-barH+22);
  ctx.fillText(new Date().toLocaleString(), pad, canvas.height-barH+42);
  canvas.toBlob(function(blob){
    if(!blob) return;
    const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
    state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
    state.photos[currentPhotoField].push(file);
    closeCamera();
    renderPhotoGrid(currentPhotoField,currentPhotoMax);
    uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
  }, "image/jpeg", 0.85);
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

/* ---------- online/offline toggle (folded in from toggleGetRescue, vendor
   report) + Individual/Fleet detection ---------- */
let currentVendorRecord=null;
async function loadAvailability(){
  if(!LOGIN_EMAIL) return;
  // max_records only accepts 200/500/1000 (Zoho error 9250) — was passing 1,
  // which broke boot() for every vendor (loadAvailability runs before
  // loadDashboard). Fixed 2026-07-31.
  const recs=await apiGetReport(CONFIG.vendorReport, '('+CONFIG.vendorEmailField+' == "'+LOGIN_EMAIL+'")', 200);
  if(!recs.length) return;
  currentVendorRecord={ id:recs[0].ID, data:recs[0] };
  MY_VENDOR_NAME=recs[0][CONFIG.vendorNameField]||"";
  $("techName").textContent=MY_VENDOR_NAME||"Vendor";
  IS_FLEET = String(recs[0][CONFIG.vendorTypeField]||"").trim().toLowerCase()==="fleet";
  const isOnline=String(recs[0][CONFIG.vendorStatusField])==="Online";
  $("availToggle").classList.toggle("on", isOnline);
}
async function onToggleClick(){
  if(!currentVendorRecord) return;
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.vendorStatusField]=wantOnline?"Online":"Offline";
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.vendorReport, id:currentVendorRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

$("backBtn").onclick=backToDashboard;
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
  }catch(e){ console.warn("getInitParams failed", e); }
  await loadAvailability();
  await loadDashboard();
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
