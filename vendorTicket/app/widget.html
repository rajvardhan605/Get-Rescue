    el.innerHTML="";
    el.appendChild(img);
  });
}
// Real bug fixed 2026-08-21 (see fileCountFor()'s own comment above) — this
// used to render ONLY state.photos[fieldName] (this session's own picks),
// so reopening the app after already uploading photos in an earlier
// session showed a completely empty grid, even though the photos were
// genuinely saved server-side. Now renders whatever's already on the
// ticket record FIRST (as a placeholder, hydrated to a real thumbnail
// right after by hydrateAlreadyUploadedThumbs() — same async pattern
// getRescueTicket's own file previews use), then this session's own
// newly-picked files after that. Already-saved tiles have no ✕ remove
// button — there's no "delete an already-uploaded photo" flow here, only
// newly-picked-but-not-yet-final ones can be removed before upload.
function renderPhotoGrid(fieldName,max){
  const files=state.photos[fieldName]||[];
  const grid=$("pf_"+fieldName+"_grid"); if(!grid) return;
  const alreadyRaw = state.current && state.current[fieldName];
  const alreadyCount = fileCountFor(alreadyRaw);
  let html="";
  for(let i=0;i<alreadyCount;i++){
    html += `<div class="photo-slot" data-already-field="${esc(fieldName)}" data-already-idx="${i}"><span class="up-badge ok" title="Already saved">✓ Saved</span></div>`;
  }
  files.forEach(function(f,i){
    html+=`<div class="photo-slot"><img src="${URL.createObjectURL(f)}">${uploadBadgeHtml(f)}<button type="button" class="rm" data-i="${i}">✕</button></div>`;
  });
  if((alreadyCount+files.length)<max){
    // Two explicit add tiles (2026-08-03, user-requested) — live camera
    // capture (with GPS/time watermark) and a plain gallery picker.
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addCam" title="Take Photo">📷</div>`;
    html+=`<div class="photo-slot add" id="pf_${fieldName}_addGal" title="Choose from Gallery">🖼️</div>`;
  }
  grid.innerHTML=html;
  if(alreadyCount>0) hydrateAlreadyUploadedThumbs(fieldName, alreadyRaw);
  const addCamEl=$("pf_"+fieldName+"_addCam");
  if(addCamEl) addCamEl.onclick=function(){ openCamera(fieldName,max); };
  const addGalEl=$("pf_"+fieldName+"_addGal");
  if(addGalEl) addGalEl.onclick=function(){ openGallery(fieldName,max); };
  grid.querySelectorAll(".rm").forEach(function(btn){
    btn.onclick=function(){ files.splice(Number(btn.dataset.i),1); renderPhotoGrid(fieldName,max); };
  });
  const cntEl=$("pf_"+fieldName+"_cnt");
  const minLabel=cntEl?cntEl.textContent.split("/")[1]:"";
  if(cntEl) cntEl.textContent=(alreadyCount+files.length)+" /"+minLabel;
}
async function uploadPendingPhotos(recordId){
  for(const fieldName in state.photos){
    const files=state.photos[fieldName]||[];
    for(let i=0;i<files.length;i++){
      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading the same
      // file twice. Anything still not in the set (immediate upload failed,
      // or a live SDK became available only after it was taken) still gets
      // uploaded here as a fallback, same as before this change.
      if(state.uploadedPhotoFiles.has(files[i])) continue;
      await apiUpload(recordId, fieldName, files[i]);
    }
  }
}
// Fire-and-forget upload the moment a photo is captured/picked, so it's
// saved before the vendor ever taps a final action button (2026-08-04, per
// user request). Best-effort: a failure here just leaves the file for
// uploadPendingPhotos() to retry at the normal save step, so nothing is lost
// either way — this only makes the common case faster to actually persist.
async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  try{ await apiUpload(r.ID, fieldName, file); state.uploadedPhotoFiles.add(file); }
  catch(e){ console.warn("[GR-Vendor] immediate upload failed for "+fieldName+" — will retry on save", e); state.failedPhotoFiles.add(file); }
  renderPhotoGrid(fieldName, max); // refresh this slot's badge either way
}

let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
// maximumAge param added 2026-09-13 (user request: "In-app image capture
// lag/time is excessively high" — re-checked after the earlier 2026-09-10/
// 2026-09-12 camera-resolution fixes, which addressed the canvas/stream size
// but left the real dominant cost untouched: getPositionSafe() itself can
// block for up to 8 FULL SECONDS per call, on every single photo, since it
// always requested a brand-new GPS fix with no maximumAge at all (defaults
// to 0 — "never accept a cached position"). Defaults to 0 here too, so every
// EXISTING call site (Accept/Reach/WIP/etc., where a fresh, current-moment
// position genuinely matters) is completely unaffected — only capturePhoto()
// below now opts into a 15s cache window, since a vendor taking several
// photos in quick succession during the same job hasn't meaningfully moved
// between shots; the 2nd/3rd/4th photo in a sequence can reuse the 1st
// photo's already-resolved position instead of waiting up to 8s all over
// again. Does not touch enableHighAccuracy or the 8s timeout itself — a
// genuinely cold GPS fix (first photo of a session) is unaffected either way.
function getPositionSafe(maximumAge){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03) — see technicianTicket's own comment on
      // this same function. Rounded to 15 decimal places via toFixed() (the
      // fields were widened to 15 places the same day) — not Math.round(x*1e15),
      // which can exceed Number.MAX_SAFE_INTEGER for lat/lon-sized values.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:maximumAge||0 }
    );
  });
}
async function openCamera(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  try{
    // width/height ideal constraints added 2026-09-12 (client email: "In-app
    // image capture lag/time is excessively high") — this call used to ask
    // for no resolution at all, meaning the device handed back its own
    // native (often 1920x1080+, sometimes far higher) stream; the existing
    // CAPTURE_MAX_DIM=1600 downscale only ever helped the SAVED FILE's size
    // — the live preview and the canvas draw at capture time were still
    // working with that full native-resolution video the whole time, which
    // is real, plausible overhead the file-size fix never touched. `ideal`
    // (not a hard `min`/exact value) is a soft preference — devices that
    // can't hit it just return their closest native mode, so this can't
    // break capture on any device, only possibly reduce it working harder
    // than the eventual 1600px output ever needed. Matches CAPTURE_MAX_DIM
    // (below) so there's no real resolution left to gain past that point.
    cameraStream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:"environment", width:{ideal:1600}, height:{ideal:1600}}, audio:false });
    $("cameraVideo").srcObject=cameraStream;
    $("cameraModal").classList.add("on");
  }catch(e){
    toast("Camera unavailable — pick a photo instead","err");
    $("cameraFallbackInput").onchange=function(){
      const f=$("cameraFallbackInput").files[0]; if(!f) return;
      $("cameraFallbackInput").value="";
      // Compressed 2026-09-12 (full-application audit — real gap found,
      // not live-reported) — this camera-permission-denied fallback path
      // pushed the OS picker's file straight through with zero compression,
      // same gap the 2026-09-11 fix already closed for openGallery() just
      // below, using the identical compressImageFile() helper.
      compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
        state.photos[fieldName]=state.photos[fieldName]||[];
        state.photos[fieldName].push(compressed);
        renderPhotoGrid(fieldName,max);
        uploadPhotoNow(fieldName,compressed,max);
      });
    };
    $("cameraFallbackInput").click();
  }
}
function openGallery(fieldName,max){
  currentPhotoField=fieldName; currentPhotoMax=max;
  $("galleryInput").onchange=function(){
    const f=$("galleryInput").files[0]; if(!f) return;
    $("galleryInput").value="";
    // Compressed before it ever enters state.photos (2026-09-11) — see
    // compressImageFile()'s own header comment. Everything downstream
    // (renderPhotoGrid/uploadPhotoNow/uploadPendingPhotos) is unaffected —
    // it just receives a smaller File than before, same shape either way.
    compressImageFile(f, CAPTURE_MAX_DIM, 0.85).then(function(compressed){
      state.photos[fieldName]=state.photos[fieldName]||[];
      state.photos[fieldName].push(compressed);
      renderPhotoGrid(fieldName,max);
      uploadPhotoNow(fieldName,compressed,max);
    });
  };

}
function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(function(t){ t.stop(); }); cameraStream=null; }
  $("cameraModal").classList.remove("on");
}
// capturingPhoto guard + shutter disable/feedback (2026-09-07, real bug
// fixed — confirmed live: "photo clicks are taking too much time"). Root
// cause wasn't the two camera/gallery buttons (those are intentional,
// separate features — camera vs. gallery-picker — not a duplicate, see
// renderPhotoGrid()'s own comment) but this function itself: getPositionSafe()
// can take up to 8 seconds to resolve, and until now nothing disabled the
// shutter button or showed any progress during that wait — the modal just
// sat there looking frozen, inviting repeated taps that each started a NEW
// concurrent capture (a fresh GPS request plus a duplicate photo pushed onto
// state.photos/duplicate upload). Now guarded with a simple in-flight flag
// (extra taps are ignored outright, not queued) and visible feedback (shutter
// disabled + dimmed) so the wait reads as "working," not "broken." Does not
// change the actual capture/watermark/upload logic at all — only wraps it.
let capturingPhoto=false;
// Soft-test item #14 (2026-09-10): "In-app image capture lag/time is
// excessively high (compression itself is good)" — root cause was the
// canvas being sized at the camera's NATIVE stream resolution (often
// 1920x1080+ on a modern phone with no width/height constraint passed to
// getUserMedia), so every capture encoded a full-res JPEG regardless of
// what the photo actually needs to show. 1600px matches the backlog item's
// own suggested figure. Math.min(1, ...) below guarantees this only ever
// scales DOWN, never up — a device whose native stream is already smaller
// than 1600px on its long edge is completely unaffected.
const CAPTURE_MAX_DIM = 1600;

// be automatically compressed before transmission") — capturePhoto() below
// already resizes/re-encodes an in-app camera shot to this same
// CAPTURE_MAX_DIM at JPEG quality 0.85; a gallery-PICKED file (openGallery(),
// above) bypassed that entirely — pushed straight into state.photos as
// whatever the device's own Photos app handed over, which can be a full-
// resolution multi-MB original. Same resize math as capturePhoto() (scale
// only ever down, never up), via an off-screen <img> instead of a live
// <video> element. Falls back to the ORIGINAL, uncompressed file if
// anything about decoding/canvas fails (a corrupt image, an unsupported
// format) — a compression failure must never block the upload outright.
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=function(){
        try{
          const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.naturalWidth*scale);
          canvas.height=Math.round(img.naturalHeight*scale);
          canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            resolve(blob ? new File([blob], file.name, {type:"image/jpeg"}) : file);
          }, "image/jpeg", quality);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src=url;
    }catch(e){ resolve(file); }
  });
}
async function capturePhoto(){
  if(capturingPhoto) return;
  capturingPhoto=true;
  const shutterBtn=$("cameraShutter");
  shutterBtn.disabled=true; shutterBtn.style.opacity="0.4";
  try{
    const video=$("cameraVideo");
    const nativeW=video.videoWidth||720, nativeH=video.videoHeight||960;
    const scale=Math.min(1, CAPTURE_MAX_DIM/Math.max(nativeW,nativeH));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(nativeW*scale); canvas.height=Math.round(nativeH*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // maximumAge:15000 (2026-09-13) — see getPositionSafe()'s own comment;
    // this is the specific call site that benefits from reusing a very-
    // recent GPS fix instead of always requesting a brand-new one.
    const pos=await getPositionSafe(15000);
    const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
    const lonText = pos ? pos.lon.toFixed(6) : "";
    const barH=56, pad=14;
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,canvas.height-barH,canvas.width,barH);
    ctx.fillStyle="#fff"; ctx.font="16px monospace";
    ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, canvas.height-barH+22);
    ctx.fillText(new Date().toLocaleString(), pad, canvas.height-barH+42);
    await new Promise(function(resolveBlob){
      canvas.toBlob(function(blob){
        if(!blob){ resolveBlob(); return; }
        const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
        state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
        state.photos[currentPhotoField].push(file);
        closeCamera();
        renderPhotoGrid(currentPhotoField,currentPhotoMax);
        uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
        resolveBlob();
      }, "image/jpeg", 0.85);
    });
  } finally {
    capturingPhoto=false;
    shutterBtn.disabled=false; shutterBtn.style.opacity="";
  }
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

/* ---------- online/offline toggle (folded in from toggleGetRescue, vendor
   report) + Individual/Fleet detection ---------- */
let currentVendorRecord=null;
// Separate from currentVendorRecord on purpose (2026-08-05, user request —
// "use My_Availability_Vendor report for the toggle") — its own record id is
// NOT a Vendors_Report id, so it must never be used for Assigned_Vendor/
// Vendors1/Invites ID matching (see acceptService/isMine/loadMyInvites, which
// all correctly keep using currentVendorRecord instead). Only for reading/
// writing this toggle's own on/off state.
let currentAvailabilityRecord=null;
function lockAvailabilityToggle(){
  const el=$("availToggle"); if(!el) return;
  el.classList.add("locked");
  el.title="Availability unavailable — no matching "+CONFIG.availabilityReport+" record found for your login.";
}
// Extracted 2026-08-19 (was inline in loadAvailability() below, now also
// called as a RETRY from acceptService()/assignTechnician()) — two live,
// user-reported tickets (RSID396825, RSID396829) showed Expected_Arrival_Time
// correctly stamped by a genuine Accept tap (proving the vendor really did
// accept, on their own phone), yet Assigned_Vendor/Vendor_Email stayed blank
// on the agent's own screen. Being visible/acceptable to the vendor at all
// only ever requires the SEPARATE Vendor_Emails/Invites/isMine() match (see
// isMine()'s own comment) — NOT this one — so it's fully possible for a
// vendor to see and accept a ticket while this match had never resolved.
// Root cause not yet pinned down to a single explanation (could be a slow
// mobile connection racing boot()'s own one-shot fetch, or a genuine
// Vendors_Report data mismatch for that specific vendor) — but a retry of
// this exact, real query costs nothing and fixes the former outright without
// guessing at anything.
async function resolveVendorRecord(logContext){
  if(!LOGIN_EMAIL) return currentVendorRecord;
  // Vendor identity (Vendors_Report) — used for Assigned_Vendor/Vendors1/
  // Invites ID matching elsewhere (isMine/loadMyInvites/acceptService),
  // unrelated to the toggle itself. Fetches all records and matches client-
  // side, case-insensitive + trimmed (2026-08-05 fix — a server-side exact-
  // match criteria is case-sensitive and silently returns nothing on any
  // casing mismatch). Fetches up to 1000 (2026-08-19, was 200 — user
  // confirmed live a Vendors_Report record with the right email DOES exist
  // for a vendor this still failed to match; a growing Vendors_Report
  // quietly exceeding the old 200-record cap would produce exactly that
  // symptom, so removing the cap costs nothing and rules it out outright).
  const vrecs=await apiGetReport(CONFIG.vendorReport, null, 1000);
  const myVendor=vrecs.find(function(r){ return String(r[CONFIG.vendorEmailField]||"").trim().toLowerCase()===LOGIN_EMAIL.trim().toLowerCase(); });
  if(myVendor){
    currentVendorRecord={ id:myVendor.ID, data:myVendor };
    MY_VENDOR_NAME=myVendor[CONFIG.vendorNameField]||"";
    MY_VENDOR_PHONE=myVendor[CONFIG.vendorPhoneField]||"";
    $("techName").textContent=MY_VENDOR_NAME||"Vendor";
    IS_FLEET = String(myVendor[CONFIG.vendorTypeField]||"").trim().toLowerCase()==="fleet";
    // Real change (2026-08-06, user request) — "show the technician hand-off
    // option if this vendor actually HAS technicians, hide it if not" is now
    // driven by this multi-lookup field's own contents, not by Vendor_Type.
    // Each item can be a bare id or an enriched {ID/display_value/...}
    // object depending on how Zoho returns a multi-lookup — lookupId()
    // already handles both.
    const rawTechs = myVendor[CONFIG.vendorTechniciansField];
    MY_TECHNICIAN_IDS = (Array.isArray(rawTechs)?rawTechs:(rawTechs?[rawTechs]:[])).map(lookupId).filter(function(v){ return v!=null && v!==""; });
    // Only warn for a Fleet-type vendor with zero extracted ids — an
    // Individual vendor genuinely having none is the normal, expected case
    // and would otherwise spam every such login with a false-alarm warning.
    if(IS_FLEET && !MY_TECHNICIAN_IDS.length) console.warn("[GR-Vendor] "+logContext+": Vendor_Type is Fleet but no ids extracted from", CONFIG.vendorReport+"."+CONFIG.vendorTechniciansField, "— raw value:", JSON.stringify(rawTechs), ". If this vendor genuinely has technicians assigned, the field name guess is likely wrong (see CONFIG.vendorTechniciansField's own comment) — this vendor's own record keys:", Object.keys(myVendor));
  } else {
    // Enriched 2026-08-19 (user confirmed live: a Vendors_Report record with
    // the right email genuinely exists, yet this still reported no match) —
    // dumping every record's OWN value under CONFIG.vendorEmailField (not
    // just the first record's raw keys) makes a wrong field-name guess
    // obvious at a glance: every entry showing `undefined` means
    // CONFIG.vendorEmailField ("Email") isn't this report's real API name
    // for that column; entries showing SOME email but never a match means
    // it's a genuine value mismatch (typo/whitespace/case Zoho didn't apply
    // the same trim+lowercase to) instead.
    console.warn("[GR-Vendor] "+logContext+": no", CONFIG.vendorReport, "record's", CONFIG.vendorEmailField, "matched", LOGIN_EMAIL, "— ticket matching (Assigned_Vendor/Vendors1/Invites) will be affected. Records loaded:", vrecs.length, "| every record's own "+CONFIG.vendorEmailField+" value:", vrecs.map(function(r){ return { ID:r.ID, email:r[CONFIG.vendorEmailField] }; }), "| first record's full own keys (to spot the real API name if every email above is undefined):", vrecs[0] && Object.keys(vrecs[0]));
  }
  return currentVendorRecord;
}
async function loadAvailability(){
  if(!LOGIN_EMAIL){ console.warn("[GR-Vendor] loadAvailability: LOGIN_EMAIL is empty — getInitParams may have failed or returned no loginUser. Toggle stays locked."); lockAvailabilityToggle(); return; }
  await resolveVendorRecord("loadAvailability");
  // Availability toggle (2026-08-05, user request) — a genuinely separate
  // report from Vendors_Report, same field-name convention (Email/
  // Availability_Status) the standalone toggleGetRescue widget already used
  // for this exact report.
  const arecs=await apiGetReport(CONFIG.availabilityReport, null, 200);
  const mine=arecs.find(function(r){ return String(r[CONFIG.availabilityEmailField]||"").trim().toLowerCase()===LOGIN_EMAIL.trim().toLowerCase(); });
  if(!mine){
    console.warn("[GR-Vendor] loadAvailability: no", CONFIG.availabilityReport, "record's", CONFIG.availabilityEmailField, "matched", LOGIN_EMAIL, "— toggle stays locked. Records loaded:", arecs.length, "| first record's own keys:", arecs[0]);
    lockAvailabilityToggle();
    return;
  }
  currentAvailabilityRecord={ id:mine.ID, data:mine };
  const isOnline=String(mine[CONFIG.availabilityStatusField])==="Online";
  $("availToggle").classList.toggle("on", isOnline);
  // Reopening the app while already Online (2026-08-17) — start the
  // heartbeat here too, not just from onToggleClick()'s own toggle action,
  // so location stays fresh across a page refresh/reopen without the vendor
  // having to toggle off and back on.
  if(isOnline) startLocationHeartbeat();
}
/* Live location heartbeat (2026-08-17, user request: "when vendor is online
   it is supposed to show the distance from the vendor's current location
   (latest location from app)") — while toggled Online, refreshes this
   vendor's own Current_Latitude/Current_Longitude every ~2.5 minutes (the
   midpoint of the user's own requested 2-3 min range), read by
   getRescueTicket's own Assignment-step vendor picker (see that widget's own
   vendorInfo() comment) once Online. An immediate fix is taken the moment
   they toggle online, rather than waiting for the first interval tick — see
   startLocationHeartbeat(). Best-effort throughout: a denied/unavailable
   fix, or a failed write, just silently skips that one tick — never blocks
   the toggle itself or any other part of this app. */
const LOCATION_HEARTBEAT_MS=150000; // 2.5 min
let locationHeartbeatTimer=null;
async function pingCurrentLocation(){
  if(!currentAvailabilityRecord) return;
  try{
    const pos=await getPositionSafe();
    if(!pos) return;
    const fn=resolve("updateRecordById"); if(!fn) return;
    const payload={};
    payload[CONFIG.availabilityCurrentLatField]=pos.lat;
    payload[CONFIG.availabilityCurrentLonField]=pos.lon;
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.availabilityReport, id:currentAvailabilityRecord.id, payload:{data:payload} });
  }catch(e){ console.warn("[GR-Vendor] pingCurrentLocation failed (non-fatal, retries next tick):", e); }
}
function startLocationHeartbeat(){
  stopLocationHeartbeat(); // never let two timers stack
  pingCurrentLocation(); // immediate fix now, don't wait for the first interval tick
  locationHeartbeatTimer=setInterval(pingCurrentLocation, LOCATION_HEARTBEAT_MS);
}
function stopLocationHeartbeat(){ if(locationHeartbeatTimer){ clearInterval(locationHeartbeatTimer); locationHeartbeatTimer=null; } }
async function onToggleClick(){
  if(!currentAvailabilityRecord) return;
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.availabilityStatusField]=wantOnline?"Online":"Offline";
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.availabilityReport, id:currentAvailabilityRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
    if(wantOnline) startLocationHeartbeat(); else stopLocationHeartbeat();
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

$("backBtn").onclick=backToDashboard;
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
    INIT_PARAMS=params; // zohoAppLinkName()'s own envUrlFragment lookup
  }catch(e){ console.warn("getInitParams failed", e); }
  await loadAvailability();
  // Awaited (not fire-and-forget) so VEHICLE_NAMES is already populated
  // before the very first render — otherwise the dashboard's first paint
  // would still show a raw id with nothing to trigger a re-render once the
  // names actually arrive.
  await loadVehicleNames();
  await loadIssueNames();
  await loadDashboard();
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
