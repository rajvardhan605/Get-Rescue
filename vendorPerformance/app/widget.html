<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get-Rescue · Vendor Performance</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 60px}
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.hdr h1{font-family:var(--f-disp);font-size:24px;font-weight:800;color:var(--ink)}

select#filterRange{font-family:var(--f-disp);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:10px;
  border:1.5px solid var(--line-strong);background:var(--card);color:var(--text);cursor:pointer}
.section-title{font-family:var(--f-disp);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 12px}

  padding:22px 18px;text-align:center}

  align-items:center;justify-content:center;margin:0 auto 10px}

  font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}

<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Vendor Performance</h1>
      <div class="sub" id="vendorNameLine">Loading…</div>
    </div>
    <select id="filterRange">
      <option value="today">Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="thisMonth" selected>This Month</option>
      <option value="lastMonth">Last Month</option>
    </select>
  </div>
  <div id="content"><div class="center-state"><div class="spin"></div></div></div>
</div>
<script>
/* =====================================================================
   Get-Rescue — Vendor Performance widget (2026-09-03)

   Runs inside a logged-in vendor's own portal (same identity-resolution
   pattern as vendorTicket: Vendors_Report matched by login email). Shows
   only THIS vendor's own aggregate stats — per the hand-drawn wireframe's
   own explicit rule "Vendor & mechanic will not be shown case HISTORY",
   this widget deliberately never lists individual tickets, only counts/
   percentages. Read-only — no writes anywhere in this file.

   Layout matches the wireframe: a "CASES" column (Rejected/Timed Out,
   Completed, Cancelled) and a "% PERCENTAGE" column (Reached Inside ETA,
   Issues Fixed, Customer Feedback >= 9), both filterable by
   Today/Yesterday/This Month/Last Month.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  // reportName / taskRejectionsReport are NO LONGER READ BY THIS WIDGET
  // (2026-09-18). Both reports are now fetched server-side by the
  // getVendorTickets and getTaskRejections Custom APIs, which hold the real
  // report names themselves. Kept here purely as documentation of what those
  // two APIs read — if either report is ever renamed in Zoho, the name has to
  // change in the Deluge, not here.
  reportName: "Agent_Ticket_Report",
  taskRejectionsReport: "Task_Rejections_Report",
  vendorReport: "Vendors_Report",
  vendorEmailField: "Email",
  vendorNameField: "Vendor_Name",
  serviceTypeField: "Service_Type"
};
const ZOHO_SCOPE_NAME = "getrescued";
let INIT_PARAMS = null;
function zohoAppLinkName(){
  const frag = (INIT_PARAMS && INIT_PARAMS.envUrlFragment) || "";
  return CONFIG.appName + (/development/i.test(frag) ? "-development" : "");
}
let LOGIN_EMAIL="", currentVendorRecord=null, MY_VENDOR_NAME="";

const $=(id)=>document.getElementById(id);
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function resolve(method){
  const C = window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces = [C.DATA, C.PUBLISH, C.META, C.UTIL, C.FILE];
  for (let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||1000 };
  if(criteria) cfg.criteria=criteria;
  try{
    const r=await fn(cfg);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  }catch(e){ console.warn("[GR-VendorPerf] apiGetReport("+report+") failed", e); return []; }
}
function lookupId(v){ return (v && typeof v==="object") ? (v.ID||v.id) : v; }

/* resolveVendorRecord() — 2026-09-18, user request ("use My_Availability_Vendor
   report in place of Vendors_Report").

   A vendor signing in to the portal got "No matching Vendors_Report record found
   for your login" even though their vendor record plainly exists. Same root
   cause as the raw vehicle ids on the dashboard the same day: the Vendor portal
   profile is refused Vendors_Report with {"code":2898,"message":"Permission
   denied to view record(s)."}, and apiGetReport turns that refusal into an empty
   array — so the search had nothing to search.

   My_Availability_Vendor is a report over the SAME underlying Vendors form
   (unified 2026-08-03, see FIELDS.md Form 4) but scoped to the signed-in user,
   which is exactly why a portal vendor can read it when the full report is
   closed to them. Record IDs and field names are therefore identical — nothing
   downstream of this function changes.

   Tried in order, first hit wins, so this is additive rather than a swap:
   My_Availability_Vendor first (works for a portal vendor), then Vendors_Report
   (works for an internal user, and is what every existing working setup uses).
   Neither report being readable leaves currentVendorRecord null and produces the
   same error screen as before, so the failure mode is unchanged. */
/* loadTaskRejectionsViaCustomApi() — 2026-09-18. Server-side read of
   Task_Rejections_Report via the getTaskRejections Custom API, for the case
   where this portal profile is refused the report directly (code 2898).

   Returns rows in the SAME shape the direct read produces — objects carrying
   RSP_Name and Rejected_At — so the existing filter below is untouched and does
   not need to know which route the data arrived by.

   Fails soft in every branch: any problem returns an empty array, which is
   exactly what the direct read already returned, so the screen behaves as it
   does today rather than breaking. */
/* loadVendorTicketsViaCustomApi() — 2026-09-18. Server-side read of
   Agent_Ticket_Report via the getVendorTickets Custom API, for the case where
   this portal profile cannot read that report directly.

   Unlike the direct read, this one filters BY VENDOR on the server, so it comes
   back with only this vendor's cases instead of all 1000. Rows carry
   Assigned_Vendor as a bare id, so boot()'s existing client-side filter still
   matches and did not need changing.

   Fails soft: any problem returns an empty array, which is what the direct read
   already returned in this situation. */
async function loadVendorTicketsViaCustomApi(vendorId){
  const fn=resolve("invokeCustomApi");
  if(!fn){ console.warn("[GR-VendorPerf] loadVendorTicketsViaCustomApi: invokeCustomApi unavailable — no tickets."); return []; }
  try{
    const res=await fn({ api_name:"getVendorTickets", workspace_name:"getrescued", http_method:"POST", content_type:"application/json", payload:{ vendorId:String(vendorId) } });
    console.log("[GR-VendorPerf] loadVendorTicketsViaCustomApi: raw response:", res);
    let data=res;
    if(data && typeof data.result==="string"){
      try{ data=JSON.parse(data.result); }
      catch(e){ console.warn("[GR-VendorPerf] loadVendorTicketsViaCustomApi: response.result wasn't valid JSON", e, res); return []; }
    }
    if(!data || data.code!=="SUCCESS" || !Array.isArray(data.tickets)){
      console.warn("[GR-VendorPerf] loadVendorTicketsViaCustomApi: Custom API did not return tickets —", (data&&data.message)||"(no message)", res);
      return [];
    }
    console.log("[GR-VendorPerf] loadVendorTicketsViaCustomApi: resolved "+data.tickets.length+" ticket(s) via the Custom API fallback.");
    return data.tickets;
  }catch(e){
    console.warn("[GR-VendorPerf] loadVendorTicketsViaCustomApi failed — no tickets.", e);
    return [];
  }
}
async function loadTaskRejectionsViaCustomApi(){
  const fn=resolve("invokeCustomApi");
  if(!fn){ console.warn("[GR-VendorPerf] loadTaskRejectionsViaCustomApi: invokeCustomApi unavailable — rejections stay at zero."); return []; }
  try{
    // POST with no payload key — the shape proven by this project's other
    // zero-parameter Custom APIs (checkOperationsManagerPermission,
    // getVehicleNames). GET with an empty payload does not work.
    const res=await fn({ api_name:"getTaskRejections", workspace_name:"getrescued", http_method:"POST", content_type:"application/json" });
    console.log("[GR-VendorPerf] loadTaskRejectionsViaCustomApi: raw response:", res);
    let data=res;
    if(data && typeof data.result==="string"){
      try{ data=JSON.parse(data.result); }
      catch(e){ console.warn("[GR-VendorPerf] loadTaskRejectionsViaCustomApi: response.result wasn't valid JSON", e, res); return []; }
    }
    if(!data || data.code!=="SUCCESS" || !Array.isArray(data.rejections)){
      console.warn("[GR-VendorPerf] loadTaskRejectionsViaCustomApi: Custom API did not return rejections —", (data&&data.message)||"(no message)", res);
      return [];
    }
    console.log("[GR-VendorPerf] loadTaskRejectionsViaCustomApi: resolved "+data.rejections.length+" rejection row(s) via the Custom API fallback.");
    return data.rejections;
  }catch(e){
    console.warn("[GR-VendorPerf] loadTaskRejectionsViaCustomApi failed — rejections stay at zero.", e);
    return [];
  }
}
const VENDOR_SELF_REPORTS = ["My_Availability_Vendor", "Vendors_Report"];
async function resolveVendorRecord(){
  if(!LOGIN_EMAIL) return null;
  const wanted = LOGIN_EMAIL.trim().toLowerCase();
  for(const reportName of VENDOR_SELF_REPORTS){
    const vrecs = await apiGetReport(reportName, null, 1000);
    console.log("[GR-VendorPerf] resolveVendorRecord: "+reportName+" returned "+vrecs.length+" record(s).");
    if(!vrecs.length) continue;
    // Email match first — the original behaviour, unchanged.
    let myVendor = vrecs.find(function(r){ return String(r[CONFIG.vendorEmailField]||"").trim().toLowerCase()===wanted; });
    // My_Availability_Vendor is already filtered to the signed-in user, so a
    // single row IS this vendor even when its email column is blank or held
    // under a different field name. Only ever applied to a one-row result, and
    // never to the full Vendors_Report, where picking "the only row" would be
    // meaningless.
    if(!myVendor && vrecs.length===1 && reportName!=="Vendors_Report"){
      myVendor = vrecs[0];
      console.log("[GR-VendorPerf] resolveVendorRecord: no email match in "+reportName+", but it returned exactly one row and is a self-scoped report — using it.");
    }
    if(myVendor){
      currentVendorRecord = { id: myVendor.ID, data: myVendor };
      MY_VENDOR_NAME = myVendor[CONFIG.vendorNameField] || "";
      console.log("[GR-VendorPerf] resolveVendorRecord: matched vendor "+currentVendorRecord.id+" ("+(MY_VENDOR_NAME||"no name")+") via "+reportName+".");
      return currentVendorRecord;
    }
    console.log("[GR-VendorPerf] resolveVendorRecord: "+reportName+" had rows but none matched "+wanted+" on "+CONFIG.vendorEmailField+".");
  }
  console.warn("[GR-VendorPerf] resolveVendorRecord: no vendor record found in any of", VENDOR_SELF_REPORTS, "for", LOGIN_EMAIL);
  return currentVendorRecord;
}

/* ---------- date-range filter ---------- */
function rangeFor(key){
  const now=new Date();
  const startOfDay=(d)=> new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0);
  const endOfDay=(d)=> new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999);
  if(key==="today") return { from:startOfDay(now), to:endOfDay(now) };
  if(key==="yesterday"){ const y=new Date(now); y.setDate(y.getDate()-1); return { from:startOfDay(y), to:endOfDay(y) }; }
  if(key==="thisMonth") return { from:new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0), to:endOfDay(now) };
  if(key==="lastMonth"){ const f=new Date(now.getFullYear(),now.getMonth()-1,1,0,0,0,0); const t=new Date(now.getFullYear(),now.getMonth(),0,23,59,59,999); return { from:f, to:t }; }
  return { from:startOfDay(now), to:endOfDay(now) };
}
// Same defensive multi-format parse as the dashboard timer feature
// (getRescueTicket) — Added_Time is a Zoho system field, its own wire
// format isn't independently confirmed live, so native ISO parsing is
// tried first, falling back to this app's own "DD-Mon-YYYY HH:mm:ss"
// dash formats (12h and 24h) rather than assuming either.
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseDateTime12(str){
  if(!str) return null;
  const m=String(str).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return null;
  const monIdx=MON.findIndex(function(mo){ return mo.toLowerCase()===m[2].toLowerCase(); });
  if(monIdx<0) return null;
  let hour=Number(m[4])%12; if(/pm/i.test(m[7])) hour+=12;
  const d=new Date(Number(m[3]), monIdx, Number(m[1]), hour, Number(m[5]), Number(m[6]));
  return isNaN(d) ? null : d;
}
function parseDateTime24(str){
  if(!str) return null;
  const m=String(str).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
  if(!m) return null;
  const monIdx=MON.findIndex(function(mo){ return mo.toLowerCase()===m[2].toLowerCase(); });
  if(monIdx<0) return null;
  const d=new Date(Number(m[3]), monIdx, Number(m[1]), Number(m[4]), Number(m[5]), Number(m[6]));
  return isNaN(d) ? null : d;
}
function parseAnyDateTime(str){
  if(!str) return null;
  const native=new Date(str);
  if(!isNaN(native)) return native;
  return parseDateTime12(str) || parseDateTime24(str);
}
function inRange(dateVal, range){
  const d=parseAnyDateTime(dateVal);
  if(!d) return false;
  return d.getTime()>=range.from.getTime() && d.getTime()<=range.to.getTime();
}

/* ---------- ETA-met check — same logic as getRescueTicket's own
   etaMetStatus(), duplicated here rather than shared across widget files
   (each widget in this repo is a single self-contained HTML file). ---------- */
function expectedArrivalDeadline(r){
  const isTow=String(r[CONFIG.serviceTypeField]||"").toUpperCase()==="TOW";
  const acceptRaw = isTow ? r.Service_Acceptance_For_Tow : r.Service_Acceptance;
  const acceptAt = parseDateTime12(acceptRaw) || parseDateTime24(acceptRaw);
  const overrideMins = isTow ? r.Agent_ETA_Override_TOW : r.Agent_ETA_Override;
  const etaMins = (overrideMins!=null && overrideMins!=="") ? Number(overrideMins) : Number(isTow ? r.ETA_TOW : r.ETA);
  if(!etaMins || isNaN(etaMins) || !acceptAt) return null;
  return new Date(acceptAt.getTime()+etaMins*60000);
}
function etaMetStatus(r){
  const deadline=expectedArrivalDeadline(r);
  if(!deadline) return null;
  const reachAt=parseDateTime12(r.Reach_Time) || parseDateTime24(r.Reach_Time);
  if(!reachAt) return null;
  return reachAt.getTime()<=deadline.getTime();
}

/* ---------- stat computation ---------- */
function computeStats(tickets, rejections, range){
  const mine = tickets.filter(function(r){ return inRange(r.Added_Time, range); });

  const cancelled = mine.filter(function(r){
    const st=String(r.Status||"").trim().toUpperCase();
    const cs=String(r.Closure_Status||"").trim();
    return st==="RSP CANCELLED" || cs==="Cancelled" || cs==="Cancelled - Billable";
  }).length;
  // Real bug fixed 2026-09-04, live-confirmed via console dump: Closure_Status
  // is a separate, agent-driven Final Closure field that in practice is
  // almost never set (every "done" ticket sampled live had it blank) — the
  // vendor's own completion signal is Status:"RSP CLOSED" (Step 8, Payment
  // Received), which happens automatically and much earlier than any
  // optional Final Closure step. Keeping the Closure_Status check too (a
  // ticket that DOES reach full Final Closure with Completed set should
  // still count) — just no longer the only signal.
  const completed = mine.filter(function(r){
    const st=String(r.Status||"").trim().toUpperCase();
    const cs=String(r.Closure_Status||"").trim();
    return st==="RSP CLOSED" || cs==="Completed";
  }).length;

  const rejectedCount = rejections.filter(function(t){ return inRange(t.Rejected_At, range); }).length;

  const etaJudged = mine.map(etaMetStatus).filter(function(v){ return v!==null; });
  const etaMetPct = etaJudged.length ? Math.round(etaJudged.filter(Boolean).length/etaJudged.length*100) : null;

  // Issue Resolved is an RSR-only field (WIP page) — scoped to RSR tickets only.
  const rsrWithResolution = mine.filter(function(r){
    return String(r[CONFIG.serviceTypeField]||"").toUpperCase()!=="TOW" && (r.Issue_Resolved==="Yes"||r.Issue_Resolved==="No");
  });
  const issuesFixedPct = rsrWithResolution.length ? Math.round(rsrWithResolution.filter(function(r){ return r.Issue_Resolved==="Yes"; }).length/rsrWithResolution.length*100) : null;

  const withFeedback = mine.filter(function(r){ return r.Cx_Feedback_Score!=null && r.Cx_Feedback_Score!==""; });
  const feedbackHighPct = withFeedback.length ? Math.round(withFeedback.filter(function(r){ return Number(r.Cx_Feedback_Score)>=9; }).length/withFeedback.length*100) : null;

  return { rejectedCount, completed, cancelled, etaMetPct, issuesFixedPct, feedbackHighPct };
}

/* Vendor Portal settlement statement (2026-09-14) — the last outstanding piece
   of the Vendor Accounting scope ("vendor statement view in Vendor Portal").

   AGGREGATE TOTALS ONLY. This is a hard constraint, not a simplification: the
   2026-09-04 decision was explicit that this shows "aggregate totals only, NOT
   a full case-level statement", preserving the hand-drawn wireframe rule this
   entire widget exists under — "Vendor & mechanic will not be shown case
   HISTORY" (see ACCESS.md's own vendorPerformance note). So there is
   deliberately no case list, no Case IDs, no dates, no per-job breakdown here,
   and none should be added later without re-confirming that decision.

   Reads fields this widget ALREADY receives — Agent_Ticket_Report is fetched
   with field_config:"all" and filtered to this vendor's own tickets in boot(),
   so every figure below comes out of data already in memory. No new report, no
   new API call, and no new permission: ACCESS.md's existing "Agent_Ticket_Report
   - View" grant for this widget already covers it.

   Deliberately ALL-TIME, ignoring the date filter above, and labelled as such
   on screen. Money owed does not expire at a month boundary: showing a vendor
   "Awaiting Payment ₹0" purely because the filter says "This Month" would be
   actively misleading about whether they are owed anything. The performance
   cards above stay date-filtered exactly as they always were - this section is
   the only thing that ignores it. */
function computeSettlement(tickets){
  const num=(v)=>Number(v)||0;
  const isPaid=(r)=>String(r.Vendor_Payment_Status||"").trim().toUpperCase()==="PAID";
  const isApproved=(r)=>{
    const s=String(r.Settlement_Status||"").trim().toUpperCase();
    return s==="PAYABLE"||s==="PAID";
  };
  // Awaiting payment uses Vendor_Balance_Before_TDS — the figure Operations
  // Approval actually writes (Net Fee minus Cash Collected). TDS is only
  // computed later, at Level 2 payment time, so it genuinely is not known yet
  // for an unpaid case; the card is labelled "before TDS" rather than quietly
  // presenting a pre-TDS number as if it were the final payout.
  const awaiting = tickets.filter(function(r){ return isApproved(r) && !isPaid(r); });
  const paid = tickets.filter(isPaid);
  const sum=(list,field)=>list.reduce(function(a,r){ return a+num(r[field]); },0);
  return {
    awaitingAmount: sum(awaiting,"Vendor_Balance_Before_TDS"),
    awaitingCount: awaiting.length,
    paidAmount: sum(paid,"Vendor_Amount_Paid"),
    paidCount: paid.length,
    tdsAmount: sum(paid,"TDS_Amount"),
    cashCollected: sum(tickets.filter(isApproved),"Cash_Collected"),
    anyData: awaiting.length>0 || paid.length>0
  };
}
function money(n){ return "₹"+Number(n||0).toFixed(2); }
const ICON_RUPEE='<svg viewBox="0 0 24 24" fill="none"><path d="M7 5h10M7 9h10M7 5c5 0 7 1.5 7 4s-2 4-7 4h1l7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_OK='<svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_WARN='<svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m10.3 4.5-8 14A1.5 1.5 0 0 0 3.6 21h16.8a1.5 1.5 0 0 0 1.3-2.5l-8-14a1.5 1.5 0 0 0-2.6 0Z" stroke="currentColor" stroke-width="2"/></svg>';
const ICON_PCT='<svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M7 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function pctText(v){ return v==null ? "—" : v+"%"; }

function render(stats, settlement){
  // settlement is optional — render() keeps working with a single argument
  // exactly as before if it is ever called without one.
  const s = settlement || { awaitingAmount:0, awaitingCount:0, paidAmount:0, paidCount:0, tdsAmount:0, cashCollected:0, anyData:false };
  const settlementHtml = `
    <div class="section-title">Settlement <span style="font-weight:400;opacity:.7;font-size:12px">— all time, not affected by the date filter</span></div>
    <div class="grid">
      <div class="card wait"><div class="ic">${ICON_RUPEE}</div><div class="num">${esc(money(s.awaitingAmount))}</div><div class="lbl">Awaiting Payment (before TDS) · ${esc(s.awaitingCount)} case${s.awaitingCount===1?"":"s"}</div></div>
      <div class="card"><div class="ic">${ICON_RUPEE}</div><div class="num">${esc(money(s.paidAmount))}</div><div class="lbl">Paid to You · ${esc(s.paidCount)} case${s.paidCount===1?"":"s"}</div></div>
      <div class="card"><div class="ic">${ICON_RUPEE}</div><div class="num">${esc(money(s.tdsAmount))}</div><div class="lbl">TDS Deducted</div></div>
      <div class="card"><div class="ic">${ICON_RUPEE}</div><div class="num">${esc(money(s.cashCollected))}</div><div class="lbl">Cash You Collected</div></div>
    </div>
    ${s.anyData ? "" : '<div style="font-size:12.5px;opacity:.7;margin-top:6px">No cases have been approved for settlement yet. Figures appear here once Operations approves your completed cases.</div>'}
  `;
  $("content").innerHTML = settlementHtml + `
    <div class="section-title">Cases</div>
    <div class="grid">
      <div class="card warn"><div class="ic">${ICON_WARN}</div><div class="num">${esc(stats.rejectedCount)}</div><div class="lbl">Rejected / Timed Out</div></div>
      <div class="card"><div class="ic">${ICON_OK}</div><div class="num">${esc(stats.completed)}</div><div class="lbl">Completed</div></div>
      <div class="card wait"><div class="ic">${ICON_WARN}</div><div class="num">${esc(stats.cancelled)}</div><div class="lbl">Cancelled</div></div>
    </div>
    <div class="section-title">% Percentage</div>
    <div class="grid">
      <div class="card"><div class="ic">${ICON_PCT}</div><div class="num">${esc(pctText(stats.etaMetPct))}</div><div class="lbl">Reached Inside ETA</div></div>
      <div class="card"><div class="ic">${ICON_PCT}</div><div class="num">${esc(pctText(stats.issuesFixedPct))}</div><div class="lbl">Issues Fixed (RSR)</div></div>
      <div class="card"><div class="ic">${ICON_PCT}</div><div class="num">${esc(pctText(stats.feedbackHighPct))}</div><div class="lbl">Customer Feedback ≥ 9</div></div>
    </div>
  `;
}
function renderError(msg){ $("content").innerHTML = '<div class="state-err">'+esc(msg)+'</div>'; }

let ALL_TICKETS=[], ALL_REJECTIONS=[];
async function refresh(){
  const range = rangeFor($("filterRange").value);
  // Diagnostic (2026-09-04) — the boot log already proves Assigned_Vendor
  // matching works; this shows whether zero Cases is a date-range issue
  // (mine=0 out of ALL_TICKETS) or a Closure_Status/Status value mismatch
  // (mine>0 but the string values don't match what computeStats() checks
  // for: "Completed", "Cancelled", "Cancelled - Billable", "RSP CANCELLED").
  const mineNow = ALL_TICKETS.filter(function(r){ return inRange(r.Added_Time, range); });
  console.log("[GR-VendorPerf] refresh: range="+range.from.toDateString()+" to "+range.to.toDateString()+" | "+mineNow.length+" of "+ALL_TICKETS.length+" tickets in range | Closure_Status values seen="+JSON.stringify(mineNow.map(function(r){ return r.Closure_Status||"(blank)"; }))+" | Status values seen="+JSON.stringify(mineNow.map(function(r){ return r.Status||"(blank)"; })));
  // Settlement is computed from the UNFILTERED ticket list on purpose — see
  // computeSettlement()'s own header for why money owed must not be hidden by
  // a date filter. The performance stats below it stay range-filtered exactly
  // as before; nothing about that call has changed.
  render(computeStats(ALL_TICKETS, ALL_REJECTIONS, range), computeSettlement(ALL_TICKETS));
}
$("filterRange").onchange = refresh;

async function boot(){
  let tries=0;
  while(!resolve("getRecords") && tries<40){ await new Promise(function(r){ setTimeout(r,200); }); tries++; }
  if(!resolve("getRecords")){ renderError("Couldn't connect to Zoho — please reopen this page."); return; }
  try{
    const getInit = resolve("getInitParams");
    if(getInit){ INIT_PARAMS = await getInit(); LOGIN_EMAIL = (INIT_PARAMS && INIT_PARAMS.loginUser) || ""; }
    await resolveVendorRecord();
    $("vendorNameLine").textContent = MY_VENDOR_NAME ? MY_VENDOR_NAME : (LOGIN_EMAIL || "Unknown vendor");
    if(!currentVendorRecord){
      renderError("No vendor record found for your login ("+esc(LOGIN_EMAIL)+") in either My_Availability_Vendor or Vendors_Report — performance can't be computed without it. If your vendor record does exist, the most likely cause is that this portal profile cannot read either report (Zoho answers \"Permission denied to view record(s)\"); the browser console names which report was tried and what each returned.");
      return;
    }
    const vid = currentVendorRecord.id;
    /* Both reports now come ONLY from their Custom APIs — 2026-09-18, user
       request ("now we move to these two api, so remove unnecessary api calls").

       The two direct apiGetReport() reads that used to run first are gone. They
       were refused for a Vendor portal profile anyway (code 2898, which
       apiGetReport turns into an empty array), so on this screen they were two
       guaranteed-wasted round trips — one of them pulling the entire
       Agent_Ticket_Report, all 1000 rows, before discarding nearly all of it.

       What this removes, per page load:
         - a full Agent_Ticket_Report fetch (~20 kB and rising with every case)
         - a full Task_Rejections_Report fetch
         - the fallback branches that decided between the two routes

       getVendorTickets filters by vendor SERVER-SIDE, so what arrives is only
       this vendor's cases. That is both far smaller and a genuine privacy fix:
       the old direct read shipped every other vendor's cases, customer names and
       money fields into this vendor's browser.

       resolveVendorRecord() above still uses apiGetReport for
       My_Availability_Vendor — that one is self-scoped and readable by the
       portal profile, so it needs no Custom API. */
    const [allTicketRecs, rejectionRecs] = await Promise.all([
      loadVendorTicketsViaCustomApi(vid),
      loadTaskRejectionsViaCustomApi()
    ]);
    // The client-side Assigned_Vendor filter is KEPT even though
    // getVendorTickets already filters server-side. It is one cheap pass over an
    // already-small list, and it means this line stays correct if the Custom API
    // is ever changed to return a wider set. Historical note: a server-side
    // Zoho criteria of "Assigned_Vendor == vid" silently matches nothing against
    // a real Lookup field (2026-09-03, live) — which is why matching is done on
    // an unwrapped id here rather than in a report criteria.
    ALL_TICKETS = allTicketRecs.filter(function(r){ return String(lookupId(r.Assigned_Vendor))===String(vid); });
    console.log("[GR-VendorPerf] boot: "+allTicketRecs.length+" ticket(s) returned by getVendorTickets, "+ALL_TICKETS.length+" match Assigned_Vendor id "+vid);
    // Diagnostic (2026-09-04) — "This Month" showed 0 of 37 in range, which
    // means either none of this vendor's tickets are dated this month, or
    // Added_Time isn't parsing the way this widget expects. Dumping every
    // matched ticket's raw Case_ID/Added_Time/Closure_Status/Status settles
    // it in one shot instead of another guess-and-reupload round.
    console.log("[GR-VendorPerf] boot: all "+ALL_TICKETS.length+" matched tickets — Case_ID | Added_Time (raw) | Closure_Status | Status:");
    ALL_TICKETS.forEach(function(r){ console.log("  "+(r.Case_ID||"(no Case_ID)")+" | "+JSON.stringify(r.Added_Time)+" | "+(r.Closure_Status||"(blank)")+" | "+(r.Status||"(blank)")); });
    // Task_Rejections has no confirmed direct Vendor-ID lookup field (see
    // FIELDS.md) — matched by name here, same convention vendorTicket's own
    // rejectService() write already uses (RSP_Name: this vendor's own
    // display name) since that's the only identity it reliably carries.
    ALL_REJECTIONS = rejectionRecs.filter(function(t){
      return String(t.RSP_Name||"").trim().toLowerCase()===MY_VENDOR_NAME.trim().toLowerCase();
    });
    await refresh();
  }catch(e){
    console.error("[GR-VendorPerf] boot failed", e);
    renderError("Something went wrong loading your performance data — check the console for details.");
  }
}
boot();
</script>

</html>
