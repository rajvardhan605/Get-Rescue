<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get-Rescue · Ticket Flow</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
img,svg{max-width:100%}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);
  border-radius:16px;padding:14px 18px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .mk{width:38px;height:38px;border-radius:10px;background:var(--signal);display:grid;place-items:center;box-shadow:0 4px 12px rgba(241,90,34,.45)}
.brand .mk svg{width:22px;height:22px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:19px;color:#fff;letter-spacing:.3px;line-height:1}
.search{position:relative;flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid transparent;border-radius:11px;padding:0 12px;transition:.15s}
.search:focus-within{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.25)}
.search svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);padding:12px 0;font-family:var(--f-body)}
.search .x{border:0;background:transparent;color:var(--muted-2);cursor:pointer;padding:6px;display:none;line-height:0;border-radius:7px}
.search .x svg{width:15px;height:15px}
.search-ic{border:0;background:transparent;padding:0;margin:0;line-height:0;color:var(--muted-2);cursor:pointer;flex:none;border-radius:7px}
.search-ic:hover{color:var(--signal)}
.search-dropdown{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-2);z-index:45;max-height:min(360px,70vh);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.search-dropdown.on{display:block}
.search-dropdown .rrow{border-top:1px solid var(--line)}
.search-dropdown .rrow:first-child{border-top:0}
.search-dropdown .sd-msg{padding:18px;text-align:center;color:var(--muted-2);font-size:13px;font-family:var(--f-mono)}

/* ---------- searchable combo-select (Client/Vehicle/Vehicle_Issue) ---------- */
.combo{position:relative}
.combo-input{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;
  font-family:var(--f-body);color:var(--text);background:#fff;outline:0;transition:.15s;width:100%}
.combo-input:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.combo-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh-2);z-index:20;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.combo-dropdown.on{display:block}
.combo-opt{padding:10px 12px;font-size:13.5px;cursor:pointer;border-top:1px solid var(--line)}
.combo-opt:first-child{border-top:0}
.combo-opt:hover{background:var(--worktop)}
.combo-empty{padding:10px 12px;font-size:12.5px;color:var(--muted-2);font-family:var(--f-mono)}
.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:14.5px;letter-spacing:.02em;
  padding:12px 18px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:hover{background:var(--signal-deep)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn.ghost:hover{background:var(--worktop)}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.danger:hover{background:var(--stop-soft)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(18,161,80,.3)}
.btn.ok:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13px}

/* ---------- section headings ---------- */
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.sec-head h2{font-family:var(--f-disp);font-size:20px;font-weight:800}
.sec-head .sub{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-head .spacer{flex:1}

/* ---------- dashboard report lists ---------- */
.report-lists{display:flex;flex-direction:column;gap:22px}
.rlist{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
.rlist-head{display:flex;align-items:center;gap:13px;padding:16px 20px;position:relative;
  background:linear-gradient(180deg,#fff,var(--worktop) 260%)}
.rlist-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--signal))}
.rlist-head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--accent,var(--signal));box-shadow:0 4px 12px rgba(20,22,28,.28)}
.rlist-head .ic svg{width:20px;height:20px}
.rlist-head .tt b{font-family:var(--f-disp);font-size:16.5px;font-weight:800;display:block;letter-spacing:.01em}
.rlist-head .tt span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rlist-head .cnt{margin-left:auto;font-family:var(--f-disp);font-size:19px;font-weight:900;color:var(--text);
  background:#fff;border:1.5px solid var(--line);min-width:38px;text-align:center;padding:5px 10px;border-radius:12px}
.rlist-body{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);cursor:pointer;
  transition:background .12s;text-align:left;font:inherit;color:inherit;width:100%;background:#fff}
.rrow:hover{background:var(--worktop)}
.rrow .avatar{width:38px;height:38px;border-radius:11px;background:var(--worktop);display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:13.5px;color:var(--muted);flex:none;border:1px solid var(--line)}
.rrow .main{flex:1;min-width:0}
.rrow .top-line{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.rrow .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted-2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .nm{font-weight:700;font-size:14.5px;color:var(--text);flex:1;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .svc{display:inline-flex;font-family:var(--f-mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;flex:none}
.svc.rsr{background:var(--signal-soft);color:var(--signal-deep)} .svc.tow{background:var(--info-soft);color:var(--info)}
.rrow .pill{flex:none;max-width:140px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;white-space:normal;text-align:center;line-height:1.3}
.rrow .chev{color:var(--line-strong);flex:none}
.rrow .flags{display:flex;gap:6px;margin-top:5px}
.rrow .flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;padding:3px 8px 3px 5px;border-radius:999px;background:var(--worktop);color:var(--muted-2)}
.rrow .flag svg{width:12px;height:12px;flex:none}
.rrow .flag.on{background:var(--ok-soft);color:var(--ok)}
.rlist-empty{color:var(--muted-2);font-size:13px;text-align:center;padding:36px 8px;font-family:var(--f-mono);border-top:1px solid var(--line)}

/* pill status colours */
.pill.b-new{background:var(--info-soft);color:var(--info)}
.pill.b-asg{background:var(--wait-soft);color:var(--wait)}
.pill.b-wip{background:var(--signal-soft);color:var(--signal-deep)}
.pill.b-pay{background:var(--ok-soft);color:var(--ok)}
.pill.b-closed{background:var(--worktop);color:var(--muted)}

/* ---------- search results ---------- */
.results{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
.results .rrow:first-child{border-top:0}

/* ---------- wizard ---------- */
.wizard{display:none}
.wizard.on{display:block}
.dashboard.off{display:none}
.wiz-top{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);padding:16px 18px;margin-bottom:16px}
.wiz-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wiz-title h2{font-family:var(--f-disp);font-size:24px;font-weight:900;line-height:1}
.wiz-title .cid{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--worktop);padding:5px 10px;border-radius:999px}
.wiz-title .close-x{margin-left:auto;border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.wiz-title .close-x:hover{background:var(--line);color:var(--text)}
.wiz-title .close-x svg{width:18px;height:18px}

/* progress stepper */
.progress{margin-top:16px}
.pbar{height:7px;border-radius:999px;background:var(--worktop);overflow:hidden;margin-bottom:14px}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--signal-bright));border-radius:999px;transition:width .35s ease}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line);
  background:#fff;cursor:pointer;transition:.15s;white-space:nowrap}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--worktop);color:var(--muted);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:600;flex:none}
.step .lb{font-family:var(--f-disp);font-weight:700;font-size:12.5px;color:var(--muted)}
.step.done .n{background:var(--ok);color:#fff}
.step.done .lb{color:var(--text)}
.step.active{border-color:var(--signal);background:var(--signal-soft)}
.step.active .n{background:var(--signal);color:#fff}
.step.active .lb{color:var(--signal-deep)}
.step.locked{cursor:not-allowed;opacity:.5}
.step.locked .n{color:var(--muted-2)}

/* form */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);padding:22px;margin-bottom:100px}
.form-card h3{font-family:var(--f-disp);font-size:19px;margin-bottom:4px}
.form-card .fdesc{font-size:13px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1 / -1}
.fld-row{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
.fld label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld label .req{color:var(--stop);margin-left:2px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;
  font-family:var(--f-body);color:var(--text);background:#fff;outline:0;transition:.15s;width:100%}
.fld textarea{resize:vertical;min-height:74px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld input[type=file]{padding:9px;background:var(--worktop);border-style:dashed;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;
  color:var(--muted);cursor:pointer;background:#fff;transition:.12s;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--signal)}
.check span{font-size:14px;color:var(--text)}
.hint{font-size:11px;color:var(--muted-2);font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--signal-soft);color:var(--signal-deep);
  border-radius:999px;padding:7px 8px 7px 13px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;font-size:11px;line-height:1;padding:0;flex:none}
.chip button:hover{background:rgba(0,0,0,.18)}
.chip-empty{font-size:12.5px;color:var(--muted-2);font-family:var(--f-mono)}
.add-select{border:1.5px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:13.5px;
  color:var(--muted);background:#fff;width:100%}

/* summary (final) */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.summary .srow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.summary .srow .k{color:var(--muted);font-weight:600}
.summary .srow .v{text-align:right;font-weight:500}

/* button bar (sticky) */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:40;box-shadow:0 -6px 20px rgba(20,22,28,.06)}
.bar .inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
.bar .spacer{flex:1}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:60;
  transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(20,22,28,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:var(--sh-2);text-align:center}
.modal .box h4{font-family:var(--f-disp);font-size:21px;margin-bottom:8px}
.modal .box p{color:var(--muted);font-size:14px;margin-bottom:20px}
.modal .box .row{display:flex;gap:10px}
.modal .box .row .btn{flex:1;justify-content:center}

/* loader / states */
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-state{text-align:center;padding:50px 16px;color:var(--muted)}
.center-state h3{font-family:var(--f-disp);font-size:18px;color:var(--text);margin:14px 0 6px}
.center-state p{font-size:14px}
.demo-note{margin:10px 2px 0;font-family:var(--f-mono);font-size:11px;color:var(--wait);background:var(--wait-soft);border-radius:9px;padding:9px 12px;display:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- tablets / small laptops: tighten outer spacing only, 2-col form grid still fits ---- */
@media(max-width:900px){
  .wrap{padding:14px}
  .form-card{padding:18px}
}

/* ---- phones (portrait) ---- */
@media(max-width:680px){
  .wrap{padding:12px}
  .topbar{position:static}
  .search{order:3;flex-basis:100%;min-width:0}
  .grid,.summary,.fld-row{grid-template-columns:1fr}
  .bar{padding:10px 12px}
  .bar .inner{flex-wrap:wrap}
  .bar .btn{flex:1 1 auto;justify-content:center}
  .form-card{margin-bottom:150px;padding:18px}
  .rrow .meta{white-space:normal}
  .rlist-head{padding:14px 16px}
  .sec-head{flex-wrap:wrap}
  .wiz-title h2{font-size:20px}
}

/* ---- small phones ---- */
@media(max-width:420px){
  .wrap{padding:10px}
  .brand b{font-size:16px}
  .brand .mk{width:32px;height:32px}
  .brand .mk svg{width:18px;height:18px}
  .btn{padding:10px 14px;font-size:13.5px}
  .rrow{padding:11px 12px;gap:10px}
  .rrow .avatar{width:32px;height:32px;font-size:12px}
  .rrow .nm{font-size:13.5px}
  .rrow .pill{max-width:96px;font-size:8.5px;padding:4px 8px}
  .rlist-head{padding:12px 14px;gap:10px}
  .rlist-head .ic{width:34px;height:34px}
  .rlist-head .ic svg{width:17px;height:17px}
  .rlist-head .tt b{font-size:15px}
  .form-card{padding:14px}
  .wiz-top{padding:14px}
}

/* ---- landscape phones: short viewport height, keep the bottom bar from crowding the form ---- */
@media(max-height:420px) and (orientation:landscape){
  .topbar{position:static}
  .form-card{margin-bottom:90px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#fff"/></svg></span>
      <b>GET-RESCUE</b>
    </div>
    <label class="search">
      <button class="search-ic" id="searchBtn" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <input id="q" type="text" inputmode="search" autocomplete="off" placeholder="Search by phone, Case ID, vehicle reg. no. or client tracking ID…" aria-label="Search">
      <button class="x" id="clearSearch" type="button" aria-label="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </label>
    <button class="btn primary" id="newBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Create Ticket
    </button>
  </div>

  <div class="demo-note" id="demoNote">Preview mode — Creator SDK not detected, showing sample data. Inside Creator this reads/writes <b>Create_Case</b>.</div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="sec-head"><h2>Live Tickets</h2><span class="sub" id="dashSub">all tickets per report</span><span class="spacer"></span>
      <button class="btn ghost sm" id="refreshBtn" type="button">Refresh</button></div>
    <div class="report-lists" id="columns"></div>
  </div>

  <!-- WIZARD -->

<script>
/* =====================================================================
   GET-RESCUE · TICKET FLOW WIDGET
   Everything is stored in ONE Create_Case record. The widget adds it on
   the first save, then updates the same record every step. The stage is
   written to CONFIG.stageField each save so the dashboard can bucket it.
   Adjust CONFIG + the SCHEMA field link names to match your app.
   ===================================================================== */
const CONFIG = {
  appName:      "get-rescue",
  formName:     "Create_Case",          // add records here
  reportName:   "Agent_Ticket_Report",  // read / update / search here — user-confirmed 2026-07-28 (was Create_Case_Report)
  phoneField:   "Phone_Number",         // primary global search field — real Create_Case field name (confirmed live); the form shows "Phone_Number1" but mirrors into this one via the create stage's extra() hook, and that's the field Agent_Ticket_Report actually searches on
  searchTextFields: ["Case_ID","Vehicle_Registration_Number","Client_Tracking_Id"], // additional fields the topbar search box also matches against (OR'd with phoneField)
  stageField:   "Status",               // text field on Create_Case that holds the current stage
  caseIdField:  "Case_ID",
  serviceTypeField: "Service_Type",      // "RSR" | "TOW" drives the branch
  nameField:    "Customer_Name",         // composite name field
  vehicleField: "Vehicle",              // Create_Case's own lookup field — confirmed via a live record, NOT "vehicle_master"
  vehicleCategoryField: "Category",     // 2W/4W field on vehicle_master_Report, matched against Vehicle_Issue_Report's VEHICLE_TYPE
  rateMasterReport: "Rate_Master_Report", // best-guess report name for the Rate_Master form (pattern-matched — not yet confirmed live)
  // option sources (best-effort; degrade to text/empty if unavailable) — report names are the MASTER tables we pull picker options from, unrelated to the Create_Case field names above
  optionReports: {
    vehicles:    { report:"vehicle_master_Report", label:["Name"], max:1000 },
    issues:      { report:"Vehicle_Issue_Report",  label:["Issue_Name","Name"] },
    vendors:     { report:"vendors_Report",        label:["Vendor_Name","Name","vendor_name"] },
    technicians: { report:"technicians_Report",    label:["technician_name","Name"], emailField:"Email" },
    clients:     { report:"Client_Report",         label:["Client_Name","Name"] }
  },
  fetchLatest: 1000   // how many recent tickets to pull for the dashboard — Creator only accepts 200, 500 or 1000; maxed out so "show all" isn't capped by an earlier fetch limit
};

/* ---------- SDK boot (this SDK has no ZOHO.CREATOR.init) ---------- */
let SDK_READY = false;
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams === "function"; }
function resolve(method){
  const C = window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces = [C.DATA, C.PUBLISH, C.META, C.UTIL, C.FILE];
  for (let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}

/* ---------- Creator data layer ---------- */
async function apiGet(criteria){
  const fn = resolve("getRecords"); if(!fn) throw new Error("getRecords unavailable");
  const cfg = { app_name:CONFIG.appName, report_name:CONFIG.reportName, field_config:"all", max_records:CONFIG.fetchLatest };
  if(criteria) cfg.criteria = criteria;
  console.log("[Get-Rescue] apiGet -> report:", cfg.report_name, "| criteria:", cfg.criteria||"(none)", "| full request:", cfg);
  try{
    const r = await fn(cfg);
    console.log("[Get-Rescue] apiGet <- code:", r&&r.code, "| records:", r&&r.data&&r.data.length, "| raw response:", r);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  }
  catch(e){ const c=e&&e.code; console.warn("[Get-Rescue] apiGet threw:", e); if(c===3100||c==="3100") return []; return []; }
}
async function apiGetReport(report, criteria, max){
  const fn = resolve("getRecords"); if(!fn) return [];
  const cfg = { app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria = criteria;
  try{ const r = await fn(cfg); return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : []; } catch(e){ return []; }
}
async function apiAdd(data){
  const fn = resolve("addRecords") || resolve("addRecord"); if(!fn) throw new Error("addRecords unavailable");
  const r = await fn({ app_name:CONFIG.appName, form_name:CONFIG.formName, payload:{ data:data } });
  if(r && r.code===3000){ const d=r.data; return Array.isArray(d) ? (d[0]&&(d[0].ID||d[0].id)) : (d&&(d.ID||d.id)); }
  throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Add failed");
}
async function apiUpdate(id, data){
  const fn = resolve("updateRecordById") || resolve("updateRecord"); if(!fn) throw new Error("updateRecordById unavailable");
  const r = await fn({ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, payload:{ data:data } });
  if(!r || r.code!==3000) throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Update failed");
  return true;
}
/* best-effort file upload — signatures vary by SDK build; never blocks a save */
async function apiUpload(id, fieldName, file){
  const fn = resolve("uploadFile"); if(!fn || !file) return false;
  try{ await fn({ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, field_name:fieldName, file:file }); return true; }
  catch(e){ console.warn("uploadFile failed for "+fieldName, e); return false; }
}

/* ---------- reusable option lists ---------- */
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
/* half-hour slots, 9:00 AM through 5:00 PM */
const SERVICE_TIMES = (function(){
  function fmt(mins){ const h=Math.floor(mins/60), m=mins%60; const am=h<12; const hh=(h%12)||12; return hh+":"+(m<10?"0"+m:m)+" "+(am?"AM":"PM"); }
  const out=[];
  for(let mins=9*60; mins<17*60; mins+=30){ out.push(fmt(mins)+" - "+fmt(mins+30)); }
  return out;
})();

/* dynamic options filled at boot from reports (best-effort) */
const OPTIONS = { vehicles:[], issues:[], vendors:[], technicians:[], clients:[] };

/* Quote & Booking Fee's Status is fully derived from what's actually been done
   on it — no manual override. No payment/location integration exists yet, so
   "sent"/"PAID" are both set by the agent by hand, not by any webhook. Exact
   flow as specified by the user (2026-07-28):
     Booking_Fee not > 0 (nothing to collect):
       Request Location clicked -> LOCATION PENDING (can advance)
       not clicked (Cancel, or Save without clicking) -> LOCATION REQUEST (blocked)
     Booking_Fee > 0:
       Payment_Status === "PAID" -> LOCATION PENDING (can advance)
       else Send_Payment_Link clicked -> BOOKING FEE PENDING (blocked)
       else -> SERVICE FEE QUOTE, unchanged (blocked) */
function quoteStatus(r){
  const feeZero = !(Number(r.Booking_Fee)>0);
  if(feeZero) return r.Send_Link_For_The_Breakdown_Location ? "LOCATION PENDING" : "LOCATION REQUEST";
  if(r.Payment_Status==="PAID") return "LOCATION PENDING";
  if(r.Send_Payment_Link) return "BOOKING FEE PENDING";
  return "SERVICE FEE QUOTE";
}

/* =====================================================================
   STAGE SCHEMA  —  each field's "n" is the Create_Case field link name.
   branch: all | rsr | tow | pay | final   (path = all + rsr|tow + pay + final)
   bucket: dashboard column index (0..3)

const STAGES = [

    fields:[

    /* Exactly one button here, never two. Booking_Fee>0 -> a single button

/* build the active stage path from Service_Type */
function buildPath(serviceType){
  const all   = STAGES.filter(s=>s.branch==="all");
  const branch= STAGES.filter(s=>s.branch===(serviceType==="TOW"?"tow":"rsr"));
  const pay   = STAGES.filter(s=>s.branch==="pay");
  const fin   = STAGES.filter(s=>s.branch==="final");
  return all.concat(branch, pay, fin);
}
/* Create_Case.Status is a real fixed picklist (confirmed 2026-07-28) — every
   save must write one of these exact values, never the human-readable stage
   title. computeStatus() resolves a stage's static status or (for stages that
   branch on Accept/Reject/Cancel) calls its status(record) function. */
function computeStatus(step, record){
  return typeof step.status==="function" ? step.status(record) : step.status;
}
/* Dashboard shows exactly 3 report lists (by explicit request) — anything
   whose Status isn't in one of these three sets simply won't appear on the
   dashboard (still findable via phone search, which lists every status). */
const BUCKETS = [
  { name:"New & Open", sub:"Just came in", statuses:["NEW","OPEN","SERVICE FEE QUOTE","BOOKING FEE PENDING","LOCATION REQUEST","LOCATION PENDING"], accent:"var(--info)", pill:"b-new",

    icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 0 0-5.4 4.9L4 16.5V20h3.5l5.3-5.3a4 4 0 0 0 4.9-5.4l-2.6 2.6-2-2 2.6-2.6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>' },

function bucketOfStatus(status){
  if(!status) return -1;
  const key = String(status).trim().toUpperCase();
  for(let i=0;i<BUCKETS.length;i++){ if(BUCKETS[i].statuses.indexOf(key)>=0) return i; }
  return -1;
}
/* find where in a resolved RSR/TOW path a given saved Status value belongs —
   some statuses (e.g. "RSP ON THE WAY") are valid for more than one stage, so
   this is a best fit, not a guarantee; the stepper lets the agent jump anyway. */
function stageIndexForStatus(path, status){
  if(!status) return 0;
  const key = String(status).trim().toUpperCase();
  const idx = path.findIndex(s => (s.statuses||[]).some(v=>v.toUpperCase()===key));
  return idx>=0 ? idx : 0;
}

/* ---------- load dropdown options (best-effort) ---------- */
async function loadOptions(){
  const O = CONFIG.optionReports;
  async function pull(spec){
    const recs = await apiGetReport(spec.report, null, spec.max); // Creator only accepts 200, 500 or 1000 (apiGetReport defaults to 200)
    return recs.map(function(r){
      let label="";
      for(const f of spec.label){ if(r[f]){ label = (typeof r[f]==="object")?(r[f].display_value||r[f].zc_display_value||""):String(r[f]); if(label) break; } }
      if(!label) label = r.ID;
      return { v:label, label:label, id:r.ID, raw:r };
    });
  }
  try{ OPTIONS.vehicles    = await pull(O.vehicles); }catch(e){}
  try{ OPTIONS.issues      = await pull(O.issues); }catch(e){}
  try{ OPTIONS.vendors     = await pull(O.vendors); }catch(e){}
  try{ OPTIONS.technicians = await pull(O.technicians); }catch(e){}
  try{ OPTIONS.clients     = await pull(O.clients); }catch(e){}
  try{ RATE_MASTER = await apiGetReport(CONFIG.rateMasterReport, null, 1000); }catch(e){}
}
/* option lists for a field — "@vehicleIssues" is computed on the fly (vehicle-
   dependent), everything else is a static pull from OPTIONS. Shared by
   resolveOptions (render) and idsFor (payload) so both always agree. */
function optionsListFor(field){
  if(Array.isArray(field.o)) return field.o.map(function(v){ return {v:v,label:v}; });
  if(field.o==="@vehicleIssues") return vehicleIssuesFor(state.record[CONFIG.vehicleField]);
  if(typeof field.o==="string" && field.o[0]==="@"){ return OPTIONS[field.o.slice(1)] || []; }
  return [];
}
function resolveOptions(field){ return optionsListFor(field); }

/* ---------- vehicle_master + Vehicle_Issue_Report → issue derivation ----------
   Vehicle_Issue_Report holds every issue with a VEHICLE_TYPE (2W/4W, multiselect)
   and an Issue_Type (ROS/TOW/REPAIR). We show only the issues whose VEHICLE_TYPE
   includes the selected vehicle's own Category (2W/4W, from vehicle_master_Report).
   The chosen issue's Issue_Type then drives Service_Type: TOW -> "TOW", anything
   else -> "RSR". */
function valuesOf(v){
  if(v==null) return [];
  if(Array.isArray(v)) return v.map(String);
  if(typeof v==="object") return [String(v.display_value||v.zc_display_value||v.value||"")];
  return String(v).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
}
function vehicleIssuesFor(vehicleLabel){
  if(!vehicleLabel) return [];
  const veh = OPTIONS.vehicles.find(function(v){ return v.v===vehicleLabel; });
  if(!veh || !veh.raw) return [];
  const category = valuesOf(veh.raw[CONFIG.vehicleCategoryField])[0];
  if(!category) return [];
  return OPTIONS.issues.filter(function(issue){
    const types = valuesOf(issue.raw && issue.raw.VEHICLE_TYPE);
    return types.some(function(t){ return t.toUpperCase()===category.toUpperCase(); });
  });
}
function isTowIssue(issueLabel){
  const m = OPTIONS.issues.find(function(o){ return String(o.v)===String(issueLabel); });
  const type = m && m.raw ? valuesOf(m.raw.Issue_Type).join(" ") : "";
  return /tow/i.test(type);
}

/* Zoho's Decimal field for Latitude/Longitude rejected a raw GPS paste's full
   ~15-digit precision ("Longitude has exceeded its maximum digits" — live
   error). 6 decimal places (~11cm accuracy, the usual convention for GPS
   coordinates) is far more precision than dispatch needs and comfortably
   under any reasonable digit limit — best-effort guess at the actual
   configured limit, not confirmed against the live field's exact settings. */
function roundCoord(n){ return Math.round(Number(n)*1e6)/1e6; }

/* ---------- round-trip distance (TOW only, "locations" step) ----------
   Static office location; round trip = office -> breakdown -> drop -> office.
   Falls back to office -> breakdown -> office if the drop pin isn't set yet. */
const OFFICE_LAT=12.967827711025203, OFFICE_LON=77.611228;
function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcRoundTripKm(r){
  const bLat=Number(r.Latitude), bLon=Number(r.Longitude);
  if(isNaN(bLat)||isNaN(bLon)) return 0;
  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
  const dLat=Number(r.DropLocationLat), dLon=Number(r.DropLocationLong);
  if(!isNaN(dLat) && !isNaN(dLon)){
    total+=haversineKm(bLat,bLon,dLat,dLon);
    total+=haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON);
  } else {
    total+=haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON);
  }
  return Math.round(total*10)/10;
}

/* ---------- Rate_Master → Suggested_Rate / Rate_Breakup ----------
   Ported from the native Create_Case form's Deluge (runs on Create -> Quote
   section transition there; here it runs whenever the "quote" step renders or
   the distance field changes). For every selected Vehicle_Issue, finds the
   Rate_Master row matching the vehicle's Vehicle_Type(=Category) + Vehicle_Segment
   + Issue.Issue_Name: FIXED rows use Fixed_Rate as-is; FORMULA rows need
   Distance_For_Quote_RT_KM ("RT_KM" on the native form) and compute
   Formula_Base_Amount + (RT_KM + Formula_KM_Buffer) * Formula_Per_KM_Rate,
   floored at Formula_Min_Amount. NOTE: "Rate_Master_Report" is a best-guess
   report name (see CONFIG.rateMasterReport) — not yet confirmed live. */
let RATE_MASTER = [];
function calcQuote(){
  const r = state.record;
  const veh = OPTIONS.vehicles.find(function(v){ return v.v===r[CONFIG.vehicleField]; });
  const issues = Array.isArray(r.Vehicle_Issue) ? r.Vehicle_Issue : [];
  const out = { total:0, breakup:"", needsDistance:false };
  if(!veh || !veh.raw || !issues.length) return out;
  const vType = valuesOf(veh.raw[CONFIG.vehicleCategoryField])[0] || "";
  const vSegment = valuesOf(veh.raw.Segment)[0] || "";
  const rtKm = Number(r.Distance_For_Quote_RT_KM) || 0;
  issues.forEach(function(issueName){
    const rate = RATE_MASTER.find(function(row){
      const rowType = valuesOf(row.Vehicle_Type)[0] || "";
      const rowSeg = valuesOf(row.Vehicle_Segment)[0] || "";
      const rowIssue = valuesOf(row.Issue)[0] || "";
      return rowType.toUpperCase()===vType.toUpperCase() && rowSeg.toUpperCase()===vSegment.toUpperCase() && rowIssue.toUpperCase()===String(issueName).toUpperCase();
    });
    if(!rate){ out.breakup += issueName+": Rs. -- (no rate rule found)\n"; return; }
    if(String(valuesOf(rate.Rate_Type)[0]||"").toUpperCase()==="FIXED"){
      const amt = Number(rate.Fixed_Rate)||0;
      out.total += amt;
      out.breakup += issueName+": Rs. "+amt+"\n";
    } else {
      out.needsDistance = true;
      if(rtKm>0){
        const formulaAmount = (Number(rate.Formula_Base_Amount)||0) + (rtKm + (Number(rate.Formula_KM_Buffer)||0)) * (Number(rate.Formula_Per_KM_Rate)||0);
        const minAmt = Number(rate.Formula_Min_Amount)||0;
        const amt = formulaAmount > minAmt ? formulaAmount : minAmt;
        out.total += amt;
        out.breakup += issueName+": Rs. "+amt+" (RT_KM: "+rtKm+" km)\n";
      } else {
        out.breakup += issueName+": Rs. -- (enter distance — distance needed for this issue)\n";
      }
    }
  });
  return out;
}

/* best-effort demo-mode stand-in for a real criteria() query — pulls every
   quoted search term back out of the built criteria string (one per OR'd
   .contains() clause) and checks each DEMO record's phone digits + the
   configured text fields against them. */
function demoQuery(criteria){
  if(!criteria) return DEMO.slice();
  const terms = (criteria.match(/contains\("([^"]*)"/g)||[]).map(m=>m.slice(10,-1)).filter(Boolean);
  if(!terms.length) return DEMO.slice();
  return DEMO.filter(r=> terms.some(t=>{
    const tDigits = t.replace(/\D/g,"");
    if(tDigits && (r[CONFIG.phoneField]||"").replace(/\D/g,"").indexOf(tDigits)!==-1) return true;
    const tLower = t.toLowerCase();
    return CONFIG.searchTextFields.some(f=> String(r[f]||"").toLowerCase().indexOf(tLower)!==-1);
  }));
}

const $ = id => document.getElementById(id);
function pad(n){ return n<10?"0"+n:""+n; }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear(); }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
/* Computed_Service_Time is stored 12-hour with AM/PM + seconds (confirmed live,
   e.g. "26-Jul-2026 11:25:18 PM") — different shape from fmtDateTime() above,
   which is 24-hour with no AM/PM. Kept separate rather than changing the
   generic one, since other datetime fields haven't shown this format live. */
function fmtDateTime12(d){
  const h24=d.getHours(); const ampm=h24<12?"AM":"PM"; const h12=(h24%12)||12;
  return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(h12)+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+" "+ampm;
}
function parseSlotStart(slot){
  if(!slot) return null;
  const m=String(slot).split(" - ")[0].trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return null;
  let h=parseInt(m[1],10); const min=parseInt(m[2],10); const ap=m[3].toUpperCase();
  if(ap==="PM" && h!==12) h+=12;
  if(ap==="AM" && h===12) h=0;
  return {h:h, m:min};
}
/* Computed_Service_Time: NOW -> 30 minutes from the moment of saving; LATER ->
   the picked Schedule_Date combined with the picked Service_Time slot's start. */
function computeServiceTime(r){
  if(r.Time_of_service==="LATER"){
    if(!r.Schedule_Date || !r.Service_Time) return "";
    const dp=String(r.Schedule_Date).split("-"); // <input type=date> gives "YYYY-MM-DD"
    if(dp.length!==3) return "";
    const slot=parseSlotStart(r.Service_Time);
    if(!slot) return "";
    return fmtDateTime12(new Date(Number(dp[0]), Number(dp[1])-1, Number(dp[2]), slot.h, slot.m, 0));
  }
  return fmtDateTime12(new Date(Date.now()+30*60*1000));
}
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* every phone number in this app is an Indian number — if the agent didn't
   type a country code, assume +91 rather than leaving it bare. Matches the
   "+919696406443" shape Create_Case expects (no spaces/dashes). */
function formatIndianPhone(v){
  if(!v) return "";
  const s=String(v).trim();
  if(s.charAt(0)==="+") return "+"+s.slice(1).replace(/\D/g,"");
  const digits=s.replace(/\D/g,""); if(!digits) return "";
  return "+91"+digits;
}
function readVal(rec,key){ let v=rec?rec[key]:null; if(v==null) return ""; if(Array.isArray(v)) return v.join(", "); if(typeof v==="object") return v.display_value||v.zc_display_value||v.first_name&&((v.first_name||"")+" "+(v.last_name||"")).trim()||v.value||""; return String(v); }

      <div class="rlist-head"><span class="ic">${bk.icon}</span><span class="tt"><b>${bk.name}</b><span>${bk.sub}</span></span><span class="cnt">${cols[i].length}</span></div>

    el.onclick=()=>{ const rec=recs.find(r=>String(r.ID)===el.dataset.id); if(rec) openTicket(rec); };
  });
}
function initials(name){
  const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase();
}
/* checked = green filled box + white tick; unchecked = plain outline box */
const FLAG_ON='<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="m7 12.3 3.2 3.2 6.6-6.6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FLAG_OFF='<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="2"/></svg>';
/* "Paid" also counts as ticked when there's no booking fee to collect at all
   (Booking_Fee not >0) — matches quoteStatus()'s own feeZero test, same rule. */
function isPaidFlag(r){ return r.Payment_Status==="PAID" || !(Number(r.Booking_Fee)>0); }
/* "Loc" ticked only once both Latitude and Longitude actually hold a value —
   empty-string/null must not read as valid 0,0 (Number("") is 0, not NaN). */
function hasLocFlag(r){
  const lat=r.Latitude, lon=r.Longitude;
  if(lat==null||lat===""||lon==null||lon==="") return false;
  return !isNaN(Number(lat)) && !isNaN(Number(lon));
}
/* Vendors' saved shape is a composite "[priority] Name | Phone | Status"
   string (see §3 in README) — the dashboard row should show just the name,
   not the priority/phone/status riding along with it. */
function vendorDisplayName(v){
  return String(v||"").trim().replace(/^\[[^\]]*\]\s*/,"").split("|")[0].trim();
}
function vendorNamesFor(r){
  const v=r.Vendors; const arr=Array.isArray(v)?v:(v?[v]:[]);
  return arr.map(vendorDisplayName).filter(Boolean).join(", ");
}
function rowHtml(r){
  const svc=(readVal(r,CONFIG.serviceTypeField)||"").toUpperCase();
  const stage=readVal(r,CONFIG.stageField)||"—";
  const b=bucketOfStatus(stage);
  const bucket=b>=0 ? BUCKETS[b] : null;
  const pill = bucket ? bucket.pill : "b-closed";
  const name = readVal(r,CONFIG.nameField)||"—";
  // Paid/Loc flags: New & Open rows only. Vendor line: Work In Progress rows only.
  const showFlags = !!bucket && bucket.name==="New & Open";
  const showVendor = !!bucket && bucket.name==="Work In Progress";
  const paid=isPaidFlag(r), loc=hasLocFlag(r);
  const vendor = vendorNamesFor(r)||r.Vendor_Email||"";
  const serviceTime = readVal(r,"Computed_Service_Time");
  return `<button class="rrow" data-id="${esc(r.ID)}" type="button">
    <span class="avatar">${esc(initials(name))}</span>
    <span class="main">
      <span class="top-line"><span class="cid">${esc(caseLabel(r))}</span><span class="nm">${esc(name)}</span></span>
      <span class="meta">${svc?`<span class="svc ${svc==='TOW'?'tow':'rsr'}">${svc}</span> `:""}${esc(readVal(r,CONFIG.vehicleField)||"")} · ${esc(readVal(r,"Vehicle_Issue")||"")}</span>
      ${showVendor && vendor ? `<span class="meta">Vendor: ${esc(vendor)}</span>` : ""}
      ${serviceTime ? `<span class="meta">Service Time: ${esc(serviceTime)}</span>` : ""}
      ${showFlags ? `<span class="flags">
        <span class="flag ${paid?"on":""}">${paid?FLAG_ON:FLAG_OFF}Paid</span>
        <span class="flag ${loc?"on":""}">${loc?FLAG_ON:FLAG_OFF}Loc</span>
      </span>` : ""}
    </span>
    <span class="pill ${pill}">${esc(stage)}</span>
    <svg class="chev" viewBox="0 0 24 24" width="18" height="18"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>`;
}

/* search — a dropdown under the search bar, driven by the search button/Enter
   (not live-as-you-type, to avoid firing a query on every keystroke). Reads
   from CONFIG.reportName (Agent_Ticket_Report) via the same getTickets() every
   other list uses. Clicking a result opens it exactly like a dashboard row. */
function closeSearchDropdown(){ const dd=$("searchDropdown"); dd.classList.remove("on"); dd.innerHTML=""; }
function onSearchInput(){
  const raw=$("q").value.trim(); $("clearSearch").style.display = raw?"flex":"none";
  if(raw.length<3) closeSearchDropdown();
}
/* Search box matches on CONFIG.phoneField (digits-only, needs >=3 digits typed)
   OR'd with every field in CONFIG.searchTextFields (Case_ID, Vehicle_Registration_Number,
   Client_Tracking_Id) matched as typed. Quotes are stripped from the typed text
   so it can't break the criteria string. */
async function runSearch(){
  const raw=$("q").value.trim();
  if(raw.length<3){ toast("Type at least 3 characters — phone number, Case ID, vehicle reg. no., or client tracking ID","err"); return; }
  const digits=raw.replace(/\D/g,"");
  const safe=raw.replace(/"/g,"");
  const dd=$("searchDropdown");
  dd.classList.add("on");
  dd.innerHTML='<div class="sd-msg"><div class="spin" style="width:22px;height:22px;margin-bottom:8px"></div>Searching…</div>';
  const clauses=[];
  if(digits.length>=3) clauses.push("("+CONFIG.phoneField+'.contains("'+digits+'"))');
  CONFIG.searchTextFields.forEach(f=>{ clauses.push("("+f+'.contains("'+safe+'"))'); });
  const crit=clauses.join(" || ");
  console.log("[Get-Rescue] search — report:", CONFIG.reportName, "| fields:", [CONFIG.phoneField].concat(CONFIG.searchTextFields), "| typed:", raw, "| criteria:", crit, "| SDK_READY:", SDK_READY);
  const recs=await getTickets(crit);
  console.log("[Get-Rescue] search matched", recs.length, "record(s):", recs);
  if(!recs.length){ dd.innerHTML=`<div class="sd-msg">No ticket found for "${esc(raw)}"</div>`; return; }
  dd.innerHTML=recs.map(rowHtml).join("");
  dd.querySelectorAll(".rrow").forEach(el=>{
    el.onclick=()=>{ const rec=recs.find(r=>String(r.ID)===el.dataset.id); closeSearchDropdown(); if(rec) openTicket(rec); };
  });
}
document.addEventListener("click",e=>{
  const box=document.querySelector(".search");
  if(box && !box.contains(e.target)) closeSearchDropdown();
});

/* =====================================================================

function showView(v){
  state.view=v;
  $("dashboard").classList.toggle("off", v!=="dashboard");
  $("wizard").classList.toggle("on", v==="wizard");
  $("bar").style.display = v==="wizard" ? "block" : "none";
  if(v==="dashboard") window.scrollTo(0,0);
}

/* =====================================================================
   WIZARD
   ===================================================================== */
function newTicket(){
  state.record={}; state.files={}; state.recordId=null; state.editing=false;
  setPath(); state.stepIndex=0; state.maxStepIndex=0;
  showView("wizard"); renderWizard();
}
/* Lookup fields (useId:true) come back from Creator as objects (or arrays of
   objects) with a display_value, not the plain label the rest of the UI works
   with. Unwrap them once on load so the select/chip UI, and vehicleIssuesFor's
   label match, see the same plain strings they'd see on a freshly-built ticket. */
function unwrapLookup(v){
  if(v==null) return v;
  if(Array.isArray(v)) return v.map(unwrapLookup);
  if(typeof v==="object") return v.display_value||v.zc_display_value||v.value||"";
  return v;
}
function openTicket(rec){
  state.record=Object.assign({},rec); state.files={}; state.recordId=rec.ID; state.editing=true;
  STAGES.forEach(st=>st.fields.forEach(f=>{ if(f.useId && state.record[f.n]!=null) state.record[f.n]=unwrapLookup(state.record[f.n]); }));
  setPath();
  const st=readVal(rec,CONFIG.stageField);
  state.stepIndex = stageIndexForStatus(state.path, st);
  state.maxStepIndex = state.stepIndex; // can revisit anything already reached, not skip ahead of it
  showView("wizard"); renderWizard();
}
function setPath(){
  const t=(state.record[CONFIG.serviceTypeField]||"").toUpperCase();
  state.path=buildPath(t==="TOW"?"TOW":"RSR");
  if(state.stepIndex>state.path.length-1) state.stepIndex=state.path.length-1;
}
/* shown on stepper steps beyond state.maxStepIndex — mandatory fields on an
   earlier step haven't been saved yet, so the agent can't skip ahead to them */
const LOCK_ICON='<svg viewBox="0 0 24 24" width="11" height="11"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function renderWizard(){
  const step=state.path[state.stepIndex];
  $("wizStageTitle").textContent = state.editing ? "Edit Ticket" : "New Ticket";
  $("wizCaseId").textContent = state.recordId ? caseLabel(state.record) : "unsaved";
  // Service_Type drives the branch below but is never shown — it's derived from Vehicle_Issue and saved silently.
  // stepper
  $("steps").innerHTML = state.path.map((s,i)=>{
    const locked = i>state.maxStepIndex;
    const cls = (i===state.stepIndex?"active":(i<state.stepIndex?"done":""))+(locked?" locked":"");
    const num = locked ? LOCK_ICON : (i<state.stepIndex?"✓":(i+1));
    return `<div class="step ${cls}" data-i="${i}"><span class="n">${num}</span><span class="lb">${s.short}</span></div>`;
  }).join("");
  document.querySelectorAll("#steps .step").forEach(el=>{
    const i=+el.dataset.i;
    if(i>state.maxStepIndex) return; // locked — mandatory fields on an earlier step haven't been saved yet
    el.onclick=()=>jumpTo(i);
  });
  const pct = state.path.length>1 ? (state.stepIndex/(state.path.length-1))*100 : 100;
  $("pbarFill").style.width = pct+"%";
  // buttons
  $("prevBtn").disabled = state.stepIndex===0;
  $("saveBtn").textContent = step.save;
  $("closeBtn").style.display = step.key==="create" ? "none" : ""; // no ticket to close yet on the first step
  if(step.key==="quote"){
    const q=calcQuote();
    state.record.Suggested_Rate=q.total; // readonly/computed — always kept in sync
    // Rate_Breakup is agent-editable (2026-07-28), so only seed it the first
    // time — otherwise every re-render (e.g. after changing Booking_Fee) would
    // silently overwrite whatever the agent typed back to the auto breakup.
    if(state.record.Rate_Breakup==null || state.record.Rate_Breakup==="") state.record.Rate_Breakup=q.breakup;
    if(state.record.Total_Service_Fee==null || state.record.Total_Service_Fee==="") state.record.Total_Service_Fee=q.total;
    state.record.Remaining_Fee=(Number(state.record.Total_Service_Fee)||0)-(Number(state.record.Booking_Fee)||0);
  }
  // fields
  $("stepTitle").textContent = step.title;
  $("stepDesc").textContent = step.desc||"";
  renderFields(step);
}
/* fields sharing the same "row" tag render side-by-side in one full-width
   row (e.g. Customer_Name/Phone_Number1/Email on the create step), instead of
   each taking its own slot in the normal 2-column grid. */
function renderFields(step){
  const box=$("fields"); box.innerHTML="";
  const visible = step.fields.filter(f=> !(f.when && !f.when(state.record)) && f.t!=="badge");
  let i=0;
  while(i<visible.length){
    const f=visible[i];
    if(f.row){
      const group=[f]; let j=i+1;
      while(j<visible.length && visible[j].row===f.row){ group.push(visible[j]); j++; }
      const rowWrap=document.createElement("div");
      rowWrap.className="fld-row";
      group.forEach(gf=>rowWrap.appendChild(buildField(gf)));
      box.appendChild(rowWrap);
      i=j;
    } else {
      box.appendChild(buildField(f));
      i++;
    }
  }
}
function buildField(f){
  const wrap=document.createElement("div");
  wrap.className="fld"+(f.full?" full":"");
  if(f.t==="summary"){ wrap.innerHTML=summaryHtml(); return wrap; }
  const id="f_"+f.n;
  const lab=`<label>${esc(f.l)}${f.req?'<span class="req">*</span>':""}</label>`;
  const cur=state.record[f.n];
  if(f.t==="textarea"){
    wrap.innerHTML=lab+`<textarea id="${id}"${f.readonly?" readonly":""}>${esc(cur||"")}</textarea>`;
  } else if(f.t==="select" && f.searchable){
    const baseOpts=resolveOptions(f);
    const effectiveCur = (cur!=null && cur!=="") ? cur : (f.default||"");
    const curOpt = baseOpts.find(o=>String(o.v)===String(effectiveCur));
    wrap.innerHTML=lab+`<div class="combo">
      <input type="text" id="${id}" class="combo-input" autocomplete="off" placeholder="Search ${esc(f.l)}…" value="${esc(curOpt?curOpt.label:"")}">
      <div class="combo-dropdown" id="${id}_dd"></div>
    </div>`;
  } else if(f.t==="select"){
    const baseOpts=resolveOptions(f);
    const knownVals=baseOpts.map(o=>String(o.v));
    const effectiveCur = (cur!=null && cur!=="") ? cur : (f.default||"");
    const isCustom = !!(f.other && effectiveCur!=="" && knownVals.indexOf(String(effectiveCur))===-1);
    const selVal = isCustom ? "Other" : effectiveCur;
    const opts=baseOpts.map(o=>`<option value="${esc(o.v)}" ${String(selVal)===String(o.v)?"selected":""}>${esc(o.label)}</option>`).join("");
    const showOther = f.other && selVal==="Other";
    wrap.innerHTML=lab+`<select id="${id}"${f.disabled?" disabled":""}><option value="">— select —</option>${opts}</select>`
      + (f.other ? `<input type="text" id="${id}_other" placeholder="Please specify ${esc(f.l)}" value="${esc(isCustom?effectiveCur:"")}" style="margin-top:8px${showOther?"":";display:none"}">` : "");
  } else if(f.t==="radio"){
    const sel = cur!=null?String(cur):"";
    const opts=resolveOptions(f).map(o=>`<div class="opt ${sel===String(o.v)?"sel":""}" data-value="${esc(o.v)}">${esc(o.label)}</div>`).join("");
    wrap.innerHTML=lab+`<div class="radio-set" id="${id}">${opts}</div>`;
  } else if(f.t==="check"){
    const on = cur===true||cur==="Yes"||(Array.isArray(cur)&&cur.indexOf("Yes")>=0);
    wrap.innerHTML=`<label class="check"><input type="checkbox" id="${id}" ${on?"checked":""}><span>${esc(f.l)}</span></label>`;
  } else if(f.t==="button"){
    const on = cur===true||cur==="Yes"||(Array.isArray(cur)&&cur.indexOf("Yes")>=0);
    const locked = on && !f.repeatable; // repeatable buttons (e.g. recalculate) never lock into a permanent "done" state
    const doneIcon='<svg viewBox="0 0 24 24" width="17" height="17"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    wrap.innerHTML=`<button type="button" id="${id}" class="btn ${locked?"ok":"primary"}" style="width:100%;justify-content:center"${locked?" disabled":""}>${locked?doneIcon+" "+esc(f.doneLabel||"Done"):esc(f.buttonLabel||f.l)}</button>`;
  } else if(f.t==="multiselect"){
    if(f.needsVehicle && !state.record[CONFIG.vehicleField]){
      wrap.innerHTML=lab+`<div class="hint" style="padding:4px 0">Select a vehicle first</div>`;
    } else {
      const arr = Array.isArray(cur)?cur:(cur?String(cur).split(",").map(s=>s.trim()):[]);
      const allOpts = resolveOptions(f);
      const selectedOpts = arr.map(v=>allOpts.find(o=>String(o.v)===String(v))||{v:v,label:v});
      const remaining = allOpts.filter(o=>arr.indexOf(o.v)===-1);
      const chips = selectedOpts.length
        ? selectedOpts.map(o=>`<span class="chip" data-value="${esc(o.v)}">${esc(o.label)}<button type="button" data-remove="${esc(o.v)}" aria-label="Remove ${esc(o.label)}">✕</button></span>`).join("")
        : `<span class="chip-empty">None selected</span>`;
      let addBox;
      if(!remaining.length){
        addBox = allOpts.length ? "" : `<span class="hint">This vehicle has no issues configured</span>`;
      } else if(f.searchable){
        addBox = `<div class="combo"><input type="text" id="${id}" class="combo-input" autocomplete="off" placeholder="Search to add…"><div class="combo-dropdown" id="${id}_dd"></div></div>`;
      } else {
        const addOpts = remaining.map(o=>`<option value="${esc(o.v)}">${esc(o.label)}</option>`).join("");
        addBox = `<select class="add-select" id="${id}"><option value="">+ Add…</option>${addOpts}</select>`;
      }
      wrap.innerHTML=lab+`<div class="chips" id="${id}_chips">${chips}</div>`+addBox;
    }
  } else if(f.t==="file"){
    const has = state.files[f.n];
    wrap.innerHTML=lab+`<input type="file" id="${id}" accept="image/*"${f.readonly?" disabled":""}>`+(has?`<span class="hint">Selected: ${esc(has.name)}</span>`:(cur?`<span class="hint">Already uploaded</span>`:""));
  } else {
    const map={tel:"tel",email:"email",number:"number",decimal:"number",date:"date",datetime:"datetime-local",time:"time",text:"text"};
    const step2 = (f.t==="decimal")?' step="any"':"";
    wrap.innerHTML=lab+`<input type="${map[f.t]||"text"}" id="${id}"${step2}${f.readonly?" readonly":""} value="${esc(cur||"")}">`+(f.hint?`<span class="hint">${esc(f.hint)}</span>`:"");
  }
  // interactions
  setTimeout(()=>wireField(f,id),0);
  return wrap;
}
const RERENDER=["Time_of_service","Action_field","Action_field2","Service_Request","Service_Request1","Vehicle"];
/* any field change that forces a full re-render must snapshot the DOM into
   state.record FIRST (via collectStep(false)) — otherwise every other field
   on the step (plain text inputs have no live listener of their own) reverts
   to its last-saved value and looks like it "went blank". */
function wireField(f,id){
  if(f.t==="multiselect"){ wireMultiselect(f,id); return; }
  if(f.t==="select" && f.searchable){ wireCombo(f,id); return; }
  const el=$(id); if(!el) return;
  if(f.t==="radio"){
    el.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      el.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel");
      state.record[f.n]=o.dataset.value;
      if(RERENDER.indexOf(f.n)>=0){ collectStep(false); renderWizard(); }
    });
  } else if(f.t==="check"){
    el.onchange=()=>{ state.record[f.n]=el.checked; };
  } else if(f.t==="button"){
    el.onclick=()=>{
      state.record[f.n]=true;
      if(typeof f.action==="function") f.action(state.record); // e.g. Calculate_Distance sets RT_KM
      collectStep(false); renderWizard();
    };
  } else if(f.t==="file"){
    el.onchange=()=>{ if(el.files&&el.files[0]) state.files[f.n]=el.files[0]; };
  } else if(f.t==="select"){
    el.onchange=()=>{
      state.record[f.n]=el.value;
      if(f.other){ const oEl=$(id+"_other"); if(oEl) oEl.style.display = el.value==="Other" ? "block":"none"; if(el.value==="Other" && oEl) oEl.focus(); }
      if(RERENDER.indexOf(f.n)>=0){
        collectStep(false); // snapshot everything else on screen before we rebuild it
        if(f.n===CONFIG.vehicleField){ state.record.Vehicle_Issue=[]; state.record[CONFIG.serviceTypeField]=""; state.record.Total_Service_Fee=""; }
        setPath(); renderWizard();
      }
    };
    if(f.other){ const oEl=$(id+"_other"); if(oEl) oEl.onchange=()=>{ if(el.value==="Other") state.record[f.n]=oEl.value; }; }
  } else if(f.recompute || f.parseTarget){
    el.onchange=()=>{
      collectStep(false);
      if(f.parseTarget){
        // e.g. "28.647, 65.546" -> Latitude/Longitude (or the drop-location pair)
        // rounded to 6 decimal places — Zoho's Decimal field rejected the raw
        // ~15-digit precision a live paste came in with ("Longitude has
        // exceeded its maximum digits"); 6 decimals (~11cm accuracy) is more
        // than enough for dispatch and comfortably under any reasonable limit.
        const parts=String(state.record[f.n]||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(parts.length>=2){
          const lat=Number(parts[0]), lon=Number(parts[1]);
          if(!isNaN(lat)) state.record[f.parseTarget[0]]=roundCoord(lat);
          if(!isNaN(lon)) state.record[f.parseTarget[1]]=roundCoord(lon);
        }
      }
      renderWizard();
    };
  }
}
/* Searchable single-select combo (Client/Vehicle) — a plain text input plus a
   custom filtered dropdown instead of a native <select>, since these option
   lists can run into the hundreds. Picking an option writes state.record[f.n]
   directly (mirrors the plain select's onchange, incl. the same RERENDER /
   Vehicle-clears-Issue side effects) — collectStep skips DOM-reading these
   fields entirely, same treatment as multiselect/button types. mousedown (not
   click) is used for picking so it fires before the input's blur hides the
   dropdown first. */
function wireCombo(f,id){
  const input=$(id); const dd=$(id+"_dd"); if(!input||!dd) return;
  const opts=resolveOptions(f);
  function labelFor(v){ const o=opts.find(x=>String(x.v)===String(v)); return o?o.label:""; }
  function renderList(filter){
    const q=(filter||"").trim().toLowerCase();
    const matches=q ? opts.filter(o=>o.label.toLowerCase().indexOf(q)!==-1) : opts;
    dd.innerHTML = matches.length
      ? matches.map(o=>`<div class="combo-opt" data-v="${esc(o.v)}">${esc(o.label)}</div>`).join("")
      : `<div class="combo-empty">No matches</div>`;
    dd.querySelectorAll(".combo-opt").forEach(el=>{
      el.onmousedown=(e)=>{
        e.preventDefault();
        const o=matches.find(m=>String(m.v)===el.dataset.v); if(!o) return;
        input.value=o.label;
        state.record[f.n]=o.v;
        dd.classList.remove("on");
        if(RERENDER.indexOf(f.n)>=0){
          collectStep(false); // snapshot everything else on screen before we rebuild it
          if(f.n===CONFIG.vehicleField){ state.record.Vehicle_Issue=[]; state.record[CONFIG.serviceTypeField]=""; state.record.Total_Service_Fee=""; }
          setPath(); renderWizard();
        }
      };
    });
    dd.classList.add("on");
  }
  input.addEventListener("focus",()=>renderList(""));
  input.addEventListener("input",()=>renderList(input.value));
  input.addEventListener("blur",()=>{
    setTimeout(()=>{ dd.classList.remove("on"); input.value=labelFor(state.record[f.n]); },150);
  });
}
/* Zoho-style multiselect: selected values show as removable chips, plus an
   "+ Add…" widget for what's left — a searchable combo when f.searchable is
   set (Vehicle_Issue), otherwise a plain native <select>. state.record is the
   single source of truth (no DOM scraping at collect time — see collectStep). */
function wireMultiselect(f,id){
  const chipsBox=$(id+"_chips");
  if(chipsBox){
    chipsBox.querySelectorAll("button[data-remove]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.getAttribute("data-remove");
        const cur=Array.isArray(state.record[f.n])?state.record[f.n]:[];
        state.record[f.n]=cur.filter(x=>x!==val);
        afterMultiselectChange(f);
      };
    });
  }
  if(f.searchable){ wireComboAdd(f,id); return; }
  const addEl=$(id);
  if(addEl && addEl.tagName==="SELECT"){
    addEl.onchange=()=>{
      if(!addEl.value) return;
      const cur=Array.isArray(state.record[f.n])?state.record[f.n].slice():[];
      if(cur.indexOf(addEl.value)===-1) cur.push(addEl.value);
      state.record[f.n]=cur;
      afterMultiselectChange(f);
    };
  }
}
function wireComboAdd(f,id){
  const input=$(id); const dd=$(id+"_dd"); if(!input||!dd) return;
  function remainingOpts(){
    const allOpts=resolveOptions(f);
    const cur=Array.isArray(state.record[f.n])?state.record[f.n]:[];
    return allOpts.filter(o=>cur.indexOf(o.v)===-1);
  }
  function renderList(filter){
    const remaining=remainingOpts();
    const q=(filter||"").trim().toLowerCase();
    const matches=q ? remaining.filter(o=>o.label.toLowerCase().indexOf(q)!==-1) : remaining;
    dd.innerHTML = matches.length
      ? matches.map(o=>`<div class="combo-opt" data-v="${esc(o.v)}">${esc(o.label)}</div>`).join("")
      : `<div class="combo-empty">No matches</div>`;
    dd.querySelectorAll(".combo-opt").forEach(el=>{
      el.onmousedown=(e)=>{
        e.preventDefault();
        const o=matches.find(m=>String(m.v)===el.dataset.v); if(!o) return;
        const cur=Array.isArray(state.record[f.n])?state.record[f.n].slice():[];
        if(cur.indexOf(o.v)===-1) cur.push(o.v);
        state.record[f.n]=cur;
        dd.classList.remove("on");
        afterMultiselectChange(f); // rebuilds the field, clearing the search input fresh
      };
    });
    dd.classList.add("on");
  }
  input.addEventListener("focus",()=>renderList(""));
  input.addEventListener("input",()=>renderList(input.value));
  input.addEventListener("blur",()=>{ setTimeout(()=>dd.classList.remove("on"),150); });
}
function afterMultiselectChange(f){
  if(f.n==="Vehicle_Issue"){
    const vals=Array.isArray(state.record.Vehicle_Issue)?state.record.Vehicle_Issue:[];
    state.record[CONFIG.serviceTypeField] = vals.length ? (vals.some(isTowIssue)?"TOW":"RSR") : "";
    // Total_Service_Fee must track the selected issue(s) — clear it so the
    // quote step recomputes a fresh total next time it renders, instead of
    // keeping whatever total was already there from before this edit.
    state.record.Total_Service_Fee = "";
  }
  collectStep(false); // snapshot everything else on screen before we rebuild it
  setPath();
  renderWizard();
}
function summaryHtml(){
  const r=state.record;
  const rows=[
    ["Case ID", state.recordId?caseLabel(r):"(unsaved)"],
    ["Customer", readVal(r,CONFIG.nameField)],
    ["Phone", r[CONFIG.phoneField]||""],
    ["Service Type", r[CONFIG.serviceTypeField]||""],
    ["Vehicle", r[CONFIG.vehicleField]||""],
    ["Issue", readVal(r,"Vehicle_Issue")],
    ["Total Fee", r.Total_Service_Fee||r.Total_Service_Fee1||""],
    ["Booking Fee", r.Booking_Fee||""],
    ["Remaining Fee", r.Remaining_Fee||""],
    ["Vendor", readVal(r,"Vendors")||r.Vendor_Email||""],
    ["Technician", r.Assigned_Technician||r.Assigned_Technician_Email||""]
  ].filter(x=>x[1]!=="" && x[1]!=null);
  return `<div class="summary">`+rows.map(x=>`<div class="srow"><span class="k">${esc(x[0])}</span><span class="v">${esc(x[1])}</span></div>`).join("")+`</div>`;
}

/* ---- collect current step DOM -> state.record ---- */
function collectStep(validate){
  const step=state.path[state.stepIndex]; let ok=true; let missing="";
  step.fields.forEach(f=>{
    if(f.when && !f.when(state.record)) return;
    if(f.t==="summary") return;
    if(f.t==="file") return; // handled via state.files
    if(f.t==="badge") return; // read-only, value already set by Vehicle_Issue handler
    if(f.t==="button") return; // no DOM value to read — its own onclick sets state.record directly
    let v;
    if(f.t==="multiselect"){
      // chip UI keeps state.record as the only source of truth — nothing to scrape from the DOM
      v=Array.isArray(state.record[f.n])?state.record[f.n]:[];
      if(validate&&f.req && !v.length){ ok=false; missing=missing||f.l; }
      return;
    }
    if(f.t==="select" && f.searchable){
      // combo input's DOM value is the display label, not the real value —
      // wireCombo already keeps state.record[f.n] current on every pick
      v=state.record[f.n];
      if(validate&&f.req){ const empty=(v===""||v==null); if(empty){ ok=false; missing=missing||f.l; } }
      return;
    }
    const el=$("f_"+f.n); if(!el) return;
    if(f.t==="radio"){ const s=el.querySelector(".opt.sel"); v=s?s.dataset.value:""; }
    else if(f.t==="check"){ v=el.checked; }
    else if(f.t==="select" && f.other){
      v=el.value;
      if(v==="Other"){ const oEl=$("f_"+f.n+"_other"); const ov=((oEl&&oEl.value)||"").trim(); if(ov) v=ov; }
    }
    else if(f.t==="tel"){ v=formatIndianPhone(el.value); }
    else { v=el.value; }
    state.record[f.n]=v;
    if(validate&&f.req){ const empty=(v===""||v==null||(Array.isArray(v)&&!v.length)); if(empty){ ok=false; missing=missing||f.l; } }
  });
  return {ok,missing};
}
/* fields flagged useId:true are real Lookups (confirmed for "Vehicle" via a live
   record) — Creator's API rejects display text for those and wants the linked
   record's ID instead. Vehicle_Issue/Vendors/Assigned_Technician are confirmed
   plain multiselect/text, NOT lookups — don't re-add useId to those without new
   evidence. Falls back to the raw value if no matching option is loaded yet
   (better a failed save you can see than a silent drop). */
function idsFor(field, value){
  const list = optionsListFor(field);
  const findId = (val)=>{ const m=list.find(o=>String(o.v)===String(val)); return (m && m.id!=null) ? m.id : val; };
  return Array.isArray(value) ? value.map(findId) : findId(value);
}
const COORD_FIELDS=["Latitude","Longitude","DropLocationLat","DropLocationLong"];
function buildPayload(step){
  const p={}; const r=state.record;
  step.fields.forEach(f=>{
    if(f.t==="summary"||f.t==="file") return;
    if(f.when && !f.when(r)) return;
    let v=r[f.n];
    if(f.t==="check"||f.t==="button"){ p[f.n]= (v===true||v==="Yes")?["Yes"]:[]; return; }
    if(f.t==="multiselect"){ let arr=Array.isArray(v)?v:(v?[v]:[]); if(f.useId) arr=idsFor(f,arr); p[f.n]=arr; return; }
    if(v===""||v==null) return;
    if(f.useId) v=idsFor(f,v);
    if(f.t==="date") v=fmtDate(v);
    else if(f.t==="datetime") v=fmtDateTime(v);
    else if(f.t==="number"||f.t==="decimal") v=Number(v);
    // safety net for manual edits to the lat/long boxes themselves, not just
    // pasted via parseTarget (which already rounds on the way in — see wireField)
    if(COORD_FIELDS.indexOf(f.n)>=0) v=roundCoord(v);
    p[f.n]=v;
  });
  p[CONFIG.stageField]=computeStatus(step, r) || step.title; // title fallback should never actually fire — every stage has a status
  if(!state.recordId && r[CONFIG.caseIdField]) p[CONFIG.caseIdField]=r[CONFIG.caseIdField];
  if(typeof step.extra==="function") Object.assign(p, step.extra(r)); // mirror values into required fields the UI doesn't show separately
  return p;
}

/* ---- actions ---- */
async function saveStep(advance){
  const step=state.path[state.stepIndex];
  const chk=collectStep(true);
  if(!chk.ok){ toast("Please fill: "+chk.missing,"err"); return; }
  setPath();
  const payload=buildPayload(step);
  console.log("[Get-Rescue] saving step:", step.title, "| Status ->", payload[CONFIG.stageField], "| full payload:", payload, "| Vehicle_Issue:", payload.Vehicle_Issue);
  $("saveBtn").disabled=true;
  try{
    if(!state.recordId){
      const id=await addTicket(payload); state.recordId=id;
      // Case_ID depends on the record's own ID, so it can only be set after creation —
      // short, unique-enough tag: "RSID" + the last 6 digits of the new record's ID.
      // Best-effort: if Create_Case already auto-stamps its own Case_ID on create
      // (e.g. a formula/autonumber field the API won't let us override), this
      // update may be rejected — don't let that fail the whole ticket creation,
      // just log it so a still-CSID-looking Case_ID can be diagnosed from console.
      const caseId="RSID"+String(id).slice(-6);
      state.record[CONFIG.caseIdField]=caseId;
      try{ await updateTicket(id,{[CONFIG.caseIdField]:caseId}); }
      catch(e){ console.warn("[Get-Rescue] could not set Case_ID to", caseId, "on record", id, "— ticket was still created; Case_ID may be left at Zoho's own default:", e); }
    }
    else { await updateTicket(state.recordId,payload); }
    // best-effort file uploads (won't block)
    for(const k in state.files){ if(state.files[k]) apiUpload(state.recordId,k,state.files[k]); }
    $("wizCaseId").textContent=caseLabel(state.record)||("#"+state.recordId);
    toast("Saved","ok");
    if(step.branch==="final"){ // closing step
      await updateTicket(state.recordId,{[CONFIG.stageField]:"CLOSED"});
      toast("Ticket closed","ok"); return backToDash();
    }
    // required action not done yet (e.g. location/payment) -> save as-is and
    // close the wizard back to the dashboard, same as Cancel, rather than
    // blocking the agent on this page. Reopening the ticket from the dashboard
    // resumes on this same step (stageIndexForStatus).
    const blocked = typeof step.canAdvance==="function" && !step.canAdvance(state.record);
    if(blocked){
      toast(step.blockedMessage||"Saved — required action still pending","ok");
      return backToDash();
    } else if(advance && state.stepIndex<state.path.length-1){
      state.stepIndex++;
      if(state.stepIndex>state.maxStepIndex) state.maxStepIndex=state.stepIndex; // unlocks the next step now that this one's required fields are saved
      renderWizard(); window.scrollTo(0,0);
    }
    else renderWizard();
  }catch(e){ console.error(e); toast((e&&e.message)||"Save failed","err"); }
  finally{ $("saveBtn").disabled=false; }
}
function prevStep(){ if(state.stepIndex===0) return; collectStep(false); state.stepIndex--; renderWizard(); window.scrollTo(0,0); }
function jumpTo(i){ if(i===state.stepIndex || i>state.maxStepIndex) return; collectStep(false); setPath(); state.stepIndex=Math.min(i,state.path.length-1); renderWizard(); window.scrollTo(0,0); }
async function cancelWizard(){
  const yes=await confirmBox("Stop filling?","Your current progress on this step will be saved as-is before you leave.","Yes, stop");
  if(!yes) return;
  // best-effort: persist whatever's on screen (incl. its computed Status, e.g.
  // "LOCATION REQUEST"/"SERVICE FEE QUOTE" if a required action wasn't done)
  // so cancelling isn't silently different from saving without completing it.
  if(state.recordId){
    try{ collectStep(false); setPath(); await updateTicket(state.recordId, buildPayload(state.path[state.stepIndex])); }
    catch(e){ console.warn("cancel: best-effort save failed", e); }
  }
  backToDash();
}
async function closeTicketAction(){
  const yes=await confirmBox("Close this ticket?","It will be marked CLOSED and removed from the active stages.","Close ticket");
  if(!yes) return;
  try{
    collectStep(false); setPath();
    const payload=Object.assign(buildPayload(state.path[state.stepIndex]),{[CONFIG.stageField]:"CLOSED"});
    if(!state.recordId){ state.recordId=await addTicket(payload); } else { await updateTicket(state.recordId,payload); }
    toast("Ticket closed","ok"); backToDash();
  }catch(e){ toast((e&&e.message)||"Could not close","err"); }
}
function backToDash(){ showView("dashboard"); loadDashboard(); }

/* =====================================================================
   WIRING + BOOT
   ===================================================================== */
$("newBtn").onclick=newTicket;
$("refreshBtn").onclick=loadDashboard;
$("wizClose").onclick=cancelWizard;
$("prevBtn").onclick=prevStep;
$("saveBtn").onclick=()=>saveStep(true);
$("cancelBtn").onclick=cancelWizard;
$("closeBtn").onclick=closeTicketAction;
$("searchBtn").onclick=runSearch;
$("q").addEventListener("input",onSearchInput);
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter") runSearch(); });
$("clearSearch").onclick=()=>{ $("q").value=""; $("clearSearch").style.display="none"; closeSearchDropdown(); };

async function boot(){
  SDK_READY=true;
  try{ await ZOHO.CREATOR.UTIL.getInitParams(); }catch(e){}
  await loadOptions();
  loadDashboard();
}
function enterDemo(){
  SDK_READY=false; $("demoNote").style.display="block";
  OPTIONS.vehicles = DEMO_VEHICLES.map(function(r){ return { v:r.Name, label:r.Name, id:r.ID, raw:r }; });
  OPTIONS.issues   = DEMO_ISSUES.map(function(r){ return { v:r.Issue_Name, label:r.Issue_Name, id:r.ID, raw:r }; });
  OPTIONS.clients  = DEMO_CLIENTS.map(function(r){ return { v:r.Client_Name, label:r.Client_Name, id:r.ID, raw:r }; });
  RATE_MASTER = DEMO_RATE_MASTER;
  loadDashboard();
}
function waitForSDK(a){
  a=a||0;
  if(sdkReady()){ boot(); return; }
  if(a>40){ enterDemo(); return; }
  setTimeout(()=>waitForSDK(a+1),200);
}
waitForSDK();
</script>
