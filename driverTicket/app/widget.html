<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Get-Rescue · Driver</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
/* Same design tokens as every other Get-Rescue widget — kept identical on
   purpose (2026-07-31: "the theme will be same"), not re-derived here. */
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 100px}
img,svg{max-width:100%}

.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--signal);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(241,90,34,.4)}
.brand .mk svg{width:18px;height:18px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.toggle{flex:none;position:relative;width:96px;height:32px;border-radius:999px;background:var(--stop);box-shadow:inset 0 1px 3px rgba(20,22,28,.2);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--ok)}
.toggle .lab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:700;font-size:11px;color:#fff;pointer-events:none}
.toggle .lab.off{right:11px} .toggle .lab.on{left:11px;display:none}
.toggle.on .lab.on{display:block} .toggle.on .lab.off{display:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .knob{transform:translateX(64px)}
.toggle.locked{opacity:.6;pointer-events:none}

.sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-head h2{font-family:var(--f-disp);font-size:18px;font-weight:800}
.sec-head .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
.tcard:active{background:var(--worktop)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.tcard .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--worktop);padding:3px 9px;border-radius:999px;flex:none}
.tcard h3{font-family:var(--f-disp);font-size:17px;font-weight:800;margin:2px 0 3px}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.invite{background:var(--purple-soft);color:#5a3fd6}
.st.otw{background:var(--info-soft);color:#1d5fc0}
.st.wip{background:var(--signal-soft);color:var(--signal-deep)}
.st.pay{background:var(--wait-soft);color:#a85a06}
.st.rej{background:var(--stop-soft);color:var(--stop)}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}
.empty-state h3{font-family:var(--f-disp);font-size:17px;color:var(--text);margin:10px 0 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#actionScreen.off{display:none}
.ascreen-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-x{border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.ascreen-top h2{font-family:var(--f-disp);font-size:19px;font-weight:900;flex:1}
/* minmax(0,1fr) + wrapping, 2026-09-25 — client-reported: the vehicle name showed
   correctly on iPhone but was clipped or missing on Android.
   Not a data difference: both devices receive the same name. A grid column sized
   plain `1fr` keeps min-width:auto, so the track REFUSES to shrink below its
   content's min-content width. A long unbroken value ("OTHER TWO WHEELER",
   "PUNCTURE-TUBELESS TYRE") therefore pushes the column wider than the card and
   overflows instead of wrapping. iOS Safari and Android Chrome differ in viewport
   width and font metrics, so the same layout clips on one and fits on the other.
   minmax(0,1fr) lets the track shrink and the wrap rules below let the text break,
   which is additive: nothing that fits today renders any differently. */
.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;margin-bottom:6px}
.info-grid .full{grid-column:1/-1}
.info-grid .k{font-family:var(--f-mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.info-grid .v{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.info-grid .tel-wrap{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.info-grid .tel-link{color:inherit;text-decoration:underline;word-break:break-word}
.info-grid .tel-copy{border:1px solid var(--line-strong);background:var(--worktop);color:var(--muted);
  font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;cursor:pointer;flex:none}
.nav-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--info-soft);color:#1d5fc0;border-radius:11px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:14px;text-decoration:none;margin:6px 0}

.photo-field{margin:12px 0}
.photo-field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.photo-field .lab .l{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.photo-field .lab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.photo-field .lab .cnt.ok{color:var(--ok)}
/* Collapsible photo section (2026-08-04, per user request — "accordion as we
   do for RSR ticket") — see vendorTicket's own matching comment. */
.photo-field.collapsible .lab{cursor:pointer;user-select:none}
.photo-field.collapsible .lab .chev{color:var(--muted);vertical-align:middle;margin-right:4px;transition:transform .2s}
.photo-field.collapsible.collapsed .lab .chev{transform:rotate(-90deg)}
.photo-field.collapsible.collapsed .photo-grid{display:none}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
/* Armed state for the two-tap photo controls - the ONLY visual cue a phone
   gets that the next tap will delete, since there is no dialog. Deliberately
   loud: red, bigger, and wide enough to read the word on a small remove pill. */
.rm.armed{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;transform:scale(1.25)}
.photo-clearall.armed{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--worktop)}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.add{border:1.5px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;color:var(--muted-2);background:#fff}
.photo-slot.add:active{background:var(--worktop)}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,22,28,.65);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:11px}
/* Auto-upload status badge — see vendorTicket's own matching comment. */
.photo-slot .up-badge{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;line-height:1}
.photo-slot .up-badge.ok{background:var(--ok)}
.photo-slot .up-badge.pending{background:rgba(20,22,28,.65);animation:pulseBadge 1.1s ease-in-out infinite}
.photo-slot .up-badge.failed{background:var(--stop)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.35}}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;font-family:var(--f-body);color:var(--text);background:#fff;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld textarea{min-height:70px;resize:vertical}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;background:#fff;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}

.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:active{background:var(--signal-deep)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:16px}
.btn-row .btn{flex:1}

.modal{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column}
.modal.on{display:flex}
#cameraVideo{width:100%;max-width:520px;flex:1;object-fit:cover;background:#000}
.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;width:100%;max-width:520px}
.cam-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer}
.cam-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;cursor:pointer;font-size:18px}
.cam-hint{color:rgba(255,255,255,.7);font-family:var(--f-mono);font-size:11px;text-align:center;padding:8px 20px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
/* "New case assigned" notifications (2026-08-07) — see notifyNewCases()'s
   own comment. Stacks top-right, above everything else on screen. */
.mech-notif-stack{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.mech-notif-card{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--signal);
  border-radius:10px;padding:11px 12px;box-shadow:var(--sh-2);animation:mechNotifIn .2s ease-out}
.mech-notif-body{flex:1;cursor:pointer;font-size:13px;line-height:1.45}
.mech-notif-body b{display:block;font-size:13.5px;margin-bottom:2px}
.mech-notif-status{color:var(--muted);font-size:11.5px;margin-top:3px}
.mech-notif-close{flex:none;border:0;background:transparent;color:var(--muted-2);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.mech-notif-close:hover{color:var(--stop)}
@keyframes mechNotifIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
      <span><b id="techName">Driver</b><span>Get-Rescue</span></span>
    </div>
    <div class="toggle" id="availToggle" role="switch" aria-label="Toggle availability">
      <span class="lab off">Offline</span><span class="lab on">Online</span>
      <span class="knob"></span>
    </div>
  </div>

  <div id="dashboard">
    <div class="sec-head"><h2>My Tickets</h2><span class="cnt" id="ticketCount">0</span></div>
    <div id="ticketList"></div>
  </div>

  <div id="actionScreen" class="off">
    <div class="ascreen-top">
      <button class="back-x" id="backBtn" type="button" aria-label="Back to my tickets"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="ascreenTitle">—</h2>
    </div>
    <div class="card">
      <div class="info-grid" id="ticketInfo"></div>
    </div>
    <div id="ascreenBody"></div>
  </div>
</div>

<!-- camera modal — see technicianTicket's own copy for the full rationale
     comment; identical here, not re-explained. -->
<div class="modal" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="cam-hint" id="cameraHint">Center the shot, then tap to capture</div>
  <div class="camera-bar">
    <button class="cam-x" id="cameraCancel" type="button" aria-label="Cancel">✕</button>
    <button class="cam-btn" id="cameraShutter" type="button" aria-label="Capture photo"></button>
    <span style="width:40px"></span>
  </div>
</div>
<input type="file" id="cameraFallbackInput" accept="image/*" capture="environment" style="display:none">
<!-- no `capture` attribute here — lets the OS picker offer Gallery too -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<!-- Real-time-ish "new case assigned" notifications (2026-08-07, user
     request) — see notifyNewCases()'s own comment. Separate from the
     single-slot toast above (auto-hides in 2.6s, would get stomped by a
     second simultaneous event); cards here stack and persist until
     dismissed or their own 12s timeout. -->
<div class="mech-notif-stack" id="mechNotifStack"></div>

<script>
/* =====================================================================
   GET-RESCUE · DRIVER WIDGET (TOW field flow)
   Sibling of technicianTicket's widget.html — same CORE (theme, data layer,
   camera/GPS watermark modal, distance/ETA stand-in, toggle), TOW-specific
   action screens instead of RSR's. See technicianTicket/app/widget.html's
   own header comment for the full set of confirmed decisions this build
   relies on (Create_Case only, no "Invites" form, Haversine stand-in for
   Google Maps, etc.) — not re-explained per file here.
   ===================================================================== */
const CONFIG = {
  appName: "get-rescue",
  formName: "Create_Case",
  reportName: "Agent_Ticket_Report",
  stageField: "Status",
  caseIdField: "Case_ID",
  serviceTypeField: "Service_Type",
  nameField: "Customer_Name",
  phoneField: "Phone_Number",
  vehicleField: "Vehicle",
  // Added 2026-08-05 (user request — "Vehicle ID showing, not the Vehicle
  // name") — see vendorTicket's own matching CONFIG comment; same fix here.
  vehicleMasterReport: "Vehicle_Master_Report",
  vehicleNameField: "Name",
  // Added 2026-08-05 (user request — "[object Object]" on the dashboard card
  // instead of the real issue name) — see vendorTicket's own matching CONFIG
  // comment; same fix here.
  issueReport: "Vehicle_Issue_Report",
  issueNameField: "Issue_Name",
  myEmailFieldCandidates: ["Assigned_Technician_Email","Technician_Email1","Vendor_Email2"],
  techReport: "Technicians_Report",
  techStatusField: "Availability_Status",
  techEmailField: "Email",
  techNameField: "Technician_Name",
  techPhoneField: "Phone", // user-confirmed 2026-09-06 — needed for the WhatsApp "dispatched" message (spec template 8)
  // Added 2026-08-17 (user request — see pingCurrentLocation()'s own
  // comment). Same field names getRescueTicket's own vendor-assignment picker
  // expects on Technicians_Report, written here directly through this
  // driver's own techReport record (this widget's toggle already targets
  // Technicians_Report itself, same shared report technicianTicket's own
  // toggle writes to — no separate Drivers_Report in between). Brand-new
  // fields, not yet created in Zoho Studio — see FIELDS.md's own note.
  techCurrentLatField: "Current_Latitude",
  techCurrentLonField: "Current_Longitude",
  // Invites (2026-08-03, user-confirmed — "invite covers all") — see
  // technicianTicket's own comment on this same config entry.
  invitesReport: "Invites_Report"
};
/* TOW dashboard statuses — mirrors technicianTicket's own MY_STATUSES note
   on "REMAINING FEE DUE" not matching getRescueTicket's existing guess;
   same caveat applies here. */
// "RSP REJECT" added 2026-08-20 — see vendorTicket's own matching comment
// (same fix, same day, same root cause: a rejected ticket used to vanish
// from "My Tickets" with no lasting sign it was ever rejected).
const MY_STATUSES = ["RSP IRA (INVITE RESPONSE AWAITED)","RSP ON THE WAY","LOADING","TO DROP LOCATION","UNLOADING","REMAINING FEE DUE","RSP REJECT"];
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
// Corrected 2026-09-07 (user-provided LOCATIONS-DISTANCES-DATETIME spec) —
// previous value (12.967827711025203, 77.611228) was off by ~13-20m from the
// spec's confirmed office coordinates.
const OFFICE_LAT=12.967945122837245, OFFICE_LON=77.6110507612277;

// Direct download-URL construction (2026-08-21, ported from getRescueTicket's
// own already-working zohoFileDownloadUrl()) — see fileCountFor()/
// zohoFileDownloadUrl() below for why this is needed here too. Same
// account/app/report as getRescueTicket (CONFIG.appName/reportName below
// are identical), so reusing this exact constant/pattern is not a new guess.
const ZOHO_SCOPE_NAME = "getrescued";
let INIT_PARAMS = null;
function zohoAppLinkName(){
  const frag = (INIT_PARAMS && INIT_PARAMS.envUrlFragment) || "";
  return CONFIG.appName + (/development/i.test(frag) ? "-development" : "");
}
let SDK_READY=false, LOGIN_EMAIL="", MY_TECH_NAME="", MY_TECH_PHONE="";
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams==="function"; }
function resolve(method){
  const C=window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces=[C.DATA,C.PUBLISH,C.META,C.UTIL,C.FILE];
  for(let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}
async function apiGetReport(report, criteria, max){
  const fn=resolve("getRecords"); if(!fn) return [];
  const cfg={ app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria=criteria;
  try{ const r=await fn(cfg); return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : []; } catch(e){ return []; }
}
async function apiUpdate(id, data){ return apiUpdateReport(CONFIG.reportName, id, data); }
async function apiUpdateReport(report, id, data){
  const fn=resolve("updateRecordById") || resolve("updateRecord"); if(!fn) throw new Error("updateRecordById unavailable");
  const r=await fn({ app_name:CONFIG.appName, report_name:report, id:id, payload:{ data:data } });
  if(!r || r.code!==3000) throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Update failed");
  return true;
}
// WhatsApp sending (2026-09-06) — copied verbatim from getRescueTicket's own
// already-proven sendWhatsAppTemplate()/formatIndianPhone(), per the user's
// "RESCUE - Towing Service Logic Flow" spec. This widget had zero WhatsApp
// integration before now. Same Custom API (sendWhatsAppMessage), same

// Real bug fixed 2026-09-13 — same fix, same reason, as getRescueTicket's
// own matching function (that file's own isValidIndianPhoneDigits() already
// anticipates and strips this exact shape for validation purposes — this
// widget has no equivalent validator, but the underlying number shape is
// the same): a 12-digit number already starting "91" (no "+") used to get
// ANOTHER "+91" prepended here, producing a broken double-country-code
// number for tel: links.
function formatIndianPhone(v){
  if(!v) return "";
  const s=String(v).trim();
  if(s.charAt(0)==="+") return "+"+s.slice(1).replace(/\D/g,"");
  let digits=s.replace(/\D/g,""); if(!digits) return "";
  if(digits.length===12 && digits.startsWith("91")) digits=digits.slice(2);
  return "+91"+digits;
}

    const forTicket=all.filter(function(inv){

async function updateMyInvite(ticketId, data){
  let invite=state.inviteByTicketId && state.inviteByTicketId[String(ticketId)];
  if(!invite || invite.ID==null){
    // Real bug fixed (2026-08-21) — see vendorTicket's own matching
    // 2026-08-21 comment on this exact function: state.inviteByTicketId is
    // a one-time snapshot from loadDashboard() that can go stale if
    // currentTechRecord hadn't resolved yet at that moment. Retries a real,
    // direct Invites_Report lookup (matched on the Technician Lookup field,
    // not Vendor — see loadMyInvites()'s own 2026-08-03 field-name fix)
    // instead of trusting the possibly-stale cache.
    if(currentTechRecord){
      try{
        const all=await apiGetReport(CONFIG.invitesReport, null, 1000);
        const fresh=all.find(function(inv){ return String(unwrapLookup(inv.RSID)||"")===String(ticketId) && String(lookupId(inv.Technician))===String(currentTechRecord.id); });
        if(fresh){
          invite=fresh;

          state.inviteByTicketId[String(ticketId)]=fresh;
          console.log("[Get-Rescue] updateMyInvite: retry found the real Invites record for ticket", ticketId, "(id "+fresh.ID+") — the earlier cache was just stale, not missing data.");

    }

  // findMyInviteByTicket() above. Reached only when both paths above came
  // back empty, which is precisely when nothing used to be written at all.
  if(!invite || invite.ID==null) invite = await findMyInviteByTicket(ticketId);

  try{ await apiUpdateReport(CONFIG.invitesReport, invite.ID, data); }

// matching comment: resolve()'s generic namespace probe could silently pick
// the wrong "uploadFile"-named function from an earlier namespace; the real,
// documented method is specifically ZOHO.CREATOR.FILE.uploadFile. Calls it
// directly now, falling back to the old generic probe only if an older SDK
// build has no FILE namespace.
async function apiUpload(id, fieldName, file){
  const C=window.ZOHO && ZOHO.CREATOR;
  const fn=(C && C.FILE && typeof C.FILE.uploadFile==="function") ? C.FILE.uploadFile.bind(C.FILE) : resolve("uploadFile");
  if(!fn || !file) return false;
  const req={ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, field_name:fieldName, file:file };
  try{
    const r=await fn(req);
    /* THE OFFLINE-PHOTO LOSS FIX — 2026-10-03, client-reported: "it seems to
       be saving the photos when offline, but when app comes back online and
       the submit button is clicked the page moves forward but the photos are
       not sent to the backend. The photos are thus lost."

       Some Creator SDK builds RESOLVE this promise on a business-logic
       rejection (code !== 3000) instead of throwing, so the catch below never
       fired and every rejected upload was reported as a success. That alone
       would only mean a missing photo — what made it data LOSS is
       flushPhotoQueue(), which deletes the queued IndexedDB row on a
       "successful" upload. A photo saved offline was therefore uploaded,
       silently rejected, reported as sent, and then deleted from the device.

       getRescueTicket hit this same bug on 2026-08-07 and has run with this
       exact check ever since; it is ported rather than rewritten. */
    if(r && typeof r==="object" && "code" in r && r.code!==3000){
      console.warn("uploadFile for "+fieldName+" resolved with a non-success code — treating as FAILED so the photo stays queued:", r);
      return false;
    }
    return true;
  }
  catch(e){ console.warn("uploadFile failed for "+fieldName, e); return false; }
}

function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// google api - ensure that travel type has to be four wheeler for TOW cases
// and distance type should be two wheeler for REPAIR/RSR cases"). Defaults
// to "DRIVING" so any call site not yet updated keeps its exact previous
// behavior — fully backward compatible.
function googleDistanceMatrix(origins,destinations,travelMode){
  const mode=travelMode||"DRIVING";
  return loadGoogleMaps().then(function(ok){
    if(!ok || !window.google || !window.google.maps) return null;
    if(!dmService) dmService=new google.maps.DistanceMatrixService();
    return new Promise(function(res){
      try{
        dmService.getDistanceMatrix({
          origins: origins.map(function(o){ return new google.maps.LatLng(o.lat,o.lon); }),
          destinations: destinations.map(function(d){ return new google.maps.LatLng(d.lat,d.lon); }),
          travelMode: mode

          if(status!=="OK" || !resp){ console.warn("[Get-Rescue] DistanceMatrix request failed:",status,"(travelMode:",mode+")"); res(null); return; }

// Already the module's own default above, so this doesn't change any actual

/* useGoogle (2026-10-07) - OPT IN, not opt out. Google is scoped to four
   calculations; this helper serves five, so the choice belongs to the caller.
   Omitted means straight-line, which is what every unlisted caller already did
   and must keep doing. Only Accept (start -> breakdown) and Vehicle Picked
   (breakdown -> drop) pass true. */
async function calcDistanceETA(fromLat,fromLon,toLat,toLon,travelMode,useGoogle){
  if([fromLat,fromLon,toLat,toLon].some(function(n){ return n==null || isNaN(n); })) return null;
  const rows = useGoogle ? await googleDistanceMatrix([{lat:fromLat,lon:fromLon}],[{lat:toLat,lon:toLon}],travelMode) : null;
  const el=rows && rows[0] && rows[0].elements && rows[0].elements[0];
  if(el && el.status==="OK") return { distanceKm:Math.round((el.distance.value/1000)*10)/10, etaMins:Math.max(1,Math.round(el.duration.value/60)) };
  const distanceKm=Math.round(haversineKm(fromLat,fromLon,toLat,toLon)*10)/10;
  const etaMins=Math.max(1, Math.round((distanceKm/ASSUMED_SPEED_KMH)*60));
  return { distanceKm:distanceKm, etaMins:etaMins };
}
/* 4-point roundtrip (Action 7b): Office -> Breakdown -> Drop -> Office —
   matches the flow-generation prompt's own naming for the four legs
   (Office_To_Mechanic / Mechanic_To_Breakdown / Breakdown_To_Drop_Distance /
   Drop_To_Office_Distance), all saved individually plus the Roundtrip_Distance
   total. Google Distance Matrix first (one matrix call covering all legs at
   once via the diagonal of an NxN request), Haversine fallback below. */
async function calc4PointRoundtrip(bLat,bLon,dLat,dLon,travelMode){
  const hasDrop = dLat!=null && dLon!=null && !isNaN(dLat) && !isNaN(dLon);
  const origins = hasDrop ? [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon},{lat:dLat,lon:dLon}] : [{lat:OFFICE_LAT,lon:OFFICE_LON},{lat:bLat,lon:bLon}];
  const dests   = hasDrop ? [{lat:bLat,lon:bLon},{lat:dLat,lon:dLon},{lat:OFFICE_LAT,lon:OFFICE_LON}] : [{lat:bLat,lon:bLon},{lat:OFFICE_LAT,lon:OFFICE_LON}];
  const rows=await googleDistanceMatrix(origins,dests,travelMode);
  let officeToBreakdown,breakdownToDrop,dropToOffice,ok=!!rows;
  if(ok){
    const legs=[];
    for(let i=0;i<origins.length;i++){
      const el=rows[i] && rows[i].elements && rows[i].elements[i];
      if(!el || el.status!=="OK"){ ok=false; break; }
      legs.push(el.distance.value/1000);
    }
    if(ok){ officeToBreakdown=legs[0]; breakdownToDrop=hasDrop?legs[1]:0; dropToOffice=hasDrop?legs[2]:legs[1]; }
  }
  if(!ok){
    officeToBreakdown=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
    breakdownToDrop = hasDrop ? haversineKm(bLat,bLon,dLat,dLon) : 0;
    dropToOffice = hasDrop ? haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON) : haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON);
  }
  const total=officeToBreakdown+breakdownToDrop+dropToOffice;
  return {
    officeToMechanic: Math.round(officeToBreakdown*10)/10,
    mechanicToBreakdown: 0, // office->breakdown modeled as a single leg here (no separate "mechanic pickup" waypoint tracked) — see QUESTIONS_TO_ASK.md
    breakdownToDrop: Math.round(breakdownToDrop*10)/10,
    dropToOffice: Math.round(dropToOffice*10)/10,
    total: Math.round(total*10)/10
  };
}

  // centre of both boxes so it stays on the breakdown point whatever the crop.

    '<div style="position:absolute;left:50%;top:50%;width:768px;height:256px;margin:-128px 0 0 -384px">'+tiles+'</div>'+

    '<div style="position:absolute;left:4px;bottom:3px;font-family:var(--f-mono);font-size:9.5px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:3px;color:#444">'+esc(la.toFixed(5)+", "+lo.toFixed(5))+'</div>'+

const NOTIF_SOUND_STATE={ctx:null};
// Browsers block audio without a prior real user gesture — this creates (or
// resumes) a single shared AudioContext on the FIRST genuine click anywhere
// on the page, so a later background poll's sound is already unlocked by
// the time it actually needs to play. Cheap to call repeatedly.
function unlockNotifSound(){
  try{
    if(!NOTIF_SOUND_STATE.ctx) NOTIF_SOUND_STATE.ctx=new (window.AudioContext||window.webkitAudioContext)();
    else if(NOTIF_SOUND_STATE.ctx.state==="suspended") NOTIF_SOUND_STATE.ctx.resume().catch(function(){});
  }catch(e){}
}
document.addEventListener("click", unlockNotifSound);
// Two rising "whoop" sweeps (frequency ramps up within each note, rather
// than a flat-pitch beep), generated on the fly via a Web Audio oscillator —
// no audio file to bundle or host. Deliberately different from
// vendorTicket's/technicianTicket's own tone (2026-09-10, client soft-test
// feedback: "the 'New Ticket Received' audio alert/buzzer needs to be
// distinct, unique, and sufficiently loud" — all 3 field-facing apps
// previously played the identical 2-beep sine tone) — a rising sweep reads
// very differently from a repeated flat beep even at a glance/half-heard,
// and louder (gain 0.28 -> 0.5) than before.
/* Volume raised again 2026-09-23 (user request: "increase volume") — peak
   gain 0.5/0.55 -> 0.85. Still under Web Audio's clipping ceiling of 1.0, so
   the tone stays clean rather than distorting. The PATTERN (pulse count,
   waveform, frequency, spacing) is deliberately unchanged: each of the three
   field apps has its own signature so someone in earshot of more than one
   device can tell which app a ticket landed on by sound alone. */
function playNotifSound(){
  try{
    unlockNotifSound();
    const ctx=NOTIF_SOUND_STATE.ctx; if(!ctx) return;
    [0,0.22].forEach(function(offset){
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type="triangle";
      const t=ctx.currentTime+offset;
      osc.frequency.setValueAtTime(523,t);
      osc.frequency.exponentialRampToValueAtTime(784,t+0.18);
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.linearRampToValueAtTime(0.85,t+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.21);
    });
  }catch(e){ console.warn("[Get-Rescue] playNotifSound failed", e); }
}

async function pollForNewCases(){
  if(!isDashboardVisible()){ stopDashboardPoll(); return; }
  // Piggy-backs on the poll that already runs every 30s while the list is on
  // screen rather than adding a second timer. flushPhotoQueue() guards itself
  // against overlapping runs and returns immediately when the queue is empty.
  flushPhotoQueue();
  try{
    const fresh=await fetchMyTickets();
    const freshIds=new Set(fresh.map(function(r){ return String(r.ID); }));
    const newOnes = KNOWN_TICKET_IDS ? fresh.filter(function(r){ return !KNOWN_TICKET_IDS.has(String(r.ID)); }) : [];
    // Real bug fixed 2026-09-01 (found while fixing the identical gap in
    // getRescueTicket's own dashboard poll) — this used to only re-render
    // when a brand-new ticket arrived. Two related gaps fixed together:
    // (1) an already-known ticket's status silently changing elsewhere
    // updated state.tickets in the background but never refreshed the
    // screen; (2) a ticket dropping out of "my tickets" entirely (no longer
    // matches this driver's own filters) had the same problem, the stale
    // row just stayed on screen. Neither plays the new-case sound — that's
    // reserved for a genuinely new arrival — they just make sure the screen
    // itself never goes stale.
    const hasStatusChange = KNOWN_TICKET_IDS ? fresh.some(function(r){
      const id=String(r.ID);
      if(!KNOWN_TICKET_IDS.has(id)) return false; // a new ticket, already covered by newOnes
      const st=String(r[CONFIG.stageField]||"").trim().toUpperCase();
      return KNOWN_TICKET_STATUSES[id]!=null && KNOWN_TICKET_STATUSES[id]!==st;
    }) : false;
    const hasRemoval = KNOWN_TICKET_IDS ? Array.from(KNOWN_TICKET_IDS).some(function(id){ return !freshIds.has(id); }) : false;
    updateKnownTicketIds(fresh);
    state.tickets=fresh;
    if(newOnes.length) notifyNewCases(newOnes);
    if(newOnes.length || hasStatusChange || hasRemoval) renderDashboard();
  }catch(e){ console.warn("[Get-Rescue] pollForNewCases failed (non-blocking)", e); }
}

       template_not_found on every send - the real approved template is #8,
       share_rescue_service_details_and_eta, the same one getRescueTicket's own

       the template writes the literal word "Hrs" after {{3}}, so the ETA is
       converted from minutes to hours (sending 45 would otherwise read
       "45 Hrs"); and empty strings are rejected with 422 message_rejected, so
       every missing value is sent as "-" instead. */
    /* SEND 8, then SEND 9 — LOGIC-REPAIR / LOGIC-TOW: "SEND 8 with vendor/mechanic
       name and number, AND then send 9 after 5 minutes".

       SEND 9 goes out immediately rather than 5 minutes later. A widget cannot
       hold a 5-minute timer — the app is closed or the screen locked long before
       it fires, and the message would simply never arrive. Honouring the gap needs
       a scheduled Deluge function sweeping a due-time field on the ticket, which
       is new Zoho infrastructure; delivered-now beats delivered-never until that
       exists. Chained after SEND 8 so the order the customer sees is still right.

       Template 9 takes no parameters. Failures are logged, never toasted: SEND 8
       already reports its own outcome and this must not turn one failure into two
       error messages on the vendor's screen. */
    sendWhatsAppTemplate(r[CONFIG.phoneField], "share_rescue_service_details_and_eta", [MY_TECH_NAME||"-", MY_TECH_PHONE||"-", customerEtaText(dist&&dist.etaMins)||"-"])

      .catch(function(e){ console.warn("[GR] SEND 8/9 chain threw (non-blocking)", e); });

async function confirmCancel(){
  const reason=$("cancelReason").value;
  if(!reason){ toast("Please pick a cancel reason","err"); return; }
  if(effectivePhotoCount("Image_Upload5")<1){ toast("Cancel photo is required","err"); return; }
  setDisabled("confirmCancelBtn",true);
  try{
    const r=state.current;
    // See technicianTicket's own comment on confirmCancel() — same
    // Cancellation_Time/Cancel_Location_Lat/Lon/Cancel_Distance capture,
    // not repeated here.
    const payload={ Reject_Reason2: reason, Status:"RSP CANCELLED", Cancellation_Time: fmtDateTime(new Date()) };
    const pos = await getPositionSafe();
    if(pos){
      payload.Cancel_Location_Lat=pos.lat; payload.Cancel_Location_Lon=pos.lon;
      const startLat=Number(r.RSP_Start_Latitude), startLon=Number(r.RSP_Start_Longitude);
      const dist = !isNaN(startLat) && !isNaN(startLon) ? await calcDistanceETA(startLat,startLon,pos.lat,pos.lon,travelModeFor(r)) : null;
      if(dist) payload.Cancel_Distance=dist.distanceKm;
      // Distance_Cancel_To_Breakdown (2026-08-11, user request, "Missing
      // Fields & Field Behavior" spec item 2) — BRAND NEW field, deliberately
      // different from Cancel_Distance just above (Accept location → Cancel
      // location) — this is Cancel location → the ticket's own static
      // breakdown location, which no field/calc covered before this at all.
      const bLatC=Number(r.Latitude), bLonC=Number(r.Longitude);
      const cancelToBreakdown = !isNaN(bLatC) && !isNaN(bLonC) ? await calcDistanceETA(pos.lat,pos.lon,bLatC,bLonC,travelModeFor(r)) : null;
      if(cancelToBreakdown) payload.Distance_Cancel_To_Breakdown=cancelToBreakdown.distanceKm;
      // Client-requested addition (2026-08-04) — see technicianTicket's own
      // matching comment: round trip office -> this driver's current
      // (cancel-click) position -> office, reusing calc4PointRoundtrip()
      // with pos as the "breakdown" point and no drop point.
      const legs = await calc4PointRoundtrip(pos.lat,pos.lon,null,null,travelModeFor(r));
      payload.Roundtrip_Distance = legs.total;
      // Office_To_Mechanic/Mechanic_To_Breakdown/Breakdown_To_Office
      // (2026-08-04, per user request — "this also work for the Driver"):
      // same per-leg breakdown just added to technicianTicket's/vendorTicket's
      // own RSR Work Completed, extended to this widget's own office<->office
      // (no drop) trips. dropToOffice in that no-drop case IS the
      // position->office leg this field means here.
      payload.Office_To_Mechanic = legs.officeToMechanic;
      payload.Mechanic_To_Breakdown = legs.mechanicToBreakdown;
      payload.Breakdown_To_Office = legs.dropToOffice;
    }
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Task cancelled","ok");
    backToDashboard();
  }catch(e){ toast((e&&e.message)||"Could not cancel","err"); }
  finally{ setDisabled("confirmCancelBtn",false); }
}

    // denied here), so this never simply breaks on older/incomplete data.
    const eLat=parseCoord(r.Reach_Location_Lat), eLon=parseCoord(r.Reach_Location_Lon);
    const bLat = eLat!=null ? eLat : Number(r.Latitude), bLon = eLon!=null ? eLon : Number(r.Longitude);
    const pos=await getPositionSafe();
    const dLat = pos ? pos.lat : parseCoord(r.DropLocationLat), dLon = pos ? pos.lon : parseCoord(r.DropLocationLong);
    const legs=await calc4PointRoundtrip(bLat,bLon,dLat,dLon,travelModeFor(r));
    const odo=$("odoDrop").value;
    const payload={
      Status:"UNLOADING",
      Office_To_Mechanic: legs.officeToMechanic,
      Mechanic_To_Breakdown: legs.mechanicToBreakdown,
      Breakdown_To_Drop_Distance: legs.breakdownToDrop,
      Drop_To_Office_Distance: legs.dropToOffice,
      Roundtrip_Distance: legs.total,
      // Action 7b mock: "time is captured as 'drop location arrival time'" +
      // "Location is captured as 'RSP Drop Location'" — the driver's own live
      // GPS fix at click time, separate from the ticket's static
      // DropLocationLat/Long (which is the customer-specified drop point
      // already used above for the roundtrip calc).
      Drop_Location_Arrival_Time: fmtDateTime(new Date())
    };
    // CHANGED 2026-09-11 (part of the wider "capture location+time at every
    // relevant step" request, real bug fix) — this used to reuse the SAME
    // RSP_Start_Latitude/Longitude fields Accept already writes (a 2026-08-04
    // workaround to dodge a "Decimal field exceeded maximum digits" error by
    // not creating a new field at all). That meant reaching the drop location
    // silently OVERWROTE and permanently lost the Accept-time GPS fix — the
    // exact "incorrectly sharing fields" problem this request called out.
    // User has since created a real, dedicated RSP_Drop_Latitude/Longitude
    // pair (Single Line Text, matching RSP_Start_Latitude/Longitude's own
    // type — same "avoid any Decimal digit-limit risk" reasoning that field
    // pair already proved out). Accept's own RSP_Start_Latitude/Longitude
    // write (acceptService(), untouched by this change) is now permanently
    // preserved instead of being clobbered here.
    if(pos){ payload.RSP_Drop_Latitude=pos.lat; payload.RSP_Drop_Longitude=pos.lon; }
    if(toll) payload.Toll_Charges1=toll.dataset.value;
    // Fixed 2026-09-02 (user request) — this used to write to the same
    // Odometer_Reading field Accept's start-odometer uses, silently
    // overwriting it. Own field now, so both readings persist. NEW FIELD —
    // needs to be created in Zoho (Number type) before this writes for real.
    if(odo!=="") payload.Odometer_reading_at_Drop_Location=Number(odo);
    await apiUpdate(r.ID, payload);
    await uploadPendingPhotos(r.ID);
    toast("Marked as reached drop location","ok");
    goToStatus("UNLOADING");
  }catch(e){ toast((e&&e.message)||"Could not save","err"); }
  finally{ setDisabled("reachedDropBtn",false); }
}

/* ===== Action 8: Final Payment Collection (shared RSR & TOW) ===== */
/* Payment screen auto-refresh — 2026-09-28, client list item "Auto refresh on
   PAYMENTS page for vendor app: success payment needs to show".

   The remaining fee is settled by the CUSTOMER, on their own phone, through the
   payment link. paymentWebhook.deluge then writes Payment_received / Payment_Status
   onto the ticket. Nothing told this screen any of that had happened, so the vendor
   sat looking at PENDING with the button disabled until they backed out and
   reopened the ticket — exactly while standing next to a customer who has just paid.

   Polls the vendor’s own ticket list, which is already fetched by fetchMyTickets()
   for the dashboard, rather than adding a second data path. Only re-renders when a
   settlement field actually changed: a silent re-render every 10s would fight the
   vendor for focus on the receipt-photo input and the method dropdown.

   Runs only while the payment screen is open. renderActionScreen() stops it on any
   screen change, so it cannot outlive the screen or stack timers. */
let PAYMENT_POLL_TIMER=null;
const PAYMENT_POLL_MS=10000;
function stopPaymentPoll(){ if(PAYMENT_POLL_TIMER){ clearInterval(PAYMENT_POLL_TIMER); PAYMENT_POLL_TIMER=null; } }
function startPaymentPoll(){
  stopPaymentPoll();
  PAYMENT_POLL_TIMER=setInterval(pollPaymentReceived, PAYMENT_POLL_MS);
}
async function pollPaymentReceived(){
  const cur=state.current;
  if(!cur || !cur.ID){ stopPaymentPoll(); return; }
  try{
    const fresh=await fetchMyTickets();
    const hit=(fresh||[]).find(function(x){ return String(x.ID)===String(cur.ID); });
    if(!hit) return;   // dropped out of this vendor’s list — the dashboard poll handles that
    const was=String(cur.Payment_received||"").trim()+"|"+String(cur.Payment_Status||"").trim()+"|"+String(cur.Payment_Method_Final||"").trim();
    const now=String(hit.Payment_received||"").trim()+"|"+String(hit.Payment_Status||"").trim()+"|"+String(hit.Payment_Method_Final||"").trim();
    if(was===now) return;
    console.log("[Get-Rescue] pollPaymentReceived: settlement changed on ticket", cur.ID, "|", was, "->", now);
    // Copy the settlement fields onto the in-memory record rather than replacing it
    // wholesale: state.current carries unsaved screen state (a pending receipt
    // photo, a chosen method) that a blanket overwrite would discard.
    cur.Payment_received=hit.Payment_received;
    cur.Payment_Status=hit.Payment_Status;
    cur.Payment_Method_Final=hit.Payment_Method_Final;
    cur.Remaining_Fee_Receipt_Time=hit.Remaining_Fee_Receipt_Time;
    if(String(hit.Payment_received||"").trim()==="Yes") toast("Payment received","ok");
    renderActionScreen();
  }catch(e){ console.warn("[Get-Rescue] pollPaymentReceived failed (non-blocking)", e); }
}
function renderPaymentScreen(){
  // Watch for the customer settling the remaining fee while this screen is open.
  startPaymentPoll();
  const r=state.current;
  const remaining=Number(r.Remaining_Fee)||0;
  // Real bug fixed (2026-08-03, user-confirmed via the actual Zoho field
  // config) — see technicianTicket's own comment on this same line. Real
  // options are PAID / PENDING / NOT APPLICABLE, not "Pending"/"Success".
  // Real bug fixed 2026-09-12 — see vendorTicket's own matching comment
  // (identical bug: Payment_Status is shared with the agent's Booking Fee
  // stage, so it could already read "PAID" before this screen was ever
  // opened, bypassing the mandatory-photo gate). Payment_received is only
  // ever written by this exact confirmPaymentReceived() action.
  const alreadySuccess=r.Payment_received==="Yes";
  /* Payment Method now reflects what the ticket ALREADY holds (2026-09-25,
     user-reported live: a gateway-settled ticket still showed "Cash"). The five
     options used to be hardcoded with Cash pre-selected, so reopening this screen
     after paymentWebhook.deluge had written "Payment Gateway" showed Cash, and
     confirmPaymentReceived() then wrote that Cash straight back. That is a money
     bug, not a display one: getRescueTicket cashCollectedForTicket() deducts the
     Remaining Fee from the vendor payout whenever this field reads "Cash", so a
     mislabelled gateway payment underpays the vendor by money they never held. */
  const PAY_METHOD_OPTIONS=["Cash","UPI","Card","Net Banking","Payment Gateway"];
  const storedPayMethod=String(r.Payment_Method_Final||"").trim();
  const selectedPayMethod=PAY_METHOD_OPTIONS.indexOf(storedPayMethod)>=0?storedPayMethod:"";
  /* No method is pre-selected (2026-09-25, user request): Cash used to be the
     pre-picked option, so a vendor who never touched the dropdown recorded Cash
     whatever they were actually paid. The placeholder is disabled so it cannot
     be chosen back once a real method is picked. */
  const payMethodOptionsHtml='<option value=""'+(selectedPayMethod?'':' selected')+' disabled>— Select payment method —</option>'+PAY_METHOD_OPTIONS.map(function(m){
    return '<option value="'+m+'"'+(m===selectedPayMethod?' selected':'')+'>'+m+'</option>';
  }).join("");
  // Payment_Method_Final's real options confirmed 2026-08-03 (user's own Zoho
  // field screenshot): Cash / UPI / Card / Net Banking — replaces the
  // earlier guessed "Payment Gateway / Direct / Cash" list. None of these
  // is an automatic online gateway, so the QR/auto-pay block was removed —
  // every method required the receipt photo (or remaining<=0) before
  // "Payment Received" unlocked.
  // Restored 2026-08-06 (user request — parity with vendorTicket, which
  // already got this back 2026-08-04) — brings back the "Payment Gateway"
  // QR display. Still just a decorative placeholder — no real gateway/
  // webhook is wired up to this app, same as vendorTicket's own copy.
  $("ascreenBody").innerHTML = `
    <div class="card">
      <div class="fld"><label>Remaining Fee</label><input type="text" value="₹ ${esc(remaining)}" readonly></div>
      <div class="fld"><label>Payment Method</label>
        <select id="Payment_Method_Final">
          ${payMethodOptionsHtml}
        </select>
      </div>
      <!-- The striped square that used to sit here was a CSS placeholder, not a real
           code. It looked scannable and was not, and a customer WILL try to scan it.
           This app has no payment-link generation (only vendorTicket does), so there
           is nothing to encode — hence a plain instruction instead of a fake code. -->
      <div id="qrBlock" style="text-align:center;margin:10px 0;display:none">
        <div style="font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:14px;border:1.5px dashed var(--line-strong);border-radius:12px">Ask the call centre to send the customer a payment link.<br>This screen updates itself once the payment lands.</div>
      </div>
      <div id="receiptBlock">${photoFieldHtml("Upload_Photo_of_receipt","Receipt Photo",1,1)}</div>
      <div class="fld"><label>Payment Status</label><input type="text" id="paymentStatusDisplay" value="${alreadySuccess?"PAID":"PENDING"}" readonly></div>
    </div>
    <button class="btn ok" id="paymentReceivedBtn" type="button" disabled>Payment Received</button>`;
  wirePhotoField("Upload_Photo_of_receipt",1);
  const methodEl=$("Payment_Method_Final");
  function syncMethod(){
    const gateway=methodEl.value==="Payment Gateway";
    $("qrBlock").style.display=gateway?"":"none";
    $("receiptBlock").style.display=gateway?"none":"";
    refreshPayButton();
  }
  methodEl.onchange=syncMethod; syncMethod();
  function refreshPayButton(){
    const gateway=methodEl.value==="Payment Gateway";
    const receiptOk=effectivePhotoCount("Upload_Photo_of_receipt")>=1;
    /* The button now also waits for a method to be chosen, since nothing is
       pre-selected. alreadySuccess (the gateway already settled it) and
       remaining<=0 (nothing to collect) still bypass it exactly as before. */
    const methodChosen = PAY_METHOD_OPTIONS.indexOf(methodEl.value)>=0;
    const success = alreadySuccess || (methodChosen && !gateway && receiptOk);
    $("paymentStatusDisplay").value = success ? "PAID" : "PENDING";
    $("paymentReceivedBtn").disabled = !(remaining<=0 || success);
  }
  document.getElementById("ascreenBody").addEventListener("click", refreshPayButton);
  $("paymentReceivedBtn").onclick=confirmPaymentReceived;
}
async function confirmPaymentReceived(){
  setDisabled("paymentReceivedBtn",true);
  try{
    const r=state.current;
    // See technicianTicket's own comment — Payment_Status always written
    // "PAID" here since clicking this button is itself the attestation.
    // Remaining_Fee_Receipt_Time / RSP_Closure_Time (2026-09-07, user-
    // provided LOCATIONS-DISTANCES-DATETIME spec, "#14"/"#15") — both share
    // the exact same trigger per spec (this exact click), mirrored as two
    // separate fields per the spec's own literal numbering. This function
    // only ever runs when the driver genuinely clicks "Payment Received", so
    // no extra guard is needed — same reasoning Payment_received:"Yes" above
    // already relies on.
    /* Payment_Method_Final is deliberately NOT written back over a payment the
       gateway already settled (2026-09-25). paymentWebhook.deluge sets it to
       "Payment Gateway"; this screen has nothing to add, and writing its dropdown
       value could only ever downgrade a real gateway payment to Cash. Every other
       field is written exactly as before, so a normal cash/UPI/card close is
       unchanged. */
    const gatewaySettled=String(r.Payment_Method_Final||"").trim()==="Payment Gateway" && String(r.Payment_received||"").trim()==="Yes";
    const payload={ Payment_received:"Yes", Payment_Status:"PAID", Status:"RSP CLOSED", Remaining_Fee_Receipt_Time: fmtDateTime(new Date()), RSP_Closure_Time: fmtDateTime(new Date()) };
    const chosenMethod=($("Payment_Method_Final") && $("Payment_Method_Final").value)||"";
    if(!gatewaySettled && chosenMethod) payload.Payment_Method_Final = chosenMethod;
    // Diagnostic logging (2026-08-03) — see vendorTicket's own comment on this same call.
    console.log("[Get-Rescue] confirmPaymentReceived payload:", JSON.stringify(payload));
    // Real bug fixed 2026-09-11 — see vendorTicket's own matching comment
    // (identical fix): uploadPendingPhotos() now runs BEFORE the apiUpdate()
    // that marks the ticket Status="RSP CLOSED"/Payment_Status="PAID" — a
    // genuine photo-upload failure now blocks the close instead of the
    // ticket silently closing without its required proof-of-payment photo.
    await uploadPendingPhotos(r.ID);
    await apiUpdate(r.ID, payload);
    toast("Payment recorded — job closed","ok");
    backToDashboard();
  }catch(e){ console.error("[Get-Rescue] confirmPaymentReceived error:", e); toast((e&&e.message)||"Could not save","err"); setDisabled("paymentReceivedBtn",false); }
}

// fileCountFor()/zohoFileDownloadUrl()/effectivePhotoCount()/
// hydrateAlreadyUploadedThumbs() (2026-08-21) — see vendorTicket's own
// matching comment for the full real-bug writeup (user-reported live:
// "vendor closes app and opens again... fields display as empty... has to
// click all photos again"). Identical port — same account/app/report.
function fileCountFor(rawValue){
  if(Array.isArray(rawValue)) return rawValue.length;
  return rawValue ? 1 : 0;
}
function zohoFileDownloadUrl(recordId, fieldName, rawValue, index){
  if(!recordId || !rawValue || rawValue===true) return null;
  const first = Array.isArray(rawValue) ? rawValue[index||0] : rawValue;
  if(!first || first===true) return null;
  const raw = (typeof first==="string") ? first
    : (first && typeof first==="object") ? (first.filepath||first.value||first.display_value||null)
    : null;
  if(!raw) return null;
  const m = raw.match(/filepath=([^&]+)/i);
  const filepath = m ? decodeURIComponent(m[1]) : raw;
  const clean = String(filepath).replace(/^\/+/,"");
  return "https://creatorapp.zoho.in/"+ZOHO_SCOPE_NAME+"/"+zohoAppLinkName()+"/report/"+CONFIG.reportName+"/"+recordId+"/"+fieldName+"/download-file?filepath=/"+encodeURIComponent(clean)+"&digestValue=eyJsYW5ndWFnZSI6ImVuIn0=&isPreview=true";
}
function effectivePhotoCount(fieldName){
  const already=fileCountFor(state.current && state.current[fieldName]);
  const picked=(state.photos[fieldName]||[]).length;
  return already+picked;
}
function wirePhotoField(fieldName,max){ renderPhotoGrid(fieldName,max); }
// See vendorTicket's own matching comment.
function uploadBadgeHtml(f){
  if(state.uploadedPhotoFiles.has(f)) return '<span class="up-badge ok" title="Saved">✓</span>';
  if(state.failedPhotoFiles.has(f)) return '<span class="up-badge failed" title="Save failed — will retry when you submit">!</span>';
  return '<span class="up-badge pending" title="Saving…">⋯</span>';
}
function hydrateAlreadyUploadedThumbs(fieldName, rawValue){
  if(!state.current || state.current.ID==null) return;
  document.querySelectorAll('[data-already-field="'+fieldName+'"]').forEach(function(el){
    const idx=Number(el.dataset.alreadyIdx||0);
    const url=zohoFileDownloadUrl(state.current.ID, fieldName, rawValue, idx);
    if(!url) return;
    const img=document.createElement("img");
    // The remove button is part of the tile and must survive the thumbnail
     // swap below, which replaces the tile's whole innerHTML (2026-10-05).
    const keepRm=el.querySelector(".rm");
    const restoreRm=function(){ if(keepRm) el.appendChild(keepRm); };
    img.onerror=function(){
      console.warn("[Get-Rescue] hydrateAlreadyUploadedThumbs: direct URL failed to load for", fieldName, "index", idx, "— reverting to the plain 'Saved' badge.");
      el.innerHTML='<span class="up-badge ok" title="Already saved">✓ Saved</span>';
      restoreRm();
    };
    img.onload=function(){
      const badge=document.createElement("span");
      badge.className="up-badge ok"; badge.title="Already saved"; badge.textContent="✓";
      el.appendChild(badge);
    };
    img.src=url;
    el.innerHTML="";
    el.appendChild(img);
    restoreRm();
  });
}
/* See this file's photo-delete notes — deletion is only offered where the

/* True when this field holds photos saved in an EARLIER session, so it can

   it back (CSP blocks fetch; a canvas is cross-origin tainted), so keepers
   could not be re-uploaded after the blanking deletePhotoAt() relies on. */
function photoClearOnlyField(fieldName, max){
  if(Number(max)===1) return false;

/* Clears every photo on a field so better ones can be taken. Same write
   deletePhotoAt() makes — blank the field, purge the offline queue so nothing
   resurrects — minus the keeper re-upload, because here there are deliberately
   no keepers. The count goes in the prompt: this throws away work, and the
   vendor should see how much before agreeing. */
async function clearAllPhotos(fieldName, max){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  const n=fileCountFor(state.current && state.current[fieldName]) + (state.photos[fieldName]||[]).length;
  // No confirm() here - the button arms itself on first tap instead. A WebView
  // that suppresses dialogs returns false from confirm() without throwing, which
  // silently cancelled this on every phone. See armTwoTap().
  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[GR] clearAllPhotos: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photos — nothing was changed","err");
    return;
  }
  state.current[fieldName]="";
  (state.photos[fieldName]||[]).forEach(function(file){
    state.uploadedPhotoFiles.delete(file); state.failedPhotoFiles.delete(file);
  });
  state.photos[fieldName]=[];
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[GR] clearAllPhotos: could not purge the offline queue for "+fieldName, e); }
  renderPhotoGrid(fieldName,max);
  toast("Photos removed — take new ones","ok");
}
function photoDeleteAllowed(fieldName, max){

/* Shown only where per-photo removal is impossible, so there is always SOME

/* Tap once to arm, tap again to do it. Replaces confirm(), which a phone

  if(!btn){ run(); return; }

    try{ clearTimeout(Number(btn.dataset.armTimer||0)); }catch(e){}
    btn.dataset.armed = "";
    if(btn.dataset.restLabel) btn.textContent = btn.dataset.restLabel;
    btn.classList.remove("armed");

    btn.classList.remove("armed");

/* Removes a photo from the ticket for real.

   Order matters: the field is blanked FIRST and the keepers re-uploaded after.
   The reverse (upload then blank) would delete what was just written. A keeper
   whose re-upload fails goes onto the offline queue exactly like any other
   failed upload, so it is retried rather than lost — the queue is why this is
   safe to do at all.

   Queued rows for this field are purged too. Without that, flushPhotoQueue()
   would happily re-upload the very photo the vendor just deleted. */
async function deletePhotoAt(fieldName, max, kind, index){
  const r=state.current;
  if(!r || r.ID==null){ toast("No ticket open","err"); return; }
  if(!photoDeleteAllowed(fieldName, max)){
    toast("This photo was saved earlier and can't be removed here — ask an agent to clear it on the ticket","err");
    return;
  }
  // No confirm() here either - see clearAllPhotos() and armTwoTap().

  const sessionFiles=(state.photos[fieldName]||[]).slice();
  const removedFile=(kind==="session") ? sessionFiles[index] : null;
  const keepers=sessionFiles.filter(function(f,i){ return !(kind==="session" && i===index); });

  try{
    const payload={}; payload[fieldName]="";
    await apiUpdate(r.ID, payload);
  }catch(e){
    console.warn("[Get-Rescue] deletePhotoAt: could not clear "+fieldName+" — nothing was changed", e);
    toast("Couldn't remove the photo — nothing was changed","err");
    return;
  }

  // The record no longer holds anything for this field.
  state.current[fieldName]="";
  state.photos[fieldName]=keepers;
  if(removedFile){ state.uploadedPhotoFiles.delete(removedFile); state.failedPhotoFiles.delete(removedFile); }

  // Stop a queued copy resurrecting any of this field's photos.
  try{
    const queued=await photoQueueAll();
    for(const it of queued){
      if(String(it.ticketId)===String(r.ID) && it.fieldName===fieldName) await photoQueueDelete(it.key);
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }catch(e){ console.warn("[Get-Rescue] deletePhotoAt: could not purge the offline queue for "+fieldName, e); }

  // Put the keepers back.
  for(const f of keepers){
    state.uploadedPhotoFiles.delete(f);
    let ok=false;
    try{ ok=await apiUpload(r.ID, fieldName, f); }catch(e){ ok=false; }
    if(ok) state.uploadedPhotoFiles.add(f);
    else{
      state.failedPhotoFiles.add(f);
      await queuePhotoOffline(r.ID, fieldName, f);
      PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
      renderPhotoQueueNote();
    }
  }

  toast("Photo removed","ok");
}

async function uploadPendingPhotos(recordId){

      // Most photos are already uploaded immediately on capture/pick (see
      // uploadPhotoNow, 2026-08-04 — "auto save at the time of upload, don't
      // need to click save") — skip those here to avoid uploading twice.
      if(state.uploadedPhotoFiles.has(files[i])) continue;

      // be discarded silently here too.
      const saved=await apiUpload(recordId, fieldName, files[i]);
      if(saved) state.uploadedPhotoFiles.add(files[i]);
      else await queuePhotoOffline(recordId, fieldName, files[i]);
    }
  }
  /* DRAIN ANYTHING QUEUED EARLIER — 2026-10-06, client-reported: "it saves the
     photos when offline, but when the app comes back online and submit is
     clicked the page moves forward and the photos are not sent."

     Exactly right, and this was the gap. The loop above only ever handles THIS
     step's own files; photos queued during an earlier offline spell sat in
     IndexedDB waiting for one of three triggers, none of which fires here:
     app boot, the browser "online" event (which never fires if the device was
     already online when the app opened), and the dashboard poll — which
     returns immediately unless the DASHBOARD is on screen, and a vendor
     submitting a step is not on the dashboard.

     So a vendor who reconnected and pressed submit saw the page advance with
     their photos still sitting in the queue. Awaited, not fire-and-forget:
     they pressed submit expecting the photos to go, and flushPhotoQueue()
     returns immediately when the queue is empty, so the normal case costs
     nothing. It guards against overlapping runs and swallows its own errors,
     so this can never block the save. */
  try{ await flushPhotoQueue(); }catch(e){ console.warn("[GR] uploadPendingPhotos: queue flush failed (non-blocking)", e); }

// Fire-and-forget upload the moment a photo is captured/picked — see
// vendorTicket's own matching comment, not repeated here.
/* ============================================================================
   OFFLINE PHOTO QUEUE — 2026-09-30
   Client list item: "Ability to save photos and data when offline — currently
   photos and data not stored temporarily when app does not have internet".

   A REAL BUG WAS FOUND WHILE BUILDING THIS, and it is the larger half of the
   problem. apiUpload() RETURNS false on failure, it does not throw. So
   uploadPhotoNow()'s catch never fired, the failed file was added to
   uploadedPhotoFiles as though it had succeeded, uploadPendingPhotos() then
   SKIPPED it at save time, and the "!" badge never appeared. A photo lost to a
   two-second signal drop vanished silently, with the grid showing a cheerful
   tick. That is fixed below by honouring the return value — and it matters even
   for a vendor who is never fully offline.

   SCOPE, stated plainly: this is "never lose a photo", not "run the whole app
   offline". Photos that fail to upload are kept in IndexedDB and retried until
   they land. Browsing tickets, changing status and closing a job still need a
   connection. Full offline operation would need an action queue and conflict
   resolution for status transitions — a different and much larger piece of work,
   and not what the client's wording asks for.

   IndexedDB rather than localStorage: these are JPEGs, and localStorage is a
   ~5MB string store that would need base64 (a 33% size penalty) on top. Every
   entry point degrades to today's behaviour if IndexedDB is unavailable — a
   WebView that blocks it loses nothing it would not have lost anyway.
   ========================================================================= */
const PHOTO_DB_NAME="gr_driver_photo_queue", PHOTO_STORE="pending";
let PHOTO_DB_PROMISE=null, PHOTO_FLUSH_RUNNING=false, PHOTO_QUEUE_COUNT=0;
/* Resolves to null rather than rejecting on every failure path, so no caller
   ever needs a try/catch around storage being absent. */
function photoDb(){
  if(PHOTO_DB_PROMISE) return PHOTO_DB_PROMISE;
  PHOTO_DB_PROMISE=new Promise(function(resolve){
    try{
      if(!window.indexedDB){ console.warn("[Get-Rescue] IndexedDB unavailable — photos cannot be queued offline."); resolve(null); return; }
      const req=window.indexedDB.open(PHOTO_DB_NAME,1);
      req.onupgradeneeded=function(){
        const db=req.result;
        if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE,{keyPath:"key",autoIncrement:true});
      };
      req.onsuccess=function(){ resolve(req.result); };
      req.onerror=function(){ console.warn("[Get-Rescue] could not open the photo queue database", req.error); resolve(null); };
    }catch(e){ console.warn("[Get-Rescue] IndexedDB threw on open", e); resolve(null); }
  });
  return PHOTO_DB_PROMISE;
}
function photoTx(db, mode){ return db.transaction(PHOTO_STORE, mode).objectStore(PHOTO_STORE); }
function photoQueueAll(){
  return photoDb().then(function(db){
    if(!db) return [];
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readonly").getAll();
        req.onsuccess=function(){ resolve(req.result||[]); };
        req.onerror=function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  });
}
function photoQueueDelete(key){
  return photoDb().then(function(db){
    if(!db) return;
    return new Promise(function(resolve){
      try{ const req=photoTx(db,"readwrite").delete(key); req.onsuccess=function(){ resolve(); }; req.onerror=function(){ resolve(); }; }
      catch(e){ resolve(); }
    });
  });
}
/* Stores the File itself. Name and type are kept alongside because a Blob read
   back out of IndexedDB can lose them, and uploadFile needs a real File. */
function queuePhotoOffline(ticketId, fieldName, file){
  return photoDb().then(function(db){
    if(!db || !file) return false;
    return new Promise(function(resolve){
      try{
        const req=photoTx(db,"readwrite").put({
          ticketId:String(ticketId), fieldName:fieldName,
          name:(file.name||"photo.jpg"), type:(file.type||"image/jpeg"),
          blob:file, addedAt:Date.now(), tries:0
        });
        req.onsuccess=function(){
          console.log("[Get-Rescue] photo queued for later upload —", fieldName, "on ticket", ticketId);
          resolve(true);
        };
        req.onerror=function(){ console.warn("[Get-Rescue] could not queue the photo", req.error); resolve(false); };
      }catch(e){ console.warn("[Get-Rescue] queuePhotoOffline threw", e); resolve(false); }
    });
  });
}
/* Retries everything queued. A row is deleted ONLY on a confirmed success —
   never on failure, which is the whole point: a photo that cannot upload yet
   must still be there after the app is closed and reopened. `tries` is recorded
   for diagnosis, deliberately without a cap that discards anything. */
async function flushPhotoQueue(){
  if(PHOTO_FLUSH_RUNNING) return;
  PHOTO_FLUSH_RUNNING=true;
  try{
    const items=await photoQueueAll();
    PHOTO_QUEUE_COUNT=items.length;
    if(!items.length){ renderPhotoQueueNote(); return; }
    if(typeof navigator!=="undefined" && navigator.onLine===false){
      console.log("[Get-Rescue] photo queue:", items.length, "waiting — still offline, not retrying.");
      renderPhotoQueueNote(); return;
    }
    let sent=0;
    for(const it of items){
      let file=it.blob;
      // A Blob read back from IndexedDB is not always a File any more; uploadFile
      // needs a name, so rebuild one when necessary.
      try{ if(!(file instanceof File)) file=new File([it.blob], it.name||"photo.jpg", {type:it.type||"image/jpeg"}); }
      catch(e){ /* File constructor unavailable — send the Blob as-is */ }
      const ok=await apiUpload(it.ticketId, it.fieldName, file);
      if(ok){ await photoQueueDelete(it.key); sent++; }
    }
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    if(sent) console.log("[Get-Rescue] photo queue: uploaded", sent, "—", PHOTO_QUEUE_COUNT, "still waiting.");
    if(sent && typeof toast==="function") toast(sent+" saved photo"+(sent===1?"":"s")+" uploaded","ok");
    renderPhotoQueueNote();
  }catch(e){
    console.warn("[Get-Rescue] flushPhotoQueue failed (non-blocking)", e);
  }finally{
    PHOTO_FLUSH_RUNNING=false;
  }
}
/* One muted line under the ticket list, and only when something is actually
   waiting. Appended to the existing list rather than added to the markup, so no
   layout changes and nothing to clean up when the queue empties. */
function renderPhotoQueueNote(){
  const host=$("ticketList"); if(!host) return;
  const old=document.getElementById("photoQueueNote"); if(old) old.remove();
  if(!PHOTO_QUEUE_COUNT) return;
  const n=document.createElement("div");
  n.id="photoQueueNote";
  n.style.cssText="margin:10px 2px 0;font-family:var(--f-mono);font-size:10.5px;line-height:1.5;color:var(--muted)";
  n.textContent=PHOTO_QUEUE_COUNT+" photo"+(PHOTO_QUEUE_COUNT===1?"":"s")+" saved on this phone, waiting for signal \u2014 they upload on their own once you are back online.";
  host.appendChild(n);

async function uploadPhotoNow(fieldName, file, max){
  const r=state.current; if(!r || r.ID==null) return;
  /* apiUpload() returns false on failure and does NOT throw, so the old
     try/catch here never fired and every failed upload was recorded as a
     success. Checking the return value is what makes the "!" badge and the
     save-time retry work at all. */
  let ok=false;
  try{ ok=await apiUpload(r.ID, fieldName, file); }
  catch(e){ ok=false; console.warn("[Get-Rescue] immediate upload threw for "+fieldName, e); }
  if(ok){ state.uploadedPhotoFiles.add(file); }
  else{
    state.failedPhotoFiles.add(file);
    // Kept on the device so it survives the app being closed — see the queue's
    // own header. Awaited so the badge below reflects the real queue length.
    await queuePhotoOffline(r.ID, fieldName, file);
    PHOTO_QUEUE_COUNT=(await photoQueueAll()).length;
    renderPhotoQueueNote();
  }

let cameraStream=null, currentPhotoField=null, currentPhotoMax=1;
// maximumAge param added 2026-09-13 (user request: "In-app image capture
// lag/time is excessively high" — re-checked after the earlier 2026-09-10/
// 2026-09-12 camera-resolution fixes, which addressed the canvas/stream size
// but left the real dominant cost untouched: getPositionSafe() itself can
// block for up to 8 FULL SECONDS per call, on every single photo, since it
// always requested a brand-new GPS fix with no maximumAge at all (defaults
// to 0 — "never accept a cached position"). Defaults to 0 here too, so every
// EXISTING call site (Accept/Reach/WIP/etc., where a fresh, current-moment
// position genuinely matters) is completely unaffected — only capturePhoto()
// below now opts into a 15s cache window, since a driver taking several
// photos in quick succession during the same job hasn't meaningfully moved
// between shots; the 2nd/3rd/4th photo in a sequence can reuse the 1st
// photo's already-resolved position instead of waiting up to 8s all over
// again. Does not touch enableHighAccuracy or the 8s timeout itself — a
// genuinely cold GPS fix (first photo of a session) is unaffected either way.
function getPositionSafe(maximumAge){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      // Real bug fixed (2026-08-03) — see technicianTicket's own comment on
      // this same function. Rounded to 15 decimal places via toFixed() (the
      // fields were widened to 15 places the same day) — not Math.round(x*1e15),
      // which can exceed Number.MAX_SAFE_INTEGER for lat/lon-sized values.
      function(pos){ res({lat:Number(pos.coords.latitude.toFixed(15)), lon:Number(pos.coords.longitude.toFixed(15))}); },
      function(){ res(null); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:maximumAge||0 }
    );
  });
}

// separate features — camera vs. gallery-picker — not a duplicate, see

// can take up to 8 seconds to resolve, and until now nothing disabled the
// shutter button or showed any progress during that wait — the modal just
// sat there looking frozen, inviting repeated taps that each started a NEW
// concurrent capture (a fresh GPS request plus a duplicate photo pushed onto
// state.photos/duplicate upload). Now guarded with a simple in-flight flag
// (extra taps are ignored outright, not queued) and visible feedback (shutter
// disabled + dimmed) so the wait reads as "working," not "broken." Does not

let capturingPhoto=false;
// Soft-test item #14 (2026-09-10) — see vendorTicket's own matching comment
// (this exact function is copy-pasted across vendorTicket/technicianTicket/
// driverTicket — same fix applied identically to all three).
const CAPTURE_MAX_DIM = 1600;
// compressImageFile() (2026-09-11, Task Tracker: "All gallery uploads must
// be automatically compressed before transmission") — see vendorTicket's
// own matching header comment for the full reasoning (identical function,
// copy-pasted here); openGallery() above now uses this before pushing a
// gallery-picked file into state.photos.
/* Burns the capture time and GPS into the bottom of a photo — extracted from
   capturePhoto() on 2026-10-05 so the file-picker path stamps identically.

   Sizing is proportional now, where the camera had it fixed at 56px/16px. On
   a 1600px photo that bar was about 3% of the height and effectively
   unreadable once the image was opened full-size, which defeats the point of
   a proof-of-service stamp. The floors are the old fixed numbers, so a small
   image renders exactly as it did before.
