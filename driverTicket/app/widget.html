function drawPhotoStamp(ctx, w, h, pos){
  try{
    const latText = pos ? pos.lat.toFixed(6) : "GPS unavailable";
    const lonText = pos ? pos.lon.toFixed(6) : "";
    const barH = Math.max(56, Math.round(h*0.075));
    const pad  = Math.max(14, Math.round(barH*0.25));
    const font = Math.max(16, Math.round(barH*0.28)); // 0.28 so a 56px bar lands on exactly 16px, the camera figure
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0, h-barH, w, barH);
    ctx.fillStyle="#fff";
    ctx.font=font+"px monospace";
    ctx.fillText("Lat: "+latText+(lonText?", Lon: "+lonText:""), pad, h-barH+Math.round(barH*0.40));
    ctx.fillText(new Date().toLocaleString(), pad, h-barH+Math.round(barH*0.75));
  }catch(e){ console.warn("[photo stamp] could not draw the stamp (photo itself is unaffected)", e); }
}
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve){
    try{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=async function(){
        try{
          const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.naturalWidth*scale);
          canvas.height=Math.round(img.naturalHeight*scale);
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          /* THE FIX — 2026-10-05. Every photo that reaches Zoho now carries the
             same stamp the in-app camera has always drawn. getPositionSafe's 15s
             cache is reused deliberately: a vendor picking several photos for one
             job has not meaningfully moved between them, and it avoids a fresh
             8s GPS wait per photo. A denied or unavailable fix still stamps the
             time and prints "GPS unavailable" rather than silently stamping
             nothing — an unstamped photo is exactly what was reported. */
          let stampPos=null;
          try{ stampPos=await getPositionSafe(15000); }catch(e){ stampPos=null; }
          drawPhotoStamp(ctx, canvas.width, canvas.height, stampPos);
          canvas.toBlob(function(blob){
            URL.revokeObjectURL(url);
            resolve(blob ? new File([blob], file.name, {type:"image/jpeg"}) : file);
          }, "image/jpeg", quality);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src=url;
    }catch(e){ resolve(file); }
  });
}
async function capturePhoto(){
  if(capturingPhoto) return;
  capturingPhoto=true;
  const shutterBtn=$("cameraShutter");
  shutterBtn.disabled=true; shutterBtn.style.opacity="0.4";
  try{
    const video=$("cameraVideo");
    const nativeW=video.videoWidth||720, nativeH=video.videoHeight||960;
    const scale=Math.min(1, CAPTURE_MAX_DIM/Math.max(nativeW,nativeH));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(nativeW*scale); canvas.height=Math.round(nativeH*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // maximumAge:15000 (2026-09-13) — see getPositionSafe()'s own comment;
    // this is the specific call site that benefits from reusing a very-
    // recent GPS fix instead of always requesting a brand-new one.
    const pos=await getPositionSafe(15000);
    // Shared with the file-picker path since 2026-10-05 — see drawPhotoStamp().
    drawPhotoStamp(ctx, canvas.width, canvas.height, pos);
    await new Promise(function(resolveBlob){
      canvas.toBlob(function(blob){
        if(!blob){ resolveBlob(); return; }
        const file=new File([blob], currentPhotoField+"_"+Date.now()+".jpg", {type:"image/jpeg"});
        state.photos[currentPhotoField]=state.photos[currentPhotoField]||[];
        state.photos[currentPhotoField].push(file);
        closeCamera();
        renderPhotoGrid(currentPhotoField,currentPhotoMax);
        uploadPhotoNow(currentPhotoField,file,currentPhotoMax);
        resolveBlob();
      }, "image/jpeg", 0.85);
    });
  } finally {
    capturingPhoto=false;
    shutterBtn.disabled=false; shutterBtn.style.opacity="";
  }
}
$("cameraCancel").onclick=closeCamera;
$("cameraShutter").onclick=capturePhoto;

let currentTechRecord=null;
function lockAvailabilityToggle(){
  const el=$("availToggle"); if(!el) return;
  el.classList.add("locked");
  el.title="Availability unavailable — no matching "+CONFIG.techReport+" record found for your login.";
}
// Extracted 2026-08-24 (see onToggleClick()'s own retry call below) — same
// "boot-time match can go stale/never land, retry the real query once
// before giving up" fix already shipped for vendorTicket's own
// resolveVendorRecord() (2026-08-19) and updateMyInvite() (2026-08-21).
// User-reported live (technicianTicket, identical widget architecture —
// same fix applied here proactively): "online/offline toggle is not
// working" — the most likely explanation, given every other identity-
// resolution bug found this session, is that currentTechRecord simply
// never resolved at boot time, leaving onToggleClick()'s own
// `if(!currentTechRecord) return;` guard silently doing nothing at all —
// no error, no toast — which reads exactly like "not working." Bumped
// 200->1000 records too, same reasoning as vendorTicket's own
// resolveVendorRecord() fix (rules out Technicians_Report simply exceeding
// the old cap).
async function resolveTechRecord(logContext){
  if(!LOGIN_EMAIL) return currentTechRecord;
  const recs=await apiGetReport(CONFIG.techReport, null, 1000);
  const mine=recs.find(function(r){ return String(r[CONFIG.techEmailField]||"").trim().toLowerCase()===LOGIN_EMAIL.trim().toLowerCase(); });
  if(mine){
    currentTechRecord={ id:mine.ID, data:mine };
    MY_TECH_NAME=mine[CONFIG.techNameField]||"";
    MY_TECH_PHONE=mine[CONFIG.techPhoneField]||"";
    $("techName").textContent=MY_TECH_NAME||"Driver";
  } else {
    console.warn("[Get-Rescue] "+logContext+": no", CONFIG.techReport, "record's", CONFIG.techEmailField, "matched", LOGIN_EMAIL, "— toggle stays locked/inert. Records loaded:", recs.length, "| first record's own keys:", recs[0]);
  }
  return currentTechRecord;
}
async function loadAvailability(){
  if(!LOGIN_EMAIL){ console.warn("[Get-Rescue] loadAvailability: LOGIN_EMAIL is empty — getInitParams may have failed or returned no loginUser. Toggle stays locked."); lockAvailabilityToggle(); return; }
  // Real bug fixed (2026-08-05, user-reported: "online offline toggle is not
  // working"): fetched with a server-side exact-match criteria on
  // techEmailField — Zoho Creator criteria matches are case-sensitive, and a
  // login email differing only in case from the Technicians_Report record
  // would silently return zero records, leaving currentTechRecord null and
  // the toggle clickable-but-inert (onToggleClick's own guard). Also breaks
  // the ID-based loadMyInvites() matching above, since it needs
  // currentTechRecord to resolve at all. Now matches client-side,
  // case-insensitive + trimmed — see resolveTechRecord() above.
  await resolveTechRecord("loadAvailability");
  if(!currentTechRecord){ lockAvailabilityToggle(); return; }
  const mine=currentTechRecord.data;
  const isOnline=String(mine[CONFIG.techStatusField])==="Online";
  $("availToggle").classList.toggle("on", isOnline);
  // Reopening the app while already Online (2026-08-17) — start the
  // heartbeat here too, not just from onToggleClick()'s own toggle action,
  // so location stays fresh across a page refresh/reopen without the
  // driver having to toggle off and back on.
  if(isOnline) startLocationHeartbeat();
}
/* Live location heartbeat (2026-08-17, user request: "when vendor is online
   it is supposed to show the distance from the vendor's current location
   (latest location from app); ... this applies to Technicians/Drivers too,
   not just Vendors") — while toggled Online, refreshes this driver's own
   Current_Latitude/Current_Longitude every ~2.5 minutes (the midpoint of the
   user's own requested 2-3 min range), read by getRescueTicket's own
   Assignment-step vendor picker once Online — see vendorTicket's own/
   technicianTicket's own matching comment for the fuller cross-widget
   picture. An immediate fix is taken the moment they toggle online, rather
   than waiting for the first interval tick — see startLocationHeartbeat().
   Best-effort throughout: a denied/unavailable fix, or a failed write, just
   silently skips that one tick — never blocks the toggle itself or any
   other part of this app. */
const LOCATION_HEARTBEAT_MS=150000; // 2.5 min
let locationHeartbeatTimer=null;
/* announce=true only for the fix taken the moment they come on duty — a
   deliberate action they are waiting on. Interval ticks pass nothing and stay
   silent, so this never nags every 2.5 minutes. */
async function pingCurrentLocation(announce){
  if(!currentTechRecord) return false;
  const say=function(msg,kind){ if(announce && typeof toast==="function") toast(msg,kind); };
  try{
    const pos=await getPositionSafe();
    if(!pos){
      /* The portal-app case. A WebView gets location only if the host app has
         the OS permission and passes it through, so this can fail here while
         working perfectly in the phone browser. Said out loud because there is
         no console inside the app to find it in. */
      console.warn("[Get-Rescue] pingCurrentLocation: no position fix. In the Zoho Creator portal app this usually means the app itself lacks location permission — check the OS app settings, not just the browser prompt.");
      say("Location unavailable — you may not show correctly on the dispatch map. Check location permission for this app.","err");
      return false;
    }
    const fn=resolve("updateRecordById");
    if(!fn){ say("Couldn't save your location right now","err"); return false; }
    const payload={};
    payload[CONFIG.techCurrentLatField]=pos.lat;
    payload[CONFIG.techCurrentLonField]=pos.lon;
    /* Location_Last_Updated_At stamped here 2026-09-25 — the field was created in
       Zoho on 2026-08-17 but nothing had ever written to it, so the assignment
       popup and the Ops Map had no way to tell a fix from thirty seconds ago from
       one left over from yesterday. Written in the SAME update as the coordinates,
       so the timestamp can never disagree with the position it describes. */
    payload["Location_Last_Updated_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
    // Logged so a wrong-but-present fix (a VPN or a desktop IP lookup putting
    // someone in another country) is visible rather than guessed at.
    console.log("[Get-Rescue] location updated —", pos.lat, pos.lon);
    say("Location updated","ok");
    return true;
  }catch(e){
    console.warn("[Get-Rescue] pingCurrentLocation failed (non-fatal, retries next tick):", e);
    say("Couldn't save your location — check your connection","err");
    return false;
  }
}
function startLocationHeartbeat(){
  stopLocationHeartbeat(); // never let two timers stack
  pingCurrentLocation(true); // immediate fix now, and say how it went
  locationHeartbeatTimer=setInterval(function(){ pingCurrentLocation(false); }, LOCATION_HEARTBEAT_MS);
}
function stopLocationHeartbeat(){ if(locationHeartbeatTimer){ clearInterval(locationHeartbeatTimer); locationHeartbeatTimer=null; } }
async function onToggleClick(){
  if(!currentTechRecord){
    // Real bug fixed 2026-08-24 — see technicianTicket's own matching
    // comment (identical widget architecture, same fix applied here
    // proactively).
    console.warn("[Get-Rescue] onToggleClick: currentTechRecord was null at tap time; retrying the "+CONFIG.techReport+" match once before giving up.");
    await resolveTechRecord("onToggleClick retry");
  }
  if(!currentTechRecord){ toast("Availability unavailable — no matching driver record found for your login","err"); return; }
  const el=$("availToggle");
  const wantOnline=!el.classList.contains("on");
  el.classList.toggle("on", wantOnline);
  el.classList.add("locked");
  try{
    const fn=resolve("updateRecordById"); if(!fn) throw new Error("unavailable");
    const payload={}; payload[CONFIG.techStatusField]=wantOnline?"Online":"Offline";
    /* Last_Online_At stamped on going ONLINE only, 2026-09-25 — same story as
       Location_Last_Updated_At: created in Zoho 2026-08-17, never written. Not
       touched when going offline, because the field records when someone last came
       online, and overwriting it on sign-off would turn it into "last toggled"
       and lose that. */
    if(wantOnline) payload["Last_Online_At"]=fmtDateTime(new Date());
    await fn({ app_name:CONFIG.appName, report_name:CONFIG.techReport, id:currentTechRecord.id, payload:{data:payload} });
    toast(wantOnline?"You're online":"You're offline","ok");
    if(wantOnline) startLocationHeartbeat(); else stopLocationHeartbeat();
  }catch(e){ el.classList.toggle("on", !wantOnline); toast("Couldn't update availability","err"); }
  finally{ el.classList.remove("locked"); }
}
$("availToggle").onclick=onToggleClick;

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* The customer-facing ETA - 2026-10-08, see this change's own note, including
   the WhatsApp template dependency. Flip ETA_AS_CLOCK_TIME to false to go back
   to the hours-to-one-decimal the approved template text still expects. */
const ETA_AS_CLOCK_TIME = true;
const ETA_CUSTOMER_PAD_MINS = 10;   // spec 5.4, vendor-app cases only
function fmtClockTime24(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
/* This app only ever sends at the moment the VENDOR accepts in their own app,
   so acceptance time is now and the +10 always applies - the agent-on-behalf
   half of the rule lives in getRescueTicket, which is where that case runs. */
function customerEtaText(etaMins){
  const mins=Number(etaMins);
  if(!mins || isNaN(mins)) return "";
  if(!ETA_AS_CLOCK_TIME) return String(Math.round((mins/60)*10)/10);
  return fmtClockTime24(new Date(Date.now()+(mins+ETA_CUSTOMER_PAD_MINS)*60000));
}
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }

$("backBtn").onclick=backToDashboard;
async function boot(){
  try{
    const params=await ZOHO.CREATOR.UTIL.getInitParams();
    LOGIN_EMAIL=(params&&params.loginUser)||"";
    INIT_PARAMS=params; // zohoAppLinkName()'s own envUrlFragment lookup
  }catch(e){ console.warn("getInitParams failed", e); }
  await loadAvailability();
  await loadVehicleNames();
  await loadIssueNames();
  await loadDashboard();
  // Repair pass: only does anything when a vehicle this user can actually
  // see failed to resolve, and only re-renders when the retry genuinely helped.
  /* Anything left over from a previous session goes up now (2026-09-30). Not
     awaited: a queued photo must never delay the app opening, and flushPhotoQueue()
     re-renders its own badge when it finishes. */
  flushPhotoQueue();
  /* Retry the moment the device says it is back online. Cheap, and it is the
     difference between a photo landing when the technician walks out of a basement
     and it sitting there until they happen to reopen the app. */
  if(typeof window!=="undefined" && window.addEventListener){
    window.addEventListener("online", function(){
      console.log("[Get-Rescue] back online — retrying any queued photos.");
      flushPhotoQueue();
    });
  }
  try{ if(await ensureVehicleNamesForLoadedTickets()) await loadDashboard(); }
  catch(e){ console.warn("[GR] vehicle-name repair pass failed (non-blocking)", e); }
}
function waitForSDK(attempt){
  attempt=attempt||0;
  if(sdkReady()){ SDK_READY=true; boot(); return; }
  if(attempt>50){ console.error("ZOHO.CREATOR not ready — running with no live data"); loadDashboard(); return; }
  setTimeout(function(){ waitForSDK(attempt+1); }, 200);
}
waitForSDK();
</script>
