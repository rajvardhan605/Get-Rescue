<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get-Rescue · Kanban Board</title>
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --signal:#F15A22; --signal-bright:#FF7A2F; --signal-deep:#C2410C; --signal-soft:#FCE9DF;
  --ink:#15171C; --ink-2:#20232B; --paper:#FBFAF7; --card:#FFFFFF; --worktop:#EDEAE3;
  --line:#E6E2DA; --line-strong:#C7C1B4; --muted:#6C665B; --muted-2:#8C8578; --text:#20222A;
  --ok:#12A150; --ok-soft:#E3F4EA; --stop:#E23A2E; --stop-soft:#FBE4E2;
  --info:#2C7BE5; --info-soft:#E4EEFB; --wait:#E8890B; --wait-soft:#FCEEDA; --purple:#7A5AF8; --purple-soft:#ECE7FE;
  --f-disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --sh-1:0 1px 2px rgba(20,22,28,.05),0 3px 12px rgba(20,22,28,.06); --sh-2:0 12px 30px rgba(20,22,28,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
img,svg{max-width:100%}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);
  border-radius:16px;padding:14px 18px;box-shadow:var(--sh-1);position:sticky;top:8px;z-index:30}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .mk{width:38px;height:38px;border-radius:10px;background:var(--signal);display:grid;place-items:center;box-shadow:0 4px 12px rgba(241,90,34,.45)}
.brand .mk svg{width:22px;height:22px}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:19px;color:#fff;letter-spacing:.3px;line-height:1}
.search{position:relative;flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid transparent;border-radius:11px;padding:0 12px;transition:.15s}
.search:focus-within{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.25)}
.search svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);padding:12px 0;font-family:var(--f-body)}
.search .x{border:0;background:transparent;color:var(--muted-2);cursor:pointer;padding:6px;display:none;line-height:0;border-radius:7px}
.search .x svg{width:15px;height:15px}
.search-ic{border:0;background:transparent;padding:0;margin:0;line-height:0;color:var(--muted-2);cursor:pointer;flex:none;border-radius:7px}
.search-ic:hover{color:var(--signal)}
.search-dropdown{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-2);z-index:45;max-height:min(360px,70vh);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.search-dropdown.on{display:block}
.search-dropdown .rrow{border-top:1px solid var(--line)}
.search-dropdown .rrow:first-child{border-top:0}
.search-dropdown .sd-msg{padding:18px;text-align:center;color:var(--muted-2);font-size:13px;font-family:var(--f-mono)}
.btn{border:0;cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:14.5px;letter-spacing:.02em;
  padding:12px 18px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--signal);color:#fff;box-shadow:0 4px 12px rgba(241,90,34,.34)}
.btn.primary:hover{background:var(--signal-deep)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line-strong)}
.btn.ghost:hover{background:var(--worktop)}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid var(--stop)}
.btn.danger:hover{background:var(--stop-soft)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(18,161,80,.3)}
.btn.ok:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13px}

/* ---------- section headings ---------- */
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.sec-head h2{font-family:var(--f-disp);font-size:20px;font-weight:800}
.sec-head .sub{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-head .spacer{flex:1}

/* ---------- kanban board ---------- */
.board-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.kanban-board{display:flex;gap:16px;align-items:flex-start}
.kcol{flex:0 0 270px;width:270px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:220px}
.kcol-head{display:flex;align-items:center;gap:11px;padding:14px 16px;position:relative;flex:none;
  background:linear-gradient(180deg,#fff,var(--worktop) 260%);border-radius:18px 18px 0 0}
.kcol-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--signal));border-radius:18px 0 0 18px}
.kcol-head .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--accent,var(--signal));box-shadow:0 4px 12px rgba(20,22,28,.28)}
.kcol-head .ic svg{width:17px;height:17px}
.kcol-head .tt{min-width:0;flex:1}
.kcol-head .tt b{font-family:var(--f-disp);font-size:14.5px;font-weight:800;display:block;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcol-head .tt span{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.kcol-head .cnt{flex:none;font-family:var(--f-disp);font-size:15px;font-weight:900;color:var(--text);
  background:#fff;border:1.5px solid var(--line);min-width:30px;text-align:center;padding:3px 8px;border-radius:10px}
.kcol-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.kcol-empty{color:var(--muted-2);font-size:12.5px;text-align:center;padding:26px 8px;font-family:var(--f-mono)}

.kcard{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:.12s;box-shadow:var(--sh-1)}
.kcard:hover{border-color:var(--line-strong);box-shadow:var(--sh-2);transform:translateY(-1px)}
.kcard .kc-top{display:flex;align-items:center;gap:8px}
.kcard .avatar{width:32px;height:32px;border-radius:9px;background:var(--worktop);display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:12px;color:var(--muted);flex:none;border:1px solid var(--line)}
.kcard .kc-id{flex:1;min-width:0;font-family:var(--f-mono);font-size:10.5px;color:var(--muted-2);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .chev{color:var(--line-strong);flex:none}
.kcard .nm{font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .svc{display:inline-flex;font-family:var(--f-mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;flex:none;margin-right:6px}
.svc.rsr{background:var(--signal-soft);color:var(--signal-deep)} .svc.tow{background:var(--info-soft);color:var(--info)}
.kcard .flags{display:flex;gap:6px;flex-wrap:wrap}
.kcard .flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;padding:3px 8px 3px 5px;border-radius:999px;background:var(--worktop);color:var(--muted-2)}
.kcard .flag svg{width:11px;height:11px;flex:none}
.kcard .flag.on{background:var(--ok-soft);color:var(--ok)}
.kcard .kc-pill{align-self:flex-start;font-family:var(--f-mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:4px 9px;border-radius:999px}

/* pill status colours (shared by kanban cards + search dropdown rows) */
.pill.b-new{background:var(--info-soft);color:var(--info)}
.pill.b-asg{background:var(--wait-soft);color:var(--wait)}
.pill.b-wip{background:var(--signal-soft);color:var(--signal-deep)}
.pill.b-pay{background:var(--ok-soft);color:var(--ok)}
.pill.b-closed{background:var(--worktop);color:var(--muted)}

/* ---------- search dropdown rows (shared row-style renderer) ---------- */
.results{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
.results .rrow:first-child{border-top:0}
.rrow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);cursor:pointer;
  transition:background .12s;text-align:left;font:inherit;color:inherit;width:100%;background:#fff}
.rrow:hover{background:var(--worktop)}
.rrow .avatar{width:38px;height:38px;border-radius:11px;background:var(--worktop);display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:13.5px;color:var(--muted);flex:none;border:1px solid var(--line)}
.rrow .main{flex:1;min-width:0}
.rrow .top-line{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.rrow .cid{font-family:var(--f-mono);font-size:11px;color:var(--muted-2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .nm{font-weight:700;font-size:14.5px;color:var(--text);flex:1;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .svc{display:inline-flex;font-family:var(--f-mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;flex:none}
.rrow .pill{flex:none;max-width:140px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;white-space:normal;text-align:center;line-height:1.3}
.rrow .chev{color:var(--line-strong);flex:none}
.rrow .flags{display:flex;gap:6px;margin-top:5px}
.rrow .flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;padding:3px 8px 3px 5px;border-radius:999px;background:var(--worktop);color:var(--muted-2)}
.rrow .flag svg{width:12px;height:12px;flex:none}
.rrow .flag.on{background:var(--ok-soft);color:var(--ok)}

/* ---------- wizard ---------- */
.wizard{display:none}
.wizard.on{display:block}
.dashboard.off{display:none}
.wiz-top{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);padding:16px 18px;margin-bottom:16px}
.wiz-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wiz-title h2{font-family:var(--f-disp);font-size:24px;font-weight:900;line-height:1}
.wiz-title .cid{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--worktop);padding:5px 10px;border-radius:999px}
.wiz-title .close-x{margin-left:auto;border:0;background:var(--worktop);width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.wiz-title .close-x:hover{background:var(--line);color:var(--text)}
.wiz-title .close-x svg{width:18px;height:18px}

/* progress stepper */
.progress{margin-top:16px}
.pbar{height:7px;border-radius:999px;background:var(--worktop);overflow:hidden;margin-bottom:14px}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--signal-bright));border-radius:999px;transition:width .35s ease}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line);
  background:#fff;cursor:pointer;transition:.15s;white-space:nowrap}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--worktop);color:var(--muted);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:600;flex:none}
.step .lb{font-family:var(--f-disp);font-weight:700;font-size:12.5px;color:var(--muted)}
.step.done .n{background:var(--ok);color:#fff}
.step.done .lb{color:var(--text)}
.step.active{border-color:var(--signal);background:var(--signal-soft)}
.step.active .n{background:var(--signal);color:#fff}
.step.active .lb{color:var(--signal-deep)}
.step.locked{cursor:not-allowed;opacity:.5}
.step.locked .n{color:var(--muted-2)}

/* form */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);padding:22px;margin-bottom:100px}
.form-card h3{font-family:var(--f-disp);font-size:19px;margin-bottom:4px}
.form-card .fdesc{font-size:13px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1 / -1}
.fld label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld label .req{color:var(--stop);margin-left:2px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14.5px;
  font-family:var(--f-body);color:var(--text);background:#fff;outline:0;transition:.15s;width:100%}
.fld textarea{resize:vertical;min-height:74px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.fld input[type=file]{padding:9px;background:var(--worktop);border-style:dashed;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.radio-set{display:flex;flex-wrap:wrap;gap:8px}
.radio-set .opt{border:1.5px solid var(--line-strong);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;
  color:var(--muted);cursor:pointer;background:#fff;transition:.12s;user-select:none}
.radio-set .opt.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-deep)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--signal)}
.check span{font-size:14px;color:var(--text)}
.hint{font-size:11px;color:var(--muted-2);font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
/* Chips + the "add" select live inside one bordered box together (2026-08-04)
   — see getRescueTicket's own matching comment, not repeated here. */
.combo-multi{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:#fff;transition:.12s}
.combo-multi:focus-within{border-color:var(--signal);box-shadow:0 0 0 3px rgba(241,90,34,.18)}
.combo-multi .chips{margin-bottom:0}
.combo-multi-input{border:0;outline:0;flex:1;min-width:120px;font-size:14.5px;padding:6px 2px;background:transparent}
.combo-multi select.add-select{border:0;background:transparent;flex:1;min-width:140px;padding:6px 2px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--signal-soft);color:var(--signal-deep);
  border-radius:999px;padding:7px 8px 7px 13px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;font-size:11px;line-height:1;padding:0;flex:none}
.chip button:hover{background:rgba(0,0,0,.18)}
.chip-empty{font-size:12.5px;color:var(--muted-2);font-family:var(--f-mono)}
.add-select{border:1.5px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:13.5px;
  color:var(--muted);background:#fff;width:100%}

/* summary (final) */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.summary .srow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.summary .srow .k{color:var(--muted);font-weight:600}
.summary .srow .v{text-align:right;font-weight:500}

/* button bar (sticky) */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:40;box-shadow:0 -6px 20px rgba(20,22,28,.06)}
.bar .inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
.bar .spacer{flex:1}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:60;
  transition:.25s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--stop)} .toast.ok{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(20,22,28,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:var(--sh-2);text-align:center}
.modal .box h4{font-family:var(--f-disp);font-size:21px;margin-bottom:8px}
.modal .box p{color:var(--muted);font-size:14px;margin-bottom:20px}
.modal .box .row{display:flex;gap:10px}
.modal .box .row .btn{flex:1;justify-content:center}

/* loader / states */
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--signal-soft);border-top-color:var(--signal);animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-state{text-align:center;padding:50px 16px;color:var(--muted)}
.center-state h3{font-family:var(--f-disp);font-size:18px;color:var(--text);margin:14px 0 6px}
.center-state p{font-size:14px}
.demo-note{margin:10px 2px 0;font-family:var(--f-mono);font-size:11px;color:var(--wait);background:var(--wait-soft);border-radius:9px;padding:9px 12px;display:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- tablets / small laptops: tighten outer spacing only, 2-col form grid still fits ---- */
@media(max-width:900px){
  .wrap{padding:14px}
  .form-card{padding:18px}
}

/* ---- phones (portrait) ---- */
@media(max-width:680px){
  .wrap{padding:12px}
  .topbar{position:static}
  .search{order:3;flex-basis:100%;min-width:0}
  .grid,.summary{grid-template-columns:1fr}
  .bar{padding:10px 12px}
  .bar .inner{flex-wrap:wrap}
  .bar .btn{flex:1 1 auto;justify-content:center}
  .form-card{margin-bottom:150px;padding:18px}
  .rrow .meta{white-space:normal}
  .kcol{flex:0 0 82vw;width:82vw;max-height:calc(100vh - 260px)}
  .kcol-head{padding:12px 14px}
  .sec-head{flex-wrap:wrap}
  .wiz-title h2{font-size:20px}
}

/* ---- small phones ---- */
@media(max-width:420px){
  .wrap{padding:10px}
  .brand b{font-size:16px}
  .brand .mk{width:32px;height:32px}
  .brand .mk svg{width:18px;height:18px}
  .btn{padding:10px 14px;font-size:13.5px}
  .kcol{flex:0 0 86vw;width:86vw}
  .kcol-head{padding:11px 12px;gap:9px}
  .kcol-head .ic{width:30px;height:30px}
  .kcol-head .ic svg{width:15px;height:15px}
  .kcol-head .tt b{font-size:13.5px}

<script>
/* =====================================================================
   GET-RESCUE · KANBAN BOARD
   Read-only board over the same Create_Case data the ticket-flow widget
   writes to. One column per Status picklist value (all 20, in field order —
   see BUCKETS below); clicking a card opens the exact same multi-step edit
   wizard as the ticket page — there is no "create" entry point here,
   tickets are created elsewhere.
   Adjust CONFIG + the SCHEMA field link names to match your app.
   ===================================================================== */
const CONFIG = {
  appName:      "get-rescue",
  formName:     "Create_Case",          // add records here (only used if a ticket is somehow opened before it has an ID)
  reportName:   "Agent_Ticket_Report",  // read / update / search here — user-confirmed 2026-07-28 (was Create_Case_Report)
  phoneField:   "Phone_Number",         // primary global search field — real Create_Case field name (confirmed live); the form shows "Phone_Number1" but mirrors into this one via the create stage's extra() hook, and that's the field Agent_Ticket_Report actually searches on
  searchTextFields: ["Case_ID","Vehicle_Registration_Number","Client_Tracking_Id"], // additional fields the topbar search box also matches against (OR'd with phoneField)
  stageField:   "Status",               // text field on Create_Case that holds the current stage
  caseIdField:  "Case_ID",
  serviceTypeField: "Service_Type",      // "RSR" | "TOW" drives the branch
  nameField:    "Customer_Name",         // composite name field
  vehicleField: "Vehicle",              // Create_Case's own lookup field — confirmed via a live record, NOT "vehicle_master"
  vehicleCategoryField: "Category",     // 2W/4W single-select field on Vehicle_Master_Report, matched against Vehicle_Issue_Report's own VEHICLE_TYPE below
  // See getRescueTicket's own matching comment (2026-08-04, user-confirmed
  // real Zoho Studio schema) — not repeated here.
  issueVehicleTypeField: "VEHICLE_TYPE",
  issueDisplayStatusField: "DISPLAY_STATUS",
  rateMasterReport: "Rate_Master_Report", // best-guess report name for the Rate_Master form (pattern-matched — not yet confirmed live)
  // option sources (best-effort; degrade to text/empty if unavailable) — report names are the MASTER tables we pull picker options from, unrelated to the Create_Case field names above
  optionReports: {
    vehicles:    { report:"Vehicle_Master_Report", label:["Name"], max:1000 },
    issues:      { report:"Vehicle_Issue_Report",  label:["Issue_Name","Name"] },
    vendors:     { report:"Vendors_Report",        label:["Vendor_Name","Name"] },
    technicians: { report:"Technicians_Report",    label:["Technician_Name","Name"], emailField:"Email" },
    clients:     { report:"Client_Report",         label:["Client_Name","Name"] }
  },
  fetchLatest: 1000   // how many recent tickets to pull for the board — Creator only accepts 200, 500 or 1000; maxed out so "show all" isn't capped by an earlier fetch limit
};

/* ---------- SDK boot (this SDK has no ZOHO.CREATOR.init) ---------- */
function sdkReady(){ return window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && typeof ZOHO.CREATOR.UTIL.getInitParams === "function"; }
function resolve(method){
  const C = window.ZOHO && ZOHO.CREATOR; if(!C) return null;
  const spaces = [C.DATA, C.PUBLISH, C.META, C.UTIL, C.FILE];
  for (let i=0;i<spaces.length;i++){ const ns=spaces[i]; if(ns && typeof ns[method]==="function") return ns[method].bind(ns); }
  return null;
}

/* ---------- Creator data layer ---------- */
async function apiGet(criteria){
  const fn = resolve("getRecords"); if(!fn) throw new Error("getRecords unavailable");
  const cfg = { app_name:CONFIG.appName, report_name:CONFIG.reportName, field_config:"all", max_records:CONFIG.fetchLatest };
  if(criteria) cfg.criteria = criteria;
  console.log("[Get-Rescue] apiGet -> report:", cfg.report_name, "| criteria:", cfg.criteria||"(none)", "| full request:", cfg);
  try{
    const r = await fn(cfg);
    console.log("[Get-Rescue] apiGet <- code:", r&&r.code, "| records:", r&&r.data&&r.data.length, "| raw response:", r);
    return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : [];
  }
  catch(e){ const c=e&&e.code; console.warn("[Get-Rescue] apiGet threw:", e); if(c===3100||c==="3100") return []; return []; }
}
async function apiGetReport(report, criteria, max){
  const fn = resolve("getRecords"); if(!fn) return [];
  const cfg = { app_name:CONFIG.appName, report_name:report, field_config:"all", max_records:max||200 };
  if(criteria) cfg.criteria = criteria;
  try{ const r = await fn(cfg); return (r && r.code===3000 && Array.isArray(r.data)) ? r.data : []; } catch(e){ return []; }
}
async function apiAdd(data){
  const fn = resolve("addRecords") || resolve("addRecord"); if(!fn) throw new Error("addRecords unavailable");
  const r = await fn({ app_name:CONFIG.appName, form_name:CONFIG.formName, payload:{ data:data } });
  if(r && r.code===3000){ const d=r.data; return Array.isArray(d) ? (d[0]&&(d[0].ID||d[0].id)) : (d&&(d.ID||d.id)); }
  throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Add failed");
}
async function apiUpdate(id, data){
  const fn = resolve("updateRecordById") || resolve("updateRecord"); if(!fn) throw new Error("updateRecordById unavailable");
  const r = await fn({ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, payload:{ data:data } });
  if(!r || r.code!==3000) throw new Error((r&&(r.message||JSON.stringify(r.error)))||"Update failed");
  return true;
}
/* best-effort file upload — signatures vary by SDK build; never blocks a save */
async function apiUpload(id, fieldName, file){
  const fn = resolve("uploadFile"); if(!fn || !file) return false;
  try{ await fn({ app_name:CONFIG.appName, report_name:CONFIG.reportName, id:id, field_name:fieldName, file:file }); return true; }
  catch(e){ console.warn("uploadFile failed for "+fieldName, e); return false; }
}

/* ---------- reusable option lists ---------- */
const REJECT_REASONS = ["Too Far / Outside Service Area","Already Engaged With Another Job","Vehicle/Equipment Not Suitable","Not Available (Off Duty)","Other"];
/* Half-hour slots covering the full 24-hour day (2026-08-04, same fix as
   getRescueTicket — was wrongly limited to 9:00 AM-5:00 PM). */
const SERVICE_TIMES = (function(){
  function fmt(mins){ mins=((mins%1440)+1440)%1440; const h=Math.floor(mins/60), m=mins%60; const am=h<12; const hh=(h%12)||12; return hh+":"+(m<10?"0"+m:m)+" "+(am?"AM":"PM"); }
  const out=[];
  for(let mins=0; mins<24*60; mins+=30){ out.push(fmt(mins)+" - "+fmt(mins+30)); }
  return out;
})();

/* dynamic options filled at boot from reports (best-effort) */
const OPTIONS = { vehicles:[], issues:[], vendors:[], technicians:[], clients:[] };

/* Quote & Booking Fee's Status is fully derived from what's actually been done
   on it — no manual override. No payment/location integration exists yet, so
   "sent"/"PAID" are both set by the agent by hand, not by any webhook. Exact
   flow as specified by the user (2026-07-28):
     Booking_Fee not > 0 (nothing to collect):
       Request Location clicked -> LOCATION PENDING (can advance)
       not clicked (Cancel, or Save without clicking) -> LOCATION REQUEST (blocked)
     Booking_Fee > 0:
       Payment_Status === "PAID" -> LOCATION PENDING (can advance)
       else Send_Payment_Link clicked -> BOOKING FEE PENDING (blocked)
       else -> SERVICE FEE QUOTE, unchanged (blocked) */
function quoteStatus(r){
  const feeZero = !(Number(r.Booking_Fee)>0);
  if(feeZero) return r.Send_Link_For_The_Breakdown_Location ? "LOCATION PENDING" : "LOCATION REQUEST";
  if(r.Payment_Status==="PAID") return "LOCATION PENDING";
  if(r.Send_Payment_Link) return "BOOKING FEE PENDING";
  return "SERVICE FEE QUOTE";
}

/* =====================================================================
   STAGE SCHEMA  —  each field's "n" is the Create_Case field link name.
   branch: all | rsr | tow | pay | final   (path = all + rsr|tow + pay + final)
   bucket: dashboard column index (0..3)
   ===================================================================== */
const STAGES = [
  /* ---- COMMON ---- */
  { key:"create", branch:"all", bucket:0, short:"Create", title:"Create Service Ticket",
    desc:"Basic customer, vehicle and issue details.", save:"Save & Continue",
    statuses:["NEW"], status:"NEW",
    /* Create_Case has a required "Phone_Number" field separate from the one
       shown in this form ("Phone_Number1"). Mirror the value the agent types
       rather than showing a duplicate box. Confirmed via a live "Enter a value
       for Phone Number" error on save. "Client" used to need the same
       treatment but is now its own real Lookup field below (see Client).
       Computed_Service_Time: NOW -> +30 min from save time; LATER -> the picked
       Schedule_Date + Service_Time slot's start (see computeServiceTime()). */
    extra:(r)=>({ Phone_Number:r.Phone_Number1||"", Computed_Service_Time:computeServiceTime(r) }),
    fields:[
    { n:"Lead_Source", l:"Lead Source", t:"select", o:["Call","Website","WhatsApp","App"], default:"Call", disabled:true },
    { n:"Customer_Name", l:"Customer Name", t:"name2", req:true },
    { n:"Phone_Number1", l:"Phone Number", t:"tel", req:true },
    { n:"Email", l:"Email", t:"email" },
    { n:"Client", l:"Client", t:"select", o:"@clients", req:true, useId:true },
    { n:"Client_Tracking_Id", l:"Client Tracking ID", t:"text" },
    { n:"Vehicle", l:"Vehicle", t:"select", o:"@vehicles", req:true, useId:true },
    { n:"Vehicle_Registration_Number", l:"Vehicle Reg. Number", t:"text" },
    // useId:true added 2026-08-04 — see getRescueTicket's own matching
    // comment: Vehicle_Issue is a real multiselect Lookup, not plain text.
    { n:"Vehicle_Issue", l:"Vehicle Issue", t:"multiselect", o:"@vehicleIssues", full:true, req:true, needsVehicle:true, useId:true },
    { n:"Service_Type", l:"Service Type", t:"badge", full:true },
    { n:"Vehicle_Status", l:"Vehicle Status", t:"select", o:["ONROAD","SAFE PARKING"] },
    { n:"Time_of_service", l:"Time of Service", t:"radio", o:["NOW","LATER"] },
    { n:"Schedule_Date", l:"Schedule Date", t:"date", when:(s)=>s.Time_of_service==="LATER" },
    { n:"Service_Time", l:"Service Time", t:"select", o:SERVICE_TIMES, when:(s)=>s.Time_of_service==="LATER" }
  ]},
  /* Quote + Booking Fee merged into one step (was two) — matches the native
     form, which shows them as a single section ("Service_Fee_Quote_Booking_fee_Collection"
     in its own Deluge). step.key stays "quote" so the renderWizard() calcQuote()
     hook (keyed on that string) keeps working unchanged. */
  { key:"quote", branch:"all", bucket:0, short:"Quote", title:"Service Fee Quote & Booking Fee",
    desc:"Distance, rate breakup, the fee to quote, and the upfront booking fee.", save:"Save & Continue",
    statuses:["SERVICE FEE QUOTE","LOCATION REQUEST","BOOKING FEE PENDING"], status:quoteStatus,
    // can't advance to Capture Locations until the required action for this
    // ticket's fee situation has actually been done (see quoteStatus above)
    // not a hard block anymore — Save & Continue always saves. If the required
    // action (location requested / payment confirmed) isn't done yet, saving
    // just closes the wizard back to the board instead of advancing; the
    // ticket shows up under its current status and reopens on this same step
    // to pick up where it left off (see stageIndexForStatus). Once Payment_Status
    // is PAID (quoteStatus -> "LOCATION PENDING"), Save & Continue advances normally.
    canAdvance:(r)=>quoteStatus(r)==="LOCATION PENDING",
    blockedMessage:"Saved. This ticket will wait here until the location is requested (or the payment is confirmed) — reopen it from the board to continue.",
    fields:[
    { n:"Distance_For_Quote_RT_KM", l:"Distance for Quote (RT KM)", t:"number", recompute:true, when:(s)=>s.Service_Type==="TOW" },
    { n:"Suggested_Rate", l:"Suggested Rate", t:"number" },
    { n:"Total_Service_Fee", l:"Total Service Fee", t:"number", recompute:true },
    { n:"Booking_Fee", l:"Booking Fee", t:"number", recompute:true },
    { n:"Remaining_Fee", l:"Remaining Fee", t:"decimal", readonly:true },
    { n:"Rate_Breakup", l:"Rate Breakup", t:"textarea", full:true },
    /* Exactly one button here, never two. Booking_Fee>0 -> a single button
       that sends the payment link AND requests the location together in one
       click (its action hook flips Send_Link_For_The_Breakdown_Location too)
       — once a real payment gateway is wired up, that integration is expected
       to trigger the location request itself, so this bundles the same
       behavior by hand for now. Fee not >0 -> just the location request. */
    { n:"Send_Payment_Link", l:"Send Payment Link", t:"button", full:true, when:(s)=>Number(s.Booking_Fee)>0,
      buttonLabel:"Send Payment Link & Request Location", doneLabel:"Payment Link & Location Sent",
      action:(r)=>{ r.Send_Link_For_The_Breakdown_Location=true; } },
    { n:"Send_Link_For_The_Breakdown_Location", l:"Request Location", t:"button", full:true, when:(s)=>!(Number(s.Booking_Fee)>0),
      buttonLabel:"Request Location", doneLabel:"Location Requested" },
    { n:"Payment_Method", l:"Payment Method", t:"select", o:["Cash","UPI","Card","Net Banking"] },
    { n:"Payment_Status", l:"Payment Status", t:"select", o:["PAID","PENDING","NOT APPLICABLE"] },
    { n:"Image_Upload", l:"Receipt Photo", t:"file" },
    { n:"Remarks", l:"Remarks", t:"textarea", full:true }
  ]},
  { key:"locations", branch:"all", bucket:0, short:"Location", title:"Capture Locations",
    desc:"Breakdown location (and drop location for tows).", save:"Save Locations",
    // "LOCATION PENDING" (set by the quote stage once fee/location has been
    // requested) resumes here — this is the next real step for that ticket,
    // not back at the quote page. Saving this step still writes "READY" as before.
    statuses:["READY","LOCATION PENDING"], status:"READY",
    fields:[
    { n:"Send_Link_For_The_Breakdown_Location", l:"Send Breakdown Location Link", t:"button", full:true,
      buttonLabel:"Send Breakdown Location Link to Customer", doneLabel:"Location Link Sent" },
    { n:"LatLongPaste", l:"Paste Breakdown Lat,Long", t:"text", full:true, hint:"e.g. 28.6139, 77.2090", parseTarget:["Latitude","Longitude"] },
    { n:"Latitude", l:"Breakdown Latitude", t:"decimal" },
    { n:"Longitude", l:"Breakdown Longitude", t:"decimal" },
    { n:"Send_Link_For_The_Drop_Location", l:"Send drop-location link", t:"check", full:true, when:(s)=>s.Service_Type==="TOW" },
    { n:"DropLatLongPaste", l:"Paste Drop Lat,Long", t:"text", full:true, when:(s)=>s.Service_Type==="TOW", parseTarget:["DropLocationLat","DropLocationLong"] },
    { n:"DropLocationLat", l:"Drop Latitude", t:"decimal", when:(s)=>s.Service_Type==="TOW" },
    { n:"DropLocationLong", l:"Drop Longitude", t:"decimal", when:(s)=>s.Service_Type==="TOW" },
    /* Round-trip distance calc is TOW-only (RSR's distances live on the wip
       stage's own fields instead). Clicking recalculates from the static
       office location -> breakdown -> drop -> office each time; repeatable
       since coordinates might get corrected after a first calculation. */
    { n:"Calculate_Distance", l:"Calculate Round-Trip Distance", t:"button", full:true, repeatable:true, when:(s)=>s.Service_Type==="TOW",
      buttonLabel:"Calculate Round-Trip Distance", action:(r)=>{ r.RT_KM=calcRoundTripKm(r); } },
    { n:"RT_KM", l:"Round-Trip KM", t:"number", when:(s)=>s.Service_Type==="TOW" }
  ]},
  { key:"assignment", branch:"all", bucket:1, short:"Assign", title:"Vendor Assignment",
    desc:"Assign to vendor(s) and (optionally) a technician.", save:"Assign & Continue",
    statuses:["RSP IRA (INVITE RESPONSE AWAITED)"], status:"RSP IRA (INVITE RESPONSE AWAITED)",
    fields:[
    { n:"Preferred_Vendor", l:"Preferred Vendor?", t:"radio", o:["Yes","No"] },
    // Real Zoho field API name is "Vendors1" (confirmed 2026-07-31 by the user).
    { n:"Vendors1", l:"Vendors", t:"multiselect", o:"@vendors", full:true, useId:true }, // real Lookup, confirmed 2026-07-31
    { n:"Vendor_Email", l:"Vendor Email", t:"text" },
    // "Assignment_Sent" dropped from the schema 2026-08-03 (forms rebuilt
    // from scratch) — nothing ever wrote it, same fix already made in
    // getRescueTicket a while back that this widget hadn't picked up yet.
    { n:"Assigned_Technician", l:"Assigned Technician", t:"select", o:"@technicians" },
    { n:"Assigned_Technician_Email", l:"Technician Email", t:"text" }
  ]},

  /* ---- RSR branch (reordered: accept -> reach -> WIP, was accept -> WIP -> reach) ---- */
  { key:"acceptance", branch:"rsr", bucket:1, short:"Accept", title:"Service Acceptance",
    desc:"Vendor/technician response to the assignment.", save:"Save Acceptance",
    statuses:["RSP ON THE WAY","RSP REJECT"],
    // 2026-08-03: "Service_Request"/"Assign_Technican" dropped from the
    // schema — neither was ever written by any field widget (they write
    // Status directly). Same fix getRescueTicket already made; this widget
    // hadn't picked it up yet.
    status:(r)=> r.Status==="RSP REJECT" ? "RSP REJECT" : "RSP ON THE WAY",
    fields:[
    { n:"Reject_Reason", l:"Reject Reason", t:"select", o:REJECT_REASONS, when:(s)=>!!s.Reject_Reason, full:true },
    { n:"Vendor_Email1", l:"Vendor Email", t:"text" },
    { n:"Technician_Email", l:"Technician Email", t:"text" }
  ]},
  { key:"reach", branch:"rsr", bucket:2, short:"Reach", title:"Reach Breakdown Location",
    desc:"Arrival, ETA and navigation.", save:"Save",
    statuses:["RSP ON THE WAY","RSP CANCELLED"],
    // 2026-08-03: "Action_field" dropped — same fix as `acceptance` above.
    status:(r)=> r.Status==="RSP CANCELLED" ? "RSP CANCELLED" : "RSP ON THE WAY",
    fields:[
    { n:"ETA", l:"ETA (mins)", t:"number" },
    { n:"Distance_To_Breakdown", l:"Distance to Breakdown (km)", t:"number" },
    { n:"Navigation_Link", l:"Navigation Link", t:"textarea", full:true },
    { n:"Image_Upload2", l:"Arrival Photo", t:"file" },
    { n:"Cancel_Reason", l:"Cancel Reason", t:"select", o:REJECT_REASONS, when:(s)=>!!s.Cancel_Reason, full:true }
  ]},
  { key:"wip", branch:"rsr", bucket:2, short:"WIP", title:"Work In Progress",
    desc:"On-site repair — photos, expense and resolution.", save:"Save Progress",
    statuses:["WORK IN PROGRESS"], status:"WORK IN PROGRESS",
    fields:[
    { n:"Issue_Resolved", l:"Issue Resolved?", t:"radio", o:["Yes","No"] },
    { n:"Image_Upload3", l:"Pre-service Photo", t:"file" },
    { n:"Image_Upload4", l:"Post-service Photo", t:"file" },
    { n:"Expense_Amount", l:"Expense Amount", t:"number" },
    { n:"Expense_Photo", l:"Expense Photo", t:"file" },
    { n:"Office_To_Mechanic", l:"Office → Mechanic (km)", t:"number" },
    { n:"Mechanic_To_Breakdown", l:"Mechanic → Breakdown (km)", t:"number" },
    { n:"Breakdown_To_Office", l:"Breakdown → Office (km)", t:"number" },
    { n:"Roundtrip_Distance", l:"Round-Trip Distance (km)", t:"number" }
  ]},

  /* ---- TOW branch (reordered: accept -> reach -> load -> reached drop -> unload,
     was accept -> reach -> reached drop -> load -> unload) ---- */
  { key:"acceptanceTow", branch:"tow", bucket:1, short:"Accept", title:"Service Acceptance (Tow)",
    desc:"Driver response to the tow assignment.", save:"Save Acceptance",
    statuses:["RSP ON THE WAY","RSP REJECT"],
    // 2026-08-03: "Service_Request1"/"Assign_Technican1" dropped — same fix
    // as `acceptance` (its RSR sibling) above.
    status:(r)=> r.Status==="RSP REJECT" ? "RSP REJECT" : "RSP ON THE WAY",
    fields:[
    { n:"Reject_Reason1", l:"Reject Reason", t:"select", o:REJECT_REASONS, when:(s)=>!!s.Reject_Reason1, full:true },
    { n:"Image_Upload1", l:"Photo", t:"file" },
    { n:"Vendor_Email2", l:"Vendor Email", t:"text" },
    { n:"Technician_Email1", l:"Driver Email", t:"text" }
  ]},
  { key:"reachTow", branch:"tow", bucket:2, short:"Reach", title:"Reach Breakdown (Tow)",
    desc:"Arrival, odometer and toll.", save:"Save",
    statuses:["RSP ON THE WAY"], status:"RSP ON THE WAY",
    fields:[
    { n:"Odometer_reading_at_Reached_Location", l:"Odometer at Reached", t:"number" },
    { n:"Toll_Charges", l:"Toll Charges?", t:"radio", o:["Yes","No"] },
    { n:"Navigate_To_Breakdown_Link", l:"Navigate to Breakdown Link", t:"textarea", full:true },
    { n:"Image_Upload5", l:"Arrival Photo", t:"file" },
    { n:"Reject_Reason2", l:"Reject Reason", t:"select", o:REJECT_REASONS, full:true }

/* build the active stage path from Service_Type */
function buildPath(serviceType){
  const all   = STAGES.filter(s=>s.branch==="all");
  const branch= STAGES.filter(s=>s.branch===(serviceType==="TOW"?"tow":"rsr"));
  const pay   = STAGES.filter(s=>s.branch==="pay");
  const fin   = STAGES.filter(s=>s.branch==="final");
  return all.concat(branch, pay, fin);
}
/* Create_Case.Status is a real fixed picklist (confirmed 2026-07-28) — every
   save must write one of these exact values, never the human-readable stage
   title. computeStatus() resolves a stage's static status or (for stages that
   branch on Accept/Reject/Cancel) calls its status(record) function. */
function computeStatus(step, record){
  return typeof step.status==="function" ? step.status(record) : step.status;
}

function bucketOfStatus(status){
  if(!status) return -1;
  const key = String(status).trim().toUpperCase();
  return BUCKETS.findIndex(b=>b.status===key);
}
/* find where in a resolved RSR/TOW path a given saved Status value belongs —
   some statuses (e.g. "RSP ON THE WAY") are valid for more than one stage, so
   this is a best fit, not a guarantee; the stepper lets the agent jump anyway. */
function stageIndexForStatus(path, status){
  if(!status) return 0;
  const key = String(status).trim().toUpperCase();
  const idx = path.findIndex(s => (s.statuses||[]).some(v=>v.toUpperCase()===key));
  return idx>=0 ? idx : 0;
}

/* ---------- load dropdown options (best-effort) ---------- */
async function loadOptions(){
  const O = CONFIG.optionReports;
  async function pull(spec){
    const recs = await apiGetReport(spec.report, null, spec.max); // Creator only accepts 200, 500 or 1000 (apiGetReport defaults to 200)
    return recs.map(function(r){
      let label="";
      for(const f of spec.label){ if(r[f]){ label = (typeof r[f]==="object")?(r[f].display_value||r[f].zc_display_value||""):String(r[f]); if(label) break; } }
      if(!label) label = r.ID;
      return { v:label, label:label, id:r.ID, raw:r };
    });
  }
  try{ OPTIONS.vehicles    = await pull(O.vehicles); }catch(e){}
  try{ OPTIONS.issues      = await pull(O.issues); }catch(e){}
  try{ OPTIONS.vendors     = await pull(O.vendors); }catch(e){}
  try{ OPTIONS.technicians = await pull(O.technicians); }catch(e){}
  try{ OPTIONS.clients     = await pull(O.clients); }catch(e){}
  try{ RATE_MASTER = await apiGetReport(CONFIG.rateMasterReport, null, 1000); }catch(e){}

/* option lists for a field — "@vehicleIssues" is computed on the fly (vehicle-
   dependent), everything else is a static pull from OPTIONS. Shared by
   resolveOptions (render) and idsFor (payload) so both always agree. */
function optionsListFor(field){
  if(Array.isArray(field.o)) return field.o.map(function(v){ return {v:v,label:v}; });
  if(field.o==="@vehicleIssues") return vehicleIssuesFor(state.record[CONFIG.vehicleField]);
  if(typeof field.o==="string" && field.o[0]==="@"){ return OPTIONS[field.o.slice(1)] || []; }
  return [];
}
function resolveOptions(field){ return optionsListFor(field); }

/* ---------- Vehicle_Master_Report + Vehicle_Issue_Report → issue derivation ----------
   Vehicle_Issue_Report holds every issue with a VEHICLE_TYPE (2W/4W, multiselect),
   a DISPLAY_STATUS (only "SHOW" issues are offered), and an Issue_Type
   (ROS/TOW/REPAIR). We show only the SHOW-status issues whose VEHICLE_TYPE
   includes the selected vehicle's own Category (2W/4W, from Vehicle_Master_Report).
   The chosen issue's Issue_Type then drives Service_Type: TOW -> "TOW", anything
   else -> "RSR". */
// See getRescueTicket's own comment on unwrapOne/valuesOf/vehicleIssuesFor
// (2026-08-04) — same robustness + diagnostic-logging pass, not repeated here.
function unwrapOne(v){
  return (v && typeof v==="object") ? String(v.display_value||v.zc_display_value||v.value||"") : String(v);
}
function valuesOf(v){
  if(v==null) return [];
  if(Array.isArray(v)) return v.map(unwrapOne);
  if(typeof v==="object") return [unwrapOne(v)];
  return String(v).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
}
function vehicleIssuesFor(vehicleLabel){
  if(!vehicleLabel) return [];
  const veh = OPTIONS.vehicles.find(function(v){ return v.v===vehicleLabel; });
  if(!veh || !veh.raw){
    console.warn("[Get-Rescue] vehicleIssuesFor: no matching vehicle in OPTIONS.vehicles for", JSON.stringify(vehicleLabel), "— known vehicle labels:", OPTIONS.vehicles.map(v=>v.v));
    return [];
  }
  const category = valuesOf(veh.raw[CONFIG.vehicleCategoryField])[0];
  if(!category){
    console.warn("[Get-Rescue] vehicleIssuesFor: vehicle", JSON.stringify(vehicleLabel), "has no", CONFIG.vehicleCategoryField, "value on its Vehicle_Master_Report record:", veh.raw);
    return [];
  }
  const matches = OPTIONS.issues.filter(function(issue){
    if(!issue.raw) return false;
    const display = valuesOf(issue.raw[CONFIG.issueDisplayStatusField])[0] || "";
    if(display.toUpperCase()!=="SHOW") return false;
    const types = valuesOf(issue.raw[CONFIG.issueVehicleTypeField]);
    return types.some(function(t){ return t.toUpperCase()===category.toUpperCase(); });
  });
  if(!matches.length) console.warn("[Get-Rescue] vehicleIssuesFor: 0 of", OPTIONS.issues.length, "issues matched category", JSON.stringify(category), "(with DISPLAY_STATUS=SHOW) for vehicle", JSON.stringify(vehicleLabel), "— every issue's own", CONFIG.issueVehicleTypeField, "/", CONFIG.issueDisplayStatusField, ":", OPTIONS.issues.map(i=>({issue:i.v, vehicleType:valuesOf(i.raw && i.raw[CONFIG.issueVehicleTypeField]), display:i.raw && i.raw[CONFIG.issueDisplayStatusField]})));
  return matches;
}
function isTowIssue(issueLabel){
  const m = OPTIONS.issues.find(function(o){ return String(o.v)===String(issueLabel); });
  const type = m && m.raw ? valuesOf(m.raw.Issue_Type).join(" ") : "";
  return /tow/i.test(type);
}

/* ---------- round-trip distance (TOW only, "locations" step) ----------
   Static office location; round trip = office -> breakdown -> drop -> office.
   Falls back to office -> breakdown -> office if the drop pin isn't set yet. */
const OFFICE_LAT=12.967827711025203, OFFICE_LON=77.611228;
function haversineKm(lat1,lon1,lat2,lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
// See getRescueTicket's own matching comment (2026-08-04) — Number("") is 0,
// not NaN, so a blank coordinate was silently treated as "at the equator"
// instead of "not set yet".
function parseCoord(v){
  if(v==null || v==="") return null;
  const n=Number(v);
  return isNaN(n) ? null : n;
}
function calcRoundTripKm(r){
  const bLat=parseCoord(r.Latitude), bLon=parseCoord(r.Longitude);
  if(bLat==null||bLon==null) return 0;
  let total=haversineKm(OFFICE_LAT,OFFICE_LON,bLat,bLon);
  const dLat=parseCoord(r.DropLocationLat), dLon=parseCoord(r.DropLocationLong);
  if(dLat!=null && dLon!=null){
    total+=haversineKm(bLat,bLon,dLat,dLon);
    total+=haversineKm(dLat,dLon,OFFICE_LAT,OFFICE_LON);
  } else {
    total+=haversineKm(bLat,bLon,OFFICE_LAT,OFFICE_LON);
  }
  return Math.round(total*10)/10;
}

/* ---------- Rate_Master → Suggested_Rate / Rate_Breakup ----------
   Ported from the native Create_Case form's Deluge (runs on Create -> Quote
   section transition there; here it runs whenever the "quote" step renders or
   the distance field changes). For every selected Vehicle_Issue, finds the
   Rate_Master row matching the vehicle's Vehicle_Type(=Category) + Vehicle_Segment
   + Issue.Issue_Name: FIXED rows use Fixed_Rate as-is; FORMULA rows need
   Distance_For_Quote_RT_KM ("RT_KM" on the native form) and compute
   Formula_Base_Amount + (RT_KM + Formula_KM_Buffer) * Formula_Per_KM_Rate,
   floored at Formula_Min_Amount. NOTE: "Rate_Master_Report" is a best-guess
   report name (see CONFIG.rateMasterReport) — not yet confirmed live. */
let RATE_MASTER = [];
function calcQuote(){
  const r = state.record;
  const veh = OPTIONS.vehicles.find(function(v){ return v.v===r[CONFIG.vehicleField]; });
  const issues = Array.isArray(r.Vehicle_Issue) ? r.Vehicle_Issue : [];
  const out = { total:0, breakup:"", needsDistance:false };
  if(!veh || !veh.raw || !issues.length) return out;
  const vType = valuesOf(veh.raw[CONFIG.vehicleCategoryField])[0] || "";
  const vSegment = valuesOf(veh.raw.Segment)[0] || "";
  const rtKm = Number(r.Distance_For_Quote_RT_KM) || 0;
  issues.forEach(function(issueName){
    const rate = RATE_MASTER.find(function(row){
      const rowType = valuesOf(row.Vehicle_Type)[0] || "";
      const rowSeg = valuesOf(row.Vehicle_Segment)[0] || "";
      const rowIssue = valuesOf(row.Issue)[0] || "";
      return rowType.toUpperCase()===vType.toUpperCase() && rowSeg.toUpperCase()===vSegment.toUpperCase() && rowIssue.toUpperCase()===String(issueName).toUpperCase();
    });
    if(!rate){ out.breakup += issueName+": Rs. -- (no rate rule found)\n"; return; }
    if(String(valuesOf(rate.Rate_Type)[0]||"").toUpperCase()==="FIXED"){
      const amt = Number(rate.Fixed_Rate)||0;
      out.total += amt;
      out.breakup += issueName+": Rs. "+amt+"\n";
    } else {
      out.needsDistance = true;
      if(rtKm>0){
        const formulaAmount = (Number(rate.Formula_Base_Amount)||0) + (rtKm + (Number(rate.Formula_KM_Buffer)||0)) * (Number(rate.Formula_Per_KM_Rate)||0);
        const minAmt = Number(rate.Formula_Min_Amount)||0;
        const amt = formulaAmount > minAmt ? formulaAmount : minAmt;
        out.total += amt;
        out.breakup += issueName+": Rs. "+amt+" (RT_KM: "+rtKm+" km)\n";
      } else {
        out.breakup += issueName+": Rs. -- (enter distance — distance needed for this issue)\n";
      }
    }
  });
  return out;
}

const $ = id => document.getElementById(id);
function pad(n){ return n<10?"0"+n:""+n; }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear(); }
function fmtDateTime(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
/* Computed_Service_Time is stored 12-hour with AM/PM + seconds (confirmed live,
   e.g. "26-Jul-2026 11:25:18 PM") — different shape from fmtDateTime() above,
   which is 24-hour with no AM/PM. Kept separate rather than changing the
   generic one, since other datetime fields haven't shown this format live. */
function fmtDateTime12(d){
  const h24=d.getHours(); const ampm=h24<12?"AM":"PM"; const h12=(h24%12)||12;
  return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()+" "+pad(h12)+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+" "+ampm;
}
function parseSlotStart(slot){
  if(!slot) return null;
  const m=String(slot).split(" - ")[0].trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return null;
  let h=parseInt(m[1],10); const min=parseInt(m[2],10); const ap=m[3].toUpperCase();
  if(ap==="PM" && h!==12) h+=12;
  if(ap==="AM" && h===12) h=0;
  return {h:h, m:min};
}
/* Computed_Service_Time: NOW -> 30 minutes from the moment of saving; LATER ->
   the picked Schedule_Date combined with the picked Service_Time slot's start. */
function computeServiceTime(r){
  if(r.Time_of_service==="LATER"){
    if(!r.Schedule_Date || !r.Service_Time) return "";
    const dp=String(r.Schedule_Date).split("-"); // <input type=date> gives "YYYY-MM-DD"
    if(dp.length!==3) return "";
    const slot=parseSlotStart(r.Service_Time);
    if(!slot) return "";
    return fmtDateTime12(new Date(Number(dp[0]), Number(dp[1])-1, Number(dp[2]), slot.h, slot.m, 0));
  }
  return fmtDateTime12(new Date(Date.now()+30*60*1000));
}
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* every phone number in this app is an Indian number — if the agent didn't
   type a country code, assume +91 rather than leaving it bare. Matches the
   "+919696406443" shape Create_Case expects (no spaces/dashes). */
function formatIndianPhone(v){
  if(!v) return "";
  const s=String(v).trim();
  if(s.charAt(0)==="+") return "+"+s.slice(1).replace(/\D/g,"");
  const digits=s.replace(/\D/g,""); if(!digits) return "";
  return "+91"+digits;
}
function readVal(rec,key){ let v=rec?rec[key]:null; if(v==null) return ""; if(Array.isArray(v)) return v.join(", "); if(typeof v==="object") return v.display_value||v.zc_display_value||v.first_name&&((v.first_name||"")+" "+(v.last_name||"")).trim()||v.value||""; return String(v); }
function caseLabel(rec){ return readVal(rec,CONFIG.caseIdField) || ("#"+(rec.ID||"")); }
let toastT;
function toast(msg,kind){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(kind?(" "+kind):""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }

function renderBoard(recs){

  recs.forEach(r=>{ const b=bucketOfStatus(readVal(r,CONFIG.stageField)); if(b>=0) cols[b].push(r); });
  $("columns").innerHTML = BUCKETS.map((bk,i)=>{

    return `<div class="kcol" style="--accent:${g.accent}">
      <div class="kcol-head"><span class="ic">${g.icon}</span><span class="tt"><b>${esc(bk.name)}</b><span>${esc(bk.sub)}</span></span><span class="cnt">${items.length}</span></div>
      <div class="kcol-body">${cards}</div>

  }).join("");
  document.querySelectorAll("#columns .kcard").forEach(el=>{
    el.onclick=()=>{ const rec=recs.find(r=>String(r.ID)===el.dataset.id); if(rec) openTicket(rec); };
  });
}
function initials(name){
  const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase();
}
/* checked = green filled box + white tick; unchecked = plain outline box */
const FLAG_ON='<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="m7 12.3 3.2 3.2 6.6-6.6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FLAG_OFF='<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="2"/></svg>';
/* "Paid" also counts as ticked when there's no booking fee to collect at all
   (Booking_Fee not >0) — matches quoteStatus()'s own feeZero test, same rule. */
function isPaidFlag(r){ return r.Payment_Status==="PAID" || !(Number(r.Booking_Fee)>0); }
/* "Loc" ticked only once both Latitude and Longitude actually hold a value —
   empty-string/null must not read as valid 0,0 (Number("") is 0, not NaN). */
function hasLocFlag(r){
  const lat=r.Latitude, lon=r.Longitude;
  if(lat==null||lat===""||lon==null||lon==="") return false;
  return !isNaN(Number(lat)) && !isNaN(Number(lon));
}
/* Vendors1 is a real Lookup (confirmed 2026-07-31, same as getRescueTicket's
   own copy of this field) — a raw fetch returns each selection as a lookup
   object. The composite-string stripping below only matters for any ticket
   saved under the old (pre-2026-07-31) plain-text format; it's a no-op on a
   plain lookup display_value. */
function vendorDisplayName(v){
  const plain = (v && typeof v==="object") ? (v.display_value||v.zc_display_value||v.value||"") : v;
  return String(plain||"").trim().replace(/^\[[^\]]*\]\s*/,"").split("|")[0].trim();
}
function vendorNamesFor(r){
  const v=r.Vendors1; const arr=Array.isArray(v)?v:(v?[v]:[]);
  return arr.map(vendorDisplayName).filter(Boolean).join(", ");
}
/* one Kanban card per ticket — same fields the old row-style dashboard showed,
