/* search — a dropdown under the search bar, driven by the search button/Enter
   (not live-as-you-type, to avoid firing a query on every keystroke). Reads
   from CONFIG.reportName (Agent_Ticket_Report) via the same getTickets() every
   other list uses. Clicking a result opens it exactly like a board card. */
function closeSearchDropdown(){ const dd=$("searchDropdown"); dd.classList.remove("on"); dd.innerHTML=""; }
function onSearchInput(){
  const raw=$("q").value.trim(); $("clearSearch").style.display = raw?"flex":"none";
  if(raw.length<3) closeSearchDropdown();
}
/* Search box matches on CONFIG.phoneField (digits-only, needs >=3 digits typed)
   OR'd with every field in CONFIG.searchTextFields (Case_ID, Vehicle_Registration_Number,
   Client_Tracking_Id) matched as typed. Quotes are stripped from the typed text
   so it can't break the criteria string. */
async function runSearch(){
  const raw=$("q").value.trim();
  if(raw.length<3){ toast("Type at least 3 characters — phone number, Case ID, vehicle reg. no., or client tracking ID","err"); return; }
  const digits=raw.replace(/\D/g,"");
  const safe=raw.replace(/"/g,"");
  const dd=$("searchDropdown");
  dd.classList.add("on");
  dd.innerHTML='<div class="sd-msg"><div class="spin" style="width:22px;height:22px;margin-bottom:8px"></div>Searching…</div>';
  const clauses=[];
  if(digits.length>=3) clauses.push("("+CONFIG.phoneField+'.contains("'+digits+'"))');
  CONFIG.searchTextFields.forEach(f=>{ clauses.push("("+f+'.contains("'+safe+'"))'); });
  const crit=clauses.join(" || ");
  console.log("[Get-Rescue] search — report:", CONFIG.reportName, "| fields:", [CONFIG.phoneField].concat(CONFIG.searchTextFields), "| typed:", raw, "| criteria:", crit);
  const recs=await getTickets(crit);
  console.log("[Get-Rescue] search matched", recs.length, "record(s):", recs);
  if(!recs.length){ dd.innerHTML=`<div class="sd-msg">No ticket found for "${esc(raw)}"</div>`; return; }
  dd.innerHTML=recs.map(rowHtml).join("");
  dd.querySelectorAll(".rrow").forEach(el=>{
    el.onclick=()=>{ const rec=recs.find(r=>String(r.ID)===el.dataset.id); closeSearchDropdown(); if(rec) openTicket(rec); };
  });
}
document.addEventListener("click",e=>{
  const box=document.querySelector(".search");
  if(box && !box.contains(e.target)) closeSearchDropdown();
});

/* =====================================================================
   VIEWS
   ===================================================================== */
function showView(v){
  state.view=v;
  $("dashboard").classList.toggle("off", v!=="dashboard");
  $("wizard").classList.toggle("on", v==="wizard");
  $("bar").style.display = v==="wizard" ? "block" : "none";
  if(v==="dashboard") window.scrollTo(0,0);
}

/* =====================================================================
   WIZARD (edit-only — every ticket here already exists; there is no
   "new ticket" entry point on the board)
   ===================================================================== */
/* Lookup fields (useId:true) come back from Creator as objects (or arrays of
   objects) with a display_value, not the plain label the rest of the UI works
   with. Unwrap them once on load so the select/chip UI, and vehicleIssuesFor's
   label match, see the same plain strings they'd see on a freshly-built ticket. */
function unwrapLookup(v){
  if(v==null) return v;
  if(Array.isArray(v)) return v.map(unwrapLookup);
  if(typeof v==="object") return v.display_value||v.zc_display_value||v.value||"";
  return v;
}
function openTicket(rec){
  state.record=Object.assign({},rec); state.files={}; state.recordId=rec.ID;
  STAGES.forEach(st=>st.fields.forEach(f=>{ if(f.useId && state.record[f.n]!=null) state.record[f.n]=unwrapLookup(state.record[f.n]); }));
  setPath();
  const st=readVal(rec,CONFIG.stageField);
  state.stepIndex = stageIndexForStatus(state.path, st);
  state.maxStepIndex = state.stepIndex; // can revisit anything already reached, not skip ahead of it
  showView("wizard"); renderWizard();
}
function setPath(){
  const t=(state.record[CONFIG.serviceTypeField]||"").toUpperCase();
  state.path=buildPath(t==="TOW"?"TOW":"RSR");
  if(state.stepIndex>state.path.length-1) state.stepIndex=state.path.length-1;
}
/* shown on stepper steps beyond state.maxStepIndex — mandatory fields on an
   earlier step haven't been saved yet, so the agent can't skip ahead to them */
const LOCK_ICON='<svg viewBox="0 0 24 24" width="11" height="11"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function renderWizard(){
  const step=state.path[state.stepIndex];
  $("wizStageTitle").textContent = "Edit Ticket";
  $("wizCaseId").textContent = state.recordId ? caseLabel(state.record) : "unsaved";
  // Service_Type drives the branch below but is never shown — it's derived from Vehicle_Issue and saved silently.
  // stepper
  $("steps").innerHTML = state.path.map((s,i)=>{
    const locked = i>state.maxStepIndex;
    const cls = (i===state.stepIndex?"active":(i<state.stepIndex?"done":""))+(locked?" locked":"");
    const num = locked ? LOCK_ICON : (i<state.stepIndex?"✓":(i+1));
    return `<div class="step ${cls}" data-i="${i}"><span class="n">${num}</span><span class="lb">${s.short}</span></div>`;
  }).join("");
  document.querySelectorAll("#steps .step").forEach(el=>{
    const i=+el.dataset.i;
    if(i>state.maxStepIndex) return; // locked — mandatory fields on an earlier step haven't been saved yet
    el.onclick=()=>jumpTo(i);
  });
  const pct = state.path.length>1 ? (state.stepIndex/(state.path.length-1))*100 : 100;
  $("pbarFill").style.width = pct+"%";
  // buttons
  $("prevBtn").disabled = state.stepIndex===0;
  $("saveBtn").textContent = step.save;
  $("closeBtn").style.display = step.key==="create" ? "none" : ""; // no ticket to close yet on the first step
  if(step.key==="quote"){
    const q=calcQuote();
    state.record.Suggested_Rate=q.total;
    state.record.Rate_Breakup=q.breakup;
    if(state.record.Total_Service_Fee==null || state.record.Total_Service_Fee==="") state.record.Total_Service_Fee=q.total;
    state.record.Remaining_Fee=(Number(state.record.Total_Service_Fee)||0)-(Number(state.record.Booking_Fee)||0);
  }
  // fields
  $("stepTitle").textContent = step.title;
  $("stepDesc").textContent = step.desc||"";
  renderFields(step);
}
function renderFields(step){
  const box=$("fields"); box.innerHTML="";
  step.fields.forEach(f=>{
    if(f.when && !f.when(state.record)) return;
    if(f.t==="badge") return; // computed + saved silently, never shown
    box.appendChild(buildField(f));
  });
}
function buildField(f){
  const wrap=document.createElement("div");
  wrap.className="fld"+(f.full?" full":"");
  if(f.t==="summary"){ wrap.innerHTML=summaryHtml(); return wrap; }
  const id="f_"+f.n;
  const lab=`<label>${esc(f.l)}${f.req?'<span class="req">*</span>':""}</label>`;
  const cur=state.record[f.n];
  if(f.t==="textarea"){
    wrap.innerHTML=lab+`<textarea id="${id}">${esc(cur||"")}</textarea>`;
  } else if(f.t==="select"){
    const baseOpts=resolveOptions(f);
    const knownVals=baseOpts.map(o=>String(o.v));
    const effectiveCur = (cur!=null && cur!=="") ? cur : (f.default||"");
    const isCustom = !!(f.other && effectiveCur!=="" && knownVals.indexOf(String(effectiveCur))===-1);
    const selVal = isCustom ? "Other" : effectiveCur;
    const opts=baseOpts.map(o=>`<option value="${esc(o.v)}" ${String(selVal)===String(o.v)?"selected":""}>${esc(o.label)}</option>`).join("");
    const showOther = f.other && selVal==="Other";
    wrap.innerHTML=lab+`<select id="${id}"${f.disabled?" disabled":""}><option value="">— select —</option>${opts}</select>`
      + (f.other ? `<input type="text" id="${id}_other" placeholder="Please specify ${esc(f.l)}" value="${esc(isCustom?effectiveCur:"")}" style="margin-top:8px${showOther?"":";display:none"}">` : "");
  } else if(f.t==="radio"){
    const sel = cur!=null?String(cur):"";
    const opts=resolveOptions(f).map(o=>`<div class="opt ${sel===String(o.v)?"sel":""}" data-value="${esc(o.v)}">${esc(o.label)}</div>`).join("");
    wrap.innerHTML=lab+`<div class="radio-set" id="${id}">${opts}</div>`;
  } else if(f.t==="check"){
    const on = cur===true||cur==="Yes"||(Array.isArray(cur)&&cur.indexOf("Yes")>=0);
    wrap.innerHTML=`<label class="check"><input type="checkbox" id="${id}" ${on?"checked":""}><span>${esc(f.l)}</span></label>`;
  } else if(f.t==="button"){
    const on = cur===true||cur==="Yes"||(Array.isArray(cur)&&cur.indexOf("Yes")>=0);
    const locked = on && !f.repeatable; // repeatable buttons (e.g. recalculate) never lock into a permanent "done" state
    const doneIcon='<svg viewBox="0 0 24 24" width="17" height="17"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    wrap.innerHTML=`<button type="button" id="${id}" class="btn ${locked?"ok":"primary"}" style="width:100%;justify-content:center"${locked?" disabled":""}>${locked?doneIcon+" "+esc(f.doneLabel||"Done"):esc(f.buttonLabel||f.l)}</button>`;
  } else if(f.t==="multiselect"){
    if(f.needsVehicle && !state.record[CONFIG.vehicleField]){
      wrap.innerHTML=lab+`<div class="hint" style="padding:4px 0">Select a vehicle first</div>`;
    } else {
      const arr = Array.isArray(cur)?cur:(cur?String(cur).split(",").map(s=>s.trim()):[]);
      const allOpts = resolveOptions(f);
      const selectedOpts = arr.map(v=>allOpts.find(o=>String(o.v)===String(v))||{v:v,label:v});
      const remaining = allOpts.filter(o=>arr.indexOf(o.v)===-1);
      const chips = selectedOpts.map(o=>`<span class="chip" data-value="${esc(o.v)}">${esc(o.label)}<button type="button" data-remove="${esc(o.v)}" aria-label="Remove ${esc(o.label)}">✕</button></span>`).join("");
      // Chips + the "add" select render inside one bordered box together
      // (2026-08-04) — see getRescueTicket's own matching comment.
      let addInner="";
      if(remaining.length){
        const addOpts = remaining.map(o=>`<option value="${esc(o.v)}">${esc(o.label)}</option>`).join("");
        addInner = `<select class="add-select" id="${id}"><option value="">+ Add…</option>${addOpts}</select>`;
      }
      if(!allOpts.length){
        wrap.innerHTML=lab+`<span class="hint">This vehicle has no issues configured</span>`;
      } else {
        wrap.innerHTML=lab+`<div class="combo-multi" id="${id}_wrap"><div class="chips" id="${id}_chips">${chips}</div>${addInner}</div>`;
      }
    }
  } else if(f.t==="name2"){
    // Customer_Name is saved as a single plain-text string ("First Last") — split
    // on the first space so a reopened ticket still populates both boxes.
    let nm = {};
    if(cur && typeof cur==="object") nm = cur;
    else if(typeof cur==="string" && cur){ const parts=cur.split(" "); nm={first_name:parts[0]||"", last_name:parts.slice(1).join(" ")}; }
    wrap.innerHTML=lab+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <input id="f_firstName" placeholder="First name" value="${esc(nm.first_name||"")}">
      <input id="f_lastName" placeholder="Last name" value="${esc(nm.last_name||"")}"></div>`;
  } else if(f.t==="file"){
    const has = state.files[f.n];
    wrap.innerHTML=lab+`<input type="file" id="${id}" accept="image/*">`+(has?`<span class="hint">Selected: ${esc(has.name)}</span>`:(cur?`<span class="hint">Already uploaded</span>`:""));
  } else {
    const map={tel:"tel",email:"email",number:"number",decimal:"number",date:"date",datetime:"datetime-local",time:"time",text:"text"};
    const step2 = (f.t==="decimal")?' step="any"':"";
    wrap.innerHTML=lab+`<input type="${map[f.t]||"text"}" id="${id}"${step2}${f.readonly?" readonly":""} value="${esc(cur||"")}">`+(f.hint?`<span class="hint">${esc(f.hint)}</span>`:"");
  }
  // interactions
  setTimeout(()=>wireField(f,id),0);
  return wrap;
}
const RERENDER=["Time_of_service","Vehicle"];
/* any field change that forces a full re-render must snapshot the DOM into
   state.record FIRST (via collectStep(false)) — otherwise every other field
   on the step (plain text inputs have no live listener of their own) reverts
   to its last-saved value and looks like it "went blank". */
function wireField(f,id){
  if(f.t==="multiselect"){ wireMultiselect(f,id); return; }
  const el=$(id); if(!el) return;
  if(f.t==="radio"){
    el.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      el.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel");
      state.record[f.n]=o.dataset.value;
      if(RERENDER.indexOf(f.n)>=0){ collectStep(false); renderWizard(); }
    });
  } else if(f.t==="check"){
    el.onchange=()=>{ state.record[f.n]=el.checked; };
  } else if(f.t==="button"){
    el.onclick=()=>{
      state.record[f.n]=true;
      if(typeof f.action==="function") f.action(state.record); // e.g. Calculate_Distance sets RT_KM
      collectStep(false); renderWizard();
    };
  } else if(f.t==="file"){
    el.onchange=()=>{ if(el.files&&el.files[0]) state.files[f.n]=el.files[0]; };
  } else if(f.t==="select"){
    el.onchange=()=>{
      state.record[f.n]=el.value;
      if(f.other){ const oEl=$(id+"_other"); if(oEl) oEl.style.display = el.value==="Other" ? "block":"none"; if(el.value==="Other" && oEl) oEl.focus(); }
      if(RERENDER.indexOf(f.n)>=0){
        collectStep(false); // snapshot everything else on screen before we rebuild it
        if(f.n===CONFIG.vehicleField){ state.record.Vehicle_Issue=[]; state.record[CONFIG.serviceTypeField]=""; }
        setPath(); renderWizard();
      }
    };
    if(f.other){ const oEl=$(id+"_other"); if(oEl) oEl.onchange=()=>{ if(el.value==="Other") state.record[f.n]=oEl.value; }; }
  } else if(f.recompute || f.parseTarget){
    el.onchange=()=>{
      collectStep(false);
      if(f.parseTarget){
        // e.g. "28.647, 65.546" -> Latitude/Longitude (or the drop-location pair)
        const parts=String(state.record[f.n]||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(parts.length>=2){
          const lat=Number(parts[0]), lon=Number(parts[1]);
          if(!isNaN(lat)) state.record[f.parseTarget[0]]=lat;
          if(!isNaN(lon)) state.record[f.parseTarget[1]]=lon;
        }
      }
      renderWizard();
    };
  }
}
/* Zoho-style multiselect: selected values show as removable chips, plus an
   "+ Add…" dropdown of what's left. state.record is the single source of
   truth (no DOM scraping at collect time — see collectStep). */
function wireMultiselect(f,id){
  const chipsBox=$(id+"_chips");
  if(chipsBox){
    chipsBox.querySelectorAll("button[data-remove]").forEach(btn=>{
      btn.onclick=()=>{
        const val=btn.getAttribute("data-remove");
        const cur=Array.isArray(state.record[f.n])?state.record[f.n]:[];
        state.record[f.n]=cur.filter(x=>x!==val);
        afterMultiselectChange(f);
      };
    });
  }
  const addEl=$(id);
  if(addEl && addEl.tagName==="SELECT"){
    addEl.onchange=()=>{
      if(!addEl.value) return;
      const cur=Array.isArray(state.record[f.n])?state.record[f.n].slice():[];
      if(cur.indexOf(addEl.value)===-1) cur.push(addEl.value);
      state.record[f.n]=cur;
      afterMultiselectChange(f);
    };
  }
}
function afterMultiselectChange(f){
  if(f.n==="Vehicle_Issue"){
    const vals=Array.isArray(state.record.Vehicle_Issue)?state.record.Vehicle_Issue:[];
    state.record[CONFIG.serviceTypeField] = vals.length ? (vals.some(isTowIssue)?"TOW":"RSR") : "";
  }
  collectStep(false); // snapshot everything else on screen before we rebuild it
  setPath();
  renderWizard();
}
function summaryHtml(){
  const r=state.record;
  const rows=[
    ["Case ID", state.recordId?caseLabel(r):"(unsaved)"],
    ["Customer", readVal(r,CONFIG.nameField)],
    ["Phone", r[CONFIG.phoneField]||""],
    ["Service Type", r[CONFIG.serviceTypeField]||""],
    ["Vehicle", r[CONFIG.vehicleField]||""],
    ["Issue", readVal(r,"Vehicle_Issue")],
    ["Total Fee", r.Total_Service_Fee||""],
    ["Booking Fee", r.Booking_Fee||""],
    ["Remaining Fee", r.Remaining_Fee||""],
    ["Vendor", readVal(r,"Vendors1")||r.Vendor_Email||""],
    ["Technician", r.Assigned_Technician||r.Assigned_Technician_Email||""]
  ].filter(x=>x[1]!=="" && x[1]!=null);
  return `<div class="summary">`+rows.map(x=>`<div class="srow"><span class="k">${esc(x[0])}</span><span class="v">${esc(x[1])}</span></div>`).join("")+`</div>`;
}

/* ---- collect current step DOM -> state.record ---- */
function collectStep(validate){
  const step=state.path[state.stepIndex]; let ok=true; let missing="";
  step.fields.forEach(f=>{
    if(f.when && !f.when(state.record)) return;
    if(f.t==="summary") return;
    if(f.t==="file") return; // handled via state.files
    if(f.t==="badge") return; // read-only, value already set by Vehicle_Issue handler
    if(f.t==="button") return; // no DOM value to read — its own onclick sets state.record directly
    let v;
    if(f.t==="name2"){
      const fn=($("f_firstName")||{}).value||""; const ln=($("f_lastName")||{}).value||"";
      v={first_name:fn,last_name:ln}; state.record[f.n]=v;
      if(validate&&f.req&&!fn&&!ln){ ok=false; missing=missing||f.l; }
      return;
    }
    if(f.t==="multiselect"){
      // chip UI keeps state.record as the only source of truth — nothing to scrape from the DOM
      v=Array.isArray(state.record[f.n])?state.record[f.n]:[];
      if(validate&&f.req && !v.length){ ok=false; missing=missing||f.l; }
      return;
    }
    const el=$("f_"+f.n); if(!el) return;
    if(f.t==="radio"){ const s=el.querySelector(".opt.sel"); v=s?s.dataset.value:""; }
    else if(f.t==="check"){ v=el.checked; }
    else if(f.t==="select" && f.other){
      v=el.value;
      if(v==="Other"){ const oEl=$("f_"+f.n+"_other"); const ov=((oEl&&oEl.value)||"").trim(); if(ov) v=ov; }
    }
    else if(f.t==="tel"){ v=formatIndianPhone(el.value); }
    else { v=el.value; }
    state.record[f.n]=v;
    if(validate&&f.req){ const empty=(v===""||v==null||(Array.isArray(v)&&!v.length)); if(empty){ ok=false; missing=missing||f.l; } }
  });
  return {ok,missing};
}
/* fields flagged useId:true are real Lookups (confirmed for "Vehicle" via a
   live record, for "Vendors1" 2026-07-31 by the user directly, and for
   "Vehicle_Issue" 2026-08-04 — also user-confirmed, reversing the earlier
   "plain text" assumption). Assigned_Technician is still assumed plain text
   by analogy (not independently confirmed) — don't re-add useId to it without
   new evidence. Falls back to the raw value if no matching option is loaded
   yet (better a failed save you can see than a silent drop). */
// 2026-07-31: reverted — sending Lookup fields as an {"ID":"..."} object
// broke saving entirely (see getRescueTicket's own copy of this function).
// Back to the plain bare-ID value, which is what was actually working.
function idsFor(field, value){
  const list = optionsListFor(field);
  const findId = (val)=>{ const m=list.find(o=>String(o.v)===String(val)); return (m && m.id!=null) ? m.id : val; };
  return Array.isArray(value) ? value.map(findId) : findId(value);
}
function buildPayload(step){
  const p={}; const r=state.record;
  step.fields.forEach(f=>{
    if(f.t==="summary"||f.t==="file") return;
    if(f.when && !f.when(r)) return;
    let v=r[f.n];
    if(f.t==="name2"){
      // Customer_Name on Create_Case is a plain single-line text field, not a
      // composite Name field — confirmed live (it was saving as a literal
      // stringified {"first_name":...} object before this fix).
      const fn=(v&&v.first_name)||""; const ln=(v&&v.last_name)||"";
      p[f.n]=(fn+" "+ln).replace(/\s+/g," ").trim();
      return;
    }
    if(f.t==="check"||f.t==="button"){ p[f.n]= (v===true||v==="Yes")?["Yes"]:[]; return; }
    if(f.t==="multiselect"){ let arr=Array.isArray(v)?v:(v?[v]:[]); if(f.useId) arr=idsFor(f,arr); p[f.n]=arr; return; }
    if(v===""||v==null) return;
    if(f.useId) v=idsFor(f,v);
    if(f.t==="date") v=fmtDate(v);
    else if(f.t==="datetime") v=fmtDateTime(v);
    else if(f.t==="number"||f.t==="decimal") v=Number(v);
    p[f.n]=v;
  });
  p[CONFIG.stageField]=computeStatus(step, r) || step.title; // title fallback should never actually fire — every stage has a status
  if(!state.recordId && r[CONFIG.caseIdField]) p[CONFIG.caseIdField]=r[CONFIG.caseIdField];
  if(typeof step.extra==="function") Object.assign(p, step.extra(r)); // mirror values into required fields the UI doesn't show separately
  return p;
}

/* ---- actions ---- */
async function saveStep(advance){
  const step=state.path[state.stepIndex];
  const chk=collectStep(true);
  if(!chk.ok){ toast("Please fill: "+chk.missing,"err"); return; }
  setPath();
  const payload=buildPayload(step);
  console.log("[Get-Rescue] saving step:", step.title, "| Status ->", payload[CONFIG.stageField], "| full payload:", payload, "| Vehicle_Issue:", payload.Vehicle_Issue);
  $("saveBtn").disabled=true;
  try{
    if(!state.recordId){
      const id=await addTicket(payload); state.recordId=id;
      // Case_ID depends on the record's own ID, so it can only be set after creation —
      // short, unique-enough tag: "RSID" + the last 6 digits of the new record's ID.
      // Best-effort: if Create_Case already auto-stamps its own Case_ID on create
      // (e.g. a formula/autonumber field the API won't let us override), this
      // update may be rejected — don't let that fail the whole ticket creation,
      // just log it so a still-CSID-looking Case_ID can be diagnosed from console.
      const caseId="RSID"+String(id).slice(-6);
      state.record[CONFIG.caseIdField]=caseId;
      try{ await updateTicket(id,{[CONFIG.caseIdField]:caseId}); }
      catch(e){ console.warn("[Get-Rescue] could not set Case_ID to", caseId, "on record", id, "— ticket was still created; Case_ID may be left at Zoho's own default:", e); }
    }
    else { await updateTicket(state.recordId,payload); }
    // best-effort file uploads (won't block)
    for(const k in state.files){ if(state.files[k]) apiUpload(state.recordId,k,state.files[k]); }
    $("wizCaseId").textContent=caseLabel(state.record)||("#"+state.recordId);
    toast("Saved","ok");
    if(step.branch==="final"){ // closing step
      await updateTicket(state.recordId,{[CONFIG.stageField]:"CLOSED"});
      toast("Ticket closed","ok"); return backToDash();
    }
    // required action not done yet (e.g. location/payment) -> save as-is and
    // close the wizard back to the board, same as Cancel, rather than
    // blocking the agent on this page. Reopening the ticket from the board
    // resumes on this same step (stageIndexForStatus).
    const blocked = typeof step.canAdvance==="function" && !step.canAdvance(state.record);
    if(blocked){
      toast(step.blockedMessage||"Saved — required action still pending","ok");
      return backToDash();
    } else if(advance && state.stepIndex<state.path.length-1){
      state.stepIndex++;
      if(state.stepIndex>state.maxStepIndex) state.maxStepIndex=state.stepIndex; // unlocks the next step now that this one's required fields are saved
      renderWizard(); window.scrollTo(0,0);
    }
    else renderWizard();
  }catch(e){ console.error(e); toast((e&&e.message)||"Save failed","err"); }
  finally{ $("saveBtn").disabled=false; }
}
function prevStep(){ if(state.stepIndex===0) return; collectStep(false); state.stepIndex--; renderWizard(); window.scrollTo(0,0); }
function jumpTo(i){ if(i===state.stepIndex || i>state.maxStepIndex) return; collectStep(false); setPath(); state.stepIndex=Math.min(i,state.path.length-1); renderWizard(); window.scrollTo(0,0); }
async function cancelWizard(){
  const yes=await confirmBox("Stop filling?","Your current progress on this step will be saved as-is before you leave.","Yes, stop");
  if(!yes) return;
  // best-effort: persist whatever's on screen (incl. its computed Status, e.g.
  // "LOCATION REQUEST"/"SERVICE FEE QUOTE" if a required action wasn't done)
  // so cancelling isn't silently different from saving without completing it.
  if(state.recordId){
    try{ collectStep(false); setPath(); await updateTicket(state.recordId, buildPayload(state.path[state.stepIndex])); }
    catch(e){ console.warn("cancel: best-effort save failed", e); }
  }
  backToDash();
}
async function closeTicketAction(){
  const yes=await confirmBox("Close this ticket?","It will be marked CLOSED and removed from the active stages.","Close ticket");
  if(!yes) return;
  try{
    collectStep(false); setPath();
    const payload=Object.assign(buildPayload(state.path[state.stepIndex]),{[CONFIG.stageField]:"CLOSED"});
    if(!state.recordId){ state.recordId=await addTicket(payload); } else { await updateTicket(state.recordId,payload); }
    toast("Ticket closed","ok"); backToDash();
  }catch(e){ toast((e&&e.message)||"Could not close","err"); }
}
function backToDash(){ showView("dashboard"); loadDashboard(); }

/* =====================================================================
   WIRING + BOOT
   ===================================================================== */
$("refreshBtn").onclick=loadDashboard;
$("wizClose").onclick=cancelWizard;
$("prevBtn").onclick=prevStep;
$("saveBtn").onclick=()=>saveStep(true);
$("cancelBtn").onclick=cancelWizard;
$("closeBtn").onclick=closeTicketAction;
$("searchBtn").onclick=runSearch;
$("q").addEventListener("input",onSearchInput);
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter") runSearch(); });
$("clearSearch").onclick=()=>{ $("q").value=""; $("clearSearch").style.display="none"; closeSearchDropdown(); };

async function boot(){
  try{ await ZOHO.CREATOR.UTIL.getInitParams(); }catch(e){}
  await loadOptions();
  loadDashboard();
}
// No more demo-data fallback (2026-08-04, per user request) — same change as
// getRescueTicket's own matching comment; every detail now comes from the
// live Zoho API only.
function showSdkError(){
  $("demoNote").style.display="block";
  console.error("[Get-Rescue] ZOHO.CREATOR.UTIL.getInitParams never became available — widget is not running inside a Creator page, or the SDK failed to load.");
}
function waitForSDK(a){
  a=a||0;
  if(sdkReady()){ boot(); return; }
  if(a>40){ showSdkError(); return; }
  setTimeout(()=>waitForSDK(a+1),200);
}
waitForSDK();
</script>
